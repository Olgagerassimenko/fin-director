name: Пульс — ДЗ/КЗ каждый час

# Зачем отдельное расписание.
# Полный прогон (pulse-daily) ходит четыре раза в сутки, последний — в 20:00 по Алматы.
# Таблицу «Баланс по поставщикам и дебиторам» заполняют вечером, нередко после 22:00,
# и до утра дашборд показывал прошлую неделю: 4 сентября на странице стояло
# 208 594 403 ₸ (колонка «ДЗ на 28.08»), хотя в таблице уже было 215 259 795 ₸.
# ДЗ/КЗ читаются из одного CSV-файла Google и считаются за секунды, поэтому
# гонять их раз в час дешевле, чем объяснять расхождение.
#
# iiko здесь не трогаем: только Google-таблица, пересборка dz_kz.js и публикация.

on:
  schedule:
    - cron: "5 * * * *"      # каждый час в:05, чтобы не сталкиваться с ДДС в:00 и :30
  workflow_dispatch: {}

permissions:
  contents: write

# Та же группа, что у полного прогона: два деплоя одновременно опубликовали бы
# половину свежих файлов и половину старых.
concurrency:
  group: pulse-daily
  cancel-in-progress: false

jobs:
  dzkz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Зависимости
        run: pip install -r requirements.txt

      # dz_kz_months.py считает помесячные итоги и следом сам вызывает
      # parse_dz_kz.py, который пересобирает dz_kz.js для страницы ДЗ/КЗ.
      - name: "ДЗ/КЗ из Google"
        timeout-minutes: 5
        run: python dz_kz_months.py

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Публикация (Cloudflare Workers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy

      # dz_kz.js весит четыре килобайта, поэтому в отличие от страницы ДДС
      # сохраняем его в репозиторий: история не распухнет, зато полный прогон
      # и локальные сборки всегда стартуют со свежих данных.
      - name: Сохранить ДЗ/КЗ в репозиторий
        if: always()
        run: |
          git config user.name "pulse-ci"
          git config user.email "ci@local"
          # Сначала фиксируем свою свежую выгрузку коммитом и только потом
          # перематываемся на main. Раньше здесь стоял «pull --rebase --autostash
          # || true»: когда часовой прогон шёл следом за ежедневным, git не мог
          # свести две версии dz_kz.js, оставлял в файле маркеры <<<<<<<,
          # ошибку проглатывал «|| true», и шаг проверки падал на разборе JSON
          # (05.09.2026, прогон в 04:13 UTC). -X theirs при rebase означает
          # «наш коммит важнее»: свежая выгрузка побеждает то, что лежало в main.
          git add -f dz_kz.js "дз_кз_месяцы.json" 2>/dev/null || true
          git commit -m "ДЗ/КЗ: свежие данные [skip ci]" || echo "нет изменений"
          git pull --rebase -X theirs origin main || { git rebase --abort || true; }
          if grep -q '^<<<<<<< ' dz_kz.js ; then
            echo "::error::в dz_kz.js остались маркеры конфликта — push отменён"
            exit 1
          fi
          git push origin HEAD:main || echo "push не удался"

      # Проверяем не дату сборки, а саму цифру: если последняя колонка «ДЗ на …»
      # совпала с предыдущей до тенге, неделю в таблице ещё не заполнили —
      # это не ошибка прогона, но знать об этом надо.
      - name: "Проверка: свежая колонка ДЗ заполнена"
        if: always()
        run: |
          python - <<'PY'
          import json, re, sys
          txt = open("dz_kz.js", encoding="utf-8").read()
          m = re.search(r"=\s*(\{.*\});?\s*$", txt, re.S)
          if not m:
              sys.exit("dz_kz.js не разобрался")
          d = json.loads(m.group(1))
          print("обновлено:", d.get("updated"))
          for tag in ("dz", "kz"):
              o = d.get(tag) or {}
              dyn = o.get("dynamics") or []
              print("%s: итог %s на %s" % (tag.upper(), f"{o.get('total',0):,}".replace(",", " "), o.get("date")))
              am = o.get("anaMeta") or {}
              if am:
                  print("  неделя: %s | приход %s | оплата %s"
                        % (am.get("period") or "?", am.get("totalIn"), am.get("totalPay")))
                  if not am.get("period"):
                      print("  ВНИМАНИЕ: не разобралась подпись недели — проверьте шапку листа")
              if len(dyn) >= 2 and dyn[-1]["total"] == dyn[-2]["total"]:
                  print("  ВНИМАНИЕ: %s на %s совпадает с %s до тенге — неделю в таблице,"
                        " похоже, ещё не заполнили" % (tag.upper(), dyn[-1]["date"], dyn[-2]["date"]))
          PY
