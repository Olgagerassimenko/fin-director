name: Контрагенты — пересборка разреза

# Отдельный прогон только под contractor_items.js. Полный pulse-daily идёт
# сорок с лишним минут и упирается в лимит, а здесь нужны всего два шага:
# выгрузить продажи из айко и пересобрать разрез по контрагентам.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pulse-daily
  cancel-in-progress: false

jobs:
  ctr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.txt

      - name: Продажи из iiko
        timeout-minutes: 12
        run: python iiko_export.py

      - name: Контрагенты — что купили
        timeout-minutes: 8
        run: python gen_contractor_items.py

      - uses: actions/setup-node@v4
        with: {node-version: "20"}

      - name: Публикация (Cloudflare Workers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy

      - name: Сохранить в репозиторий
        if: always()
        run: |
          git config user.name "pulse-ci"; git config user.email "ci@local"
          git add -f contractor_items.js || true
          git commit -m "Контрагенты: пересобранный разрез [skip ci]" || echo "нет изменений"
          git pull --rebase -X theirs origin main || { git rebase --abort || true; }
          git push origin HEAD:main || echo "push не удался"

      - name: "Проверка: 99 и 110 сведены"
        if: always()
        run: |
          python - <<'PY'
          import re, json, sys
          txt = open("contractor_items.js", encoding="utf-8").read()
          bad = re.findall(r'"name"\s*:\s*"110[^"]*"', txt)
          rp  = re.findall(r'"name"\s*:\s*"99[^"]*"', txt)
          print("строк с 99-…:", len(rp), set(rp[:3]))
          print("строк со 110-…:", len(bad), set(bad[:3]))
          if bad:
              sys.exit("110 всё ещё отдельным контрагентом — слияние не сработало")
          PY
