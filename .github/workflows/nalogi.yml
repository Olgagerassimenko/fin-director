name: Налоги — 1С (каждый час)

on:
  workflow_dispatch: {}
  schedule:
    # Раз в час. Налоги меняются медленно (начисления — помесячно, оплаты — по факту),
    # поэтому чаще не нужно, а сервер 1С лишний раз не тревожим.
    - cron: "20 * * * *"
  push:
    branches: [main]
    paths:
      - "nalogi_report.py"
      - "nalogi_template.html"
      - ".github/workflows/nalogi.yml"

permissions:
  contents: write

concurrency:
  group: nalogi-1c-hourly    # своя дорожка — не отменяется отчётом по оплатам
  cancel-in-progress: true

jobs:
  nalogi:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Сбор налогов из 1С (OData)
        env:
          ODATA_USER: ${{ secrets.ODATA_USER }}
          ODATA_PASS: ${{ secrets.ODATA_PASS }}
        run: python nalogi_report.py

      - name: Есть ли изменения
        id: diff
        run: |
          if [ -n "$(git status --porcelain 'nalogi_отчёт.html')" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
            echo "Отчёт изменился — коммитим и деплоим"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "Изменений нет — деплой не нужен"
          fi

      - name: Сохранить в репозиторий
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "pulse-ci"
          git config user.email "ci@local"
          git add -f "nalogi_отчёт.html"
          git commit -m "Налоги: обновление из 1С [skip ci]" || echo "нечего коммитить"
          git pull --rebase -X ours origin main || { git rebase --abort || true; }
          git push origin HEAD:main || echo "push не удался (продолжаем деплой)"

      - name: Node
        if: steps.diff.outputs.changed == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Публикация на сайт (Cloudflare Workers)
        if: steps.diff.outputs.changed == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy
