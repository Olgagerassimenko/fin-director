name: iiko — какие поля отдаёт OLAP

# Разведка перед «журналом изменений» в ДДС. В OLAP автора нет, зато есть
# /resto/api/events: события с пользователем и временем. Смотрим, какие
# типы событий бывают и что внутри у денежных. Ничего не пишет.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Типы событий в журнале iiko
        run: |
          python - <<'PY'
          import os, warnings, hashlib, requests, sys, datetime, re, collections
          import xml.etree.ElementTree as ET
          warnings.filterwarnings("ignore"); sys.stdout.reconfigure(encoding="utf-8")
          from iiko_export import URL, LOGIN, PASS
          s = requests.Session()
          tok = s.get(f"{URL}/resto/api/auth",
                      params={"login": LOGIN, "pass": hashlib.sha1(PASS.encode()).hexdigest()},
                      verify=False, timeout=60).text.strip().strip('"')
          today = datetime.date.today()
          frm = (today - datetime.timedelta(days=7)).isoformat()
          to = (today + datetime.timedelta(days=1)).isoformat()
          r = s.get(URL + "/resto/api/events", params={"key": tok, "from": frm, "to": to},
                    verify=False, timeout=180)
          root = ET.fromstring(r.text)
          evs = root.findall("event")
          out = ["# Журнал событий iiko за %s — %s" % (frm, to), "",
                 "событий получено: **%d**, размер ответа %d КБ" % (len(evs), len(r.text)//1024), ""]

          # справочник сотрудников: id -> имя
          emp = {}
          er = s.get(URL + "/resto/api/employees", params={"key": tok}, verify=False, timeout=180)
          for e in ET.fromstring(er.text).findall("employee"):
              i = e.findtext("id"); n = (e.findtext("name") or "").strip()
              if i: emp[i] = n
          out.append("сотрудников в справочнике: **%d**" % len(emp)); out.append("")

          def attrs(ev):
              d = {}
              for a in ev.findall("attribute"):
                  d[a.findtext("name") or ""] = (a.findtext("value") or "", a.findtext("type") or "")
              return d

          cnt = collections.Counter(ev.findtext("type") or "?" for ev in evs)
          out.append("## типы событий")
          out.append("| тип | сколько |")
          out.append("|---|---|")
          for t, c in cnt.most_common(60):
              out.append("| `%s` | %d |" % (t, c))
          out.append("")

          # события, похожие на деньги и документы
          MONEY = re.compile(r"doc|pay|cash|invoice|money|account|transact|writeoff|incom|outgo|"
                             r"store|order|price|product", re.I)
          out.append("## примеры денежных и документных событий")
          shown = 0
          for ev in evs:
              t = ev.findtext("type") or ""
              if not MONEY.search(t): continue
              a = attrs(ev)
              u = a.get("user", ("", ""))[0]
              out.append("### `%s` · %s · пользователь: **%s**"
                         % (t, ev.findtext("date"), emp.get(u, u or "—")))
              out.append("| поле | значение | тип |")
              out.append("|---|---|---|")
              for k, (v, tp) in list(a.items())[:16]:
                  vv = emp.get(v, v)
                  out.append("| %s | %s | %s |" % (k, str(vv)[:90].replace("|", "/"), tp))
              out.append("")
              shown += 1
              if shown >= 8: break
          if not shown:
              out.append("таких событий за неделю нет — показываю любые пять:")
              for ev in evs[:5]:
                  a = attrs(ev)
                  out.append("### `%s` · %s" % (ev.findtext("type"), ev.findtext("date")))
                  out.append("```")
                  out.append(", ".join("%s=%s" % (k, emp.get(v[0], v[0])[:40]) for k, v in a.items()))
                  out.append("```")
          txt = "\n".join(out)
          print(txt[:4000])
          p2 = os.environ.get("GITHUB_STEP_SUMMARY")
          if p2: open(p2, "a", encoding="utf-8").write(txt + "\n")
          PY
