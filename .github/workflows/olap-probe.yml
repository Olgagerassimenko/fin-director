name: iiko — какие поля отдаёт OLAP

# Разведка перед «аналитикой изменений» в ДДС. В OLAP TRANSACTIONS автора
# нет (проверено: 116 полей, ни одного про пользователя), поэтому ищем его
# в журнале событий и в API документов. Ничего не пишет, только печатает.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Где в iiko лежит автор операции
        run: |
          python - <<'PY'
          import json, os, warnings, hashlib, requests, sys, datetime
          warnings.filterwarnings("ignore"); sys.stdout.reconfigure(encoding="utf-8")
          from iiko_export import URL, LOGIN, PASS
          s = requests.Session()
          tok = s.get(f"{URL}/resto/api/auth",
                      params={"login": LOGIN, "pass": hashlib.sha1(PASS.encode()).hexdigest()},
                      verify=False, timeout=60).text.strip().strip('"')
          today = datetime.date.today()
          frm = (today - datetime.timedelta(days=3)).isoformat()
          to = today.isoformat()
          out = ["# Где в iiko есть автор и время правки", ""]
          cand = [
            ("журнал событий", "/resto/api/events", {"from": frm, "to": to}),
            ("журнал событий v2", "/resto/api/v2/events", {"from": frm, "to": to}),
            ("типы событий", "/resto/api/events/metadata/types", {}),
            ("кассовые смены", "/resto/api/v2/cashShifts/list",
             {"openDateFrom": frm, "openDateTo": to}),
            ("пользователи", "/resto/api/employees", {}),
            ("платёжные документы", "/resto/api/v2/documents/paymentDocument",
             {"dateFrom": frm, "dateTo": to}),
            ("кассовые операции", "/resto/api/v2/documents/cashIncome",
             {"dateFrom": frm, "dateTo": to}),
          ]
          for name, path, extra in cand:
              p = dict(extra); p["key"] = tok
              try:
                  r = s.get(URL + path, params=p, verify=False, timeout=90)
                  body = r.text or ""
                  out.append("## %s — `%s` → HTTP %d, %d байт" % (name, path, r.status_code, len(body)))
                  if r.status_code == 200 and body.strip():
                      out.append("```")
                      out.append(body[:1200].replace("`", "'"))
                      out.append("```")
                  elif body:
                      out.append("`%s`" % body[:200].replace("`", "'").replace("\n", " "))
              except Exception as e:
                  out.append("## %s — `%s` → ошибка: %s" % (name, path, str(e)[:160]))
              out.append("")
          txt = "\n".join(out)
          print(txt)
          p2 = os.environ.get("GITHUB_STEP_SUMMARY")
          if p2: open(p2, "a", encoding="utf-8").write(txt + "\n")
          PY
