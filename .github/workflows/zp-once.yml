name: ЗП — отчёт из iiko

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: zp-once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python gen_zp.py
      - name: Сохранить
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add -f зп_РАЗВЕДКА.txt зп_август.csv зп_LOG.txt 2>/dev/null || true
          git commit -m "ЗП: выгрузка из iiko [skip ci]" || echo "нечего сохранять"
          git push
