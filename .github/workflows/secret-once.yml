name: secret-once
# Разовый прогон: кладёт PULSE_TOKEN из секретов GitHub в секреты Cloudflare,
# чтобы воркер читал его как env.PULSE_TOKEN. Значение нигде не печатается.
on:
  workflow_dispatch: {}
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: положить секрет в Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULSE_TOKEN: ${{ secrets.PULSE_TOKEN }}
        run: |
          if [ -z "$PULSE_TOKEN" ]; then echo "::error::секрет PULSE_TOKEN пуст"; exit 1; fi
          printf '%s' "$PULSE_TOKEN" | npx --yes wrangler@3 secret put PULSE_TOKEN
          echo "готово"
