name: sales-rebuild-once
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - name: пересборка дашборда продаж
        run: python rebuild_sales.py
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: публикация
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy
      - name: сохранить
        run: |
          git config user.name "pulse-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f продажи_2026.html sales_sum.js *_meta.js
          git commit -m "дашборд продаж пересобран (раздел Астана) [skip ci]" || echo "нет изменений"
          git pull --rebase -X theirs origin main || git rebase --abort || true
          git push origin HEAD:main
