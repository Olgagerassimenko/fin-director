name: Публикация сайта (быстрая)

# Зачем отдельный workflow.
# «Пульс — ежедневное обновление из iiko» перед публикацией прогоняет всю
# сборку: продажи, ОПиУ, ДДС, закуп, склады, SKU. Когда iiko недоступен
# (02.09.2026 он лежал с ServerState=WAITING_LICENSE), каждый такой шаг ждёт
# свой таймаут, и один прогон растягивается на десятки минут. А так как
# прогоны выстраиваются в очередь, правка вёрстки или текста могла ждать
# публикации час — при том, что пересобирать для неё нечего.
#
# Этот workflow ничего не собирает: берёт репозиторий как есть и выкладывает.
# Данные в нём те, что уже лежат в репозитории после последней ночной сборки,
# поэтому свежесть цифр не страдает — их по-прежнему обновляет ночной прогон,
# он же и публикует результат.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Своя очередь, отдельная от pulse-daily: иначе быстрая публикация вставала бы
# за многочасовой сборкой. Новый пуш отменяет предыдущую публикацию — смысла
# выкладывать промежуточное состояние нет.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Публикация (Cloudflare Workers)
        timeout-minutes: 6
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy
