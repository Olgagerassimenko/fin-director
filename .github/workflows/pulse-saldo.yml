name: Пульс — сальдо по контрагентам (каждые 30 минут)

# Баланс по контрагентам берётся не из гугл-таблицы, а прямо из айко
# (счёт 3.06 «Задолженность перед поставщиками»), поэтому его можно
# показывать на любой день, а не только на недельный срез. Сверено
# на 25.09.2026: Витамин+, Глобал Фуд, Handy Yummy, Adolar, KazBeef
# и Элита-Трейд сошлись с таблицей до тенге.
#
# Раз в полчаса: проводки в айко правят в течение дня, а страница ДЗ/КЗ
# и так пересобирается ежечасно — сальдо просто идёт чаще.

on:
  schedule:
    - cron: "20,50 * * * *"    # в :20 и :50, чтобы не сталкиваться с ДДС (:00/:30) и ДЗ/КЗ (:05)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pulse-daily
  cancel-in-progress: false

jobs:
  saldo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.txt

      - name: Сальдо из айко
        timeout-minutes: 10
        run: python gen_saldo.py

      - uses: actions/setup-node@v4
        with: {node-version: "20"}

      - name: Публикация (Cloudflare Workers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy

      - name: Сохранить сальдо в репозиторий
        if: always()
        run: |
          git config user.name "pulse-ci"; git config user.email "ci@local"
          git add -f saldo.js || true
          git commit -m "Сальдо: свежие данные [skip ci]" || echo "нет изменений"
          git pull --rebase -X theirs origin main || { git rebase --abort || true; }
          if grep -q '^<<<<<<< ' saldo.js ; then
            echo "::error::в saldo.js остались маркеры конфликта — push отменён"
            exit 1
          fi
          git push origin HEAD:main || echo "push не удался"

      - name: "Проверка: сальдо собралось"
        if: always()
        run: |
          python - <<'PY'
          import json, re, sys
          txt = open("saldo.js", encoding="utf-8").read()
          m = re.search(r"=\s*(\{.*\});?\s*$", txt, re.S)
          if not m: sys.exit("saldo.js не разобрался")
          d = json.loads(m.group(1))
          rows = d.get("rows") or []
          tot = sum(r["open"] + sum(v for _, v in r["mv"]) for r in rows)
          print("обновлено:", d.get("updated"), "| строк:", len(rows),
                "| итого на сегодня: %s" % f"{tot:,.0f}".replace(",", " "))
          if not rows: sys.exit("сальдо пустое")
          if d.get("missing"):
              print("не нашлись в айко (%d):" % len(d["missing"]), ", ".join(d["missing"][:10]))
          PY
