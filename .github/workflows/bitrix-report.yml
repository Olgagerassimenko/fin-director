name: Битрикс — отчёт по оплатам

on:
  workflow_dispatch: {}
  schedule:
    # каждые 3 часа (UTC). Живой отчёт «Битрикс · Оплаты».
    - cron: "0 */3 * * *"
  push:
    branches: [main]
    paths:
      - "bitrix_report.py"
      - ".github/workflows/bitrix-report.yml"

permissions:
  contents: write

concurrency:
  group: pulse-daily        # общий с основным пайплайном — деплои не сталкиваются
  cancel-in-progress: false

jobs:
  bitrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Робот по оплатам (сбор + отчёт)
        continue-on-error: true
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: python bitrix_report.py

      - name: Сохранить результат в репозиторий
        if: always()
        run: |
          git config user.name "pulse-ci"
          git config user.email "ci@local"
          git add -f bitrix_log.txt "bitrix_отчёт_оплаты.html" 2>/dev/null || true
          git commit -m "Битрикс: отчёт по оплатам [skip ci]" || echo "нет изменений"
          # --autostash при конфликте писал маркеры <<<<<<< прямо в данные.
          git checkout -- . 2>/dev/null || true
          git pull --rebase -X theirs origin main || { git rebase --abort || true; }
          git push origin HEAD:main || echo "push не удался"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Публикация отчёта (Cloudflare Workers)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy
