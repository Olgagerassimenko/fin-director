name: Битрикс — оплаты (каждые 5 минут)

on:
  workflow_dispatch: {}
  schedule:
    # Каждые 5 минут. Крон GitHub — «не чаще 5 мин» и может плавать на несколько минут
    # под нагрузкой. Запуск на серверах GitHub — ноутбук не нужен.
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "bitrix_report.py"
      - "oplaty_template.html"
      - ".github/workflows/bitrix-report.yml"

permissions:
  contents: write

concurrency:
  group: bitrix-oplaty-5min   # своя дорожка — не отменяется чужими процессами
  cancel-in-progress: true    # свежий запуск важнее — старый можно отменить

jobs:
  bitrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Сбор отчёта из Битрикса
        id: build
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
        run: python bitrix_report.py

      - name: Есть ли изменения
        id: diff
        run: |
          if [ -n "$(git status --porcelain 'bitrix_отчёт_оплаты.html')" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
            echo "Отчёт изменился — коммитим и деплоим"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "Изменений нет — деплой не нужен"
          fi

      - name: Сохранить в репозиторий
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "pulse-ci"
          git config user.email "ci@local"
          git add -f "bitrix_отчёт_оплаты.html"
          git commit -m "Битрикс: оплаты [skip ci]" || echo "нечего коммитить"
          git pull --rebase -X ours origin main || { git rebase --abort || true; }
          git push origin HEAD:main || echo "push не удался (продолжаем деплой)"

      - name: Node
        if: steps.diff.outputs.changed == '1'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Публикация на сайт (Cloudflare Workers)
        if: steps.diff.outputs.changed == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy
