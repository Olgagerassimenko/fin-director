name: deploy-debug
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: wrangler 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          npx --yes wrangler@3 --version > /tmp/d.log 2>&1
          npx --yes wrangler@3 deploy >> /tmp/d.log 2>&1
          echo "=== exit wrangler3: $? ===" >> /tmp/d.log
      - name: wrangler 4
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          echo "=== wrangler 4 ===" >> /tmp/d.log
          npx --yes wrangler@4 --version >> /tmp/d.log 2>&1
          npx --yes wrangler@4 deploy >> /tmp/d.log 2>&1
          echo "=== exit wrangler4: $? ===" >> /tmp/d.log
      - name: сохранить лог
        if: always()
        run: |
          mkdir -p _logs
          sed -e 's/[A-Za-z0-9_-]\{40,\}/<HIDDEN>/g' /tmp/d.log > _logs/deploy.log
          git config user.name "pulse-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f _logs/deploy.log
          git commit -m "лог деплоя [skip ci]" || echo "нет изменений"
          git pull --rebase -X theirs origin main || git rebase --abort || true
          git push origin HEAD:main
