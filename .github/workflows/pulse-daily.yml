name: Пульс — ежедневное обновление из iiko

on:
  schedule:
    # 3 раза в день. UTC+5 (Asia/Almaty): 08:00, 14:00, 20:00 = 03:00, 09:00, 15:00 UTC.
    # Время GitHub может плавать на несколько минут. Запуск идёт на серверах GitHub — ноутбук не нужен.
    - cron: "0 3,9,15 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    # Полный прогон при каждом коммите. Шаг сохранения ставит [skip ci], поэтому автопуш не зациклится.

permissions:
  contents: write      # чтобы сохранять свежие дашборды обратно в репозиторий

concurrency:
  group: pulse-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: "1. Продажи из iiko"
        continue-on-error: true
        run: python iiko_export.py
      - name: "2. Пересборка дашборда продаж"
        continue-on-error: true
        run: python rebuild_sales.py
      - name: "2b. ОПиУ из iiko (для сверки на дашборде продаж)"
        continue-on-error: true
        run: python opiu_iiko.py
      - name: "3. Контрагенты — что купили"
        continue-on-error: true
        run: python gen_contractor_items.py
      - name: "4. ДДС — остатки из iiko"
        continue-on-error: true
        run: python dds_data.py
      - name: "5. ДЗ/КЗ из Google"
        continue-on-error: true
        run: python dz_kz_months.py
      - name: "6. Сборка дашборда ДДС"
        continue-on-error: true
        run: python gen_dds.py
      - name: "6b. Дашборд складов"
        continue-on-error: true
        run: python gen_sklady.py

      - name: "7. ДДС прямой метод"
        continue-on-error: true
        run: python dds_pryamoy.py
      - name: "8. Сборка ДДС прямого"
        continue-on-error: true
        run: python gen_ddsp.py
      - name: "9. SKU-аналитика 360"
        continue-on-error: true
        run: python SKU_iiko/generate.py
      - name: "10. Закуп из iiko"
        continue-on-error: true
        run: python zakup_data.py
      - name: "11. Сборка дашборда закупа"
        continue-on-error: true
        run: python gen_zakup.py

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Публикация (Cloudflare Workers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy

      - name: Сохранить свежие дашборды обратно в репозиторий
        if: always()
        run: |
          git config user.name "pulse-ci"
          git config user.email "ci@local"
          git add -f продажи_2026.html дашборд_ддс.html дашборд_ддс_прямой.html склады.html закуп.html zakup_data.js дашборд_sku_iiko.html *_meta.js sku_live.js contractor_items.js opiu_rev.js 2>/dev/null || true
          git commit -m "Свежие данные дашбордов [skip ci]" || echo "нет изменений"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || echo "push не удался"

      - name: "Проверка свежести (сайт показывает сегодняшнюю дату)"
        if: always()
        run: |
          python - <<'PY'
          import datetime, json, re, sys, time, urllib.request, gzip, base64
          TZ = datetime.timezone(datetime.timedelta(hours=5))
          today = datetime.datetime.now(TZ).strftime("%d.%m.%Y")
          SITE = "https://lucky-river-eaf1.findirfoodzavod.workers.dev"
          stamp = str(int(time.time()))
          print("сегодня:", today)

          def local(path):
              return open(path, encoding="utf-8").read()

          def live(path):
              url = "%s/%s?cb=%s" % (SITE, path, stamp)
              return urllib.request.urlopen(url, timeout=60).read().decode("utf-8", "replace")

          def date_meta(txt):
              m = re.search(r'"(?:updated|pulled)":\s*"(\d{2}\.\d{2}\.\d{4})', txt)
              return m.group(1) if m else "?"

          def date_zakup(txt):
              m = re.search(r'window\.__ZG="([^"]+)"', txt)
              if not m: return "?"
              head = gzip.decompress(base64.b64decode(m.group(1)))[:200].decode("utf-8", "replace")
              d = re.search(r'"updated":\s*"(\d{2}\.\d{2}\.\d{4})', head)
              return d.group(1) if d else "?"

          print("ждём распространения деплоя 60 сек")
          time.sleep(60)

          checks = [
              ("продажи",  "sales_meta.js", date_meta),
              ("ДДС",      "dds_meta.js",   date_meta),
              ("ДДС прямой","ddsp_meta.js", date_meta),
              ("закуп",    "zakup_data.js", date_zakup),
          ]
          bad = []
          for title, path, fn in checks:
              try:
                  l = fn(local(path))
              except Exception as e:
                  l = "ошибка: %s" % e
              try:
                  s = fn(live(path))
              except Exception as e:
                  s = "ошибка: %s" % e
              print("%-12s собрано=%s  сайт=%s" % (title, l, s))
              if s != today:
                  bad.append("%s: на сайте %s вместо %s" % (title, s, today))

          if bad:
              print("")
              print("ПРОБЛЕМА — сайт не обновился:")
              for b in bad: print("  -", b)
              print("Частая причина: кто-то запустил локальный npx wrangler deploy из папки ФД")
              print("и перезаписал сайт старой копией.")
              sys.exit(1)
          print("ОК: все дашборды на сайте сегодняшние")
          PY
