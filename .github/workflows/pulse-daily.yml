name: Пульс — ежедневное обновление из iiko

on:
  schedule:
    # 3 раза в день. UTC+5 (Asia/Almaty): 08:00, 14:00, 20:00 = 03:00, 09:00, 15:00 UTC.
    # Время GitHub может плавать на несколько минут. Запуск идёт на серверах GitHub — ноутбук не нужен.
    - cron: "0 3,9,15 * * *"
    # + ежедневная сборка отчёта «ДДС за день» за ТЕКУЩИЙ день, 18:00 Алматы = 13:00 UTC
    - cron: "0 13 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    # Полный прогон при каждом коммите. Шаг сохранения ставит [skip ci], поэтому автопуш не зациклится.

permissions:
  contents: write      # чтобы сохранять свежие дашборды обратно в репозиторий

concurrency:
  group: pulse-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: "1. Продажи из iiko"
        continue-on-error: true
        timeout-minutes: 9
        run: python iiko_export.py
      - name: "2. Пересборка дашборда продаж"
        continue-on-error: true
        run: python rebuild_sales.py
      - name: "2b. ОПиУ из iiko (для сверки на дашборде продаж)"
        continue-on-error: true
        timeout-minutes: 7
        run: python opiu_iiko.py
      - name: "3. Контрагенты — что купили"
        continue-on-error: true
        timeout-minutes: 6
        run: python gen_contractor_items.py
      - name: "4. ДДС — остатки из iiko"
        continue-on-error: true
        timeout-minutes: 7
        run: python dds_data.py
      - name: "5. ДЗ/КЗ из Google"
        continue-on-error: true
        timeout-minutes: 5
        run: python dz_kz_months.py
      - name: "6. Сборка дашборда ДДС"
        continue-on-error: true
        run: python gen_dds.py
      - name: "6b. Дашборд складов"
        continue-on-error: true
        run: python gen_sklady.py

      - name: "7. ДДС прямой метод"
        continue-on-error: true
        timeout-minutes: 7
        run: python dds_pryamoy.py
      - name: "8. Сборка ДДС прямого"
        continue-on-error: true
        run: python gen_ddsp.py
      - name: "9. SKU-аналитика 360"
        continue-on-error: true
        timeout-minutes: 9
        run: python SKU_iiko/generate.py
      - name: "10. Закуп из iiko"
        continue-on-error: true
        timeout-minutes: 9
        run: python zakup_data.py
      - name: "11. Сборка дашборда закупа"
        continue-on-error: true
        run: python gen_zakup.py

      - name: "11a. Аналитика кредиторки (поступление на склад против оплат)"
        continue-on-error: true
        run: python gen_kz_ana.py

      - name: "11c. Аудит ОПиУ постатейно (проверка разносок)"
        continue-on-error: true
        run: python gen_opiu_audit.py

      - name: "11b. Структура затрат ОПиУ из iiko (свежие месяцы)"
        continue-on-error: true
        timeout-minutes: 7
        run: python opiu_full.py

      - name: "11d. ОПиУ: незакрытые месяцы из iiko (июнь и дальше)"
        continue-on-error: true
        timeout-minutes: 8
        run: python gen_opiu_late.py

      - name: "12. Аналитика возвратов Маймарт (полная себестоимость по ОПиУ)"
        continue-on-error: true
        run: python gen_maymart.py

      - name: "13. Полная себестоимость завода (ОПиУ + контрагенты)"
        continue-on-error: true
        run: python gen_fullcost.py

      - name: "14. Рычаги прибыли (цены, потери, ножницы, ассортимент)"
        continue-on-error: true
        run: python gen_levers.py

      - name: Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Публикуем всегда: если какой-то источник отвалился по таймауту,
      # сайт всё равно должен обновиться остальными свежими данными.
      - name: Публикация (Cloudflare Workers)
        if: always()
        timeout-minutes: 6
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@3 deploy

      - name: Сохранить свежие дашборды обратно в репозиторий
        if: always()
        run: |
          git config user.name "pulse-ci"
          git config user.email "ci@local"
          git add -f продажи_2026.html дашборд_ддс.html дашборд_ддс_прямой.html склады.html "дашборд_себестоимость_2025-2026.html" закуп.html zakup_data.js dz_kz.js рычаги.html дашборд_sku_iiko.html *_meta.js ddsp_days.js kz_ana.js opiu_audit.js opiu_late.js sku_live.js contractor_items.js opiu_rev.js 2>/dev/null || true
          git commit -m "Свежие данные дашбордов [skip ci]" || echo "нет изменений"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || echo "push не удался"

      - name: "Проверка свежести (данные и сайт за сегодня)"
        if: always()
        run: |
          python - <<'PY'
          import datetime, re, sys, time, urllib.request, gzip, base64
          TZ = datetime.timezone(datetime.timedelta(hours=5))
          today = datetime.datetime.now(TZ).strftime("%d.%m.%Y")
          SITE = "https://lucky-river-eaf1.findirfoodzavod.workers.dev"
          stamp = str(int(time.time()))
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          print("сегодня:", today)

          def live(path):
              req = urllib.request.Request("%s/%s?cb=%s" % (SITE, path, stamp))
              req.add_header("User-Agent", UA)
              req.add_header("Accept", "*/*")
              return urllib.request.urlopen(req, timeout=90).read().decode("utf-8", "replace")

          def date_meta(txt):
              m = re.search(r'"(?:updated|pulled)":\s*"(\d{2}\.\d{2}\.\d{4})', txt)
              return m.group(1) if m else "?"

          def date_zakup(txt):
              m = re.search(r'window\.__ZG="([^"]+)"', txt)
              if not m: return "?"
              head = gzip.decompress(base64.b64decode(m.group(1)))[:200].decode("utf-8", "replace")
              d = re.search(r'"updated":\s*"(\d{2}\.\d{2}\.\d{4})', head)
              return d.group(1) if d else "?"

          checks = [("продажи", "sales_meta.js", date_meta),
                    ("ДДС", "dds_meta.js", date_meta),
                    ("ДДС прямой", "ddsp_meta.js", date_meta),
                    ("закуп", "zakup_data.js", date_zakup),
                    ("ДЗ/КЗ", "dz_kz.js", date_meta)]

          # 1) собранные файлы — главная проверка (упал iiko => красный прогон)
          stale = []
          for title, path, fn in checks:
              try:
                  d = fn(open(path, encoding="utf-8").read())
              except Exception as e:
                  d = "ошибка: %s" % e
              print("%-12s собрано: %s" % (title, d))
              if d != today:
                  stale.append("%s: данные за %s вместо %s" % (title, d, today))

          # 2) сайт — предупреждение (Cloudflare может не пустить робота)
          print("")
          print("ждём распространения деплоя 60 сек")
          time.sleep(60)
          rolled = []
          for title, path, fn in checks:
              try:
                  s = fn(live(path))
                  print("%-12s на сайте: %s" % (title, s))
                  if s != today:
                      rolled.append("%s: на сайте %s" % (title, s))
              except Exception as e:
                  print("%-12s на сайте: проверить не удалось (%s)" % (title, e))

          if rolled:
              print("")
              print("ВНИМАНИЕ — сайт откатился:")
              for r in rolled: print("  -", r)
              print("Обычная причина: локальный npx wrangler deploy из папки ФД")
              print("перезаписал сайт старой копией.")
          if stale:
              print("")
              print("ПРОБЛЕМА — данные не собрались:")
              for s in stale: print("  -", s)
              sys.exit(1)
          if rolled:
              sys.exit(1)
          print("")
          print("ОК: данные и сайт за сегодня")
          PY
