      + 'что позиции там нет: если она нужна цеху, её либо заказывают, либо перекидывают с другого склада.</div>'
      + '<div class="mx"><table><thead><tr><th>Позиция</th>'
      + used.map(function(s){ return '<th class="rot" title="' + esc(s) + '">' + esc(shortStore(s)) + '</th>'; }).join('')
      + '<th>Всего, штук</th><th>Сумма, тенге</th><th>Статус</th></tr></thead><tbody>';
    rows.forEach(function (i) {
      h += '<tr><td>' + esc(i.n) + '<div class="sub2">' + esc(i.u||'') + '</div></td>'
        + used.map(function (s) {
            var v = i.st[s];
            return '<td class="c ' + (v ? 'has' : 'no') + '">' + (v ? f1(v[0]) : '·') + '</td>';
          }).join('')
        + '<td>' + f1(i.stock) + '</td><td>' + f0(i.stSum) + '</td>'
        + '<td><span class="st ' + stCls(i.st_) + '">' + i.st_ + '</span></td></tr>';
    });
    h += '</tbody><tfoot><tr><td>Итого</td>'
      + used.map(function (s) {
          var t = rows.reduce(function (a, i) { return a + (i.st[s] ? i.st[s][1] : 0); }, 0);
          return '<td class="c">' + fm(t) + '</td>'; }).join('')
      + '<td></td><td>' + f0(rows.reduce(function(a,i){return a+i.stSum;},0)) + '</td><td></td></tr></tfoot>'
      + '</table></div>'
      + '<div class="legend"><span><i style="background:rgba(34,197,94,.35)"></i>есть на складе</span>'
      + '<span><i style="background:#1c2740"></i>нет на складе</span>'
      + '<span>в итоговой строке — сумма остатка по складу, ₸</span></div></div>';
    el.innerHTML = h;
  }

  /* ── 3. ВСЯ УПАКОВКА ───────────────────────────────────────────── */
  var SORT = { k:'order', dir:-1 };
  var COLS = [['n','Позиция'],['stock','Остаток, штук'],['perD','Расход в день, штук'],
              ['days','Хватит, дней'],['lead','Срок поставки, дн'],['order','Заказать, штук'],
              ['orderSum','Сумма, тенге'],['price','Цена за 1, тенге'],['stSum','Лежит, тенге'],
              ['st_','Статус']];
  function secAll() {
    var a = IT.filter(function(i){ return qmatch(i); }).slice();
    a.sort(function (x, y) {
      var k = SORT.k;
      if (k==='n'||k==='st_') return SORT.dir * String(x[k]).localeCompare(String(y[k]),'ru');
      var vx = x[k], vy = y[k];
      if (vx==null) vx = -1; if (vy==null) vy = -1;
      return SORT.dir * (vx - vy);
    });
    var h = '<div class="card"><div class="hint" style="margin-bottom:8px">'
      + 'Нажмите на рамку в колонке «Фото», чтобы приложить снимок позиции — он сохранится на сайте '
      + 'и будет виден всем. Можно залить сразу папку кнопкой «Фото пачкой» наверху.</div>'
      + '<div class="tw"><table><thead><tr><th class="ph">Фото</th><th class="stc" title="не заказывать">Стоп</th>'
      + COLS.map(function (c) {
          return '<th data-k="'+c[0]+'" class="'+(c[0]==='n'?'nm ':'')+(SORT.k===c[0]?'on':'')+'">'+c[1]
            + (SORT.k===c[0] ? (SORT.dir>0?' ↑':' ↓') : '') + '</th>'; }).join('')
      + '</tr></thead><tbody>';
    a.forEach(function (i) {
      h += '<tr class="' + (i.stop?'stopped':i.order>0?'hot':'') + '">'
        + phCell(i) + stopCell(i)
        + '<td class="nm">' + esc(i.n) + '<div class="sub2">' + supLink(i.main)
        +   (i.sups.length>1 ? ' и ещё ' + (i.sups.length-1) : '')
        +   (i.stores.length ? ' · ' + esc(i.stores.join(', ')) : ' · нет на складах') + '</div></td>'
        + '<td>' + f1(i.stock) + ' <span class="sub2" style="display:inline">' + esc(i.u) + '</span></td>'
        + '<td>' + (i.perD ? f1(i.perD) : '<span class="zero">—</span>') + '</td>'
        + '<td style="font-weight:700' + (i.days!=null&&i.days<i.lead?';color:#fca5a5':'') + '">' + f1(i.days) + '</td>'
        + '<td>' + i.lead + '</td>'
        + '<td>' + (i.order ? '<b style="color:#fcd34d">'+f0(i.order)+'</b>' : '<span class="zero">—</span>') + '</td>'
        + '<td>' + (i.orderSum ? f0(i.orderSum) : '<span class="zero">—</span>') + '</td>'
        + '<td>' + (i.price ? f1(i.price) + '<div class="sub2">' + esc(i.priceSrc) + '</div>'
            : '<span class="zero">—</span>') + '</td>'
        + '<td>' + f0(i.stSum) + '</td>'
        + '<td><span class="st ' + stCls(i.st_) + '">' + i.st_ + '</span></td></tr>';
    });
    h += '</tbody><tfoot><tr><td></td><td></td><td>Итого · ' + a.length + '</td><td></td><td></td><td></td><td></td>'
      + '<td>' + f0(a.reduce(function(s,i){return s+i.order;},0)) + '</td>'
      + '<td>' + f0(a.reduce(function(s,i){return s+i.orderSum;},0)) + '</td><td></td>'
      + '<td>' + f0(a.reduce(function(s,i){return s+i.stSum;},0)) + '</td><td></td></tr></tfoot></table></div></div>';
    var el = document.getElementById('s-all');
    el.innerHTML = h;
    bindPh(el); bindStop(el); bindSup(el);
    el.querySelectorAll('th[data-k]').forEach(function (th) {
      th.onclick = function () {
        var k = th.getAttribute('data-k');
        if (SORT.k===k) SORT.dir = -SORT.dir; else { SORT.k = k; SORT.dir = (k==='n'||k==='st_')?1:-1; }
        secAll();
      };
    });
  }

  /* ── 4. НЕ ИСПОЛЬЗУЕТСЯ ────────────────────────────────────────── */
  /*  Деньги, которые стоят. Разрезы отвечают на три разных вопроса:
      «по назначению» — можно ли это вообще вернуть в оборот (брендированную
      упаковку закрытого проекта переложить не на что), «по виду» — что именно
      закупили лишнего, «по давности» — насколько это уже безнадёжно.
      Длина полосы — величина; цвет в разрезе по виду и давности один и тот же,
      он ничего не кодирует. Двухцветным сделан только разрез по назначению,
      где цвет несёт смысл, и там он продублирован подписью и легендой.       */
  var C_NO = '#fbbf24', C_YES = '#60a5fa', C_ONE = '#a78bfa';

  function deadBrand(n) {
    var t = n.toLowerCase();
    if (t.indexOf('crave') >= 0) return ['Crave', false];
    if (/(^|[^а-я])сн([^а-я]|$)/.test(t) || t.indexOf('сладкий ноябрь') >= 0) return ['Сладкий ноябрь', false];
    if (t.indexOf('магнум') >= 0) return ['Магнум', false];
    if (t.indexOf('пикассо') >= 0) return ['Пикассо', false];
    return ['Общая упаковка', true];
  }
  function deadKind(n) {
    var t = n.toLowerCase();
    if (/короб/.test(t)) return 'Коробки';
    if (/пакет/.test(t)) return 'Пакеты';
    if (/этикетк|стикер|наклейк|топпер|слепок/.test(t)) return 'Этикетки и декор';
    if (/контейнер|боул|лоток|форма|ящик/.test(t)) return 'Контейнеры и формы';
    if (/стакан|крышк|держател|трубочк|шейкер/.test(t)) return 'Стаканы и крышки';
    return 'Бумага и прочее';
  }
  function deadAge(last) {
    if (!last) return ['Ни одного движения за год', 4];
    var cur = MON[MON.length - 1];
    var m = (+cur.slice(0, 4) - +last.slice(0, 4)) * 12 + (+cur.slice(5, 7) - +last.slice(5, 7));
    return m >= 12 ? ['Больше года', 3] : m >= 6 ? ['От 6 до 12 месяцев', 2]
         : m >= 3 ? ['От 3 до 6 месяцев', 1] : ['Меньше 3 месяцев', 0];
  }
  /*  Полоса: длина = доля от максимума, значение подписано на самой полосе —
      читать можно без наведения, поэтому отдельная всплывашка не нужна.   */
  function deadBar(label, val, share, max, color, sub) {
    var w = max > 0 ? Math.max(1.5, val / max * 100) : 0;
    return '<div style="margin-bottom:9px">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px">'
      +   '<div style="font-size:12px;color:#dbe6f5">' + label
      +     (sub ? ' <span style="color:#6b7f9c;font-size:11px">' + sub + '</span>' : '') + '</div>'
      +   '<div style="font-size:12px;color:#f1f5f9;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums">'
      +     f0(val) + ' ₸ <span style="color:#8fa2bd;font-weight:600">' + share.toFixed(1).replace('.', ',') + '%</span></div>'
      + '</div>'
      + '<div style="height:9px;background:rgba(148,163,184,.12);border-radius:5px;overflow:hidden">'
      +   '<div style="height:100%;width:' + w.toFixed(2) + '%;background:' + color + ';border-radius:5px"></div>'
      + '</div></div>';
  }
  function deadGroup(list, keyFn, tot) {
    var g = {}, order = [];
    list.forEach(function (i) {
      var k = keyFn(i);
      if (!g[k]) { g[k] = { sum: 0, n: 0 }; order.push(k); }
      g[k].sum += i.stSum; g[k].n++;
    });
    return order.map(function (k) { return { k: k, sum: g[k].sum, n: g[k].n, share: tot ? g[k].sum / tot * 100 : 0 }; })
                .sort(function (a, b) { return b.sum - a.sum; });
  }
  function deadCard(title, hint, inner) {
    return '<div class="card" style="margin-top:12px"><div style="font-size:13px;font-weight:700;color:#f1f5f9">'
      + title + '</div><div style="font-size:11.5px;color:#7f93b0;margin:3px 0 12px;line-height:1.55">' + hint + '</div>'
      + inner + '</div>';
  }

  function secDead() {
    var a = IT.filter(function(i){ return qmatch(i, true); }).filter(function (i) { return i.dead; });
    a.sort(function (x, y) { return y.stSum - x.stSum; });
    var withStock = a.filter(function (i) { return i.stock > 0; });
    var frozen = withStock.reduce(function (s, i) { return s + i.stSum; }, 0);
    var el = document.getElementById('s-dead');
    if (!a.length) { el.innerHTML = '<div class="card"><div class="empty">Вся упаковка в обороте.</div></div>'; return; }

    var stockAll = IT.reduce(function (s, i) { return s + i.stSum; }, 0);
    var sharePack = stockAll ? frozen / stockAll * 100 : 0;
    var noStock = a.length - withStock.length;

    /* можно ли вернуть в оборот */
    var reusable = withStock.filter(function (i) { return deadBrand(i.n)[1]; });
    var reusableSum = reusable.reduce(function (s, i) { return s + i.stSum; }, 0);
    var lockedSum = frozen - reusableSum;
    var lockedPct = frozen ? lockedSum / frozen * 100 : 0;

    /* топ-10 и накопленная доля */
    var run = 0, cum = withStock.map(function (i) { run += i.stSum; return frozen ? run / frozen * 100 : 0; });
    var top10 = cum.length >= 10 ? cum[9] : (cum.length ? cum[cum.length - 1] : 0);

    var gBrand = deadGroup(withStock, function (i) { return deadBrand(i.n)[0]; }, frozen);
    var gKind  = deadGroup(withStock, function (i) { return deadKind(i.n); }, frozen);
    var gAge   = deadGroup(withStock, function (i) { return deadAge(i.last)[0]; }, frozen);
    gAge.sort(function (x, y) {
      var ox = 0, oy = 0;
      withStock.some(function (i) { if (deadAge(i.last)[0] === x.k) { ox = deadAge(i.last)[1]; return true; } });
      withStock.some(function (i) { if (deadAge(i.last)[0] === y.k) { oy = deadAge(i.last)[1]; return true; } });
      return ox - oy;
    });
    var gStore = deadGroup(withStock, function (i) { return i.stores[0] || '—'; }, frozen);

    var maxB = Math.max.apply(null, gBrand.map(function (x) { return x.sum; }).concat([1]));
    var maxK = Math.max.apply(null, gKind.map(function (x) { return x.sum; }).concat([1]));
    var maxA = Math.max.apply(null, gAge.map(function (x) { return x.sum; }).concat([1]));
    var maxS = Math.max.apply(null, gStore.map(function (x) { return x.sum; }).concat([1]));

    function tile(l, v, s2, c) {
      return '<div class="kpi" style="--c:' + c + '"><div class="l">' + l + '</div>'
        + '<div class="v" style="color:' + c + '">' + v + '</div><div class="s">' + s2 + '</div></div>';
    }

    var html = '';

    /* ── вердикт ── */
    html += '<div class="card" style="border-left:3px solid ' + C_NO + '">'
      + '<div style="display:flex;gap:18px;align-items:baseline;flex-wrap:wrap">'
      +   '<div><div style="font-size:11px;color:#7f93b0;font-weight:600">ЗАМОРОЖЕНО В УПАКОВКЕ</div>'
      +   '<div style="font-size:30px;font-weight:800;color:' + C_NO + ';line-height:1.2;font-variant-numeric:tabular-nums">'
      +     f0(frozen) + ' ₸</div></div>'
      +   '<div style="flex:1;min-width:280px;font-size:12.5px;color:#c3d2e6;line-height:1.65">'
      +     'Это <b style="color:#f1f5f9">' + sharePack.toFixed(1).replace('.', ',') + '%</b> всех денег, '
      +     'которые лежат на складах в упаковке (' + f0(stockAll) + ' ₸). '
      +     'Лежит в <b style="color:#f1f5f9">' + withStock.length + '</b> '
      +     plw(withStock.length, 'позиции', 'позициях', 'позициях') + '; ещё ' + noStock + ' '
      +     plw(noStock, 'позиция', 'позиции', 'позиций') + ' не используется, но остатка не держит — '
      +     'их просто не надо заказывать.'
      +     '<div style="margin-top:7px;color:#fcd9a0">Главное: <b>' + lockedPct.toFixed(0) + '%</b> этих денег — '
      +     'упаковка под конкретный бренд. Её нельзя переложить на другой продукт: это кандидат на списание, а не на возврат в оборот.</div>'
      +   '</div></div></div>';

    /* ── плитки ── */

  /* ── ИМПОРТ ИЗ EXCEL ───────────────────────────────────────────────
     Выгрузили файл, поправили в нём недели, цены и «стоп» — и вернули
     обратно. Строки узнаём по названию позиции, остальное берём из
     колонок с теми же заголовками, что в выгрузке. Понимает .xlsx и
     .csv; xlsx распаковывается прямо в браузере. */
  function inflateRaw(buf){
    if (typeof DecompressionStream === 'undefined') return Promise.reject('браузер не умеет распаковывать');
    var ds = new DecompressionStream('deflate-raw');
    return new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer();
  }
  function unzip(ab, want){
    var dv = new DataView(ab), u8 = new Uint8Array(ab), end = -1;
    for (var i = ab.byteLength - 22; i >= 0 && i > ab.byteLength - 70000; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { end = i; break; }
    }
    if (end < 0) return Promise.reject('это не xlsx');
    var n = dv.getUint16(end + 10, true), off = dv.getUint32(end + 16, true);
    var out = {}, jobs = [], p = off;
    for (var k = 0; k < n; k++) {
      var nameLen = dv.getUint16(p + 28, true), extLen = dv.getUint16(p + 30, true),
          cmtLen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true),
          method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      var name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extLen + cmtLen;
      if (want.indexOf(name) < 0) continue;
      var lnl = dv.getUint16(lho + 26, true), lel = dv.getUint16(lho + 28, true);
      var dstart = lho + 30 + lnl + lel;
      var data = u8.subarray(dstart, dstart + csize);
      (function (nm, m, d) {
        jobs.push((m === 0 ? Promise.resolve(d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength))
                           : inflateRaw(d)).then(function (b) { out[nm] = new TextDecoder().decode(b); }));
      })(name, method, data);
    }
    return Promise.all(jobs).then(function () { return out; });
  }
  function sheetToRows(xml, shared){
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    var rows = [];
    Array.prototype.forEach.call(doc.getElementsByTagName('row'), function (tr) {
      var arr = [];
      Array.prototype.forEach.call(tr.getElementsByTagName('c'), function (c) {
        var ref = c.getAttribute('r') || '', col = 0;
        (ref.match(/^[A-Z]+/) || [''])[0].split('').forEach(function (ch) {
          col = col * 26 + (ch.charCodeAt(0) - 64);
        });
        var t = c.getAttribute('t'), v = '';
        if (t === 'inlineStr') { var is = c.getElementsByTagName('t')[0]; v = is ? is.textContent : ''; }
        else { var vn = c.getElementsByTagName('v')[0]; v = vn ? vn.textContent : '';
               if (t === 's') v = shared[+v] || ''; }
        if (col > 0) arr[col - 1] = v;
      });
      rows.push(arr);
    });
    return rows;
  }
  function csvToRows(txt){
    var first = txt.split('\n')[0] || '';
    var sep = first.split(';').length > first.split(',').length ? ';' : ',';
    return txt.split(/\r?\n/).filter(function(l){ return l.trim(); }).map(function (line) {
      var out = [], cur = '', q = false;
      for (var i = 0; i < line.length; i++) {
        var ch = line[i];
        if (q) { if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
        else if (ch === '"') q = true;
        else if (ch === sep) { out.push(cur); cur = ''; }
        else cur += ch;
      }
      out.push(cur); return out;
    });
  }
  function importRows(rows){
    if (!rows.length) { toast('Файл пустой'); return; }
    var head = (rows[0] || []).map(function(x){ return String(x||'').toLowerCase().trim(); });
    function col(){
      for (var i = 0; i < arguments.length; i++) {
        for (var j = 0; j < head.length; j++) if (head[j].indexOf(arguments[i]) === 0) return j;
      }
      return -1;
    }
    var cN = col('позиц','наимен','товар'), cW = col('недел'), cP = col('цена'), cS = col('стоп');
    if (cN < 0) { toast('В файле нет колонки «Позиция» — импортировать нечего.', 7000); return; }
    var byKey = {}; IT.forEach(function(i){ byKey[i.key] = i; });
    var jobs = [], miss = [], seen = 0;
    rows.slice(1).forEach(function (r) {
      var nm = String(r[cN] || '').trim();
      if (!nm || /^итого/i.test(nm)) return;
      var it = byKey[nkey(nm)];
      if (!it) { miss.push(nm); return; }
      seen++;
      if (cW >= 0) {
        var w = parseFloat(String(r[cW]).replace(',', '.'));
        var curW = WEEKS_MAN[it.key] || 0;
        if (isFinite(w) && w >= 1 && w <= 104) {
          if (w !== curW && !(curW === 0 && w === P.weeks)) jobs.push({ a:'weeks', n:it.key, v:w });
        } else if (curW) jobs.push({ a:'weeks', n:it.key, v:0 });
      }
      if (cP >= 0) {
        var pr = parseFloat(String(r[cP]).replace(/\s/g,'').replace(',', '.'));
        var curP = PRICE_MAN[it.key] || 0;
        if (isFinite(pr) && pr > 0 && Math.abs(pr - (curP || it.price)) > 0.005)
          jobs.push({ a:'price', n:it.key, v:pr });
      }
      if (cS >= 0) {
        var st = /стоп|да|yes|true|1|x|✓/i.test(String(r[cS] || '').trim());
        if (st !== !!it.stop) jobs.push({ a:'stop', n:it.key, v:st });
      }
    });
    if (!jobs.length) {
      toast('Узнали ' + seen + ' ' + plw(seen,'позицию','позиции','позиций') + ', менять нечего — всё совпадает.'
        + (miss.length ? '<br>Не нашли на сайте: ' + miss.length : ''), 7000);
      return;
    }
    var done = 0, bad = 0, total = jobs.length;
    toast('Применяю изменения: 0 из ' + total, 0);
    (function next(){
      if (!jobs.length) {
        redraw();
        toast('Импорт готов: изменено <b>' + done + '</b> '
          + plw(done,'значение','значения','значений')
          + (bad ? '<br>не сохранилось: ' + bad : '')
          + (miss.length ? '<br>не нашли на сайте: ' + miss.length + ' '
              + plw(miss.length,'строку','строки','строк') : ''), 9000);
        return;
      }
      var j = jobs.shift();
      fetch(API + '?a=' + j.a, { method:'POST', headers:{'content-type':'application/json'},
                                 body: JSON.stringify({ n:j.n, v:j.v }) })
        .then(function(r){ return r.json(); })
        .then(function (res) {
          if (res && res.ok) {
            done++;
            if (j.a === 'weeks') { if (j.v >= 1) WEEKS_MAN[j.n] = j.v; else delete WEEKS_MAN[j.n]; }
            if (j.a === 'price') { if (j.v > 0) PRICE_MAN[j.n] = j.v; else delete PRICE_MAN[j.n]; }
            if (j.a === 'stop')  { if (j.v) STOPS[j.n] = 1; else delete STOPS[j.n]; }
          } else bad++;
          toast('Применяю изменения: ' + (done + bad) + ' из ' + total, 0);
          next();
        })
        .catch(function(){ bad++; next(); });
    })();
  }

  /* Пачкой: файл привязывается к позиции по своему имени. «Лоток 187137 45.jpg»
     найдёт «У* Лоток 187*137*45 ФС 504 шт/кор» — служебные знаки при сравнении
     отбрасываются, достаточно узнаваемого куска названия. */
  function bulkMatch(fileName) {
    var nm = nkey(String(fileName).replace(/\.[a-z0-9]+$/i, ''));
    if (!nm) return null;
    var keys = IT.map(function(i){ return i.key; });
    if (keys.indexOf(nm) >= 0) return nm;
    var cand = keys.filter(function (x) { return x.indexOf(nm) >= 0 || nm.indexOf(x) >= 0; });
    if (!cand.length) return null;
    cand.sort(function (a, b) { return b.length - a.length; });
    return cand[0];
  }
  document.getElementById('f-many').onchange = function () {
    var files = Array.prototype.slice.call(this.files || []); this.value = '';
    if (!files.length) return;
    var pairs = [], miss = [];
    files.forEach(function (f) {
      var k = bulkMatch(f.name);
      if (k) pairs.push([k, f]); else miss.push(f.name);
    });
    if (!pairs.length) {
      toast('Ни один файл не удалось сопоставить с позицией. Назовите файл по названию позиции — '
        + 'например «Лоток 187 137 45.jpg».', 7000);
      return;
    }
    var done = 0, bad = [];
    (function next() {
      if (!pairs.length) {
        redraw();
        toast('Загружено фото: <b>' + done + '</b>'
          + (bad.length ? '<br>не получилось: ' + bad.length : '')
          + (miss.length ? '<br>не узнали позицию по имени файла: ' + esc(miss.slice(0,6).join(', '))
              + (miss.length>6 ? ' и ещё ' + (miss.length-6) : '') : ''), 9000);
        return;
      }
      var p = pairs.shift();
      toast('Загружаю фото… ' + (done + bad.length + 1) + ' из ' + (done + bad.length + 1 + pairs.length), 0);
      fotoPut(p[0], p[1], function (err) { if (err) bad.push(p[1].name); else done++; next(); });
    })();
  };
  document.getElementById('fotobulk').onclick = function () { document.getElementById('f-many').click(); };

  document.getElementById('urgbtn').onclick = function(){ urgPopup(); };
  document.getElementById('md-close').onclick = mdClose;
  document.getElementById('md').onclick = function (e) { if (e.target === this) mdClose(); };
  document.getElementById('md-go').onclick = function () {
    mdClose();
    var t = document.querySelector('#tabs .tab[data-s="buy"]');
    if (t) t.click();
    document.getElementById('s-buy').scrollIntoView({ block:'start' });
  };
  document.getElementById('md-xls').onclick = function () { xlsxBuy(urgList()); };
  document.getElementById('lb-x').onclick = lbClose;
  document.getElementById('lb').onclick = function (e) { if (e.target === this) lbClose(); };
  document.getElementById('lb-re').onclick = function () {
    fotoTarget = document.getElementById('lb').getAttribute('data-k');
    lbClose(); document.getElementById('f-one').click();
  };
  document.getElementById('lb-rm').onclick = function () {
    var k = document.getElementById('lb').getAttribute('data-k');
    lbClose();
    fetch(API + '?a=rm&n=' + encodeURIComponent(k), { method:'POST' })
      .then(function(r){ return r.json(); })
      .then(function (j) {
        if (j && j.ok) { delete FOTO[k]; redraw(); toast('Фото удалено'); }
        else toast('Удалить не удалось: ' + esc((j&&j.error)||'нет связи'));
      }).catch(function(e){ toast('Удалить не удалось: ' + esc(String(e))); });
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { lbClose(); mdClose(); } });

  document.querySelectorAll('#tabs .tab').forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll('#tabs .tab').forEach(function(x){ x.classList.remove('on'); });
      document.querySelectorAll('.sec').forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      document.getElementById('s-' + t.getAttribute('data-s')).classList.add('on');
    };
  });

  redraw();
  /* Фото и ручные цены приходят из воркера: страница рисуется сразу,
     а когда список дойдёт — перерисовываем. */
  fotoLoad().then(function () {
    if (Object.keys(FOTO).length || Object.keys(PRICE_MAN).length
        || Object.keys(STOPS).length || Object.keys(WEEKS_MAN).length) redraw();
  });
})();

</script>
