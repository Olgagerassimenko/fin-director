<!doctype html><html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Упаковка · Фуд Завод</title>
<!-- Фуд Завод · © 2026. Все права защищены. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Полный срез по упаковке из iiko: остатки по складам, движение, поставщики -->
<script src="upak_data.js" onerror="window.UPAK=null"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070c17; --card:#0d1526; --line:#1c2740; --line2:#26334d;
  --ink:#eef3fb; --ink2:#c3d0e2; --mut:#7b8ca6; --dim:#546279;
  --red:#f87171; --amb:#fbbf24; --grn:#4ade80; --vio:#22d3ee; --brn:#f59e0b;
}
body{font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(940px 520px at 8% -10%, rgba(245,158,11,.16), transparent 60%),
    radial-gradient(820px 460px at 96% 0%, rgba(34,211,238,.12), transparent 60%),
    radial-gradient(700px 500px at 55% 112%, rgba(56,189,248,.06), transparent 62%),
    var(--bg);
  background-attachment:fixed}

.topbar{display:flex;align-items:center;gap:16px;padding:15px 30px;position:sticky;top:0;z-index:60;
  background:rgba(10,16,29,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  box-shadow:0 10px 30px -24px #000}
.backbtn{display:inline-flex;align-items:center;flex-shrink:0;background:#16203a;color:var(--ink2);
  border:1px solid var(--line2);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:999px;
  text-decoration:none;transition:.18s;white-space:nowrap}
.backbtn:hover{background:var(--vio);color:#05202a;border-color:var(--vio);box-shadow:0 0 18px -4px rgba(34,211,238,.8)}
.topbar h1{font-size:17px;font-weight:900;letter-spacing:-.3px}
.topbar p{font-size:11.5px;color:var(--mut);margin-top:2px}
.live{margin-left:auto;font-size:11.5px;color:#fde68a;background:rgba(245,158,11,.11);
  border:1px solid rgba(245,158,11,.4);border-radius:999px;padding:6px 13px;font-weight:700;white-space:nowrap;
  box-shadow:0 0 20px -7px rgba(245,158,11,.75)}

.section{padding:22px 30px 40px;max-width:1500px;margin:0 auto}
.card{background:linear-gradient(180deg,#111c31,#0e1728);border:1px solid var(--line);border-radius:18px;
  padding:18px 20px;box-shadow:0 18px 40px -28px #000, inset 0 1px 0 rgba(255,255,255,.035)}

/* ── ГЕРОЙ ── */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 28px;margin-bottom:14px;
  border:1px solid var(--line2);
  background:linear-gradient(140deg,rgba(245,158,11,.15),transparent 48%),linear-gradient(180deg,#121c31,#0d1526);
  box-shadow:0 22px 50px -34px #000}
.hero-in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h2{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#fcd34d;margin-bottom:10px}
.hero .big{font-size:50px;font-weight:900;letter-spacing:-1.6px;line-height:1;color:#fcd34d;
  text-shadow:0 0 34px rgba(245,158,11,.5)}
.hero .sub{font-size:14px;color:var(--ink2);line-height:1.65;margin-top:11px;max-width:620px}
.hero .sub b{color:#fff}
.hero-side{display:grid;gap:9px}
.hs{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:11px 14px;
  display:flex;align-items:baseline;gap:10px}
.hs .v{font-size:20px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.hs .l{font-size:11.5px;color:var(--mut);line-height:1.4}

/* ── УПРАВЛЕНИЕ ── */
.ctl{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ctl label{display:block;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px}
.ctl select,.ctl input[type=search],.ctl input[type=number]{background:#0a1222;border:1px solid var(--line2);
  color:var(--ink);border-radius:11px;padding:9px 11px;font-size:12.5px;font-family:inherit;transition:.16s}
.ctl select:focus,.ctl input:focus{outline:none;border-color:var(--vio);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
.ctl input[type=number]{width:78px;text-align:right;font-weight:800}
.ctl input[type=search]{min-width:230px}
.ctl.flt{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ctl .adv{display:none}
.ctl.open .adv{display:block}
.ctl.flt select{max-width:230px}
.fcount{margin-left:auto;padding-bottom:10px;font-size:11.5px;color:var(--mut)}
.fcount b{color:#fcd34d}
.supl{cursor:pointer;border-bottom:1px dashed #3a4a68}
.un{font-size:10px;color:#6b7f9c;font-weight:600}
td.mn{color:#9fb2cc}
thead th br{line-height:1.35}
.supl:hover{color:#c4b5fd;border-bottom-color:#c4b5fd}
td.stc,th.stc{width:54px;min-width:54px;text-align:center}
td.prc{min-width:98px}
td.minq{font-weight:800;color:#93c5fd}
.pin{width:84px}
td.wkc,th.wkc{width:70px;min-width:70px;text-align:center}
.win{width:56px;background:#0a1222;border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:4px 6px;font-size:11.5px;font-family:inherit;text-align:center;font-weight:800}
.stbox{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:4px}
.stbox input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid #3a4a68;
  border-radius:5px;background:#0a1222;cursor:pointer;position:relative;transition:.15s;margin:0}
.stbox input:hover{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.stbox input:checked{background:#ef4444;border-color:#ef4444}
.stbox input:checked:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:900;color:#2a0606}
.stbox input:disabled{opacity:.5;cursor:default}
tr.stopped{opacity:.55}
tr.stopped td.nm{text-decoration:line-through;text-decoration-color:#64748b}
.btn{background:#16233c;border:1px solid var(--line2);color:var(--ink2);border-radius:11px;padding:9px 14px;
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.16s}
.btn:hover{background:#1e2f4d;color:#fff;box-shadow:0 0 18px -5px rgba(34,211,238,.75)}
.btn.pri{background:linear-gradient(135deg,#16a34a,#065f46);border-color:transparent;color:#eafff2;
  box-shadow:0 0 22px -7px rgba(22,163,74,.9)}
.btn.pri:hover{filter:brightness(1.1);color:#fff}
.note{font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:12px}
.note b{color:var(--ink2)}
.more{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.more summary{cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);list-style:none;display:flex;align-items:center;gap:8px;user-select:none;width:fit-content}
.more summary::-webkit-details-marker{display:none}
.more summary:before{content:'▸';color:var(--vio);font-size:10px;transition:.15s}
.more[open] summary:before{transform:rotate(90deg)}
.more summary:hover{color:var(--ink2)}

/* ── КАРТОЧКА ДОЛЖНИКА ── */
.deb{position:relative;border-radius:16px;border:1px solid var(--line);margin-bottom:11px;overflow:hidden;
  background:linear-gradient(180deg,#111c31,#0e1728);box-shadow:0 16px 34px -30px #000}
.deb:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#334155}
.deb.r1:before{background:#ef4444;box-shadow:0 0 20px 2px rgba(239,68,68,.65)}
.deb.r2:before{background:#f59e0b;box-shadow:0 0 18px 2px rgba(245,158,11,.5)}
.deb.r3:before{background:#22c55e}
.deb-h{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr));gap:14px;
  align-items:center;padding:14px 18px 12px}
.deb-nm{font-size:14px;font-weight:800;color:var(--ink);line-height:1.3}
.deb-tag{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800}
.t-red{background:rgba(239,68,68,.15);color:#fca5a5}
.t-amb{background:rgba(245,158,11,.15);color:#fcd34d}
.t-grn{background:rgba(34,197,94,.14);color:#86efac}
.deb-f{text-align:right}
.deb-f .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink)}
.deb-f .v.red{color:#fca5a5;text-shadow:0 0 18px rgba(248,113,113,.5)}
.deb-f .l{font-size:10.5px;color:var(--mut);margin-top:3px}
.deb-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;
  padding:0 18px 15px;align-items:start}
.spark{display:block}
.spark-l{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.spark-l b{color:var(--ink2)}

/* работа с клиентом */
.work{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.work-t{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.work-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.work-g label{display:block;font-size:9.5px;color:var(--dim);font-weight:700;margin-bottom:4px}
.work input,.work select{width:100%;background:#0a1222;border:1px solid var(--line2);color:var(--ink);
  border-radius:9px;padding:7px 9px;font-size:12px;font-family:inherit}
.work input:focus,.work select:focus{outline:none;border-color:var(--vio)}
.work-r{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
.work-s{font-size:11px;color:var(--dim);margin-left:auto}
.work-s.ok{color:#86efac}
.chip{display:inline-block;padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:700}
.c-wait{background:rgba(245,158,11,.14);color:#fcd34d}
.c-bad{background:rgba(239,68,68,.16);color:#fca5a5}
.c-ok{background:rgba(34,197,94,.14);color:#86efac}

.empty{padding:26px;text-align:center;color:var(--mut);font-size:13px}
footer{text-align:center;color:#3d4a60;font-size:12px;line-height:1.7;padding:24px 16px 40px;
  border-top:1px solid var(--line);margin-top:10px}
.fix{position:sticky;bottom:0;z-index:40;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  margin:16px -30px -40px;padding:13px 30px;background:rgba(9,14,26,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line2)}
.fix .v{font-size:18px;font-weight:900;color:#fcd34d;letter-spacing:-.3px}
.fix .n{font-size:12px;color:var(--mut)}
.fix .n b{color:var(--ink)}

@media (max-width:1000px){
  .hero-in{grid-template-columns:1fr}.hero .big{font-size:38px}
  .deb-h{grid-template-columns:1fr 1fr;gap:10px}
  .deb-b{grid-template-columns:1fr}
  .section{padding:16px 12px 34px}.topbar{padding:12px 14px}
  .fix{margin:14px -12px -34px;padding:11px 14px;gap:10px}
}

/* ── направление «упаковка»: рабочий стол закупщика ─────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;margin:14px 0}
.kpi{background:linear-gradient(180deg,#111c31,#0e1728);border:1px solid var(--line);border-radius:15px;
  padding:13px 15px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#334155)}
.kpi .l{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.kpi .v{font-size:23px;font-weight:900;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.5}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 0}
.tab{background:#101a2f;border:1px solid var(--line2);color:var(--ink2);border-radius:11px;padding:9px 15px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.tab:hover{background:#1a2842;color:#fff}
.tab.on{background:linear-gradient(135deg,#f59e0b,#b45309);border-color:transparent;color:#1a1204;
  box-shadow:0 0 22px -8px rgba(245,158,11,.9)}
.tab b{margin-left:6px;opacity:.75}
.sec{display:none}.sec.on{display:block}

.tw{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:760px}
thead th{position:sticky;top:0;z-index:5;background:#0e1830;color:var(--ink2);font-size:10.5px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:10px 11px;text-align:right;
  border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
thead th:first-child{text-align:left}
thead th.on{color:#fcd34d}
tbody td{padding:9px 11px;text-align:right;border-bottom:1px solid rgba(28,39,64,.7);
  font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td:first-child{text-align:left;white-space:normal;min-width:220px}
tbody tr:hover{background:rgba(245,158,11,.05)}
tbody tr.hot{background:rgba(239,68,68,.07)}
tfoot td{padding:9px 11px;text-align:right;font-weight:800;background:#0d1526;border-top:1px solid var(--line2)}
tfoot td:first-child{text-align:left}
.st{display:inline-block;padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:800;white-space:nowrap}
.s-def{background:rgba(239,68,68,.17);color:#fca5a5}
.s-soon{background:rgba(245,158,11,.16);color:#fcd34d}
.s-ok{background:rgba(34,197,94,.13);color:#86efac}
.s-non{background:rgba(148,163,184,.12);color:#94a3b8}
.s-dead{background:rgba(124,58,237,.15);color:#c4b5fd}
.s-low{background:rgba(96,165,250,.16);color:#93c5fd}
.s-stop{background:rgba(148,163,184,.14);color:#cbd5e1;text-decoration:line-through}
.sub2{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.zero{color:#3d4a60}

/* заявка поставщику */
.ord{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;
  background:linear-gradient(180deg,#111c31,#0e1728);position:relative}
.ord:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#f59e0b}
.ord.debt:before{background:#ef4444}
.ord-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px 11px}
.ord-n{font-size:15px;font-weight:800}
.ord-m{font-size:11.5px;color:var(--mut);margin-top:3px}
.ord-m b{color:#fca5a5}
.ord-s{margin-left:auto;text-align:right}
.ord-s .v{font-size:20px;font-weight:900;color:#fcd34d;font-variant-numeric:tabular-nums}
.ord-s .l{font-size:10.5px;color:var(--mut)}
.ord-b{padding:0 18px 15px}
.ord table{min-width:600px}
.mini{background:#16233c;border:1px solid var(--line2);color:var(--ink2);border-radius:9px;padding:6px 11px;
  font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.mini:hover{background:#1e2f4d;color:#fff;border-color:var(--vio)}

/* матрица складов */
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-top:12px}
.mx table{min-width:900px;font-size:12px}
.mx th.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:205px;text-align:left;
  padding:9px 6px;font-size:10px;font-weight:700;letter-spacing:.02em;cursor:default;
  white-space:nowrap;color:#c3d0e2}
.mx td.c{text-align:center;font-variant-numeric:tabular-nums}
.mx td.has{background:rgba(34,197,94,.09);color:#bbf7d0;font-weight:700}
.mx td.no{color:#2b3purple}
.mx td.no{color:#334155}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* фото позиции */
/* Колонка фото стоит первой, а общее правило «первая ячейка — текстовая»
   растягивало её до 220 px и сдвигало название вправо. Перебиваем адресно. */
tbody td.ph{width:64px;min-width:64px;text-align:center;white-space:nowrap;padding:7px 6px}
thead th.ph{width:64px;min-width:64px;text-align:center}
tbody td.nm{text-align:left;white-space:normal;min-width:240px}
thead th.nm{text-align:left}
#s-buy table{min-width:880px;font-size:13px}
/* Колонок немного, а ширина таблицы — вся карточка: браузер растягивал
   числовые столбцы, и между «расходом» и «неснижаемым» зияла дыра.
   Числам даём ширину по содержимому, остаток ширины забирает название. */
#s-rep th, #s-rep td, #s-buy th, #s-buy td{width:1%}
#s-rep th.nm, #s-rep td.nm, #s-buy th.nm, #s-buy td.nm{width:auto}
#s-rep table{min-width:980px;font-size:12px}
#s-rep tbody td{padding:7px 7px}
#s-rep tbody td.nm{min-width:180px}
#s-rep thead th{padding:8px 7px;font-size:10px}
#s-rep tbody td.ph,#s-rep thead th.ph{width:54px;min-width:54px}
#s-rep .ph-b{width:44px;height:44px}
#s-buy tbody td{padding:10px 12px}
#s-buy .q{font-size:15px;font-weight:900;color:#fcd34d}
#s-buy .mny{font-weight:800;color:#eef3fa}
#s-buy .dd{font-weight:800}
#s-buy .dd.red{color:#fca5a5}
.ph-b{width:52px;height:52px;border-radius:9px;border:1px solid var(--line2);background:#0d1626;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
  font-size:9.5px;color:#55688a;font-weight:700;line-height:1.2;padding:2px;transition:.15s}
.ph-b:hover{border-color:var(--vio);color:#c4b5fd}
.ph-b img{width:100%;height:100%;object-fit:cover;display:block}
.ph-b.busy{opacity:.45}
.lb{display:none;position:fixed;inset:0;z-index:90;background:rgba(5,9,18,.88);
  align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb-in{max-width:min(620px,94vw);text-align:center}
.lb-in img{max-width:100%;max-height:68vh;border-radius:14px;border:1px solid var(--line2);display:block;margin:0 auto}
.lb-n{font-size:13px;font-weight:700;color:#e8eef6;margin:12px 0 10px}
.lb-b{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.md-in{width:min(900px,96vw);max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#121d33,#0d1626);border:1px solid var(--line2);
  border-left:4px solid #ef4444;border-radius:18px;overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
.md-h{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;padding:18px 22px 14px;
  border-bottom:1px solid var(--line)}
.md-t{font-size:17px;font-weight:800;color:#fff}
.md-s{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.55;max-width:560px}
.md-sum{margin-left:auto;font-size:26px;font-weight:900;color:#fcd34d;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.md-b{overflow:auto;padding:4px 22px 6px}
.md-b table{min-width:560px}
.md-f{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:14px 22px 18px;
  border-top:1px solid var(--line)}
.md-chk{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);
  cursor:pointer;margin-right:auto}
.md-chk input{width:15px;height:15px;accent-color:#f59e0b;cursor:pointer}
.urgbtn{border-color:rgba(239,68,68,.5);color:#fca5a5}
.urgbtn:hover{background:#2a1520;color:#fff;box-shadow:0 0 18px -5px rgba(239,68,68,.8)}
.rep-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}

<!-- Подпись страницы добавляет nav.js — своего подвала здесь быть не должно,
     иначе внизу две одинаковые строки (так было до 05.10.2026). -->

<script>

(function () {
  'use strict';
  var D = window.UPAK || null;
  if (!D || !D.items || !D.items.length) {
    document.getElementById('up').style.display = 'none';
    document.getElementById('p-nodata').style.display = ''; return;
  }
  var MON = D.months || [], TH = D.through || '';
  var STORES = (D.stores || []).filter(function(s){ return !/^[0-9a-f]{8}-[0-9a-f]{4}/i.test(String(s||'')); });

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function f0(x){ if(x==null||!isFinite(x)) return '—';
    return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
  function f1(x){ return (x==null||!isFinite(x)) ? '—'
    : (Math.abs(x)>=100 ? f0(x) : x.toFixed(1).replace('.',',')); }
  function fm(x){ var a=Math.abs(x);
    if(a>=1e6) return (x/1e6).toFixed(1).replace('.',',')+' млн';
    if(a>=1e3) return Math.round(x/1e3)+' тыс';
    return f0(x); }
  function plw(n,a,b,c){ var m=n%100; if(m>=11&&m<=14) return c; m=n%10;
    return m===1?a:(m>=2&&m<=4)?b:c; }
  function dmy(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s||'') ? s.split('-').reverse().join('.') : (s||'—'); }
  function mmy(s){ return /^\d{4}-\d{2}$/.test(s||'') ? s.slice(5) + '.' + s.slice(2,4) : (s||''); }
  /* момент, на который сняты остатки: с 05.10.2026 сборщик пишет его со
     временем, старые файлы отдают только дату */
  var SAT = D.stockAt || dmy(TH);

  /* ── ПАРАМЕТРЫ ЗАКАЗА ────────────────────────────────────────────
     Срок поставки решает всё: пока едет упаковка, производство не ждёт.
     Позиции, которые делают под заказ, едут дольше — их поставщики
     отмечены отдельно, отметка держится в браузере закупщика. */
  var LONG_KEY = 'upak_long_v2';
  var LONG = {};
  try { LONG = JSON.parse(localStorage.getItem(LONG_KEY) || 'null') || null; } catch(e){ LONG = null; }
  if (!LONG) LONG = { 'Color express ТОО':1, 'Компания В ТОО':1, 'Казтехнолоджи Пак ТОО':1 };
  function saveLong(){ try{ localStorage.setItem(LONG_KEY, JSON.stringify(LONG)); }catch(e){} }

  var P = { lead:7, long:10, safe:5, weeks:4, thr:10, over:12, test:false };
  function covDays(){ return P.weeks * 7; }
  /* Срок запаса можно задать по каждой позиции отдельно: соуснице хватит
     четырёх недель, а то, что возят раз в квартал, держат дольше. */
  function weeksOf(it){ return WEEKS_MAN[it.key] || P.weeks; }

  /* последние три полных месяца: по ним считаем дневной расход */
  var LAST3 = MON.slice(-4, -1);
  if (LAST3.length < 3) LAST3 = MON.slice(-3);

  /* «Склад ТЕСТ» — служебный. Его остатки и движения в расчёт заказа не идут:
     05.10.2026 он давал минусовые остатки и портил дневной расход. */
  var TEST_RE = /склад\s*тест/i;
  /* Иногда iiko отдаёт склад, которого нет в справочнике, и вместо названия
     в данные попадает его идентификатор вида cd19b5ea-1b32-… Такие остатки
     (обычно копейки) из расчёта и из таблиц убираем всегда. */
  var GUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}/i;
  function skipStore(s){
    s = String(s || '');
    if (GUID_RE.test(s)) return true;
    return !P.test && TEST_RE.test(s);
  }

  /* Фото и ручные цены лежат в воркере (/api/upak), ключ — нормализованное
     название позиции, поэтому они переживают пересборку данных. */
  var FOTO = {}, PRICE_MAN = {}, STOPS = {}, WEEKS_MAN = {};
  function nkey(s){
    return String(s==null?'':s).toLowerCase().replace(/^у\s*\*\s*/,'')
      .replace(/ё/g,'е').replace(/[^0-9a-zа-я]+/g,' ').trim().replace(/\s+/g,' ');
  }

  var IT = D.items.map(function (r) {
    var stRaw = 0, stSum = 0, st = {};
    Object.keys(r.st || {}).forEach(function (s) {
      if (skipStore(s)) return;
      st[s] = r.st[s]; stRaw += r.st[s][0]; stSum += r.st[s][1];
    });
    /* Расход — прямой: сколько ушло со склада, а не разница остатков.
       Но только по настоящим операциям: перемещение между складами — это
       не потребление, а переезд, и до 05.10.2026 оно удваивало расход.
       Если сборщик отдал движение без перемещений (поле mc) — считаем по
       нему; разрез по складам остаётся по всем типам, там это верно. */
    var mc = r.mc || null;
    var out3 = 0, in3 = 0, outAll = 0, lastMove = '', curMv = 0, m3 = [0, 0, 0];
    var byStore = {};
    MON.forEach(function (k) {
      var m = (r.mv || {})[k]; if (!m) return;
      Object.keys(m).forEach(function (s) {
        if (skipStore(s)) return;
        var v = m[s];
        if (v[0] || v[1]) lastMove = k;
        var b = byStore[s] || (byStore[s] = [0, 0]);
        b[0] += v[0]; b[1] += v[1];
        if (!mc) {
          outAll += v[1];
          var ix0 = LAST3.indexOf(k);
          if (ix0 >= 0) { in3 += v[0]; out3 += v[1]; m3[ix0] += v[1]; }
          /* Текущий месяц неполный и в базу расхода не входит — но если позиция
             в нём двигалась, называть её «не используется» неправильно. */
          if (k === MON[MON.length - 1]) curMv += v[0] + v[1];
        }
      });
      if (mc && mc[k]) {
        var c = mc[k];
        outAll += c[1];
        var ix = LAST3.indexOf(k);
        if (ix >= 0) { in3 += c[0]; out3 += c[1]; m3[ix] += c[1]; }
        if (k === MON[MON.length - 1]) curMv += c[0] + c[1];
      }
    });
    var sup = Object.keys(r.sup || {});
    sup.sort(function (a, b) { return (r.sup[b][0] || 0) - (r.sup[a][0] || 0); });
    var main = sup[0] || '';
    var qty = sup.reduce(function (s2, k) { return s2 + (r.sup[k][1] || 0); }, 0);
    var sum = sup.reduce(function (s2, k) { return s2 + (r.sup[k][0] || 0); }, 0);
    /* iiko отдаёт единицу измерения не названием, а идентификатором вида
       cd19b5ea-1b32-… Такую «единицу» не показываем вовсе. */
    var uu = String(r.u || '');
    if (GUID_RE.test(uu)) uu = '';
    return { n:r.n, key:nkey(r.n), u:uu, st:st,
             /* В формулу заказа идёт только неотрицательный остаток: минус —
                это ошибка учёта, а не «надо докупить ещё и на минус». */
             stRaw:stRaw, stock:Math.max(0, stRaw), neg:stRaw < 0,
             stSum:stSum, sup:r.sup||{}, sups:sup, main:main,
             priceBuy: qty ? sum/qty : 0, buySum:sum, buyQty:qty,
             /* цена последнего закупа: [цена, месяц, поставщик, кол-во] */
             priceLast: (r.last && r.last[0]) || 0, lastMon: (r.last && r.last[1]) || '',
             lastSup: (r.last && r.last[2]) || '', lastQty: (r.last && r.last[3]) || 0,
             m3:m3, out3:out3, in3:in3, outAll:outAll, last:lastMove, curMv:curMv, byStore:byStore,
             stores:Object.keys(st) };
  });

  function leadOf(it){ var l=P.lead; it.sups.forEach(function(s){ if(LONG[s]) l=Math.max(l,P.long); }); return l; }

  /* ── СКОЛЬКО УХОДИТ В ДЕНЬ ───────────────────────────────────────
     Плоское среднее за три месяца врёт там, где дороже всего. Позицию
     выводят из оборота (268 773 → 87 766 → 10 424 шт), а среднее всё ещё
     велит заказать годовой запас: 05.10.2026 так в заявку попали 149 131
     этикетка на 1,2 млн ₸. Поэтому последний месяц весит втрое, а при явном
     спаде расход сверху ограничен полутора месяцами последнего факта.
     Два последних месяца без расхода — позиция не заказывается вовсе.      */
  function rateOf(it) {
    var a = it.m3[0] || 0, b = it.m3[1] || 0, c = it.m3[2] || 0;
    if (!a && !b && !c) return { m:0, why:'' };
    if (!b && !c) return { m:0, why:'два месяца без расхода' };
    var w = (a + 2 * b + 3 * c) / 6;
    if (c > 0 && c < b) {
      var cap = c * 1.5;
      if (cap < w) return { m:cap, why:'расход падает — считаем по последнему месяцу' };
    }
    return { m:w, why:'' };
  }

  function calc() {
    IT.forEach(function (it) {
      it.lead = leadOf(it);
      var rt = rateOf(it);
      it.perM = rt.m; it.why = rt.why;
      it.perD = rt.m / 30.4;
      /* Цена за единицу: сначала вписанная руками, потом цена последнего
         закупа (она и есть «сколько стоит одна сейчас»), и только если
         закупа не было ни разу — средняя за год. */
      it.price = PRICE_MAN[it.key] || it.priceLast || it.priceBuy || 0;
      it.priceSrc = PRICE_MAN[it.key] ? 'вписана вручную'
                  : it.priceLast ? 'закуп ' + mmy(it.lastMon)
                  : it.priceBuy ? 'средняя за год' : '';
      it.manual = !!PRICE_MAN[it.key];
      it.noPrice = !it.price;
      it.days = it.perD > 0 ? it.stock / it.perD : null;
      it.weeks = weeksOf(it);                       /* срок запаса по этой позиции */
      it.ownWeeks = !!WEEKS_MAN[it.key];
      /* Неснижаемый остаток = запас на заданное число недель. По умолчанию
         общие 4 недели, по позиции можно поставить свои. До него и
         дозаказываем — это одно и то же число, двух разных «минимумов»
         на странице быть не должно. */
      it.min = it.perD * it.weeks * 7;
      /* Отдельный порог срочности: кончится раньше, чем придёт поставка. */
      it.pt = it.perD * (it.lead + P.safe);
      it.over = it.perD * P.over * 7;               /* выше этого — избыток */
      var need = (it.perD > 0 && it.stock < it.min) ? it.min - it.stock : 0;
      /* мелкую недостачу в заявку не тащим — иначе список не прочитать */
      if (need > 0 && it.min > 0 && need < it.min * (P.thr / 100)) need = 0;
      /* Стоп-лист: позицию решили не заказывать. Количество считаем
         по-прежнему (видно, от чего отказались), но в заявку и в сумму
         она не идёт. Отметка общая — лежит в воркере. */
      it.stop = !!STOPS[it.key];
      it.orderWanted = Math.round(need);
      it.order = it.stop ? 0 : it.orderWanted;
      it.orderSum = it.order * it.price;
      /* Срочность: кончится раньше, чем придёт поставка — «срочно». */
      it.minMoney = it.min * it.price;
      it.stockMoney = it.stock * it.price;
      /* Зона запаса нужна не только в отчёте: по ней фильтруют на любой
         вкладке, поэтому считаем её здесь, вместе со всем остальным. */
      it.devQty = it.stock - it.min;
      it.devSum = it.devQty * it.price;
      it.zone = it.perD <= 0 ? '' : it.stock < it.min ? 'ниже неснижаемого'
              : (P.over && it.stock > it.over) ? 'избыток' : 'норма';
      it.urg = (it.stop || it.perD <= 0) ? ''
             : it.days < it.lead ? 'срочно'
             : it.days < it.lead + P.safe ? 'скоро'
             : it.order ? 'ниже минимума' : '';
      /* Позиция без единого движения за три месяца — это не дефицит,
         а вещь, которой сейчас не пользуются. Заказывать её незачем,
         но если на складе лежит остаток, это замороженные деньги. */
      it.dead = it.out3 <= 0 && it.in3 <= 0 && !it.curMv;
      it.st_ = it.stop ? 'в стопе'
             : it.dead ? (it.stock > 0 ? 'лежит без движения' : 'не используется')
             : it.perD <= 0 ? 'только приход'
             : it.days < it.lead ? 'дефицит'
             : it.days < it.lead + P.safe ? 'пора заказывать'
             : it.order ? 'ниже минимума' : 'норма';
    });
  }
  /* ── СОРТИРОВКА ТАБЛИЦ ─────────────────────────────────────────────
     Заголовки кликаются: первый клик — по убыванию (для текста по
     алфавиту), повторный разворачивает. Пустой ключ — порядок по
     умолчанию, тот, что задуман для этой таблицы. */
  function thSort(SORT, cols) {
    return cols.map(function (c) {
      if (!c[0]) return '<th' + (c[2] ? ' class="' + c[2] + '"' : '') + '>' + c[1] + '</th>';
      var on = SORT.k === c[0];
      return '<th data-sk="' + c[0] + '" class="' + (c[2] ? c[2] + ' ' : '') + (on ? 'on' : '') + '"'
        + (c[3] ? ' title="' + c[3] + '"' : '') + '>' + c[1]
        + (on ? (SORT.dir > 0 ? ' ↑' : ' ↓') : '') + '</th>';
    }).join('');
  }
  function bindSort(el, SORT, again) {
    el.querySelectorAll('th[data-sk]').forEach(function (th) {
      th.onclick = function () {
        var k = th.getAttribute('data-sk');
        var txt = (k === 'n' || k === 'zone' || k === 'urg' || k === 'main' || k === 'st_');
        if (SORT.k === k) { if (SORT.dir === (txt ? -1 : 1)) SORT.k = ''; else SORT.dir = -SORT.dir; }
        else { SORT.k = k; SORT.dir = txt ? 1 : -1; }
        again();
      };
    });
  }
  function cmpBy(SORT) {
    return function (x, y) {
      var k = SORT.k, vx = x[k], vy = y[k];
      if (typeof vx === 'string' || typeof vy === 'string')
        return SORT.dir * String(vx == null ? '' : vx).localeCompare(String(vy == null ? '' : vy), 'ru');
      if (vx == null) vx = -Infinity; if (vy == null) vy = -Infinity;
      return SORT.dir * (vx - vy);
    };
  }

  /* Имя поставщика под позицией — ссылка: клик ставит фильтр по нему.
     Так отбор по поставщику доступен из любой таблицы, а не только
     из выпадающего списка наверху. */
  function supLink(name){
    return '<span class="supl" data-sup="' + esc(name || '—') + '" title="показать только этого поставщика">'
      + esc(name || 'поставщик не указан') + '</span>';
  }
  function bindSup(el){
    el.querySelectorAll('[data-sup]').forEach(function (a2) {
      a2.onclick = function (e) {
        e.stopPropagation();
        var v = a2.getAttribute('data-sup');
        F.sup = (F.sup === v) ? '' : v;
        var sel = document.getElementById('f-sup');
        if (sel) sel.value = F.sup;
        redrawSecs();
        toast(F.sup ? 'Фильтр: ' + esc(F.sup === '—' ? 'без поставщика' : F.sup) : 'Фильтр по поставщику снят');
      };
    });
  }

  /* Везде, где число — это количество, рядом стоит единица, а под ним
     те же штуки в деньгах. Иначе непонятно, 98 447 — это штуки или тенге. */
  /* Количество и деньги — разными столбцами: так их видно рядом и можно
     отсортировать и по штукам, и по сумме. */
  /* Единица измерения стоит в шапке столбца и в подписи под названием
     позиции — в каждой ячейке её дублировать не нужно, цифры из-за этого
     не читаются. */
  function qtyCell(qty, price, unit, cls){
    var money = (price && isFinite(qty)) ? qty * price : null;
    return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + f1(qty) + '</td>'
      + '<td class="mn">' + (money == null ? '<span class="zero">—</span>' : f0(money)) + '</td>';
  }

  function stCls(s){ return s==='в стопе'?'s-stop':s==='дефицит'?'s-def':s==='пора заказывать'?'s-soon'
    :s==='ниже минимума'?'s-low':s==='норма'?'s-ok':s==='лежит без движения'?'s-dead':'s-non'; }
  function hot(){ return IT.filter(function(i){ return i.order>0; }); }

  /* ── ШАПКА ─────────────────────────────────────────────────────── */
  function head() {
    var h = hot();
    var need = h.reduce(function(s,i){ return s+i.orderSum; },0);
    var stockSum = IT.reduce(function(s,i){ return s+i.stSum; },0);
    var dead = IT.filter(function(i){ return i.dead && i.stock>0; });
    var deadSum = dead.reduce(function(s,i){ return s+i.stSum; },0);
    var sups = {}; h.forEach(function(i){ if(i.main) sups[i.main]=1; });
    var nsup = Object.keys(sups).length;

    var noP = h.filter(function(i){ return i.noPrice; });

    document.getElementById('h-sum').textContent = f0(need) + ' ₸';
    document.getElementById('h-txt').innerHTML =
      '<b>' + h.length + '</b> ' + plw(h.length,'позиция','позиции','позиций') + ' у <b>' + nsup + '</b> ' +
      plw(nsup,'поставщика','поставщиков','поставщиков') + '. Доводим запас до <b>' + P.weeks + '</b> ' +
      plw(P.weeks,'недели','недель','недель') + ' работы (' + covDays() + ' дней). Считаем от расхода за ' +
      (LAST3.length? LAST3[0].slice(5)+'.'+LAST3[0].slice(2,4)+'–'+LAST3[LAST3.length-1].slice(5)+'.'+LAST3[LAST3.length-1].slice(2,4) : 'три месяца') +
      ' и остатка на ' + SAT + '.' +
      (noP.length ? ' <b style="color:#fca5a5">' + noP.length + ' ' + plw(noP.length,'позиция','позиции','позиций')
        + ' без цены</b> — количество посчитано, в сумму не вошло.' : '');
    document.getElementById('h-side').innerHTML =
      hs(f0(stockSum)+' ₸', 'лежит на складах в упаковке') +
      hs(f0(deadSum)+' ₸', dead.length + ' ' + plw(dead.length,'позиция','позиции','позиций') + ' лежит без движения') +
      hs(IT.length, 'позиций упаковки всего');

    var def = IT.filter(function(i){ return i.st_==='дефицит'; }).length;
    var kp = [
      ['#f87171','В дефиците', def, 'запаса меньше, чем срок поставки'],
      ['#fbbf24','Пора заказывать', IT.filter(function(i){return i.st_==='пора заказывать';}).length,
       'подходят к точке заказа'],
      ['#93c5fd','Ниже минимума', IT.filter(function(i){return i.st_==='ниже минимума';}).length,
       'запаса меньше ' + P.weeks + ' ' + plw(P.weeks,'недели','недель','недель')],
      ['#4ade80','В норме', IT.filter(function(i){return i.st_==='норма';}).length, 'запаса хватает'],
      ['#c4b5fd','Без движения', IT.filter(function(i){return i.dead;}).length,
       'ни прихода, ни расхода за три месяца']
    ];
    document.getElementById('kpis').innerHTML = kp.map(function(k){
      return '<div class="kpi" style="--c:'+k[0]+'"><div class="l">'+k[1]+'</div>'+
        '<div class="v" style="color:'+k[0]+'">'+k[2]+'</div><div class="s">'+k[3]+'</div></div>';
    }).join('');
    document.getElementById('live').textContent = 'остатки на ' + SAT;
    document.getElementById('sub').textContent =
      IT.length + ' позиций · ' + STORES.length + ' складов · обновлено ' + (D.updated||'');
    fcount();
    document.getElementById('t-buy').textContent = h.length ? '· ' + h.length : '';
    var _urg = h.filter(function(i){ return i.urg==='срочно'; }).length;
    /* На вкладке показываем то, о чём она: сколько позиций ниже
       неснижаемого остатка, а не сколько срочных. */
    var _below = IT.filter(function(i){
      return i.perD > 0 && !i.stop && i.stock < i.min; }).length;
    document.getElementById('t-rep').textContent = _below ? '· ' + _below : '';
    var _ub = document.getElementById('urgbtn');
    if (_ub) _ub.textContent = _urg ? '🔴 Срочное · ' + _urg : '🔴 Срочное';
    document.getElementById('t-ord').textContent = h.length ? '· ' + h.length : '';
    document.getElementById('t-all').textContent = '· ' + IT.length;
    document.getElementById('t-dead').textContent = IT.filter(function(i){return i.dead;}).length
      ? '· ' + IT.filter(function(i){return i.dead;}).length : '';
    document.getElementById('t-mx').textContent = '· ' + STORES.length;
    document.getElementById('how').innerHTML =
      'Расход берётся прямой — сколько упаковки ушло со склада, а не разница остатков. ' +
      'Дневной расход считаем по трём последним полным месяцам, но <b>последний месяц весит втрое</b>, ' +
      'а если расход падает — берём полтора последних месяца, чтобы выводимая из оборота позиция ' +
      'не попала в заявку годовым запасом. ' +
      '<b>Минимальный остаток</b> = дневной расход × ' + covDays() + ' дней, ' +
      '<b>заказать</b> = минимум минус остаток. ' +
      'Перемещения между складами в расход не идут — это переезд, а не потребление. ' +
      (D.typeSplit === false ? '<b style="color:#fca5a5">Внимание: iiko не отдал тип операции, ' +
        'расход посчитан вместе с перемещениями и может быть завышен.</b> ' : '') +
      'Отрицательные остатки в расчёт не берём (это ошибки учёта), служебный «Склад ТЕСТ» исключён. ' +
      'Галочка <b>«Стоп»</b> в строке убирает позицию из заявки и из суммы — отметка сохраняется на сайте '+
      'и видна всем. ' +
      '<b>Дефицит</b> — запаса меньше срока поставки: заказ уже не успеет. ' +
      '<b>Пора заказывать</b> — меньше срока поставки плюс страховой. ' +
      '<b>Без движения</b> — за три месяца ни прихода, ни расхода: такой позицией сейчас не пользуются, ' +
      'и заказывать её не нужно, даже если остаток нулевой.' +
      (D.demo ? ' <b style="color:#fca5a5">Показан пробный срез: настоящие данные придут с ночным прогоном.</b>' : '');
  }
  function hs(v,l){ return '<div class="hs"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }

  /* ── ФИЛЬТРЫ ───────────────────────────────────────────────────────
     Поиск оставляем как был, сверху — срочность, поставщик, склад и
     наличие цены. Поставщик и склад действуют на всех вкладках, срочность
     и цена — только там, где они осмысленны (не на «не используется»). */
  var F = { urg:'', sup:'', store:'', price:'', stop:'', zone:'' };
  function qmatch(it, light) {
    var q = (document.getElementById('q').value||'').toLowerCase().trim();
    if (q && (it.n + ' ' + it.sups.join(' ') + ' ' + it.stores.join(' ')).toLowerCase().indexOf(q) < 0) return false;
    if (F.sup) {
      if (F.sup === '—') { if (it.sups.length) return false; }
      else if (it.sups.indexOf(F.sup) < 0) return false;
    }
    /* По складу отбираем не только по остатку: позиция может лежать на
       одном складе, а расходоваться на другом — её тоже надо показать. */
    if (F.store && !it.st[F.store] && !(it.byStore && it.byStore[F.store])) return false;
    if (F.stop === 'yes' && !it.stop) return false;
    if (F.stop === 'no' && it.stop) return false;
    if (!light) {
      if (F.urg && it.urg !== F.urg) return false;
      if (F.price === 'no' && !it.noPrice) return false;
      if (F.price === 'yes' && it.noPrice) return false;
      if (F.zone && it.zone !== F.zone) return false;
    }
    return true;
  }
  function fillFilters() {
    var sups = {}, sts = {};
    IT.forEach(function (i) {
      i.sups.forEach(function (s) { sups[s] = 1; });
      Object.keys(i.st).forEach(function (s) { sts[s] = 1; });
    });
    function fill(id, list, extra) {
      var el = document.getElementById(id);
      list.sort(function (a, b) { return a.localeCompare(b, 'ru'); }).forEach(function (s) {
        var o = document.createElement('option'); o.value = s; o.textContent = s; el.appendChild(o);
      });
      if (extra) { var o2 = document.createElement('option'); o2.value = extra[0]; o2.textContent = extra[1]; el.appendChild(o2); }
    }
    fill('f-sup', Object.keys(sups), ['—', 'без поставщика']);
    fill('f-store', Object.keys(sts));
  }
  function filtersOn(){ return !!(F.urg || F.sup || F.store || F.price || F.stop || F.zone
    || (document.getElementById('q').value||'').trim()); }
  function fcount() {
    var el = document.getElementById('f-count');
    if (!filtersOn()) { el.innerHTML = ''; return; }
    var shown = IT.filter(function(i){ return qmatch(i); }).length;
    var ord   = hot().filter(function(i){ return qmatch(i); }).length;
    el.innerHTML = 'Фильтр: <b>' + shown + '</b> из ' + IT.length + ' '
      + plw(IT.length,'позиции','позиций','позиций')
      + (ord ? ', к заказу <b>' + ord + '</b>' : ', к заказу нет');
  }

  /* ── ФОТО ПОЗИЦИЙ ──────────────────────────────────────────────────
     По названию «У* Лоток 187*137*45 ФС 504 шт/кор» на складе ничего не
     узнать, поэтому к каждой позиции можно приложить фото. Хранится оно
     в воркере (KV), ключ — нормализованное название, значит фото видят все
     и оно не теряется при пересборке данных. Загрузить можно по одной
     (клик по рамке) или пачкой — тогда файлы раскладываются по позициям
     по имени файла.                                                      */
  var API = '/api/upak';
  var fotoTarget = null;

  function fotoUrl(k){
    var m = FOTO[k];
    return API + '?a=foto&n=' + encodeURIComponent(k) + (m && m.d ? '&v=' + encodeURIComponent(m.d) : '');
  }
  function phCell(i){
    return '<td class="ph"><div class="ph-b" data-ph="' + esc(i.key) + '" title="'
      + (FOTO[i.key] ? 'фото позиции — нажмите, чтобы открыть' : 'добавить фото позиции') + '">'
      + (FOTO[i.key] ? '<img loading="lazy" src="' + esc(fotoUrl(i.key)) + '" alt="">' : '+ фото')
      + '</div></td>';
  }
  function bindPh(el){
    el.querySelectorAll('[data-ph]').forEach(function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-ph');
        if (FOTO[k]) lbOpen(k); else { fotoTarget = k; document.getElementById('f-one').click(); }
      };
    });
  }
  /* Сжимаем в браузере: со телефона прилетает 4–6 МБ, а для опознания
     позиции хватает 640 px по длинной стороне. */
  function shrink(file, cb){
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, 640 / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * s)), hh = Math.max(1, Math.round(img.height * s));
        var c = document.createElement('canvas'); c.width = w; c.height = hh;
        c.getContext('2d').drawImage(img, 0, 0, w, hh);
        if (c.toBlob) c.toBlob(function (b) { cb(b || file); }, 'image/jpeg', 0.72);
        else cb(file);
      };
      img.onerror = function () { cb(file); };
      img.src = fr.result;
    };
    fr.onerror = function () { cb(file); };
    fr.readAsDataURL(file);
  }
  function fotoPut(k, file, done){
    shrink(file, function (blob) {
      fetch(API + '?a=up&n=' + encodeURIComponent(k) + '&ct=' + encodeURIComponent(blob.type || 'image/jpeg'),
            { method:'POST', body: blob })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) FOTO[k] = { ct: blob.type || 'image/jpeg', s: j.s, d: String(Date.now()) };
          done(j && j.ok ? null : (j && j.error) || 'не удалось сохранить');
        })
        .catch(function (e) { done(String(e)); });
    });
  }
  function lbOpen(k){
    var it = IT.filter(function(i){ return i.key===k; })[0];
    document.getElementById('lb-img').src = fotoUrl(k);
    document.getElementById('lb-n').textContent = it ? it.n : k;
    document.getElementById('lb').classList.add('on');
    document.getElementById('lb').setAttribute('data-k', k);
  }
  function lbClose(){ document.getElementById('lb').classList.remove('on'); }

  /* Цена всегда в поле ввода: раньше вписать её можно было только в
     таблице «цена неизвестна», и после сохранения строка уезжала в основную
     таблицу — поле буквально пропадало из-под курсора, а ошибочную цену
     (кто-то вписал 0,01) исправить было уже негде. Теперь поле стоит в
     каждой строке: пусто — берём цену из iiko, вписано — ваша. */
  function priceCell(i){
    return '<td class="prc"><input class="pin" type="number" min="0" step="0.01" placeholder="цена"'
      + (i.price ? ' value="' + (Math.round(i.price * 100) / 100) + '"' : '')
      + ' data-pr="' + esc(i.key) + '">'
      + '<div class="sub2">' + esc(i.priceSrc || 'цены нет') + '</div></td>';
  }
  function bindPrice(el){
    el.querySelectorAll('[data-pr]').forEach(function (inp) {
      inp.onchange = function () {
        var k = inp.getAttribute('data-pr');
        var raw = String(inp.value || '').trim();
        var v = raw === '' ? 0 : (+raw || 0);
        /* Вписали ровно ту же цену, что уже пришла из iiko, — не держим
           это как «ручную», пусть обновляется вместе с накладными. */
        var it = IT.filter(function(x){ return x.key === k; })[0];
        if (it && !PRICE_MAN[k] && v && Math.abs(v - it.price) < 0.005) return;
        inp.disabled = true;
        fetch(API + '?a=price', { method:'POST', headers:{'content-type':'application/json'},
                                  body: JSON.stringify({ n:k, v:v }) })
          .then(function(r){ return r.json(); })
          .then(function (j) {
            if (j && j.ok) {
              if (v > 0) PRICE_MAN[k] = v; else delete PRICE_MAN[k];
              redraw();
              var again = document.querySelector('[data-pr="' + k.replace(/"/g,'\\"') + '"]');
              if (again) { again.focus(); again.style.borderColor = '#16a34a';
                setTimeout(function(){ again.style.borderColor = ''; }, 1200); }
              toast(v > 0 ? 'Цена сохранена' : 'Вернули цену из iiko');
            } else { inp.disabled = false; toast('Цену сохранить не удалось: ' + esc((j&&j.error)||'нет связи')); }
          })
          .catch(function(e){ inp.disabled = false; toast('Цену сохранить не удалось: ' + esc(String(e))); });
      };
    });
  }

  /* Срок запаса по позиции. Общее поле наверху — умолчание для всех,
     здесь его можно переопределить для конкретной SKU: пустое поле
     возвращает общий срок. Значение общее для всех, лежит в воркере. */
  function weeksCell(i){
    return '<td class="wkc"><input class="win" type="number" min="1" max="104" step="1"'
      + ' value="' + (Math.round(i.weeks * 10) / 10) + '" data-wk="' + esc(i.key) + '">'
      + '<div class="sub2">' + (i.ownWeeks ? 'своё' : 'общее') + '</div></td>';
  }
  function bindWeeks(el){
    el.querySelectorAll('[data-wk]').forEach(function (inp) {
      inp.onchange = function () {
        var k = inp.getAttribute('data-wk');
        var raw = String(inp.value || '').trim();
        var v = raw === '' ? 0 : (+raw || 0);
        var it = IT.filter(function(x){ return x.key === k; })[0];
        if (it && !it.ownWeeks && v === P.weeks) return;      /* то же, что общее */
        if (v && (v < 1 || v > 104)) { inp.value = it ? it.weeks : P.weeks; return; }
        inp.disabled = true;
        fetch(API + '?a=weeks', { method:'POST', headers:{'content-type':'application/json'},
                                  body: JSON.stringify({ n:k, v:v }) })
          .then(function(r){ return r.json(); })
          .then(function (j) {
            if (j && j.ok) {
              if (v >= 1) WEEKS_MAN[k] = v; else delete WEEKS_MAN[k];
              redraw();
              var again = document.querySelector('[data-wk="' + k.replace(/"/g,'\\"') + '"]');
              if (again) { again.focus(); again.style.borderColor = '#16a34a';
                setTimeout(function(){ again.style.borderColor = ''; }, 1200); }
              toast(v >= 1 ? 'Срок запаса по позиции: ' + v + ' ' + plw(v,'неделя','недели','недель')
                           : 'Вернули общий срок запаса');
            } else { inp.disabled = false; toast('Не сохранилось: ' + esc((j&&j.error)||'нет связи')); }
          })
          .catch(function(e){ inp.disabled = false; toast('Не сохранилось: ' + esc(String(e))); });
      };
    });
  }

  /* ── СТОП-ЛИСТ ─────────────────────────────────────────────────────
     Галочка «стоп» убирает позицию из заявки: количество по ней видно
     в отдельном списке, но в таблицу заказа и в сумму она не попадает.
     Отметка хранится в воркере — значит, одна на всех. */
  function stopCell(i){
    return '<td class="stc"><label class="stbox" title="'
      + (i.stop ? 'вернуть в заявку' : 'не заказывать эту позицию') + '">'
      + '<input type="checkbox" data-stop="' + esc(i.key) + '"' + (i.stop ? ' checked' : '') + '></label></td>';
  }
  function bindStop(el){
    el.querySelectorAll('[data-stop]').forEach(function (c) {
      c.onchange = function () {
        var k = c.getAttribute('data-stop'), v = c.checked;
        c.disabled = true;
        fetch(API + '?a=stop', { method:'POST', headers:{'content-type':'application/json'},
                                 body: JSON.stringify({ n:k, v:v }) })
          .then(function(r){ return r.json(); })
          .then(function (j) {
            if (j && j.ok) { if (v) STOPS[k] = 1; else delete STOPS[k]; redraw();
              toast(v ? 'Позиция в стопе — в заявку не попадёт' : 'Позиция вернулась в заявку'); }
            else { c.disabled = false; c.checked = !v; toast('Не сохранилось: ' + esc((j&&j.error)||'нет связи')); }
          })
          .catch(function(e){ c.disabled = false; c.checked = !v; toast('Не сохранилось: ' + esc(String(e))); });
      };
    });
  }

  function fotoLoad(){
    return fetch(API + '?a=list').then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return;
        FOTO = j.foto || {}; PRICE_MAN = j.prices || {}; STOPS = j.stops || {}; WEEKS_MAN = j.weeks || {};
      }).catch(function () {});
  }

  /* ── 1. ЧТО ЗАКАЗАТЬ ───────────────────────────────────────────────
     Главная страница закупщика: один список, в котором видно позицию,
     её фото, сколько лежит, на сколько дней хватит и сколько заказать,
     чтобы запаса стало на заданное число недель.                        */
  var BUY_SORT = { k:'', dir:-1 };
  function secBuy() {
    var el = document.getElementById('s-buy');
    var h = hot().filter(function(i){ return qmatch(i); });
    var urgRank = { 'срочно':0, 'скоро':1 };
    if (BUY_SORT.k) h.sort(cmpBy(BUY_SORT));
    else h.sort(function (a, b) {
      var ra = urgRank[a.urg] == null ? 2 : urgRank[a.urg];
      var rb = urgRank[b.urg] == null ? 2 : urgRank[b.urg];
      if (ra !== rb) return ra - rb;
      return (b.orderSum - a.orderSum) || (b.order - a.order);
    });
    var withP = h.filter(function(i){ return !i.noPrice; });
    var noP = h.filter(function(i){ return i.noPrice; });
    var sum = withP.reduce(function(s,i){ return s+i.orderSum; }, 0);
    var urgent = h.filter(function(i){ return i.urg==='срочно'; });
    var urgentSum = urgent.reduce(function(s,i){ return s+i.orderSum; }, 0);
    var negs = IT.filter(function(i){ return i.neg; });

    var html = '';

    html += '<div class="card" style="border-left:3px solid #fbbf24">'
      + '<div style="display:flex;gap:18px;align-items:baseline;flex-wrap:wrap">'
      +   '<div><div style="font-size:11px;color:#7f93b0;font-weight:600">ЗАКАЗАТЬ НА СУММУ</div>'
      +   '<div style="font-size:30px;font-weight:800;color:#fcd34d;line-height:1.2;font-variant-numeric:tabular-nums">'
      +     f0(sum) + ' ₸</div></div>'
      +   '<div style="flex:1;min-width:280px;font-size:12.5px;color:#c3d2e6;line-height:1.65">'
      +     '<b style="color:#f1f5f9">' + h.length + '</b> ' + plw(h.length,'позиция','позиции','позиций')
      +     ' ниже минимального запаса в ' + P.weeks + ' ' + plw(P.weeks,'неделю','недели','недель') + '. '
      +     (urgent.length
            ? '<b style="color:#fca5a5">' + urgent.length + ' ' + plw(urgent.length,'позиция','позиции','позиций')
              + ' срочно</b> — запаса меньше, чем идёт поставка (' + f0(urgentSum) + ' ₸). '
            : 'Срочных нет — ни по одной позиции запас не кончается раньше поставки. ')
      +     (noP.length ? '<div style="margin-top:7px;color:#fcd9a0">' + noP.length + ' '
              + plw(noP.length,'позиция','позиции','позиций') + ' без цены: количество посчитано, '
              + 'сумму подставить не из чего — впишите цену в таблице ниже, она сохранится для всех.</div>' : '')
      +   '</div></div></div>';

    if (negs.length) {
      html += '<div class="card" style="margin-top:12px;border-left:3px solid #f87171">'
        + '<div style="font-size:13px;font-weight:700;color:#f1f5f9">Отрицательные остатки — ошибки учёта</div>'
        + '<div class="hint">В заказ такие минусы не идут. Склад списал больше, чем приходил: '
        + 'пока не проведут приход или не поправят документ, расход по этим позициям тоже посчитан не полностью.</div>'
        + '<div class="tw"><table><thead><tr><th class="nm">Позиция</th><th>Остаток, штук</th>'
        + '<th>Сумма, тенге</th><th>Где минус</th></tr></thead><tbody>'
        + negs.map(function (i) {
            var w = Object.keys(i.st).filter(function(s){ return i.st[s][0] < 0; })
              .map(function(s){ return esc(s) + ' — ' + f1(i.st[s][0]); }).join('; ');
            return '<tr class="hot"><td>' + esc(i.n) + '</td><td style="color:#fca5a5;font-weight:800">'
              + f1(i.stRaw) + '</td><td>' + f0(i.stSum) + '</td>'
              + '<td style="text-align:left;white-space:normal;font-size:11px;color:#8fa2bd">' + w + '</td></tr>';
          }).join('')
        + '</tbody></table></div></div>';
    }

    /* ── в стопе ── */
    var stopHtml = '';
    var stopped = IT.filter(function (i) { return i.stop && qmatch(i, true); });
    if (stopped.length) {
      stopped.sort(function (a, b) { return (b.orderWanted * b.price) - (a.orderWanted * a.price); });
      var lost = stopped.reduce(function (s2, i) { return s2 + i.orderWanted * i.price; }, 0);
      stopHtml = '<div class="card" style="margin-top:12px;border-left:3px solid #64748b">'
        + '<div style="font-size:13px;font-weight:700;color:#f1f5f9">В стопе — ' + stopped.length + ' '
        + plw(stopped.length,'позиция','позиции','позиций') + '</div>'
        + '<div class="hint">Эти позиции решили не заказывать: в заявку и в сумму они не входят. '
        + 'По расчёту им не хватает на ' + f0(lost) + ' ₸ — снимите галочку, и позиция вернётся в заявку.</div>'
        + '<div class="tw"><table><thead><tr><th class="ph">Фото</th><th class="nm">Позиция</th>'
        + '<th>Остаток, штук</th><th>Хватит, дней</th><th>Расчёт просит, штук</th>'
        + '<th>Цена за 1, тенге</th><th>Сумма, тенге</th>'
        + '<th class="stc">Стоп</th></tr></thead><tbody>'
        + stopped.map(function (i) {
            return '<tr class="stopped">' + phCell(i)
              + '<td class="nm">' + esc(i.n) + '<div class="sub2">' + supLink(i.main)
              +   (i.u ? ' · ' + esc(i.u) : '') + '</div></td>'
              + '<td>' + f1(i.stock) + '</td><td>' + f1(i.days) + '</td>'
              + '<td>' + (i.orderWanted ? f0(i.orderWanted) : '<span class="zero">—</span>') + '</td>'
              + '<td>' + (i.price ? f1(i.price) : '<span class="zero">—</span>') + '</td>'
              + '<td>' + (i.orderWanted && i.price ? f0(i.orderWanted * i.price) : '<span class="zero">—</span>') + '</td>'
              + stopCell(i) + '</tr>';
          }).join('')
        + '</tbody></table></div></div>';
    }

    if (!h.length) {
      html += '<div class="card" style="margin-top:12px"><div class="empty">'
        + (filtersOn() ? 'По этому фильтру заказывать нечего.'
            : 'Заказывать нечего: по всем позициям запаса больше ' + P.weeks + ' '
              + plw(P.weeks,'недели','недель','недель') + '.')
        + '</div></div>' + stopHtml;
      el.innerHTML = html; bindPh(el); bindStop(el); bindPrice(el); bindWeeks(el); bindSup(el); return;
    }

    /* Колонок было десять, и таблица не влезала в экран: цена и сумма
       уезжали за правый край. Расход и минимум ушли в подпись под
       названием — они объясняют цифру, но смотрят на них реже. */
    function rows(list, withPrice) {
      return list.map(function (i) {
        var cls = i.urg==='срочно' ? 'hot' : '';
        return '<tr class="' + cls + '">'
          + phCell(i)
          + '<td class="nm">' + esc(i.n)
          +   '<div class="sub2">' + supLink(i.main)
          +     (i.u ? ' · ' + esc(i.u) : '')
          +     ' · расход ' + f1(i.perD) + '/дн · минимум ' + f0(i.min)
          +     (i.why ? ' · <span style="color:#fcd34d">' + esc(i.why) + '</span>' : '')
          +   '</div></td>'
          + qtyCell(i.stock, i.price, i.u)
          + '<td class="dd' + (i.days!=null&&i.days<i.lead?' red':'') + '">' + f1(i.days) + '</td>'
          + weeksCell(i)
          + '<td class="q">' + f0(i.order) + '</td>'
          + priceCell(i)
          + '<td class="mny">' + (withPrice ? f0(i.orderSum) : '<span class="zero">—</span>') + '</td>'
          + '<td>' + (i.urg ? '<span class="st ' + (i.urg==='срочно'?'s-def':i.urg==='скоро'?'s-soon':'s-low') + '">'
              + i.urg + '</span>' : '') + '</td>'
          + stopCell(i) + '</tr>';
      }).join('');
    }
    var thead = '<thead><tr>' + thSort(BUY_SORT, [
        ['', 'Фото', 'ph'], ['n', 'Позиция', 'nm'],
        ['stock', 'Остаток<br>штук'], ['stockMoney', 'Остаток<br>тенге'],
        ['days', 'Хватит<br>дней'],
        ['weeks', 'Запас<br>недель', 'wkc', 'на сколько недель держим запас по этой позиции'],
        ['order', 'Заказать<br>штук', '', 'в единицах позиции: шт, м, кг'],
        ['price', 'Цена за 1<br>тенге', '', 'цена за единицу по последней накладной'],
        ['orderSum', 'Сумма<br>тенге'], ['urg', 'Срочность'], ['', 'Стоп', 'stc']
      ]) + '</tr></thead>';

    html += '<div class="card" style="margin-top:12px">'
      + '<div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">'
      +   '<div style="font-size:13px;font-weight:700;color:#f1f5f9">Заказать — ' + withP.length + ' '
      +     plw(withP.length,'позиция','позиции','позиций') + '</div>'
      +   '<button class="mini" id="xbuy" style="margin-left:auto">📥 Заявка в Excel</button></div>'
      + '<div class="hint">Сверху то, что кончится раньше, чем придёт поставка. '
      + '«Минимум» — сколько должно лежать, чтобы хватило на ' + P.weeks + ' '
      + plw(P.weeks,'неделю','недели','недель') + '; «заказать» — разница с остатком. '
      + '«Цена за 1» — по последней накладной в iiko, под ценой написано, когда брали. '
      + 'Любой заголовок можно нажать — таблица отсортируется по нему, третий клик вернёт порядок по умолчанию.</div>'
      + '<div class="tw"><table>' + thead + '<tbody>' + rows(withP, true) + '</tbody>'
      + '<tfoot><tr><td></td><td class="nm">Итого · ' + withP.length + '</td><td></td>'
      + '<td>' + f0(withP.reduce(function(s,i){return s+i.stockMoney;},0)) + '</td><td></td><td></td>'
      + '<td>' + f0(withP.reduce(function(s,i){return s+i.order;},0)) + '</td><td></td>'
      + '<td>' + f0(sum) + '</td><td></td><td></td></tr></tfoot></table></div></div>';

    if (noP.length) {
      html += '<div class="card" style="margin-top:12px;border-left:3px solid #fbbf24">'
        + '<div style="font-size:13px;font-weight:700;color:#f1f5f9">Цена неизвестна — ' + noP.length + ' '
        + plw(noP.length,'позиция','позиции','позиций') + '</div>'
        + '<div class="hint">По этим позициям за год не было приходной накладной в iiko: расход есть, '
        + 'цены нет. Количество к заказу посчитано, в сумму заявки они не входят. '
        + 'Впишите цену — она сохранится на сайте и попадёт в расчёт.</div>'
        + '<div class="tw"><table>' + thead + '<tbody>' + rows(noP, false) + '</tbody></table></div></div>';
    }

    html += stopHtml;

    el.innerHTML = html;
    bindPh(el); bindStop(el); bindPrice(el); bindWeeks(el); bindSort(el, BUY_SORT, secBuy); bindSup(el);
    var xb = document.getElementById('xbuy');
    if (xb) xb.onclick = function(){ xlsxBuy(withP.concat(noP)); };
  }

  /* ── 2. ОТЧЁТ: неснижаемый остаток ─────────────────────────────────
     Два разных числа, которые часто путают.
       Неснижаемый остаток — сколько должно лежать, чтобы цех не встал,
       пока едет поставка: расход в день × (срок поставки + страховой).
       Целевой запас — до скольки дозаказываем: расход × заданные недели.
     Ниже неснижаемого — красная зона. Выше «избытка» — замороженные деньги. */
  var REP_SORT = { k:'', dir:-1 };
  function secRep() {
    var el = document.getElementById('s-rep');
    /* Считаем только ту упаковку, которой реально пользуются: есть расход
       за три последних месяца и она не в стопе. Позиции без движения —
       отдельный разговор, они на вкладке «не используется». */
    /* Позиции в стопе из отчёта не выкидываем: их должно быть видно
       везде, просто с пометкой — чтобы не выяснять потом, почему дыра
       в неснижаемом есть, а в заявке позиции нет. В сумму «не хватает»
       они не идут: это решение, а не недостача. */
    var a = IT.filter(function (i) { return qmatch(i) && i.perD > 0; });
    if (REP_SORT.k) a.sort(cmpBy(REP_SORT));
    else a.sort(function (x, y) { return (x.devSum - y.devSum) || (x.devQty - y.devQty); });

    var below = a.filter(function(i){ return i.zone==='ниже неснижаемого' && !i.stop; });
    var over  = a.filter(function(i){ return i.zone==='избыток'; });
    var stoppedRep = a.filter(function(i){ return i.stop; });
    var stopSum = stoppedRep.reduce(function(s2,i){ return s2 + Math.max(0, i.min - i.stock) * i.price; }, 0);
    var needSum = below.reduce(function(s2,i){ return s2 + (i.min - i.stock) * i.price; }, 0);
    var overSum = over.reduce(function(s2,i){ return s2 + (i.stock - i.over) * i.price; }, 0);
    var normSum = a.reduce(function(s2,i){ return s2 + i.min * i.price; }, 0);
    var factSum = a.reduce(function(s2,i){ return s2 + i.stock * i.price; }, 0);
    var deadSum = IT.filter(function(i){ return i.dead && i.stock>0; })
                    .reduce(function(s2,i){ return s2 + i.stSum; }, 0);

    function tile(l, v, s2, c) {
      return '<div class="kpi" style="--c:' + c + '"><div class="l">' + l + '</div>'
        + '<div class="v" style="color:' + c + '">' + v + '</div><div class="s">' + s2 + '</div></div>';
    }

    var html = '<div class="card" style="border-left:3px solid #60a5fa">'
      + '<div style="font-size:13px;font-weight:700;color:#f1f5f9">Неснижаемый остаток по упаковке</div>'
      + '<div class="hint">Неснижаемый остаток = расход в день × число недель. По умолчанию <b>' + P.weeks
      + ' ' + plw(P.weeks,'неделя','недели','недель') + '</b>, но по каждой позиции срок можно поставить свой — '
      + 'прямо в колонке «Недель», и он тут же пересчитает и неснижаемый, и заявку. '
      + 'До неснижаемого и дозаказываем: «не хватает» — это и есть заявка. '
      + 'Позиции в стопе показаны с пометкой и в сумму «не хватает» не входят. '
      + 'Запас больше ' + P.over + ' ' + plw(P.over,'недели','недель','недель') + ' считаем избытком — '
      + 'это деньги, которые лежат без дела. В отчёт берём только упаковку, которой пользуются: '
      + 'есть расход за три последних месяца и она не в стопе.</div>'
      + '<div class="kpis" style="margin-top:12px">'
      +   tile('Неснижаемый остаток, ₸', f0(normSum) + ' ₸', 'запас на ' + P.weeks + ' '
            + plw(P.weeks,'неделю','недели','недель') + ' по всей рабочей упаковке', '#60a5fa')
      +   tile('Лежит сейчас, ₸', f0(factSum) + ' ₸', a.length + ' ' + plw(a.length,'позиция','позиции','позиций') + ' в обороте', '#4ade80')
      +   tile('Не хватает, ₸', f0(needSum) + ' ₸', below.length + ' ' + plw(below.length,'позиция','позиции','позиций'), '#f87171')
      +   tile('Избыток сверх ' + P.over + ' недель', f0(overSum) + ' ₸', over.length + ' ' + plw(over.length,'позиция','позиции','позиций'), '#fbbf24')
      +   tile('Лежит без движения', f0(deadSum) + ' ₸', 'не заказывать вовсе', '#c4b5fd')
      +   (stoppedRep.length ? tile('В стопе', f0(stopSum) + ' ₸', stoppedRep.length + ' '
            + plw(stoppedRep.length,'позиция','позиции','позиций') + ' — решили не заказывать', '#94a3b8') : '')
      + '</div></div>';

    html += '<div class="card" style="margin-top:12px">'
      + '<div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">'
      +   '<div style="font-size:13px;font-weight:700;color:#f1f5f9">Позиция за позицией</div>'
      +   '<button class="mini" id="xrep" style="margin-left:auto">📥 Отчёт в Excel</button></div>'
      + '<div class="hint">Сверху то, где дыра до неснижаемого больше всего в деньгах. '
      + '«Отклонение» — остаток минус неснижаемый: минус значит, что уже ниже нормы. '
      + 'В колонках «неснижаемый» и «остаток» сверху количество в единицах позиции, снизу то же в тенге. '
      + 'Заголовки кликаются — можно отсортировать по любому столбцу.</div>'
      + '<div class="tw"><table><thead><tr>' + thSort(REP_SORT, [
          ['', 'Фото', 'ph'], ['n', 'Позиция', 'nm'],
          ['perD', 'Расход в день<br>штук', '', 'в единицах позиции: шт, м, кг'],
          ['weeks', 'Запас<br>недель', 'wkc', 'на сколько недель держим запас'],
          ['min', 'Неснижаемый<br>штук', '', 'неснижаемый остаток в единицах позиции'],
          ['minMoney', 'Неснижаемый<br>тенге', '', 'неснижаемый остаток в деньгах'],
          ['stock', 'Остаток<br>штук'], ['stockMoney', 'Остаток<br>тенге'],
          ['days', 'Хватит<br>дней'],
          ['devQty', 'Отклонение<br>штук', '', 'остаток минус неснижаемый, в единицах'],
          ['devSum', 'Отклонение<br>тенге'], ['zone', 'Зона']
        ]) + '</tr></thead><tbody>'
      + a.map(function (i) {
          var z = i.zone === 'ниже неснижаемого' ? 's-def' : i.zone === 'избыток' ? 's-soon' : 's-ok';
          return '<tr class="' + (i.stop ? 'stopped' : i.zone==='ниже неснижаемого'?'hot':'') + '">'
            + phCell(i)
            + '<td class="nm">' + esc(i.n)
            +   (i.stop ? ' <span class="st s-stop">в стопе</span>' : '')
            +   '<div class="sub2">' + supLink(i.main)
            +   (i.u ? ' · ' + esc(i.u) : '') + '</div></td>'
            + '<td>' + f1(i.perD) + '</td>'
            + weeksCell(i)
            + qtyCell(i.min, i.price, i.u, 'minq')
            + qtyCell(i.stock, i.price, i.u)
            + '<td class="dd' + (i.days!=null&&i.days<i.lead?' red':'') + '">' + f1(i.days) + '</td>'
            + '<td style="font-weight:800;color:' + (i.devQty<0?'#fca5a5':'#86efac') + '">'
            +   (i.devQty>0?'+':'') + f0(i.devQty) + '</td>'
            /* Без цены отклонение в деньгах посчитать не из чего — ноль
               здесь читался бы как «всё сходится». */
            + '<td style="color:' + (i.devSum<0?'#fca5a5':'#8fa2bd') + '">'
            +   (i.price ? (i.devSum>0?'+':'') + f0(i.devSum) : '<span class="zero">—</span>') + '</td>'
            + '<td><span class="st ' + z + '" title="' + i.zone + '">'
            +   (i.zone === 'ниже неснижаемого' ? 'ниже' : i.zone) + '</span></td></tr>';
        }).join('')
      + '</tbody><tfoot><tr><td></td><td class="nm">Итого · ' + a.length + '</td><td></td><td></td>'
      + '<td></td><td>' + f0(normSum) + '</td><td></td><td>' + f0(factSum) + '</td><td></td><td></td>'
      + '<td>' + f0(factSum - normSum) + '</td><td></td></tr></tfoot></table></div></div>';

    el.innerHTML = html;
    bindPh(el); bindWeeks(el); bindSort(el, REP_SORT, secRep); bindSup(el);
    var xr = document.getElementById('xrep');
    if (xr) xr.onclick = function(){ xlsxRep(a); };
  }

  /* ── ВСПЛЫВАЮЩЕЕ ОКНО: что срочно заказать ─────────────────────── */
  function urgList(){
    return hot().filter(function(i){ return i.urg === 'срочно'; })
      .sort(function(a,b){ return (b.orderSum - a.orderSum) || (b.order - a.order); });
  }
  /* Само при входе окно больше не выскакивает — мешает. Открывается
     только кнопкой «Срочное» со счётчиком в настройках. */
  function urgPopup(){
    var u = urgList();
    var sum = u.reduce(function(s2,i){ return s2 + i.orderSum; }, 0);
    document.getElementById('md-sum').textContent = f0(sum) + ' ₸';

  /* ── 3. ЗАЯВКА: по поставщикам ─────────────────────────────────── */

    hot().filter(function(i){ return qmatch(i); }).forEach(function (i) {

        + '<button class="mini" data-ord="' + esc(k) + '">📥 заявка в Excel</button>'

        + '<div class="ord-b"><div class="tw"><table><thead><tr>'

        + '<th class="nm">Позиция</th><th>Остаток, штук</th><th>Расход в день, штук</th>'

        + list.map(function (i) {
            var where = Object.keys(i.st).sort(function(a,b){return i.st[b][0]-i.st[a][0];})

            return '<tr class="' + (i.st_==='дефицит'?'hot':'') + '">'
              + phCell(i)
              + '<td class="nm">' + esc(i.n) + '<div class="sub2">' + esc(i.u||'') + '</div></td>'
              + '<td>' + f1(i.stock) + '</td>'
              + '<td>' + f1(i.perD) + '</td>'

  /* ── 2. ГДЕ ЧТО ЛЕЖИТ ──────────────────────────────────────────── */
  function secMx() {
    var rows = IT.filter(function(i){ return qmatch(i, true); }).filter(function (i) { return i.stock > 0 || i.order > 0; });
    rows.sort(function (a, b) { return b.stSum - a.stSum; });
    var used = STORES.filter(function (s) {
      return rows.some(function (i) { return i.st[s]; }); });
    var el = document.getElementById('s-mx');
    if (!used.length) { el.innerHTML = '<div class="card"><div class="empty">Остатков упаковки на складах нет.</div></div>'; return; }
    /* Названия складов длинные и в вертикальной шапке не помещаются:
       режем служебные хвосты, оставляя то, чем склад отличается. */
    function shortStore(s) {
      return String(s).replace(/^Основной склад\s*/i, 'Осн. ')
                      .replace(/^Склад\s+/i, '')
                      .replace(/\s*ФЗ$/i, '')
                      .replace(/[()]/g, '')
                      .trim() || s;
    }
    var h = '<div class="card"><div class="card-t" style="font-size:13px;font-weight:800;margin-bottom:4px">'
      + 'Где лежит упаковка</div>'
