<meta charset="utf-8">

<!-- Полный срез по упаковке из iiko: остатки по складам, движение, поставщики -->
<script src="upak_data.js" onerror="window.UPAK=null"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070c17; --card:#0d1526; --line:#1c2740; --line2:#26334d;
  --ink:#eef3fb; --ink2:#c3d0e2; --mut:#7b8ca6; --dim:#546279;
  --red:#f87171; --amb:#fbbf24; --grn:#4ade80; --vio:#22d3ee; --brn:#f59e0b;
}
body{font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(940px 520px at 8% -10%, rgba(245,158,11,.16), transparent 60%),
    radial-gradient(820px 460px at 96% 0%, rgba(34,211,238,.12), transparent 60%),
    radial-gradient(700px 500px at 55% 112%, rgba(56,189,248,.06), transparent 62%),
    var(--bg);
  background-attachment:fixed}

.topbar{display:flex;align-items:center;gap:16px;padding:15px 30px;position:sticky;top:0;z-index:60;
  background:rgba(10,16,29,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  box-shadow:0 10px 30px -24px #000}
.backbtn{display:inline-flex;align-items:center;flex-shrink:0;background:#16203a;color:var(--ink2);
  border:1px solid var(--line2);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:999px;
  text-decoration:none;transition:.18s;white-space:nowrap}
.backbtn:hover{background:var(--vio);color:#05202a;border-color:var(--vio);box-shadow:0 0 18px -4px rgba(34,211,238,.8)}
.topbar h1{font-size:17px;font-weight:900;letter-spacing:-.3px}
.topbar p{font-size:11.5px;color:var(--mut);margin-top:2px}
.live{margin-left:auto;font-size:11.5px;color:#fde68a;background:rgba(245,158,11,.11);
  border:1px solid rgba(245,158,11,.4);border-radius:999px;padding:6px 13px;font-weight:700;white-space:nowrap;
  box-shadow:0 0 20px -7px rgba(245,158,11,.75)}

.section{padding:22px 30px 40px;max-width:1500px;margin:0 auto}
.card{background:linear-gradient(180deg,#111c31,#0e1728);border:1px solid var(--line);border-radius:18px;
  padding:18px 20px;box-shadow:0 18px 40px -28px #000, inset 0 1px 0 rgba(255,255,255,.035)}

/* ── ГЕРОЙ ── */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 28px;margin-bottom:14px;
  border:1px solid var(--line2);
  background:linear-gradient(140deg,rgba(245,158,11,.15),transparent 48%),linear-gradient(180deg,#121c31,#0d1526);
  box-shadow:0 22px 50px -34px #000}
.hero-in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h2{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#fcd34d;margin-bottom:10px}
.hero .big{font-size:50px;font-weight:900;letter-spacing:-1.6px;line-height:1;color:#fcd34d;
  text-shadow:0 0 34px rgba(245,158,11,.5)}
.hero .sub{font-size:14px;color:var(--ink2);line-height:1.65;margin-top:11px;max-width:620px}
.hero .sub b{color:#fff}
.hero-side{display:grid;gap:9px}
.hs{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:11px 14px;
  display:flex;align-items:baseline;gap:10px}
.hs .v{font-size:20px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.hs .l{font-size:11.5px;color:var(--mut);line-height:1.4}

/* ── УПРАВЛЕНИЕ ── */
.ctl{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ctl label{display:block;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px}
.ctl select,.ctl input[type=search],.ctl input[type=number]{background:#0a1222;border:1px solid var(--line2);
  color:var(--ink);border-radius:11px;padding:9px 11px;font-size:12.5px;font-family:inherit;transition:.16s}
.ctl select:focus,.ctl input:focus{outline:none;border-color:var(--vio);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
.ctl input[type=number]{width:78px;text-align:right;font-weight:800}
.ctl input[type=search]{min-width:230px}
.btn{background:#16233c;border:1px solid var(--line2);color:var(--ink2);border-radius:11px;padding:9px 14px;
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.16s}
.btn:hover{background:#1e2f4d;color:#fff;box-shadow:0 0 18px -5px rgba(34,211,238,.75)}
.btn.pri{background:linear-gradient(135deg,#16a34a,#065f46);border-color:transparent;color:#eafff2;
  box-shadow:0 0 22px -7px rgba(22,163,74,.9)}
.btn.pri:hover{filter:brightness(1.1);color:#fff}
.note{font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:12px}
.note b{color:var(--ink2)}
.more{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.more summary{cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);list-style:none;display:flex;align-items:center;gap:8px;user-select:none;width:fit-content}
.more summary::-webkit-details-marker{display:none}
.more summary:before{content:'▸';color:var(--vio);font-size:10px;transition:.15s}
.more[open] summary:before{transform:rotate(90deg)}
.more summary:hover{color:var(--ink2)}

/* ── КАРТОЧКА ДОЛЖНИКА ── */
.deb{position:relative;border-radius:16px;border:1px solid var(--line);margin-bottom:11px;overflow:hidden;
  background:linear-gradient(180deg,#111c31,#0e1728);box-shadow:0 16px 34px -30px #000}
.deb:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#334155}
.deb.r1:before{background:#ef4444;box-shadow:0 0 20px 2px rgba(239,68,68,.65)}
.deb.r2:before{background:#f59e0b;box-shadow:0 0 18px 2px rgba(245,158,11,.5)}
.deb.r3:before{background:#22c55e}
.deb-h{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr));gap:14px;
  align-items:center;padding:14px 18px 12px}
.deb-nm{font-size:14px;font-weight:800;color:var(--ink);line-height:1.3}
.deb-tag{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800}
.t-red{background:rgba(239,68,68,.15);color:#fca5a5}
.t-amb{background:rgba(245,158,11,.15);color:#fcd34d}
.t-grn{background:rgba(34,197,94,.14);color:#86efac}
.deb-f{text-align:right}
.deb-f .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink)}
.deb-f .v.red{color:#fca5a5;text-shadow:0 0 18px rgba(248,113,113,.5)}
.deb-f .l{font-size:10.5px;color:var(--mut);margin-top:3px}
.deb-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;
  padding:0 18px 15px;align-items:start}
.spark{display:block}
.spark-l{font-size:10.5px;color:var(--dim);margin-top:5px;line-height:1.5}
.spark-l b{color:var(--ink2)}

/* работа с клиентом */
.work{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.work-t{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.work-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.work-g label{display:block;font-size:9.5px;color:var(--dim);font-weight:700;margin-bottom:4px}
.work input,.work select{width:100%;background:#0a1222;border:1px solid var(--line2);color:var(--ink);
  border-radius:9px;padding:7px 9px;font-size:12px;font-family:inherit}
.work input:focus,.work select:focus{outline:none;border-color:var(--vio)}
.work-r{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
.work-s{font-size:11px;color:var(--dim);margin-left:auto}
.work-s.ok{color:#86efac}
.chip{display:inline-block;padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:700}
.c-wait{background:rgba(245,158,11,.14);color:#fcd34d}
.c-bad{background:rgba(239,68,68,.16);color:#fca5a5}
.c-ok{background:rgba(34,197,94,.14);color:#86efac}

.empty{padding:26px;text-align:center;color:var(--mut);font-size:13px}
footer{text-align:center;color:#3d4a60;font-size:12px;line-height:1.7;padding:24px 16px 40px;
  border-top:1px solid var(--line);margin-top:10px}
.fix{position:sticky;bottom:0;z-index:40;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  margin:16px -30px -40px;padding:13px 30px;background:rgba(9,14,26,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line2)}
.fix .v{font-size:18px;font-weight:900;color:#fcd34d;letter-spacing:-.3px}
.fix .n{font-size:12px;color:var(--mut)}
.fix .n b{color:var(--ink)}

@media (max-width:1000px){
  .hero-in{grid-template-columns:1fr}.hero .big{font-size:38px}
  .deb-h{grid-template-columns:1fr 1fr;gap:10px}
  .deb-b{grid-template-columns:1fr}
  .section{padding:16px 12px 34px}.topbar{padding:12px 14px}
  .fix{margin:14px -12px -34px;padding:11px 14px;gap:10px}
}

/* ── направление «упаковка»: рабочий стол закупщика ─────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;margin:14px 0}
.kpi{background:linear-gradient(180deg,#111c31,#0e1728);border:1px solid var(--line);border-radius:15px;
  padding:13px 15px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#334155)}
.kpi .l{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.kpi .v{font-size:23px;font-weight:900;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.5}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 0}
.tab{background:#101a2f;border:1px solid var(--line2);color:var(--ink2);border-radius:11px;padding:9px 15px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.tab:hover{background:#1a2842;color:#fff}
.tab.on{background:linear-gradient(135deg,#f59e0b,#b45309);border-color:transparent;color:#1a1204;
  box-shadow:0 0 22px -8px rgba(245,158,11,.9)}
.tab b{margin-left:6px;opacity:.75}
.sec{display:none}.sec.on{display:block}

.tw{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:760px}
thead th{position:sticky;top:0;z-index:5;background:#0e1830;color:var(--ink2);font-size:10.5px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:10px 11px;text-align:right;
  border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
thead th:first-child{text-align:left}
thead th.on{color:#fcd34d}
tbody td{padding:9px 11px;text-align:right;border-bottom:1px solid rgba(28,39,64,.7);
  font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td:first-child{text-align:left;white-space:normal;min-width:220px}
tbody tr:hover{background:rgba(245,158,11,.05)}
tbody tr.hot{background:rgba(239,68,68,.07)}
tfoot td{padding:9px 11px;text-align:right;font-weight:800;background:#0d1526;border-top:1px solid var(--line2)}
tfoot td:first-child{text-align:left}
.st{display:inline-block;padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:800;white-space:nowrap}
.s-def{background:rgba(239,68,68,.17);color:#fca5a5}
.s-soon{background:rgba(245,158,11,.16);color:#fcd34d}
.s-ok{background:rgba(34,197,94,.13);color:#86efac}
.s-non{background:rgba(148,163,184,.12);color:#94a3b8}
.s-dead{background:rgba(124,58,237,.15);color:#c4b5fd}
.sub2{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.zero{color:#3d4a60}

/* заявка поставщику */
.ord{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;
  background:linear-gradient(180deg,#111c31,#0e1728);position:relative}
.ord:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#f59e0b}
.ord.debt:before{background:#ef4444}
.ord-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px 11px}
.ord-n{font-size:15px;font-weight:800}
.ord-m{font-size:11.5px;color:var(--mut);margin-top:3px}
.ord-m b{color:#fca5a5}
.ord-s{margin-left:auto;text-align:right}
.ord-s .v{font-size:20px;font-weight:900;color:#fcd34d;font-variant-numeric:tabular-nums}
.ord-s .l{font-size:10.5px;color:var(--mut)}
.ord-b{padding:0 18px 15px}
.ord table{min-width:600px}
.mini{background:#16233c;border:1px solid var(--line2);color:var(--ink2);border-radius:9px;padding:6px 11px;
  font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.mini:hover{background:#1e2f4d;color:#fff;border-color:var(--vio)}

/* матрица складов */
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-top:12px}
.mx table{min-width:900px;font-size:12px}
.mx th.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:205px;text-align:left;
  padding:9px 6px;font-size:10px;font-weight:700;letter-spacing:.02em;cursor:default;
  white-space:nowrap;color:#c3d0e2}
.mx td.c{text-align:center;font-variant-numeric:tabular-nums}
.mx td.has{background:rgba(34,197,94,.09);color:#bbf7d0;font-weight:700}
.mx td.no{color:#2b3purple}
.mx td.no{color:#334155}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style></head>
<body>

<div class="topbar">
  <a class="backbtn" href="index.html">← Пульс</a>
  <div><h1>🧻 Упаковка</h1><p id="sub">заявки, остатки по складам, поставщики</p></div>
  <div class="live" id="live">—</div>
</div>

<div class="section" id="up">
  <div class="hero"><div class="hero-in">
    <div>
      <h2>Заявка на сегодня</h2>
      <div class="big" id="h-sum">—</div>
      <div class="sub" id="h-txt">—</div>
    </div>
    <div class="hero-side" id="h-side"></div>
  </div></div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <div class="ctl">
      <div><label>Срок поставки, дней</label><input type="number" id="p-lead" min="1" max="60" value="7"></div>
      <div><label>Под заказ, дней</label><input type="number" id="p-long" min="1" max="90" value="10"></div>
      <div><label>Страховой запас, дней</label><input type="number" id="p-safe" min="0" max="60" value="5"></div>
      <div><label>На сколько дней заказываем</label><input type="number" id="p-cov" min="7" max="180" value="30"></div>
      <div style="flex:1;min-width:190px"><label>Поиск</label>
        <input type="search" id="q" placeholder="позиция, поставщик, склад…"></div>

    <div class="note" id="how"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-s="ord">📝 Заявка<b id="t-ord"></b></button>
    <button class="tab" data-s="mx">🏬 Где что лежит<b id="t-mx"></b></button>
    <button class="tab" data-s="all">📋 Вся упаковка<b id="t-all"></b></button>
    <button class="tab" data-s="dead">🧊 Не используется<b id="t-dead"></b></button>
  </div>

  <div class="sec on" id="s-ord"></div>
  <div class="sec" id="s-mx"></div>
  <div class="sec" id="s-all"></div>
  <div class="sec" id="s-dead"></div>
</div>

<div id="p-nodata" class="section" style="display:none">
  <div class="card"><div class="empty">Срез по упаковке ещё не собран: upak_data.js появится после ближайшего ночного прогона.</div></div>
</div>

<footer>Система «Пульс» · Фуд Завод<br><b style="color:#8494ad">Ольга Герасименко</b> · финансовый директор · данные из iiko, обновляются каждое утро</footer>

<script>

(function () {
  'use strict';
  var D = window.UPAK || null;
  if (!D || !D.items || !D.items.length) {
    document.getElementById('up').style.display = 'none';
    document.getElementById('p-nodata').style.display = ''; return;
  }
  var MON = D.months || [], STORES = D.stores || [], TH = D.through || '';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function f0(x){ if(x==null||!isFinite(x)) return '—';
    return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
  function f1(x){ return (x==null||!isFinite(x)) ? '—'
    : (Math.abs(x)>=100 ? f0(x) : x.toFixed(1).replace('.',',')); }
  function fm(x){ var a=Math.abs(x);
    if(a>=1e6) return (x/1e6).toFixed(1).replace('.',',')+' млн';
    if(a>=1e3) return Math.round(x/1e3)+' тыс';
    return f0(x); }
  function plw(n,a,b,c){ var m=n%100; if(m>=11&&m<=14) return c; m=n%10;
    return m===1?a:(m>=2&&m<=4)?b:c; }
  function dmy(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s||'') ? s.split('-').reverse().join('.') : (s||'—'); }

  /* ── ПАРАМЕТРЫ ЗАКАЗА ────────────────────────────────────────────
     Срок поставки решает всё: пока едет упаковка, производство не ждёт.
     Позиции, которые делают под заказ, едут дольше — их поставщики
     отмечены отдельно, отметка держится в браузере закупщика. */
  var LONG_KEY = 'upak_long_v2';
  var LONG = {};
  try { LONG = JSON.parse(localStorage.getItem(LONG_KEY) || 'null') || null; } catch(e){ LONG = null; }
  if (!LONG) LONG = { 'Color express ТОО':1, 'Компания В ТОО':1, 'Казтехнолоджи Пак ТОО':1 };
  function saveLong(){ try{ localStorage.setItem(LONG_KEY, JSON.stringify(LONG)); }catch(e){} }

  var P = { lead:7, long:10, safe:5, cov:30 };

  /* последние три полных месяца: по ним считаем дневной расход */
  var LAST3 = MON.slice(-4, -1);
  if (LAST3.length < 3) LAST3 = MON.slice(-3);
  var D3 = LAST3.length * 30.4;

  var IT = D.items.map(function (r) {
    var stock = 0, stSum = 0, st = {};
    Object.keys(r.st || {}).forEach(function (s) {
      st[s] = r.st[s]; stock += r.st[s][0]; stSum += r.st[s][1];
    });
    /* расход — прямой: сколько ушло со склада, а не разница остатков */
    var out3 = 0, in3 = 0, outAll = 0, lastMove = '';
    var byStore = {};
    MON.forEach(function (k) {
      var m = (r.mv || {})[k]; if (!m) return;
      Object.keys(m).forEach(function (s) {
        var v = m[s];
        outAll += v[1];
        if (v[0] || v[1]) lastMove = k;
        var b = byStore[s] || (byStore[s] = [0, 0]);
        b[0] += v[0]; b[1] += v[1];
        if (LAST3.indexOf(k) >= 0) { in3 += v[0]; out3 += v[1]; }
      });
    });
    var sup = Object.keys(r.sup || {});
    sup.sort(function (a, b) { return (r.sup[b][0] || 0) - (r.sup[a][0] || 0); });
    var main = sup[0] || '';
    var qty = sup.reduce(function (s2, k) { return s2 + (r.sup[k][1] || 0); }, 0);
    var sum = sup.reduce(function (s2, k) { return s2 + (r.sup[k][0] || 0); }, 0);
    return { n:r.n, u:r.u||'', st:st, stock:stock, stSum:stSum, sup:r.sup||{}, sups:sup, main:main,
             price: qty ? sum/qty : 0, buySum:sum, buyQty:qty,
             out3:out3, in3:in3, outAll:outAll, last:lastMove, byStore:byStore,
             stores:Object.keys(st) };
  });

  function leadOf(it){ var l=P.lead; it.sups.forEach(function(s){ if(LONG[s]) l=Math.max(l,P.long); }); return l; }
  function calc() {
    IT.forEach(function (it) {
      it.lead = leadOf(it);
      it.perD = it.out3 > 0 ? it.out3 / D3 : 0;
      it.days = it.perD > 0 ? it.stock / it.perD : null;
      it.point = it.perD * (it.lead + P.safe);
      it.target = it.perD * (it.lead + P.cov);
      it.order = (it.perD > 0 && it.stock < it.point) ? Math.max(0, it.target - it.stock) : 0;
      it.orderSum = it.order * it.price;
      /* Позиция без единого движения за три месяца — это не дефицит,
         а вещь, которой сейчас не пользуются. Заказывать её незачем,
         но если на складе лежит остаток, это замороженные деньги. */
      it.dead = it.out3 <= 0 && it.in3 <= 0;
      it.st_ = it.dead ? (it.stock > 0 ? 'лежит без движения' : 'не используется')
             : it.perD <= 0 ? 'только приход'
             : it.days < it.lead ? 'дефицит'
             : it.days < it.lead + P.safe ? 'пора заказывать' : 'норма';
    });
  }
  function stCls(s){ return s==='дефицит'?'s-def':s==='пора заказывать'?'s-soon'
    :s==='норма'?'s-ok':s==='лежит без движения'?'s-dead':'s-non'; }

    document.getElementById('sub').textContent =
      IT.length + ' позиций · ' + STORES.length + ' складов · обновлено ' + (D.updated||'');

    rows.sort(function (a, b) { return b.stSum - a.stSum; });

  /* ── ВЫГРУЗКИ ──────────────────────────────────────────────────── */
  function crc32(buf) {
    var c, t = crc32.t;
    if (!t) {
      t = crc32.t = [];
      for (var n = 0; n < 256; n++) {
        c = n;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[n] = c >>> 0;
      }
    }
    c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) c = t[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zip(files) {                       // без сжатия: метод STORE
    var enc = new TextEncoder(), parts = [], central = [], off = 0;
    function u16(n) { return [n & 255, (n >> 8) & 255]; }
    function u32(n) { return [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255]; }
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.data), cr = crc32(data);
      var loc = [].concat([80, 75, 3, 4], u16(20), u16(0x800), u16(0), u16(0), u16(0),
        u32(cr), u32(data.length), u32(data.length), u16(name.length), u16(0));
      parts.push(new Uint8Array(loc), name, data);
      central.push([].concat([80, 75, 1, 2], u16(20), u16(20), u16(0x800), u16(0), u16(0), u16(0),
        u32(cr), u32(data.length), u32(data.length), u16(name.length),
        u16(0), u16(0), u16(0), u16(0), u32(0), u32(off)), name);
      off += loc.length + name.length + data.length;
    });
    var cd = [], cdLen = 0;
    for (var i = 0; i < central.length; i += 2) {
      cd.push(new Uint8Array(central[i]), central[i + 1]);
      cdLen += central[i].length + central[i + 1].length;
    }
    var end = new Uint8Array([].concat([80, 75, 5, 6], u16(0), u16(0),
      u16(files.length), u16(files.length), u32(cdLen), u32(off), u16(0)));
    return new Blob(parts.concat(cd, [end]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  function xesc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  /* Стили: 0 обычный · 1 шапка · 2 текст · 3 целое · 4 процент · 5 деньги-жирно
     6 итог-текст · 7 итог-целое · 8 процент (выделен) · 9 текст мелкий · 10 просрочка */
  var XSTYLES =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0"/>' +
    '<numFmt numFmtId="165" formatCode="0.0%"/></numFmts>' +
    '<fonts count="6">' +
    '<font><sz val="10.5"/><color rgb="FF1F2937"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="10.5"/><color rgb="FF13233F"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="10.5"/><color rgb="FF166534"/><name val="Calibri"/></font>' +
    '<font><sz val="9.5"/><color rgb="FF6B7280"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="10.5"/><color rgb="FFB91C1C"/><name val="Calibri"/></font>' +
    '</fonts>' +
    '<fills count="4"><fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF13233F"/><bgColor indexed="64"/></patternFill></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FFEEF2F8"/><bgColor indexed="64"/></patternFill></fill>' +
    '</fills>' +
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' +
    '<border><left style="thin"><color rgb="FFD6DCE6"/></left><right style="thin"><color rgb="FFD6DCE6"/></right>' +
    '<top style="thin"><color rgb="FFD6DCE6"/></top><bottom style="thin"><color rgb="FFD6DCE6"/></bottom>' +
    '<diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="11">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="165" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="164" fontId="3" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="2" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
    '<xf numFmtId="164" fontId="2" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="165" fontId="2" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="4" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="164" fontId="5" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="right" vertical="center"/></xf>' +
    '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  function colName(i) {
    var s = '';
    for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
    return s;
  }
  function sheetXml(sh) {
    var cols = '<cols>' + sh.cols.map(function (c, i) {
      return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + c.w + '" customWidth="1"/>';
    }).join('') + '</cols>';
    var rows = sh.rows.map(function (row, ri) {
      var cells = row.map(function (c, ci) {
        if (c == null || c.v === '' || c.v === null || c.v === undefined)
          return '<c r="' + colName(ci) + (ri + 1) + '" s="' + (c && c.s != null ? c.s : 0) + '"/>';
        var ref = colName(ci) + (ri + 1), st = c.s != null ? c.s : 0;
        if (typeof c.v === 'number')
          return '<c r="' + ref + '" s="' + st + '"><v>' + c.v + '</v></c>';
        return '<c r="' + ref + '" s="' + st + '" t="inlineStr"><is><t xml:space="preserve">'
          + xesc(c.v) + '</t></is></c>';
      }).join('');
      return '<row r="' + (ri + 1) + '"' + (sh.hRows && sh.hRows[ri] ? ' ht="' + sh.hRows[ri] + '" customHeight="1"' : '') + '>' + cells + '</row>';
    }).join('');
    var last = colName(sh.cols.length - 1) + sh.rows.length;
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' +
      '<dimension ref="A1:' + last + '"/>' +
      '<sheetViews><sheetView showGridLines="0"' + (sh.first ? ' tabSelected="1"' : '') + ' workbookViewId="0">' +
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' + cols +
      '<sheetData>' + rows + '</sheetData>' +
      '<autoFilter ref="A1:' + colName(sh.cols.length - 1) + sh.rows.length + '"/>' +
      '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>' +
      '<pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/>' +
      '</worksheet>';
  }
  function saveXlsx(sheets, filename) {
    var files = [
      { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        sheets.map(function (s, i) {
          return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
        }).join('') +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        '</Types>' },
      { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>' },
      { name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
        'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
        sheets.map(function (s, i) {
          return '<sheet name="' + xesc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
        }).join('') + '</sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        sheets.map(function (s, i) {
          return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
        }).join('') +
        '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        '</Relationships>' },
      { name: 'xl/styles.xml', data: XSTYLES }
    ];
    sheets.forEach(function (s, i) {
      files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: sheetXml(s) });
    });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(zip(files));
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function W(a){ return a.map(function(w){ return {w:w}; }); }
  function orderRows(list) {
    var head = ['Позиция','Ед.','Остаток','Расход в день','Хватит, дней','Срок поставки, дн',
                'Заказать','Цена, ₸','Сумма, ₸','Где лежит'];
    var rows = [head.map(function(h){ return {v:h,s:1}; })];
    list.forEach(function (i) {
      rows.push([{v:i.n,s:2},{v:i.u,s:2},{v:+i.stock.toFixed(2),s:3},{v:+i.perD.toFixed(1),s:3},
        {v:i.days==null?'':+i.days.toFixed(1),s:i.days!=null&&i.days<i.lead?10:3},{v:i.lead,s:3},
        {v:Math.round(i.order),s:10},{v:Math.round(i.price),s:3},{v:Math.round(i.orderSum),s:10},
        {v:Object.keys(i.st).map(function(s){return s+' — '+f1(i.st[s][0]);}).join('; '),s:9}]);
    });
    rows.push([{v:'Итого',s:6},{v:'',s:6},{v:'',s:6},{v:'',s:6},{v:'',s:6},{v:'',s:6},
      {v:'',s:6},{v:'',s:6},{v:Math.round(list.reduce(function(s,i){return s+i.orderSum;},0)),s:7},{v:'',s:6}]);
    return rows;
  }
  function xlsxOrder(sup, list) {
    saveXlsx([{ name:'Заявка', first:true, rows:orderRows(list),
      cols:W([44,7,11,12,11,12,11,10,13,40]), hRows:{0:30} }],
      'Заявка ' + sup.replace(/[\\/:*?"<>|]/g,'') + ' ' + dmy(TH).replace(/\./g,'-') + '.xlsx');
  }
  function xlsxAll() {
    var h = hot();
    var s1 = { name:'Заявка', first:true, rows:orderRows(h), cols:W([44,7,11,12,11,12,11,10,13,40]), hRows:{0:30} };

    var used = STORES.filter(function(s){ return IT.some(function(i){ return i.st[s]; }); });
    var h2 = ['Позиция','Ед.'].concat(used).concat(['Всего','Сумма, ₸','Статус']);
    var r2 = [h2.map(function(x){ return {v:x,s:1}; })];
    IT.filter(function(i){ return i.stock>0; }).sort(function(a,b){ return b.stSum-a.stSum; })
      .forEach(function (i) {
        r2.push([{v:i.n,s:2},{v:i.u,s:2}].concat(used.map(function(s){
          return {v: i.st[s] ? +i.st[s][0].toFixed(2) : '', s:3}; }))
          .concat([{v:+i.stock.toFixed(2),s:3},{v:Math.round(i.stSum),s:3},{v:i.st_,s:2}]));
      });
    var s2 = { name:'Остатки по складам', rows:r2,
      cols:W([44,7].concat(used.map(function(){return 15;})).concat([12,13,17])), hRows:{0:30} };

    var h3 = ['Позиция','Ед.','Поставщик','Остаток','Расход в день','Хватит, дней','Заказать',
              'Цена, ₸','Лежит, ₸','Последнее движение','Статус'];
    var r3 = [h3.map(function(x){ return {v:x,s:1}; })];
    IT.forEach(function (i) {
      r3.push([{v:i.n,s:2},{v:i.u,s:2},{v:i.sups.join(', '),s:9},{v:+i.stock.toFixed(2),s:3},
        {v:+i.perD.toFixed(1),s:3},{v:i.days==null?'':+i.days.toFixed(1),s:3},
        {v:Math.round(i.order),s:i.order?10:3},{v:Math.round(i.price),s:3},{v:Math.round(i.stSum),s:3},
        {v:i.last||'',s:2},{v:i.st_,s:2}]);
    });
    var s3 = { name:'Вся упаковка', rows:r3, cols:W([44,7,30,11,12,11,11,10,12,14,18]), hRows:{0:30} };
    saveXlsx([s1,s2,s3], 'Упаковка ' + dmy(TH).replace(/\./g,'-') + '.xlsx');
  }

  /* ── ЗАПУСК ────────────────────────────────────────────────────── */
  function redraw(){ calc(); head(); secOrd(); secMx(); secAll(); secDead(); }
  ['p-lead','p-long','p-safe','p-cov'].forEach(function (id) {
    document.getElementById(id).oninput = function () {
      P.lead = +document.getElementById('p-lead').value || 7;
      P.long = +document.getElementById('p-long').value || 10;
      P.safe = +document.getElementById('p-safe').value || 0;
      P.cov  = +document.getElementById('p-cov').value  || 30;
      redraw();
    };
  });
  document.getElementById('q').oninput = function () { secOrd(); secMx(); secAll(); secDead(); };
  document.getElementById('xls').onclick = xlsxAll;
  document.querySelectorAll('#tabs .tab').forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll('#tabs .tab').forEach(function(x){ x.classList.remove('on'); });
      document.querySelectorAll('.sec').forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      document.getElementById('s-' + t.getAttribute('data-s')).classList.add('on');
    };
  });
  redraw();
})();
