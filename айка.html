<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070c17; --card:#0d1526; --line:#1c2740; --line2:#26334d;
  --ink:#eef3fb; --ink2:#c3d0e2; --mut:#7b8ca6; --dim:#546279;

}
body{font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(940px 520px at 8% -10%, rgba(47,163,154,.16), transparent 60%),

.wrap{max-width:1420px;margin:0 auto;padding:0 20px 60px}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 0 10px;flex-wrap:wrap}
.backbtn{background:#101a2f;border:1px solid var(--line2);color:var(--ink2);border-radius:11px;
  padding:8px 14px;font-size:12.5px;font-weight:700;text-decoration:none;transition:.15s}

.live{margin-left:auto;background:rgba(47,163,154,.12);border:1px solid rgba(47,163,154,.4);
  color:#5eead4;border-radius:999px;padding:7px 15px;font-size:11.5px;font-weight:800}
.card{background:linear-gradient(180deg,#111c31,#0e1728);border:1px solid var(--line);
  border-radius:18px;padding:18px 20px;margin-bottom:14px}

.hint{font-size:12px;color:var(--mut);line-height:1.65;max-width:1000px}
.hero{background:linear-gradient(135deg,#0f2a2e,#0d1526 60%);border:1px solid var(--line);
  border-radius:20px;padding:22px 24px;margin:6px 0 14px;display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.hero .big{font-size:40px;font-weight:900;letter-spacing:-1.6px;line-height:1;
  font-variant-numeric:tabular-nums}
.hero .lab{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#5eead4}
.hero .sub{font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.7;max-width:640px}

.hs{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.hs>div{background:#0b1322;border:1px solid var(--line);border-radius:13px;padding:11px 15px;min-width:132px}
.hs .v{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.hs .l{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;margin:14px 0}
.kpi{background:linear-gradient(180deg,#111c31,#0e1728);border:1px solid var(--line);border-radius:15px;
  padding:13px 15px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#334155)}
.kpi .l{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.kpi .v{font-size:23px;font-weight:900;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.55}
.ins{background:#0b1322;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:14px}
.ins>div{font-size:12.5px;color:var(--ink2);line-height:1.8;padding-left:19px;position:relative}
.ins>div:before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%;
  background:var(--d,#2fa39a)}
.ins b{color:#fcd34d}.ins i{font-style:normal;color:#fff;font-weight:700}
.ins .ok{color:var(--mut)}.ins .ok b{color:#86efac}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 14px}
.tab{background:#101a2f;border:1px solid var(--line2);color:var(--ink2);border-radius:11px;padding:9px 15px;

.tab.on{background:linear-gradient(135deg,#2fa39a,#14615f);border-color:transparent;color:#021715;
  box-shadow:0 0 22px -8px rgba(47,163,154,.9)}
.tab b{margin-left:6px;opacity:.75}
.sec{display:none}.sec.on{display:block}
.tw{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:720px}
thead th{position:sticky;top:0;z-index:5;background:#0e1830;color:var(--ink2);font-size:10px;
  font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;text-align:right;
  border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
thead th.nm{text-align:left}
thead th.on{color:#5eead4}
tbody td{padding:7px 10px;text-align:right;border-bottom:1px solid rgba(28,39,64,.7);
  font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td.nm{text-align:left;white-space:normal;min-width:210px;font-weight:700}
tbody tr:hover{background:rgba(47,163,154,.06)}
tbody tr.op{background:rgba(47,163,154,.09)}
tfoot td{padding:9px 10px;text-align:right;font-weight:800;background:#0d1526;border-top:1px solid var(--line2);
  font-variant-numeric:tabular-nums}
tfoot td.nm{text-align:left}
tbody td.dtl{text-align:left;padding:0;white-space:normal}
.dtl .in{padding:11px 14px 14px;position:sticky;left:0;max-width:1080px}
.sub-t{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.chip{display:inline-block;background:#15223a;border:1px solid var(--line2);border-radius:8px;
  padding:3px 9px;font-size:11px;color:var(--ink2);margin:2px 4px 2px 0;line-height:1.6}
.chip.add{border-color:rgba(74,222,128,.45);color:#bbf7d0}
.chip.rem{border-color:rgba(248,113,113,.45);color:#fecaca}
.chip.chg{border-color:rgba(251,191,36,.45);color:#fde68a}
.run{border-left:2px solid var(--line2);padding:2px 0 2px 13px;margin:0 0 14px}
.run-h{font-size:12.5px;font-weight:800;color:#fcd34d;margin-bottom:6px}
.bars{display:flex;gap:2px;align-items:flex-end;height:92px;margin:14px 0 4px;overflow-x:auto}
.bars .b{flex:1;min-width:13px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:4px;height:100%}
.bars .b i{display:block;width:100%;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#2fa39a,#14615f);
  min-height:2px}
.bars .b.hot i{background:linear-gradient(180deg,#fbbf24,#b45309)}
.bars .b span{font-size:8.5px;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg);
  white-space:nowrap}
.pos{color:#86efac}.neg{color:#fca5a5}.zero{color:#3d4a60}
.q{background:#0d1626;border:1px solid var(--line2);border-radius:11px;color:var(--ink);
  padding:9px 13px;font:inherit;font-size:12.5px;width:100%;max-width:320px}
.q:focus{outline:0;border-color:#2fa39a}
.btn{background:#16233c;border:1px solid var(--line2);color:var(--ink2);border-radius:10px;padding:8px 14px;
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.btn:hover{background:#1e2f4d;color:#fff}
.btn.on{background:linear-gradient(135deg,#2fa39a,#14615f);border-color:transparent;color:#021715}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.wf{display:flex;gap:6px;align-items:flex-end;height:190px;margin:18px 0 6px;overflow-x:auto;padding-bottom:4px}
.wf .c{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;
  justify-content:flex-end}
.wf .bar{width:100%;border-radius:6px 6px 0 0;position:relative;min-height:2px;transition:.2s}
.wf .up{background:linear-gradient(180deg,#4ade80,#16a34a)}
.wf .dn{background:linear-gradient(180deg,#f87171,#b91c1c)}
.wf .v{font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.wf .m{font-size:10px;color:var(--mut);font-weight:700}
.wf .bl{font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.warn{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.32);border-radius:13px;
  padding:12px 15px;font-size:12.5px;color:#fecaca;line-height:1.7;margin-top:12px}
.warn b{color:#fff}
.good{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.28);border-radius:13px;
  padding:12px 15px;font-size:12.5px;color:#bbf7d0;line-height:1.7;margin-top:12px}
.good b{color:#fff}
.st{display:inline-block;padding:2px 8px;border-radius:6px;font-size:9.5px;font-weight:800;margin-left:7px;
  letter-spacing:.02em;vertical-align:1px}
.s-cash{background:rgba(47,163,154,.2);color:#5eead4}
.s-a{background:rgba(96,165,250,.16);color:#93c5fd}
.s-l{background:rgba(245,158,11,.16);color:#fcd34d}
.s-e{background:rgba(167,139,250,.18);color:#c4b5fd}
.s-ie{background:rgba(148,163,184,.14);color:#cbd5e1}
.sub2{font-size:10px;color:var(--dim);font-weight:400;margin-top:2px;line-height:1.4}
.empty{padding:28px 6px;color:var(--dim);font-size:12.5px;line-height:1.7}
.foot{text-align:center;color:var(--dim);font-size:11.5px;padding:26px 0 10px;line-height:1.8}
@media(max-width:700px){.wrap{padding:0 13px 40px}.hero{padding:16px}.hero .big{font-size:30px}}
</style></head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backbtn" href="index.html">← Пульс</a>
    <div><h1>🧿 Айка</h1><p id="sub">—</p></div>
    <div class="live" id="live">—</div>
  </div>
  <div id="app"></div>
</div>

<script>
(function(){
var D = window.AIKA || null;
var app = document.getElementById('app');
if (!D) { app.innerHTML = '<div class="card"><div class="hint">Данные ещё не собраны. '
  + 'Сборщик «Айка» ходит в iiko каждые три часа.</div></div>'; return; }

/* ── мелочь ─────────────────────────────────────────────────────────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function f0(x){ if(x==null||!isFinite(x)) return '—';
  var n = Math.round(x), s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (n<0?'−':'') + s; }
function sg(x){ if(!isFinite(x)) return '—'; return (x>0?'+':'') + f0(x); }
function fm(x){ var a=Math.abs(x);
  if(a>=1e9) return (x/1e9).toFixed(2).replace('.',',')+' млрд';
  if(a>=1e6) return (x/1e6).toFixed(1).replace('.',',')+' млн';
  if(a>=1e3) return Math.round(x/1e3)+' тыс';
  return f0(x); }
function plw(n,a,b,c){ var m=n%100; if(m>=11&&m<=14) return c; m=n%10;
  return m===1?a:(m>=2&&m<=4)?b:c; }
var MN = ['','января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MS = ['','янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function mlab(mk){ return MS[+mk.slice(5,7)] + '.' + mk.slice(2,4); }
function dmy(s){ return /^\d{4}-\d{2}-\d{2}/.test(s||'') ? s.slice(0,10).split('-').reverse().join('.') : (s||'—'); }
function dlong(s){ var p=(s||'').slice(0,10).split('-'); return p.length===3 ? (+p[2])+' '+MN[+p[1]]+' '+p[0] : s; }

var M = D.closedMonths || [], ACC = D.accounts || [], CF = D.cf || [];
var CASH = {};  ACC.forEach(function(a){ if(a.cf===1 && a.type==='CASH') CASH[a.name]=a; });
var CASHN = Object.keys(CASH);
function sumM(m, keys){ var i=0,o=0; (keys||M).forEach(function(k){ var v=m[k]; if(v){ i+=v[0]; o+=v[1]; } });
  return [i,o]; }
function accTot(a){ return sumM(a.m); }
var INTRE = /^1\s*внутренние/i;

/* ── агрегаты ───────────────────────────────────────────────────────── */
var cashOpen = CASHN.reduce(function(s,n){ return s + (CASH[n].open||0); }, 0);
var cashIn = 0, cashOut = 0;
CASHN.forEach(function(n){ var t = accTot(CASH[n]); cashIn += t[0]; cashOut += t[1]; });
var cashEnd = cashOpen + cashIn - cashOut;

var cfCash = CF.filter(function(r){ return CASH[r.acc]; });
function cfAgg(rows, keys){
  var g = {};
  rows.forEach(function(r){
    var k = r.cat || '— без статьи —';
    var a = g[k] || (g[k] = {cat:k, ct:r.ct, l1:r.l1, i:0, o:0, m:{}, acc:{}});
    (keys||M).forEach(function(mk){ var v = r.m[mk]; if(!v) return;
      a.i += v[0]; a.o += v[1];
      var p = a.m[mk] || [0,0]; a.m[mk] = [p[0]+v[0], p[1]+v[1]];
      var q = a.acc[r.acc] || [0,0]; a.acc[r.acc] = [q[0]+v[0], q[1]+v[1]]; });
  });
  return Object.keys(g).map(function(k){ return g[k]; });
}
var CFA = cfAgg(cfCash).sort(function(a,b){ return (b.i+b.o)-(a.i+a.o); });
var intRow = CFA.filter(function(r){ return INTRE.test(r.cat); });
var intNet = intRow.reduce(function(s,r){ return s + r.i - r.o; }, 0);
var opRows = CFA.filter(function(r){ return !INTRE.test(r.cat); });
var opIn = opRows.reduce(function(s,r){ return s+r.i; }, 0);
var opOut = opRows.reduce(function(s,r){ return s+r.o; }, 0);

/* помесячный остаток денег */
var MB = [], bal = cashOpen;
M.forEach(function(mk){
  var i=0,o=0,ii=0,io=0;
  cfCash.forEach(function(r){ var v=r.m[mk]; if(!v) return;
    if (INTRE.test(r.cat)) { ii+=v[0]; io+=v[1]; } else { i+=v[0]; o+=v[1]; } });
  bal += (i+ii)-(o+io);
  MB.push({m:mk, i:i, o:o, net:i-o, intn:ii-io, bal:bal});
});

/* сходимость Дт/Кт по месяцам */
var BAL = M.map(function(mk){
  var i=0,o=0; ACC.forEach(function(a){ var v=a.m[mk]; if(v){ i+=v[0]; o+=v[1]; } });
  return {m:mk, i:i, o:o, d:i-o};
});
var balOk = BAL.every(function(x){ return Math.abs(x.d) < 1; });
var grossIn = BAL.reduce(function(s,x){ return s+x.i; }, 0);

/* неденежные счета, на которых стоит «внутренний оборот» */
var intAlien = CF.filter(function(r){ return INTRE.test(r.cat) && !CASH[r.acc]; })
  .map(function(r){ var t = sumM(r.m); return {acc:r.acc, i:t[0], o:t[1], net:t[0]-t[1]}; })
  .filter(function(x){ return Math.abs(x.net) > 0.5; })
  .sort(function(a,b){ return Math.abs(b.net)-Math.abs(a.net); });

/* денежные счета с минусом на конец */
var negCash = CASHN.map(function(n){ var a=CASH[n], t=accTot(a);
  return {n:n, end:a.open+t[0]-t[1], i:t[0], o:t[1], open:a.open}; })
  .filter(function(x){ return x.end < -0.5; });

/* денежные обороты без статьи ДДС */
var noCat = cfCash.filter(function(r){ return !(r.cat||'').trim(); })
  .map(function(r){ var t=sumM(r.m); return {acc:r.acc, i:t[0], o:t[1]}; })
  .filter(function(x){ return x.i || x.o; });

/* капитал двигали внутри года */
var eq = ACC.filter(function(a){ return a.grp==='EQUITY'; })
  .map(function(a){ var t=accTot(a); return {n:a.name, i:t[0], o:t[1]}; })
  .filter(function(x){ return x.i || x.o; });

/* недостачи против излишков — пересортица */
function byName(re){ return ACC.filter(function(a){ return re.test(a.name); }); }
var nedo = byName(/недостач/i), izl = byName(/излишк/i);
var nedoS = nedo.reduce(function(s,a){ return s + accTot(a)[0]; }, 0);
var izlS  = izl.reduce(function(s,a){ return s + accTot(a)[1]; }, 0);

var FIX = D.fixes || [], EV = D.events || [];
var minBal = MB.reduce(function(a,b){ return b.bal < a.bal ? b : a; }, MB[0] || {bal:0, m:''});

/* ── шапка ──────────────────────────────────────────────────────────── */
document.getElementById('sub').textContent =
  'Закрытый период: 01.01.' + D.year + ' — ' + dmy(D.closed)
  + ' · ' + ACC.length + ' ' + plw(ACC.length,'счёт','счёта','счетов')
  + ' · обновлено ' + D.updated;
document.getElementById('live').textContent = FIX.length
  ? '⚠ правок задним числом: ' + FIX.length
  : '✓ закрытый период не трогали';

function hero(){
  return '<div class="hero"><div>'
    + '<div class="lab">Деньги на конец закрытого периода</div>'
    + '<div class="big">' + f0(cashEnd) + ' ₸</div>'
    + '<div class="sub">На 1 января на счетах и в кассах лежало <b>' + f0(cashOpen) + ' ₸</b>. '
    + 'За ' + M.length + ' ' + plw(M.length,'месяц','месяца','месяцев') + ' пришло <b>' + fm(opIn) + ' ₸</b>, '
    + 'ушло <b>' + fm(opOut) + ' ₸</b> — деньги '
    + (cashEnd >= cashOpen ? 'выросли' : 'уменьшились') + ' на <b>' + f0(Math.abs(cashEnd-cashOpen)) + ' ₸</b>. '
    + 'Самый низкий остаток был в конце ' + MN[+String(minBal.m||'2026-01').slice(5,7)] + ' — ' + f0(minBal.bal) + ' ₸.</div></div>'
    + '<div class="hs">'
    + '<div><div class="v">' + fm(opIn) + '</div><div class="l">пришло, ₸</div></div>'
    + '<div><div class="v">' + fm(opOut) + '</div><div class="l">ушло, ₸</div></div>'
    + '<div><div class="v ' + (cashEnd-cashOpen>=0?'pos':'neg') + '">' + sg(cashEnd-cashOpen) + '</div>'
    + '<div class="l">изменение, ₸</div></div></div></div>';
}

function kpis(){
  return '<div class="kpis">'
    + '<div class="kpi" style="--c:#2fa39a"><div class="l">Счетов в обороте</div><div class="v">' + ACC.length + '</div>'
    + '<div class="s">' + CASHN.length + ' денежных · ' + (ACC.length-CASHN.length) + ' прочих</div></div>'
    + '<div class="kpi" style="--c:#22d3ee"><div class="l">Обороты за период</div><div class="v">' + fm(grossIn) + ' ₸</div>'
    + '<div class="s">' + (balOk ? 'дебет равен кредиту во всех ' + M.length + ' месяцах' : 'дебет и кредит расходятся — смотрите «Контроль»') + '</div></div>'
    + '<div class="kpi" style="--c:' + (FIX.length?'#f87171':'#4ade80') + '"><div class="l">Правки задним числом</div><div class="v">' + FIX.length + '</div>'
    + '<div class="s">обороты закрытых месяцев сверяются каждые 3 часа</div></div>'
    + '<div class="kpi" style="--c:#a78bfa"><div class="l">Журнал айко</div><div class="v">' + f0(D.evTotal||0) + '</div>'
    + '<div class="s">действий ' + (D.evFrom ? 'с ' + dmy(D.evFrom) : '') + ' — айко хранит сутки, мы копим</div></div>'
    + '</div>';
}

function insights(){
  var L = [];
  if (Math.abs(intNet) > 0.5)
    L.push(['#f87171','Внутренние переводы не схлопываются: по денежным счетам они дают <b>' + sg(intNet)
      + ' ₸</b>, хотя перевод со своего счёта на свой обязан давать ноль. Разницу забрали '
      + intAlien.length + ' ' + plw(intAlien.length,'неденежный счёт','неденежных счёта','неденежных счетов')

/* ── вкладки ────────────────────────────────────────────────────────── */

/* 1 — ДДС */

      + '<td class="' + (r.o?'neg':'zero') + '">' + (r.o?f0(r.o):'—') + '</td>'
      + '<td style="font-weight:800" class="' + (n>=0?'pos':'neg') + '">' + sg(n) + '</td>'

    + '<div class="hint">Движение считается по 22 денежным счетам — кассам и банковским счетам завода. '
    + 'Статьи берутся из айко как есть; «внутренние обороты» — это переводы между своими счетами, '
    + 'в чистом ДДС их быть не должно.</div>'
    + wf + tcards + chk + '</div>'
    + '<div class="card"><div class="row">'
    + '<button class="btn' + (SCOPE==='op'?' on':'') + '" data-sc="op">Без внутренних переводов</button>'

    + '<div class="tw"><table><thead>' + head + '</thead><tbody>' + body
    + '</tbody><tfoot><tr><td class="nm">Итого — ' + rows.length + ' '
    + plw(rows.length,'статья','статьи','статей') + '</td><td class="pos">' + f0(ti) + '</td>'
    + '<td class="neg">' + f0(to) + '</td><td class="' + (ti-to>=0?'pos':'neg') + '">' + sg(ti-to) + '</td>'

        return '<td class="' + (d>=0?'pos':'neg') + '">' + sg(d) + '</td>'; }).join('')
    + '</tr></tfoot></table></div></div>';

      + esc(a.name)

      + '<span class="st ' + (GCLS[a.grp]||'s-ie') + '">' + (GRU[a.grp]||a.grp) + '</span>'

      + '<td>' + (r.o?f0(r.o):'<span class="zero">—</span>') + '</td>'

        + '<div class="tw" style="margin:0"><table style="min-width:620px"><thead><tr><th class="nm">Месяц</th>'
        + '<th>Дебет</th><th>Кредит</th><th>Оборот нетто</th><th>Сальдо на конец</th></tr></thead><tbody>'
        + M.map(function(mk){ var v = a.m[mk] || [0,0]; b += v[0]-v[1];
            return '<tr><td class="nm">' + mlab(mk) + '</td><td>' + (v[0]?f0(v[0]):'<span class="zero">—</span>')

              + '<td class="' + (v[0]-v[1]>=0?'pos':'neg') + '">' + sg(v[0]-v[1]) + '</td>'
              + '<td style="font-weight:700">' + f0(b) + '</td></tr>'; }).join('')
        + '</tbody></table></div></div></td></tr>';
    }
    return tr; }).join('');
  return '<div class="card"><div class="card-t">📒 Все счета закрытого периода</div>'
    + '<div class="hint">Обороты за 01.01.' + D.year + ' — ' + dmy(D.closed)
    + '. «На 01.01» — входящее сальдо, посчитанное по всей истории до начала года. '

    + 'Поэтому «Айка» ходит за ним каждые три часа и складывает к себе: '
    + '<b>' + f0(D.evTotal||0) + '</b> ' + plw(D.evTotal||0,'действие','действия','действий')
    + (D.evFrom ? ' с ' + dlong(D.evFrom) : '') + '. Репликацию и выгрузки не копим — только то, '
    + 'что меняет учёт.</div>'
    + '<div class="row" style="margin-top:13px">'
    + '<button class="btn' + (EVU===''?' on':'') + '" data-u="">Все люди</button>'
    + ub.map(function(u){ return '<button class="btn' + (EVU===u?' on':'') + '" data-u="' + esc(u) + '">'
        + esc(u) + ' · ' + users[u] + '</button>'; }).join('') + '</div>'
    + '<div class="row">'
    + '<button class="btn' + (EVT===''?' on':'') + '" data-e="">Все действия</button>'
    + tb.map(function(t){ return '<button class="btn' + (EVT===t?' on':'') + '" data-e="' + esc(t) + '">'
        + esc(EVRU[t]||t) + ' · ' + types[t] + '</button>'; }).join('')
    + '<input class="q" id="q" placeholder="🔍 человек, номер, документ…" value="' + esc(Q) + '"></div>'
    + (rows.length ? '<div class="tw"><table><thead><tr><th class="nm">Когда</th><th class="nm">Что</th>'
      + '<th class="nm">Документ</th><th>Номер</th><th class="nm">Кто</th></tr></thead><tbody>' + body
      + '</tbody></table></div>' + (rows.length>600 ? '<div class="hint" style="margin-top:8px">Показаны последние 600 из '
      + f0(rows.length) + '.</div>' : '')
      : '<div class="empty">Пока ничего не попало в этот отбор.</div>')
    + '</div>';
}

/* 5 — правки: отдельно счета, отдельно техкарты */
var FKIND = 'all', FSIG = 1000, FQ = '', FSUB = 'acc';

function fixSubs(){
  var nc = (D.chartFixes||[]).length;
  var t = [['acc','📊 По счетам', FIX.length], ['card','🧪 По техкартам', nc]];
  return '<div class="sub-t">' + t.map(function(x){
    return '<button class="btn' + (FSUB===x[0]?' on':'') + '" data-fs="' + x[0] + '">'
      + x[1] + ' · ' + f0(x[2]) + '</button>'; }).join('') + '</div>';
}

/* 5а — счета */
function fixAcc(){
  if (!FIX.length)
    return '<div class="card"><div class="card-t">📊 Правки по счетам</div>'
      + '<div class="hint">Каждые три часа «Айка» снимает обороты по всем счетам за каждый закрытый месяц и '
      + 'сравнивает со снимком трёхчасовой давности. Если кто-то проведёт, изменит или удалит документ задним '
      + 'числом — оборот месяца сдвинется, и это попадёт сюда. Запись остаётся навсегда, даже если потом '
      + 'вернут как было.</div>'
      + '<div class="good"><b>Пока чисто.</b> Обороты закрытых месяцев ни разу не менялись.</div></div>';

  var rows = FIX.filter(function(f){
    var money = !!CASH[f.acc];
    if (FKIND === 'money' && !money) return false;
    if (FKIND === 'stock' && money) return false;
    if (Math.abs(f.di) < FSIG && Math.abs(f.do) < FSIG) return false;
    if (FQ && (f.acc + ' ' + f.m).toLowerCase().indexOf(FQ) < 0) return false;
    return true;
  });
  var money = FIX.filter(function(f){ return CASH[f.acc]; }).length;
  var runs = {};
  rows.forEach(function(f){ (runs[f.when] || (runs[f.when]=[])).push(f); });
  var keys = Object.keys(runs).sort().reverse();

  var byM = {};
  FIX.forEach(function(f){ byM[f.m] = (byM[f.m]||0)+1; });

  var head = '<div class="card"><div class="card-t">📊 Правки по счетам — ' + FIX.length + '</div>'
    + '<div class="hint">Обороты закрытых месяцев сверяются каждые три часа. Слежение идёт с '
    + dlong(D.fixFrom || D.today) + '. '
    + (money ? '<b style="color:#fca5a5">' + money + ' ' + plw(money,'правка','правки','правок')
        + ' на денежных счетах</b> — это самое серьёзное: двигали уже закрытые деньги. '
      : 'Денежные счета не трогали — двигались только склады и себестоимость, которые iiko пересчитывает '
        + 'задним числом сама, как только проводят документ или меняют техкарту. ')
    + 'Месяцы: ' + Object.keys(byM).sort().map(function(m){ return mlab(m) + ' — ' + byM[m]; }).join(', ') + '.</div>'
    + '<div class="row" style="margin-top:13px">'
    + [['all','Все'],['money','Только деньги'],['stock','Склады и себестоимость']].map(function(x){
        return '<button class="btn' + (FKIND===x[0]?' on':'') + '" data-fk="' + x[0] + '">' + x[1] + '</button>'; }).join('')
    + [[0,'Всё'],[1000,'от 1 000 ₸'],[100000,'от 100 000 ₸']].map(function(x){
        return '<button class="btn' + (FSIG===x[0]?' on':'') + '" data-fv="' + x[0] + '">' + x[1] + '</button>'; }).join('')
    + '<input class="q" id="q" placeholder="🔍 счёт…" value="' + esc(FQ) + '">'
    + '</div>';

  if (!rows.length)
    return head + '<div class="empty">В этом отборе правок нет.</div></div>';

  var body = keys.slice(0, 40).map(function(w){
    var g = runs[w].slice().sort(function(a,b){
      return (Math.abs(b.di)+Math.abs(b.do)) - (Math.abs(a.di)+Math.abs(a.do)); });
    return '<div class="run"><div class="run-h">' + esc(w.replace('T',' ').slice(0,16)) + ' — '
      + g.length + ' ' + plw(g.length,'изменение','изменения','изменений') + '</div>'
      + '<div class="tw" style="margin-top:0"><table style="min-width:640px"><thead><tr>'
      + '<th class="nm">Счёт</th><th>Месяц</th><th>Δ дебет</th><th>Δ кредит</th>'
      + '<th>Оборот стал</th></tr></thead><tbody>'
      + g.map(function(f){
          return '<tr><td class="nm">' + esc(f.acc)
            + (CASH[f.acc] ? '<span class="st s-cash">деньги</span>' : '') + '</td>'
            + '<td>' + mlab(f.m) + '</td>'
            + '<td class="' + (f.di>=0?'pos':'neg') + '">' + (f.di?sg(f.di):'—') + '</td>'
            + '<td class="' + (f.do>=0?'pos':'neg') + '">' + (f.do?sg(f.do):'—') + '</td>'
            + '<td>' + f0(f.now[0]) + ' / ' + f0(f.now[1]) + '</td></tr>'; }).join('')
      + '</tbody></table></div></div>'; }).join('');
  return head + body + (keys.length>40 ? '<div class="hint">Показаны последние 40 сверок.</div>' : '') + '</div>';
}

/* 5б — технологические карты */
function fixCard(){
  var C = D.charts || {}, CFX = D.chartFixes || [];
  var bm = C.byMonth || {}, mk = Object.keys(bm).sort().slice(-30);
  var mx = Math.max.apply(null, mk.map(function(k){ return bm[k]; }).concat([1]));
  var cl0 = (D.closedMonths||[])[0] || '', cl1 = (D.closedMonths||[])[(D.closedMonths||[]).length-1] || '';
  var bars = '<div class="bars">' + mk.map(function(k){
    var hot = k >= cl0 && k <= cl1;
    return '<div class="b' + (hot?' hot':'') + '" title="' + k + ': ' + bm[k] + '">'
      + '<i style="height:' + Math.max(2, Math.round(bm[k]/mx*66)) + 'px"></i>'
      + '<span>' + mlab(k) + '</span></div>'; }).join('') + '</div>';

  var inC = (C.inClosedTop||[]).filter(function(x){
    return !FQ || x.dish.toLowerCase().indexOf(FQ) >= 0; });

  var kpi = '<div class="kpis">'
    + '<div class="kpi" style="--c:#2fa39a"><div class="l">Действующих карт</div><div class="v">' + f0(C.eff||0) + '</div>'
    + '<div class="s">всего версий за всё время — ' + f0(C.versions||0) + '</div></div>'
    + '<div class="kpi" style="--c:#fbbf24"><div class="l">Начали действовать внутри периода</div>'
    + '<div class="v">' + f0(C.inClosed||0) + '</div>'
    + '<div class="s">карт с датой начала между 01.01 и ' + dmy(D.closed)
    + ' — себестоимость закрытых месяцев считалась по ним</div></div>'
    + '<div class="kpi" style="--c:' + (CFX.length?'#f87171':'#4ade80') + '"><div class="l">Правок карт</div>'
    + '<div class="v">' + f0(CFX.length) + '</div>'
    + '<div class="s">замечено с ' + dmy(D.cfixFrom || D.today) + '</div></div>'
    + '<div class="kpi" style="--c:#a78bfa"><div class="l">Карт без состава</div>'
    + '<div class="v">' + f0((C.empty||[]).length) + '</div>'
    + '<div class="s">обычно это услуги и нетоварные позиции</div></div></div>';

  var log = !CFX.length
    ? '<div class="good"><b>Карты не трогали.</b> С ' + dlong(D.cfixFrom || D.today)
      + ' состав действующих технологических карт не менялся.</div>'
    : CFX.slice().reverse().slice(0, 300).map(function(f){
        var KR = {'new':'новая карта', 'changed':'состав переписан', 'gone':'карта снята'};
        return '<div class="run"><div class="run-h">' + esc(f.dish)
          + ' <span style="color:var(--mut);font-weight:600">· ' + (KR[f.kind]||f.kind)
          + ' · действует с ' + dmy(f.df) + (f.closed ? ' — внутри закрытого периода' : '')
          + ' · замечено ' + esc(f.when.replace('T',' ').slice(0,16)) + '</span></div>'
          + '<div style="font-size:12px;color:var(--ink2);line-height:1.8">'
          + 'строк в карте: ' + f.wasN + ' → ' + f.nowN
          + (f.dfWas && f.dfWas !== f.df ? ' · дата начала: ' + dmy(f.dfWas) + ' → ' + dmy(f.df) : '')
          + (f.outWas != null && f.out != null && f.outWas !== f.out
              ? ' · выход: ' + f.outWas + ' → ' + f.out : '') + '<br>'
          + (f.add||[]).map(function(n){ return '<span class="chip add">+ ' + esc(n) + '</span>'; }).join('')
          + (f.rem||[]).map(function(n){ return '<span class="chip rem">− ' + esc(n) + '</span>'; }).join('')
          + (f.chg||[]).map(function(c){ return '<span class="chip chg">' + esc(c[0]) + ': ' + c[1] + ' → ' + c[2] + '</span>'; }).join('')
          + '</div></div>'; }).join('');

  var inCTbl = inC.length
    ? '<div class="tw"><table style="min-width:560px"><thead><tr><th class="nm">Блюдо</th>'
      + '<th>Действует с</th><th>Строк в карте</th></tr></thead><tbody>'
      + inC.slice(0, 200).map(function(x){
          return '<tr><td class="nm">' + esc(x.dish) + '</td><td>' + dmy(x.df) + '</td>'
            + '<td>' + x.n + '</td></tr>'; }).join('')
      + '</tbody></table></div>'
      + ((C.inClosedTop||[]).length >= 200 ? '<div class="hint" style="margin-top:8px">'
          + 'Показаны 200 самых свежих из ' + f0(C.inClosed||0) + '.</div>' : '')
    : '<div class="empty">Ничего не нашлось.</div>';

  var multi = (C.multi||[]).length
    ? '<div class="tw"><table style="min-width:420px"><thead><tr><th class="nm">Блюдо</th>'
      + '<th>Версий карты</th></tr></thead><tbody>'
      + C.multi.map(function(x){ return '<tr><td class="nm">' + esc(x.dish) + '</td><td>' + x.n + '</td></tr>'; }).join('')
      + '</tbody></table></div>' : '';

  return '<div class="card"><div class="card-t">🧪 Технологические карты</div>'
    + '<div class="hint">Карта — это и есть себестоимость блюда. Её можно переписать или завести заново '
    + 'с датой начала внутри уже закрытого месяца, и себестоимость пересчитается задним числом — без единой '
    + 'проводки, поэтому по счетам такая правка не видна. «Айка» снимает состав всех действующих карт '
    + 'каждые три часа и сравнивает.</div>'
    + kpi
    + '<div class="card-t" style="margin-top:16px">Когда карты начали действовать</div>'
    + '<div class="hint">По месяцу начала действия, последние 30 месяцев. Жёлтым — закрытый период.</div>'
    + bars
    + '<div class="warn" style="background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.3);color:#fde68a">'
    + '<b>' + f0(C.inClosed||0) + ' ' + plw(C.inClosed||0,'карта начала','карты начали','карт начали')
    + ' действовать внутри закрытого периода.</b> Каждая такая карта меняет себестоимость того месяца, '
    + 'в котором она появилась: выпуск до неё посчитан по старому составу, после — по новому. '
    + 'Это не ошибка сама по себе, но объясняет, почему себестоимость закрытых месяцев «плывёт».</div>'
    + '</div>'
    + '<div class="card"><div class="card-t">Что менялось в картах</div>'
    + '<div class="hint">Состав действующих карт, строка за строкой: что добавили, что убрали, где поменяли '
    + 'количество.</div>' + log + '</div>'
    + '<div class="card"><div class="card-t">Карты, действующие с даты внутри закрытого периода — '
    + f0(C.inClosed||0) + '</div>'
    + '<div class="hint">Отсортированы от самых свежих. Карта с датой начала 30 сентября меняет '
    + 'себестоимость сентября.</div>'
    + '<div class="row" style="margin-top:12px"><input class="q" id="q" placeholder="🔍 блюдо…" value="' + esc(FQ) + '"></div>'
    + inCTbl + '</div>'
    + (multi ? '<div class="card"><div class="card-t">Чаще всего переписывали</div>'
        + '<div class="hint">Сколько версий карты накопилось у блюда за всю историю. Много версий — '
        + 'рецептуру постоянно правят, и сравнивать себестоимость по месяцам надо с оглядкой.</div>'
        + multi + '</div>' : '');
}

function secFix(){ return fixSubs() + (FSUB==='acc' ? fixAcc() : fixCard()); }

/* ── CSV ────────────────────────────────────────────────────────────── */
function csv(rows, name){
  var txt = '﻿' + rows.map(function(r){ return r.map(function(c){
    return /[;"\n]/.test(String(c)) ? '"' + String(c).replace(/"/g,'""') + '"' : c; }).join(';'); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/csv;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function dlCsv(){
  if (TAB === 'dds') {
    var rows = [['Статья','Тип','Пришло','Ушло','Итого'].concat(M.map(mlab))];
    (SCOPE==='all'?CFA:opRows).forEach(function(r){
      rows.push([r.cat, r.ct, Math.round(r.i), Math.round(r.o), Math.round(r.i-r.o)]
        .concat(M.map(function(mk){ var v=r.m[mk]; return v?Math.round(v[0]-v[1]):0; }))); });
    csv(rows, 'айка_ддс_' + D.year + '.csv');
  } else {
    var rows2 = [['Код','Счёт','Группа','Тип','В ДДС','На 01.01','Дебет','Кредит','На ' + dmy(D.closed)]
      .concat(M.map(function(mk){ return mlab(mk)+' Дт'; }))
      .concat(M.map(function(mk){ return mlab(mk)+' Кт'; }))];
    ACC.forEach(function(a){ var t = accTot(a);
      rows2.push([a.code, a.name, GRU[a.grp]||a.grp, a.type, a.cf?'да':'нет',
        Math.round(a.open), Math.round(t[0]), Math.round(t[1]), Math.round(a.open+t[0]-t[1])]
        .concat(M.map(function(mk){ return Math.round((a.m[mk]||[0,0])[0]); }))
        .concat(M.map(function(mk){ return Math.round((a.m[mk]||[0,0])[1]); }))); });
    csv(rows2, 'айка_счета_' + D.year + '.csv');
  }
}

/* ── отрисовка ──────────────────────────────────────────────────────── */
function draw(){
  app.innerHTML = hero() + kpis() + insights() + tabsHtml()
    + (TAB==='dds' ? secDds() : TAB==='cash' ? secCash() : TAB==='acc' ? secAcc()
       : TAB==='log' ? secLog() : secFix());

  app.querySelectorAll('#tabs .tab').forEach(function(b){
    b.onclick = function(){ TAB = b.getAttribute('data-t'); Q=''; OPEN=null; draw(); }; });
  var q = document.getElementById('q');
  if (q) q.oninput = function(){ var p = q.selectionStart;
    if (TAB === 'fix') FQ = q.value.trim().toLowerCase(); else Q = q.value.trim().toLowerCase();
    draw();
    var n = document.getElementById('q'); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } };
  var c = document.getElementById('csv'); if (c) c.onclick = dlCsv;
  app.querySelectorAll('[data-sc]').forEach(function(b){
    b.onclick = function(){ SCOPE = b.getAttribute('data-sc'); OPEN=null; draw(); }; });
  app.querySelectorAll('[data-g]').forEach(function(b){
    b.onclick = function(){ GRP = b.getAttribute('data-g'); OPEN=null; draw(); }; });
  app.querySelectorAll('[data-u]').forEach(function(b){
    b.onclick = function(){ EVU = b.getAttribute('data-u'); draw(); }; });
  app.querySelectorAll('[data-e]').forEach(function(b){
    b.onclick = function(){ EVT = b.getAttribute('data-e'); draw(); }; });
  app.querySelectorAll('[data-fs]').forEach(function(b){
    b.onclick = function(){ FSUB = b.getAttribute('data-fs'); FQ=''; draw(); }; });
  app.querySelectorAll('[data-fk]').forEach(function(b){
    b.onclick = function(){ FKIND = b.getAttribute('data-fk'); draw(); }; });
  app.querySelectorAll('[data-fv]').forEach(function(b){
    b.onclick = function(){ FSIG = +b.getAttribute('data-fv'); draw(); }; });
  app.querySelectorAll('tr.dr').forEach(function(t){
    t.onclick = function(){ var k = 'c:'+t.getAttribute('data-c'); OPEN = OPEN===k?null:k; draw(); }; });
  app.querySelectorAll('tr.ar').forEach(function(t){
    t.onclick = function(){ var k = 'a:'+t.getAttribute('data-a'); OPEN = OPEN===k?null:k; draw(); }; });
  app.querySelectorAll('thead th[data-k]').forEach(function(t){
    t.onclick = function(){ var k = t.getAttribute('data-k');
      if (SORT===k) DIR = -DIR; else { SORT = k; DIR = k==='name'?1:-1; } draw(); }; });
}
draw();
})();
</script>
