<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#1a1035;
  font-family:'Inter',system-ui,sans-serif;
  font-size:14px;min-height:100vh;color:#111827;
}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px;}


/* TOPBAR — как на ПУЛЬС */
.topbar{background:#fff;padding:16px 40px;display:flex;align-items:center;gap:20px;}
.topbar img{width:130px;height:130px;object-fit:contain;flex-shrink:0;}
.backbtn{display:inline-flex;align-items:center;flex-shrink:0;background:#f5f3ff;color:#7c3aed;
  border:1px solid #ddd6fe;font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:999px;
  text-decoration:none;transition:.18s;white-space:nowrap}
.backbtn:hover{background:#7c3aed;color:#fff;border-color:#7c3aed}

.topbar-text h1{font-size:20px;font-weight:800;color:#111827;letter-spacing:-.3px;}
.topbar-text p{font-size:12px;color:#6b7280;margin-top:3px;}
.topbar-right{margin-left:auto;text-align:right;}
.topbar .upd{font-size:11px;color:#6b7280;}
.topbar .live-dot2{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;
  color:#7c3aed;background:#f5f3ff;padding:4px 12px;border-radius:20px;border:1px solid #c4b5fd;margin-top:4px;}
.topbar .live-dot2::before{content:'';width:6px;height:6px;border-radius:50%;background:#7c3aed;
  box-shadow:0 0 8px rgba(124,58,237,.5);animation:pulse 1.5s ease infinite;}


/* ALERTS */
#alerts-bar{display:none;padding:10px 20px;gap:10px;flex-wrap:wrap;}
#alerts-bar.has-alerts{display:flex;}
.alert-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;
  border-radius:10px;font-size:12px;font-weight:700;border:1.5px solid;}
.alert-red{background:#fff1f2;color:#9f1239;border-color:#f43f5e;}
.alert-yellow{background:#fefce8;color:#854d0e;border-color:#eab308;}
.alert-green{background:#f0fdf4;color:#065f46;border-color:#10b981;}

/* LOADING */
#loading{text-align:center;padding:100px 20px;}
.spin{font-size:36px;animation:spin 1s linear infinite;display:inline-block;margin-bottom:16px;}
#loading p{font-size:15px;color:#6b7280;font-weight:500;}
@keyframes spin{to{transform:rotate(360deg)}}

.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#7c3aed;
  background:#f5f3ff;padding:5px 12px;border-radius:20px;border:1px solid #c4b5fd;}
.live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:#a78bfa;
  box-shadow:0 0 8px #a78bfa;animation:pulse 1.5s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi{
  background:#fff;border-radius:16px;padding:20px;
  box-shadow:0 2px 16px rgba(0,0,0,.25);
  position:relative;overflow:hidden;
}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0;}
.kpi-icon{font-size:24px;margin-bottom:10px;}
.kpi-lbl{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.kpi-val{font-size:26px;font-weight:900;color:#111827;}
.kpi-sub{font-size:11px;color:#9ca3af;margin-top:5px;}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.wtab{
  padding:9px 20px;border-radius:10px;border:1.5px solid #e5e7eb;
  background:#fff;color:#6b7280;cursor:pointer;font-weight:600;font-size:12px;
  transition:all .15s;letter-spacing:.01em;
}
.wtab:hover{border-color:#7c3aed;color:#7c3aed;background:#faf5ff;}
.wtab.active{background:#7c3aed;color:#fff;border-color:#7c3aed;
  box-shadow:0 4px 12px rgba(124,58,237,.35);}
.wtab.mtab.active{background:#0f766e;border-color:#0f766e;box-shadow:0 4px 12px rgba(15,118,110,.3);}

/* CARDS */
.card{background:#fff;border-radius:16px;padding:20px;
  box-shadow:0 2px 16px rgba(0,0,0,.25);margin-bottom:16px;}
.card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#6b7280;}
.card-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.chart-wrap{position:relative;height:260px;}
.donut-wrap{position:relative;height:230px;}

/* MINI KPI */
.mkpi{border-radius:12px;padding:16px;border:1.5px solid transparent;}
.mkpi-lbl{font-size:10px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.mkpi-val{font-size:22px;font-weight:900;}
.mk-inc{background:#fdfce8;border-color:#eab308;}.mk-inc .mkpi-val{color:#854d0e;}
.mk-exp{background:#fff1f2;border-color:#f43f5e;}.mk-exp .mkpi-val{color:#9f1239;}
.mk-bal-g{background:#f0fdf9;border-color:#10b981;}.mk-bal-g .mkpi-val{color:#065f46;}
.mk-bal-r{background:#fff1f2;border-color:#f43f5e;}.mk-bal-r .mkpi-val{color:#9f1239;}
.mk-cov{background:#f5f3ff;border-color:#7c3aed;}.mk-cov .mkpi-val{color:#4c1d95;}

/* BAR */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.bar-label{font-size:11px;color:#374151;min-width:140px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;}
.bar-track{flex:1;height:10px;background:#f3f4f6;border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.bar-val{font-size:11px;font-weight:700;min-width:54px;color:#374151;}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{border-bottom:2px solid #f3f4f6;}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.08em;}
td{padding:9px 12px;border-bottom:1px solid #f9fafb;color:#111827;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafafa;}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.02em;}
.bg-g{background:#dcfce7;color:#166534;}
.bg-r{background:#fee2e2;color:#991b1b;}
.bg-y{background:#fef9c3;color:#854d0e;}

.section{display:none;}.section.active{display:block;}
#dashboard{display:none;}
@media(max-width:900px){.grid2,.kpi-row{grid-template-columns:1fr 1fr;}.grid4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.kpi-row,.grid4{grid-template-columns:1fr;}.grid2{grid-template-columns:1fr;}}

/* таблицы плана по дням */
.dtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.dtbl th{background:#f8fafc;color:#475569;font-weight:800;font-size:10.5px;letter-spacing:.04em;
  text-transform:uppercase;padding:9px 10px;border-bottom:2px solid #e2e8f0;white-space:nowrap;text-align:left}
.dtbl td{padding:7px 10px;border-bottom:1px solid #f1f5f9;color:#1f2937;vertical-align:middle}
.dtbl td.num,.dtbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.dtbl tbody tr:hover{background:#f8fafc}
.dtbl tfoot td{padding:10px;border-top:2px solid #e2e8f0;font-weight:800;background:#f8fafc;
  text-align:right;font-variant-numeric:tabular-nums}
.dtbl tfoot td:first-child{text-align:left}
.dtbl tr.d-today{background:#faf5ff;box-shadow:inset 3px 0 0 #7c3aed}
.dtbl tr.d-today:hover{background:#f5edff}
.dtbl tr.d-wknd td{color:#94a3b8;background:#fcfcfd}
.dtbl tr.d-gap{background:#fff1f2}
.dtbl tr.d-gap:hover{background:#ffe4e6}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mut{color:#9ca3af;font-weight:500;font-size:11px}
.sub2{font-size:12px;color:#6b7280;line-height:1.55;margin:-4px 0 12px}
.nlist{margin:2px 0 0;padding-left:18px}
.nlist li{font-size:13px;color:#374151;line-height:1.7;margin-bottom:5px}
.badge.bg-v{background:#f5f3ff;color:#6d28d9}
.badge.bg-n{background:#f1f5f9;color:#64748b}
</style>

<body>
<div class="topbar">
  <a class="backbtn" href="index.html">← На Пульс</a>
  <div class="topbar-text">
    <h1 id="hdr-title">ДДС — планирование</h1>
    <p id="hdr-sub">Загрузка...</p>
  </div>
  <div class="topbar-right">
    <div class="upd" id="month-pick-wrap" style="display:none;margin-bottom:6px">
      Месяц: <select id="month-pick" style="font:inherit;font-weight:700;padding:3px 7px;border-radius:7px;border:1px solid #d1d5db;background:#fff;color:#111827"></select>
    </div>
    <div class="upd">Обновлено: <span id="upd-time">—</span></div>
    <span class="live-dot2">⚡ LIVE</span>
  </div>
</div>

<div id="alerts-bar"></div>
<div class="wrap">
<div id="loading" style="text-align:center;padding:80px;color:#fff;"><div class="spin">⚡</div><p>Загружаем данные из Google Sheets...</p></div>
  <div id="dashboard">
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-accent" style="background:#eab308"></div><div class="kpi-lbl">Итого доход</div><div class="kpi-val" id="k-inc" style="color:#854d0e">—</div><div class="kpi-sub">за месяц</div></div>
      <div class="kpi"><div class="kpi-accent" style="background:#f43f5e"></div><div class="kpi-lbl">Итого расход</div><div class="kpi-val" id="k-exp" style="color:#9f1239">—</div><div class="kpi-sub">за месяц</div></div>
      <div class="kpi"><div class="kpi-accent" id="k-bal-acc" style="background:#10b981"></div><div class="kpi-lbl">Баланс</div><div class="kpi-val" id="k-bal">—</div><div class="kpi-sub">нетто</div></div>
      <div class="kpi"><div class="kpi-accent" style="background:#7c3aed"></div><div class="kpi-lbl">Покрытие</div><div class="kpi-val" id="k-cov" style="color:#4c1d95">—</div><div class="kpi-sub">доход / расход</div></div>
    </div>
    <div class="tabs" id="tabs-row"></div>
    <div id="sections-wrap"></div>
    <div id="analytics-wrap"></div>
  </div>
</div>
<script>
const API_KEY='AIzaSyC5yPu3Oiub7HrlP2J09JhLvZhjLXcUUWk',SHEET_ID='1jDakRQXNlbXz4sWxA0vP_m_xXWu1T2pFe6sJvt9jifQ',TARGET_GID=1310438345;
const INC_COL='#eab308',EXP_COL='#f43f5e',BAL_COL='#7c3aed';
const WEEK_COLS=['#7c3aed','#0891b2','#10b981','#f59e0b','#6366f1'];
const PAL=['#7c3aed','#0891b2','#10b981','#f59e0b','#f43f5e','#6366f1','#ec4899','#14b8a6','#8b5cf6','#06b6d4'];
let charts={};

/* Какой лист планировать. Планируют вперёд, поэтому по умолчанию берём САМЫЙ
   ПОЗДНИЙ месяц из тех, что есть в таблице: появился лист «сентябрь» — страница
   сама переключилась на сентябрь, ничего править не надо.
   Если Ольга выбрала месяц руками — уважаем выбор, пока страница открыта. */
let SHEET_PICK='';
function monthOf(title){
  const t=(title||'').toLowerCase();
  let m=-1;
  for(let i=0;i<12;i++){ if(t.includes(MONN[i].slice(0,4))){ m=i; break; } }
  if(m<0) return null;
  const y=(t.match(/20\d\d/)||[])[0];
  const now=new Date(Date.now()+5*3600*1000);
  return {m:m, y: y? +y : now.getUTCFullYear()};
}
/* Какой месяц выбран по умолчанию.
   Планируют вперёд: после 20-го числа рабочий месяц — уже следующий. */
function defaultKey(){
  /* Выбор храним только на время вкладки (sessionStorage), а не навсегда:
     иначе в октябре страница молча продолжала бы показывать сентябрь. */
  try{ const s=sessionStorage.getItem('dds_plan_month');
       if(s && /^\d{4}-\d{2}$/.test(s)) return s; }catch(e){}
  const n=new Date(Date.now()+5*3600*1000);
  let y=n.getUTCFullYear(), m=n.getUTCMonth();
  if(n.getUTCDate()>=20){ m++; if(m>11){ m=0; y++; } }
  return y+'-'+String(m+1).padStart(2,'0');
}
let PLAN_KEY=defaultKey();

/* Откуда брать данные за выбранный месяц.
   Есть отложенная копия с этим месяцем в названии — читаем её,
   нет — читаем рабочий лист «Неделя ОПЛАТ», в нём всегда текущий план. */
/* Копией недельного плана считаем только лист, который и по названию недельный план:
   в таблице есть «ДДС МЕСЯЦ ИЮНЬ», «ОБУ МАЙ», «ДДС ФАКТ Апрель» — в них месяц
   в названии есть, но структура совсем другая, читать их сюда нельзя. */
function isPlanSheet(title){
  const t=(title||'').toLowerCase();
  return t.indexOf('недел')>=0 && t.indexOf('оплат')>=0;
}

function sheetFor(sheets,key){
  const y=+key.slice(0,4), m=+key.slice(5,7)-1;
  const arc=sheets.find(s=>{ if(!isPlanSheet(s.properties.title)) return false;
    const d=monthOf(s.properties.title);
    return d && d.m===m && d.y===y; });
  if(arc) return arc.properties.title;
  return (sheets.find(s=>s.properties.sheetId===TARGET_GID)
       || sheets.find(s=>s.properties.title.toLowerCase().includes('оплат'))
       || sheets[0])?.properties.title;
}

function pickSheet(sheets){
  /* Список месяцев: полгода назад — три вперёд, плюс всё, что отложено копиями. */
  const n=new Date(Date.now()+5*3600*1000);
  const keys=[];
  for(let i=-6;i<=3;i++){
    const d=new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth()+i, 1));
    keys.push(d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0'));
  }
  sheets.forEach(s=>{ if(!isPlanSheet(s.properties.title)) return;
    const d=monthOf(s.properties.title);
    if(d){ const k=d.y+'-'+String(d.m+1).padStart(2,'0'); if(keys.indexOf(k)<0) keys.push(k); } });
  keys.sort().reverse();

  const sel=document.getElementById('month-pick');
  if(sel){
    if(sel.options.length!==keys.length){
      sel.innerHTML=keys.map(k=>{ const m=+k.slice(5,7)-1;
        return '<option value="'+k+'">'+MONN[m][0].toUpperCase()+MONN[m].slice(1)+' '+k.slice(0,4)+'</option>';
      }).join('');
      document.getElementById('month-pick-wrap').style.display='';
      sel.onchange=function(){
        PLAN_KEY=sel.value;
        try{ sessionStorage.setItem('dds_plan_month',PLAN_KEY); }catch(e){}
        loadData();
      };
    }
    sel.value=PLAN_KEY;
  }
  return sheetFor(sheets,PLAN_KEY);
}

async function loadData(){
  try{
    const mr=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?key=${API_KEY}&fields=sheets.properties`);
    const meta=await mr.json();if(meta.error) throw new Error(meta.error.message);
    const sheets=meta.sheets||[];
    const name=pickSheet(sheets);
    if(!name) throw new Error('Лист не найден');
    const dr=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent("'"+name+"'!A1:F2000")}?key=${API_KEY}`);
    const j=await dr.json();if(j.error) throw new Error(j.error.message);
    setPlanMonth();
    const data=parseRows(j.values||[]);
    renderDashboard(data);
    checkAlerts(data.totalInc, data.totalExp, data.wks);
    document.getElementById('upd-time').textContent=new Date().toLocaleTimeString('ru-RU');
    document.getElementById('hdr-sub').textContent='Лист «'+name+'» · факт из iiko по '+FACT_THROUGH+' · обновление каждые 60 с';
    document.getElementById('loading').style.display='none';
    document.getElementById('dashboard').style.display='block';
    clearTimeout(window.__ddsTimer);
    window.__ddsTimer=setTimeout(loadData,60000);
  }catch(e){
    document.getElementById('loading').innerHTML=`<div style="font-size:32px;margin-bottom:12px">❌</div><p style="color:#ef4444;font-weight:600;margin-bottom:12px">${e.message}</p><button onclick="loadData()" style="padding:10px 28px;border-radius:10px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;font-size:14px">Повторить</button>`;
    console.error(e);
  }
}


function checkAlerts(totalInc, totalExp, weeks) {
  const bar = document.getElementById('alerts-bar');
  const alerts = [];
  const bal = totalInc - totalExp;
  const cov = totalExp > 0 ? (totalInc / totalExp * 100) : 0;
  
  if (cov < 80) alerts.push({type:'red', icon:'🚨', text:`Покрытие ${cov.toFixed(0)}% — расходы превышают доходы`});
  else if (cov < 100) alerts.push({type:'yellow', icon:'⚠️', text:`Покрытие ${cov.toFixed(0)}% — доходы не покрывают расходы`});
  else alerts.push({type:'green', icon:'✅', text:`Покрытие ${cov.toFixed(0)}% — норма`});
  
  if (bal < 0) alerts.push({type:'red', icon:'📉', text:`Отрицательный баланс: ${(bal/1000000).toFixed(1)} млн ₸`});
  
  // Check if any week has very high expenses
  if (weeks && weeks.length > 0) {
    const maxExpWeek = weeks.reduce((a,b) => b.exp > a.exp ? b : a, weeks[0]);
    const avgExp = weeks.reduce((s,w) => s + w.exp, 0) / weeks.length;
    if (maxExpWeek.exp > avgExp * 1.5) {
      alerts.push({type:'yellow', icon:'📊', text:`Пик расходов в "${maxExpWeek.label}": ${(maxExpWeek.exp/1000000).toFixed(1)} млн ₸`});
    }
  }
  
  if (alerts.length > 0) {
    bar.classList.add('has-alerts');
    bar.innerHTML = alerts.map(a => 
      `<div class="alert-pill alert-${a.type}">${a.icon} ${a.text}</div>`
    ).join('');
  } else {
    bar.classList.remove('has-alerts');
    bar.innerHTML = '';
  }
}

function parseNum(v){
  if(typeof v==='number') return v;
  if(!v) return 0;
  const s=v.toString().trim().replace(/\s/g,'').replace(',','.');
  const n=parseFloat(s);return isNaN(n)?0:n;
}
function parseRows(rows){
  const inc=[],exp=[];
  for(const row of rows){
    const a=(row[0]||'').toString().trim().toLowerCase();
    const b=parseInt(row[1]);if(isNaN(b)||b<1||b>5) continue;
    const name=(row[2]||'').toString().trim(),cash=parseNum(row[3]),nc=parseNum(row[4]);
    if(a==='расход') exp.push({wk:b,name,cash,nc,total:cash+nc});
    else if(!a) inc.push({wk:b,name,cash,nc,total:cash+nc});
  }
  const wks={};
  for(let w=1;w<=5;w++){
    const i=inc.filter(r=>r.wk===w),e=exp.filter(r=>r.wk===w);
    const iT=i.reduce((s,r)=>s+r.total,0),eT=e.reduce((s,r)=>s+r.total,0);
    wks[w]={inc:i,exp:e,incTotal:iT,expTotal:eT,bal:iT-eT};
  }
  const catM={},cliM={};
  exp.forEach(r=>{catM[r.name]=(catM[r.name]||0)+r.total;});
  inc.forEach(r=>{cliM[r.name]=(cliM[r.name]||0)+r.total;});
  const cats=Object.entries(catM).sort((a,b)=>b[1]-a[1]);
  const clients=Object.entries(cliM).sort((a,b)=>b[1]-a[1]);
  const tI=Object.values(wks).reduce((s,w)=>s+w.incTotal,0);
  const tE=Object.values(wks).reduce((s,w)=>s+w.expTotal,0);
  return{wks,cats,clients,totalInc:tI,totalExp:tE};
}
function fmt(v){const m=Math.abs(v)/1e6;return(v<0?'−':'')+(m>=100?m.toFixed(0):m>=10?m.toFixed(1):m.toFixed(2))+' М';}
function fmtS(v){return(v>=0?'+':'')+fmt(v);}
function gc(v){return v>=0?'#065f46':'#9f1239';}
function gb(v){return v>=0?'#10b981':'#f43f5e';}

/* ═══════════ ФАКТ ИЗ IIKO + КАЛЕНДАРЬ ПЛАНА ═══════════
   План приходит из Google-таблицы недельными суммами. Дат в нём нет.
   Дни внутри недели раскладываем по ритму реальных платежей из iiko:
   если по факту вторник забирает 26% недельных выплат, а среда 14% —
   плановая неделя делится в тех же долях. Сумма недели при этом не меняется. */
const FACT=((window.DDSP_DAYS||{}).days)||{};
const FACT_THROUGH=(window.DDSP_DAYS||{}).through||'';
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const WDL=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const WDP=['в воскресенье','в понедельник','во вторник','в среду','в четверг','в пятницу','в субботу'];
const MONN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
let PLAN_Y=0, PLAN_M=0;

function iso(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function dim(y,m){ return new Date(Date.UTC(y,m+1,0)).getUTCDate(); }
function dow(k){ return new Date(k+'T00:00:00Z').getUTCDay(); }
function dRU(k){ const p=k.split('-'); return p[2]+'.'+p[1]; }
function todayISO(){ const d=new Date(Date.now()+5*3600*1000); return d.toISOString().slice(0,10); }

function setPlanMonth(){
  /* Месяц берём из выбора, а не из названия листа: рабочий лист «Неделя ОПЛАТ»
     месяц в названии не несёт, а в его шапке может стоять чужая дата. */
  PLAN_Y=+PLAN_KEY.slice(0,4); PLAN_M=+PLAN_KEY.slice(5,7)-1;
  const nm='ДДС '+MONN[PLAN_M]+' '+PLAN_Y;
  const h=document.getElementById('hdr-title');
  if(h) h.textContent=nm;
  document.title=nm+' — план по дням и неделям';
}

/* Недели месяца — те же, что в балансе по дебиторам: 1–7, 8–14, 15–21, 22–28, 29–конец */
function weekDays(w){
  const last=dim(PLAN_Y,PLAN_M), a=(w-1)*7+1;
  if(a>last) return [];
  const b=(w>=5)?last:Math.min(w*7,last);
  const out=[]; for(let d=a;d<=b;d++) out.push(iso(PLAN_Y,PLAN_M,d));
  return out;
}
function weekLabel(w){ const d=weekDays(w); return d.length? dRU(d[0])+' – '+dRU(d[d.length-1]) : '—'; }

/* Ритм недели по факту: доля каждого дня недели. Берём последние 12 недель —
   это сегодняшние платёжные привычки, а не прошлогодние. */
function rhythm(){
  const keys=Object.keys(FACT).sort().slice(-84);
  /* Если факт из iiko почему-то не подгрузился — делим неделю поровну между буднями,
     страница остаётся рабочей, а в подписи честно сказано, что ритм не применён. */
  if(!keys.length){
    const flat=[0,.2,.2,.2,.2,.2,0];
    return {inS:flat,outS:flat,inSum:new Array(7).fill(0),outSum:new Array(7).fill(0),
            cnt:new Array(7).fill(0),days:0,from:'',to:'',flat:true};
  }
  const pin=new Array(7).fill(0), pout=new Array(7).fill(0), cnt=new Array(7).fill(0);
  keys.forEach(k=>{ const w=dow(k); pin[w]+=FACT[k].in; pout[w]+=FACT[k].out; cnt[w]++; });
  const si=pin.reduce((a,b)=>a+b,0)||1, so=pout.reduce((a,b)=>a+b,0)||1;
  return {inS:pin.map(v=>v/si), outS:pout.map(v=>v/so), inSum:pin, outSum:pout, cnt:cnt,
          days:keys.length, from:keys[0]||'', to:keys[keys.length-1]||''};
}

/* Дни недели, на которые план не ставится: вс, ср, сб.
   0 — воскресенье, 3 — среда, 6 — суббота. */
const SKIP_DOW=[0,3,6];

/* Раскладка недельного плана по дням. Остаток от округления отдаём самому крупному дню,
   поэтому сумма по неделе совпадает с планом до тенге. */
function planByDay(wks){
  const R=rhythm(), rows=[];
  for(let w=1;w<=5;w++){
    const ds=weekDays(w); if(!ds.length) continue;
    const wi=Math.round(wks[w].incTotal), we=Math.round(wks[w].expTotal);
    /* Дни, на которые вообще раскладываем план: будни без среды.
       Выходные — понятно, а среда исключена по решению финдиректора:
       по факту на неё приходится около 5 % недельного прихода против 25–30 %
       во вторник и четверг, то есть день нерабочий по платежам.
       Сумма недели не меняется — она перераспределяется на пн, вт, чт, пт. */
    const bd=k=>{const w2=dow(k);return SKIP_DOW.indexOf(w2)<0;};
    const use=ds.filter(bd).length?ds.filter(bd):ds;
    let si=0, so=0; use.forEach(k=>{ si+=R.inS[dow(k)]; so+=R.outS[dow(k)]; });
    const part=ds.map(k=>{
      if(use.indexOf(k)<0) return {d:k,w:w,inc:0,exp:0};
      return {d:k,w:w,
        inc: si>0? wi*R.inS[dow(k)]/si : wi/use.length,
        exp: so>0? we*R.outS[dow(k)]/so : we/use.length};
    });
    ['inc','exp'].forEach(f=>{
      part.forEach(p=>p[f]=Math.round(p[f]));
      const tgt=(f==='inc')?wi:we, got=part.reduce((s,p)=>s+p[f],0);
      if(got!==tgt && part.length){
        let bi=-1; part.forEach((p,i)=>{ if(p[f]>0 && (bi<0||p[f]>part[bi][f])) bi=i; });
        if(bi<0) bi=0;
        part[bi][f]+=tgt-got;
      }
    });
    part.forEach(p=>{ const f=FACT[p.d];
      rows.push({d:p.d,w:w,inc:p.inc,exp:p.exp,fin:f?f.in:0,fex:f?f.out:0,has:!!f}); });
  }
  return {rows:rows, R:R};
}

/* ═══════════ СЕКЦИИ: ПЛАН ПО ДНЯМ, НЕДЕЛИ ПЛАН↔ФАКТ, РИТМ НЕДЕЛИ ═══════════ */
function rub(v){ return (v<0?'−':'')+Math.round(Math.abs(v)).toLocaleString('ru-RU'); }
function rubS(v){ return (v>0?'+':v<0?'−':'')+Math.round(Math.abs(v)).toLocaleString('ru-RU'); }

function buildPlanDays(P){
  const T=todayISO();
  let cum=0, minCum=null, minDay='', heavy=null;
  const rows=P.rows.map(r=>{
    const bal=r.inc-r.exp; cum+=bal;
    if(minCum===null||cum<minCum){minCum=cum;minDay=r.d;}
    if(!heavy||r.exp>heavy.exp) heavy=r;
    const wknd=dow(r.d)===0||dow(r.d)===6, past=r.d<T, isT=r.d===T;
    const fbal=r.fin-r.fex, dev=r.has?(fbal-bal):null;
    return {r:r,bal:bal,cum:cum,wknd:wknd,past:past,isT:isT,fbal:fbal,dev:dev};
  });
  const tI=P.rows.reduce((s,r)=>s+r.inc,0), tE=P.rows.reduce((s,r)=>s+r.exp,0);
  const fI=P.rows.reduce((s,r)=>s+r.fin,0), fE=P.rows.reduce((s,r)=>s+r.fex,0);
  const donePlanI=P.rows.filter(r=>r.d<T).reduce((s,r)=>s+r.inc,0);
  const donePlanE=P.rows.filter(r=>r.d<T).reduce((s,r)=>s+r.exp,0);

  const trs=rows.map(x=>{
    const r=x.r;
    const cls=[x.isT?'d-today':'', x.wknd?'d-wknd':'', x.cum<0?'d-gap':''].filter(Boolean).join(' ');
    return '<tr class="'+cls+'">'
      +'<td style="font-weight:700;white-space:nowrap">'+dRU(r.d)+(x.isT?' <span class="badge bg-v">сегодня</span>':'')+'</td>'
      +'<td style="color:#6b7280">'+WD[dow(r.d)]+'</td>'
      +'<td class="num" style="color:#854d0e;font-weight:700">'+rub(r.inc)+'</td>'
      +'<td class="num" style="color:#9f1239;font-weight:700">'+rub(r.exp)+'</td>'
      +'<td class="num" style="color:'+gc(x.bal)+';font-weight:700">'+rubS(x.bal)+'</td>'
      +'<td class="num" style="color:'+gc(x.cum)+';font-weight:800">'+rubS(x.cum)+'</td>'
      +'<td class="num" style="color:#0f766e">'+(r.has?rub(r.fin):'<span class="mut">—</span>')+'</td>'
      +'<td class="num" style="color:#be123c">'+(r.has?rub(r.fex):'<span class="mut">—</span>')+'</td>'
      +'<td class="num" style="font-weight:700;color:'+(x.dev===null?'#9ca3af':gc(x.dev))+'">'+(x.dev===null?'—':rubS(x.dev))+'</td></tr>';
  }).join('');

  const notes=[];
  notes.push('Самая тяжёлая дата месяца — <b>'+dRU(heavy.d)+', '+WDL[dow(heavy.d)].toLowerCase()+'</b>: по плану уходит <b>'+rub(heavy.exp)+' ₸</b>.');
  if(minCum<0) notes.push('<b style="color:#be123c">Кассовый разрыв.</b> Накопленное сальдо уходит в минус, глубже всего <b>'+rub(minCum)+' ₸</b> к <b>'+dRU(minDay)+'</b>. К этой дате нужны деньги или перенос выплат.');
  else notes.push('Разрыва нет: накопленное сальдо не опускается ниже <b>'+rub(minCum)+' ₸</b> (минимум к '+dRU(minDay)+').');
  if(donePlanE>0) notes.push('С начала месяца по плану должно было уйти <b>'+rub(donePlanE)+' ₸</b>, фактически ушло <b>'+rub(fE)+' ₸</b> — '+(fE>donePlanE?'на '+rub(fE-donePlanE)+' ₸ больше плана':'на '+rub(donePlanE-fE)+' ₸ меньше плана')+'.');
  if(donePlanI>0) notes.push('Поступления: план <b>'+rub(donePlanI)+' ₸</b>, факт <b>'+rub(fI)+' ₸</b> — '+(fI>=donePlanI?'план выполнен':'недобор '+rub(donePlanI-fI)+' ₸')+'.');

  return '<div class="section active" id="sec-days">'
   +'<div class="grid4" style="margin-bottom:16px">'
     +'<div class="mkpi mk-inc"><div class="mkpi-lbl">Ожидаем за месяц</div><div class="mkpi-val">'+rub(tI)+'</div></div>'
     +'<div class="mkpi mk-exp"><div class="mkpi-lbl">Платим за месяц</div><div class="mkpi-val">'+rub(tE)+'</div></div>'
     +'<div class="mkpi '+((tI-tE)>=0?'mk-bal-g':'mk-bal-r')+'"><div class="mkpi-lbl">Сальдо месяца</div><div class="mkpi-val">'+rubS(tI-tE)+'</div></div>'
     +'<div class="mkpi '+(minCum>=0?'mk-bal-g':'mk-bal-r')+'"><div class="mkpi-lbl">Минимум накопленного</div><div class="mkpi-val">'+rubS(minCum)+'</div></div>'
   +'</div>'
   +'<div class="card" style="margin-bottom:16px">'+cardHdr(BAL_COL,'План по дням: ожидаем и платим')
     +'<div class="chart-wrap"><canvas id="ch-days"></canvas></div></div>'
   +'<div class="card" style="margin-bottom:16px">'+cardHdr('#6366f1','Что видно')
     +'<ul class="nlist">'+notes.map(n=>'<li>'+n+'</li>').join('')+'</ul></div>'
   +'<div class="card">'+cardHdr(INC_COL,'Календарь платежей')
     +'<div class="sub2">План разложен по дням ритмом фактических платежей из iiko. План ставится только на <b>пн, вт, чт и пт</b>: по субботам и воскресеньям движения денег нет, среда исключена отдельно — по факту на неё приходится около 5 % недельного прихода. Сумма недели не меняется — меняется только распределение внутри неё. Факт — реальные движения из iiko по '+FACT_THROUGH+'.</div>'
     +'<div class="tscroll"><table class="dtbl"><thead><tr>'
     +'<th>Дата</th><th>День</th><th class="num">Ожидаем</th><th class="num">Платим</th><th class="num">Сальдо дня</th><th class="num">Нарастающим</th>'
     +'<th class="num">Факт приход</th><th class="num">Факт расход</th><th class="num">Откл. по сальдо</th>'
     +'</tr></thead><tbody>'+trs+'</tbody>'
     +'<tfoot><tr><td colspan="2">ИТОГО</td><td class="num">'+rub(tI)+'</td><td class="num">'+rub(tE)+'</td>'
     +'<td class="num">'+rubS(tI-tE)+'</td><td class="num">'+rubS(tI-tE)+'</td>'
     +'<td class="num">'+rub(fI)+'</td><td class="num">'+rub(fE)+'</td><td class="num">'+rubS((fI-fE)-(tI-tE))+'</td></tr></tfoot>'
     +'</table></div></div></div>';
}

function buildPlanWeeks(wks,P){
  const T=todayISO();
  const rows=[1,2,3,4,5].map(w=>{
    const ds=weekDays(w); if(!ds.length) return '';
    const pi=P.rows.filter(r=>r.w===w).reduce((s,r)=>s+r.inc,0);
    const pe=P.rows.filter(r=>r.w===w).reduce((s,r)=>s+r.exp,0);
    const fi=ds.reduce((s,k)=>s+((FACT[k]||{}).in||0),0);
    const fe=ds.reduce((s,k)=>s+((FACT[k]||{}).out||0),0);
    const done=ds[ds.length-1]<T, started=ds[0]<=T;
    const cov=pe>0?pi/pe*100:0;
    const st=!started?'<span class="badge bg-n">впереди</span>':(done?'<span class="badge bg-g">закрыта</span>':'<span class="badge bg-v">идёт</span>');
    return '<tr>'
      +'<td style="font-weight:800;white-space:nowrap">Неделя '+w+'<div class="mut">'+weekLabel(w)+'</div></td>'
      +'<td>'+st+'</td>'
      +'<td class="num" style="color:#854d0e;font-weight:700">'+rub(pi)+'</td>'
      +'<td class="num" style="color:#0f766e;font-weight:700">'+(started?rub(fi):'<span class="mut">—</span>')+'</td>'
      +'<td class="num" style="color:#9f1239;font-weight:700">'+rub(pe)+'</td>'
      +'<td class="num" style="color:#be123c;font-weight:700">'+(started?rub(fe):'<span class="mut">—</span>')+'</td>'
      +'<td class="num" style="color:'+gc(pi-pe)+';font-weight:800">'+rubS(pi-pe)+'</td>'
      +'<td class="num" style="color:'+gc(fi-fe)+';font-weight:800">'+(started?rubS(fi-fe):'<span class="mut">—</span>')+'</td>'
      +'<td><span class="badge '+(cov>=100?'bg-g':'bg-r')+'">'+cov.toFixed(0)+'%</span></td></tr>';
  }).join('');
  /* «Напряжённая» — та, где поступления хуже всего покрывают выплаты, а не та,
     где меньше сальдо: короткая неделя месяца иначе всегда выглядит худшей. */
  const worst=[1,2,3,4,5].map(w=>({w:w,b:wks[w].incTotal-wks[w].expTotal,
      cov:wks[w].expTotal>0?wks[w].incTotal/wks[w].expTotal*100:999}))
    .filter(x=>weekDays(x.w).length).sort((a,b)=>a.cov-b.cov)[0];
  return '<div class="section" id="sec-weeks">'
   +'<div class="card">'+cardHdr('#6366f1','Недели месяца: план и факт')
   +'<div class="sub2">Недели те же, что в балансе по дебиторам: 1–7, 8–14, 15–21, 22–28, 29–конец. Факт — из iiko по '+FACT_THROUGH+'.</div>'
   +'<div class="tscroll"><table class="dtbl"><thead><tr><th>Неделя</th><th>Статус</th>'
   +'<th class="num">Ожидаем план</th><th class="num">Приход факт</th><th class="num">Платим план</th><th class="num">Расход факт</th>'
   +'<th class="num">Сальдо план</th><th class="num">Сальдо факт</th><th>Покрытие</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
   +(worst?('<div class="card" style="margin-top:16px">'+cardHdr(EXP_COL,'Что видно')
     +'<ul class="nlist"><li>Самая напряжённая неделя — <b>Неделя '+worst.w+' ('+weekLabel(worst.w)+')</b>: покрытие <b>'+worst.cov.toFixed(0)+'%</b>, сальдо <b style="color:'+gc(worst.b)+'">'+rubS(worst.b)+' ₸</b>.'+(worst.cov>=100?' Все недели покрыты собственными поступлениями.':' Здесь поступления не закрывают выплаты.')+'</li>'
     +'<li>Покрытие ниже 100% значит, что выплаты недели не обеспечены её же поступлениями — разницу закрывает остаток на счетах.</li></ul></div>'):'')
   +'</div>';
}

function buildRhythm(P){
  const R=P.R;
  const order=[1,2,3,4,5,6,0];
  const rows=order.map(w=>{
    const n=R.cnt[w]||0;
    return '<tr'+((w===0||w===6)?' class="d-wknd"':'')+'>'
      +'<td style="font-weight:700">'+WDL[w]+'</td>'
      +'<td class="num">'+(R.inS[w]*100).toFixed(1)+'%</td>'
      +'<td class="num">'+(R.outS[w]*100).toFixed(1)+'%</td>'
      +'<td class="num" style="color:#854d0e">'+(n?rub(R.inSum[w]/n):'—')+'</td>'
      +'<td class="num" style="color:#9f1239">'+(n?rub(R.outSum[w]/n):'—')+'</td>'
      +'<td class="num mut">'+n+'</td></tr>';
  }).join('');
  const topI=order.slice().sort((a,b)=>R.inS[b]-R.inS[a])[0];
  const topO=order.slice().sort((a,b)=>R.outS[b]-R.outS[a])[0];
  const lowO=order.filter(w=>w!==0&&w!==6).sort((a,b)=>R.outS[a]-R.outS[b])[0];
  return '<div class="section" id="sec-rhythm">'
   +'<div class="card">'+cardHdr(BAL_COL,'Ритм недели по факту')
   +'<div class="sub2">'+(R.flat?'Факт из iiko не подгрузился — неделя пока делится между буднями поровну.':'Считается по последним '+R.days+' дням движения денег ('+dRU(R.from)+' – '+dRU(R.to)+'). Именно в этих долях недельная сумма плана раскладывается по датам.')+'</div>'
   +'<div class="tscroll"><table class="dtbl"><thead><tr><th>День недели</th><th class="num">Доля прихода</th><th class="num">Доля расхода</th>'
   +'<th class="num">Средний приход за день</th><th class="num">Средний расход за день</th><th class="num">Дней в выборке</th></tr></thead>'
   +'<tbody>'+rows+'</tbody></table></div></div>'
   +'<div class="card" style="margin-top:16px">'+cardHdr('#6366f1','Что видно')
   +'<ul class="nlist">'
   +'<li>Деньги приходят в основном <b>'+WDP[topI]+'</b> — '+(R.inS[topI]*100).toFixed(0)+'% недельных поступлений.</li>'
   +'<li>Платим больше всего <b>'+WDP[topO]+'</b> — '+(R.outS[topO]*100).toFixed(0)+'% недельных выплат.</li>'
   +'<li>Самый спокойный по выплатам будний день — <b>'+WDL[lowO].toLowerCase()+'</b> ('+(R.outS[lowO]*100).toFixed(0)+'%). Это резерв: платежи можно двигать сюда, если в пиковый день не хватает денег.</li>'
   +'<li>По выходным движения денег практически нет, а среда по факту даёт лишь '+(R.inS[3]*100).toFixed(0)+'% недельного прихода. Поэтому план не ставится на <b>субботу, воскресенье и среду</b> — недельная сумма целиком раскладывается на понедельник, вторник, четверг и пятницу.</li>'
   +'</ul></div></div>';
}

function chartDays(P){

    {type:'bar',label:'Платим',data:R.map(r=>-+(r.exp/1e6).toFixed(2)),backgroundColor:EXP_COL,borderRadius:3,order:2},
    {type:'line',label:'Накопленное сальдо',data:cums,borderColor:BAL_COL,backgroundColor:BAL_COL,borderWidth:2,pointRadius:2,tension:.25,order:1}
  ]},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},datalabels:{display:false},
      tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y.toFixed(2)+' млн ₸'}}},
    scales:{y:{ticks:{callback:v=>v+' М',font:{size:10}},grid:{color:'#eef1f5'}},x:{ticks:{font:{size:9},maxRotation:90,minRotation:60},grid:{display:false}}}}});
}

/* ═══════════ АНАЛИТИКА ПЛАНА ═══════════
   Считается из того, что уже загружено: недельный план из таблицы,
   факт платежей из iiko (ddsp_days.js) и дебиторка (dz_kz.js).
   Ничего никуда не отправляет, только читает. */
function codeOf(n){ const m=String(n||'').trim().match(/^0*(\d+)/); return m?m[1]:null; }

function buildAnalytics(D,P){
  const W=[1,2,3,4,5].map(w=>({w,label:weekLabel(w),inc:D.wks[w].incTotal,exp:D.wks[w].expTotal}))
                     .filter(r=>r.inc||r.exp);
  if(!W.length) return '';
  const tI=D.totalInc, tE=D.totalExp;

  /* 1 — накопленное сальдо и кассовые разрывы */
  let cum=0; const rows=W.map(r=>{ cum+=r.inc-r.exp; return Object.assign({},r,{bal:r.inc-r.exp,cum:cum}); });
  const holes=rows.filter(r=>r.bal<0);
  const dip=rows.reduce((a,b)=>b.cum<a.cum?b:a,rows[0]);
  const best=rows.reduce((a,b)=>b.bal>a.bal?b:a,rows[0]);
  const t1='<table><thead><tr><th>Неделя</th><th>Ожидаем</th><th>Платим</th><th>За неделю</th><th>Нарастающим итогом</th></tr></thead><tbody>'
    +rows.map(r=>'<tr><td style="font-weight:700;white-space:nowrap">Неделя '+r.w+' <span style="color:#9ca3af;font-weight:500">'+r.label+'</span></td>'
      +'<td style="color:#854d0e;font-weight:700">'+fmt(r.inc)+'</td>'
      +'<td style="color:#9f1239;font-weight:700">'+fmt(r.exp)+'</td>'
      +'<td style="font-weight:700;color:'+gc(r.bal)+'">'+fmtS(r.bal)+'</td>'
      +'<td style="font-weight:800;color:'+gc(r.cum)+'">'+fmtS(r.cum)+'</td></tr>').join('')
    +'</tbody></table>';
  let v1;
  if(!holes.length) v1='Ни одна неделя не уходит в минус — план сбалансирован внутри месяца.';
  else v1='Недель с разрывом: <b>'+holes.length+'</b>. Самая глубокая точка — после недели <b>'+dip.w+'</b> ('+dip.label+'): '
     +'<b style="color:#9f1239">'+fmtS(dip.cum)+'</b> нарастающим итогом. '
     +(best.bal>0? 'Профицит недели '+best.w+' — '+fmt(best.bal)+', часть платежей разумно сдвинуть туда.' : '');

  /* 2 — выполнение плана на сегодня: факт из iiko против плана тех же дней */
  const today=todayISO(), pref=PLAN_Y+'-'+String(PLAN_M+1).padStart(2,'0');
  /* Докуда сравнивать: последний день планового месяца, по который есть факт.
     FACT_THROUGH приходит строкой «31.08.2026» и с ISO-датой не сравнивается,
     поэтому берём максимальный ключ самого факта. */
  let upto='';
  Object.keys(FACT).forEach(k=>{ if(k.slice(0,7)===pref && k<=today && k>upto) upto=k; });
  let pIn=0,pOut=0,fIn=0,fOut=0,nd=0;
  ((P&&P.rows)||[]).forEach(r=>{ if(r.d<=upto && r.d.slice(0,7)===pref){ pIn+=r.inc; pOut+=r.exp; nd++; } });
  Object.keys(FACT).forEach(k=>{ if(k.slice(0,7)===pref && k<=upto){ fIn+=FACT[k].in||0; fOut+=FACT[k].out||0; } });
  const hasFact=nd>0 && (fIn||fOut);
  const doneP=pIn>0?fIn/pIn*100:0;
  const t2=hasFact? '<table><thead><tr><th>С начала месяца по '+dRU(upto)+'</th><th>План</th><th>Факт</th><th>Разница</th><th>Выполнено</th></tr></thead><tbody>'
      +'<tr><td style="font-weight:700">Поступления</td><td>'+fmt(pIn)+'</td><td style="font-weight:700;color:#854d0e">'+fmt(fIn)+'</td>'
      +'<td style="font-weight:700;color:'+gc(fIn-pIn)+'">'+fmtS(fIn-pIn)+'</td>'
      +'<td><span class="badge '+(doneP>=95?'bg-g':doneP>=75?'bg-y':'bg-r')+'">'+doneP.toFixed(0)+'%</span></td></tr>'
      +'<tr><td style="font-weight:700">Выплаты</td><td>'+fmt(pOut)+'</td><td style="font-weight:700;color:#9f1239">'+fmt(fOut)+'</td>'
      +'<td style="font-weight:700;color:'+gc(pOut-fOut)+'">'+fmtS(fOut-pOut)+'</td>'
      +'<td><span class="badge bg-n">'+(pOut>0?(fOut/pOut*100).toFixed(0):0)+'%</span></td></tr>'
      +'</tbody></table>'
    : '<p class="sub2" style="margin:0">Факт за этот месяц ещё не набрался — сравнивать не с чем.</p>';
  const v2=hasFact
    ? (doneP>=100? 'Поступления идут с опережением плана на '+fmt(fIn-pIn)+'.'
      : 'К этому дню собрано '+doneP.toFixed(0)+'% от плана — отставание <b style="color:#9f1239">'+fmt(pIn-fIn)+'</b>. '
        +'Чтобы выйти на месяц, оставшиеся дни должны дать '+fmt(Math.max(0,tI-fIn))+'.')
    : '';

  /* 3 — обеспеченность плана дебиторкой */
  const DZ=(window.DZ_KZ&&window.DZ_KZ.dz)||null;
  let t3='',v3='';
  if(DZ&&DZ.top&&DZ.top.length){
    const debt={}; DZ.top.forEach(r=>{ const c=codeOf(r.name); if(c) debt[c]=(debt[c]||0)+r.debt; });
    const plan={}; D.clients.forEach(([n,v])=>{ const c=codeOf(n); if(c){ plan[c]=plan[c]||{v:0,n:n}; plan[c].v+=v; } });
    const list=Object.keys(plan).map(c=>({c,n:plan[c].n,plan:plan[c].v,debt:debt[c]||0}))
                 .sort((a,b)=>b.plan-a.plan).slice(0,12);
    const noPlan=Object.keys(debt).filter(c=>!plan[c]&&debt[c]>=400000)
                 .map(c=>({c,debt:debt[c],n:(DZ.top.find(r=>codeOf(r.name)===c)||{}).name||c}))
                 .sort((a,b)=>b.debt-a.debt);
    t3='<table><thead><tr><th>Контрагент</th><th>План сбора</th><th>Долг на '+(DZ.date||'')+'</th><th>Долг / план</th><th>Запас</th></tr></thead><tbody>'
      +list.map(r=>{ const k=r.plan>0?r.debt/r.plan:0;
        const tag=r.debt===0?'<span class="badge bg-n">платят с колёс</span>'
                 :k>=1.5?'<span class="badge bg-g">есть что добрать</span>'
                 :k>=0.8?'<span class="badge bg-y">в притык</span>'
                 :'<span class="badge bg-r">план выше долга</span>';
        return '<tr><td>'+r.n+'</td><td style="font-weight:700;color:#854d0e">'+fmt(r.plan)+'</td>'
          +'<td style="font-weight:700">'+fmt(r.debt)+'</td>'
          +'<td style="font-weight:700">'+(r.plan>0?k.toFixed(2)+'×':'—')+'</td><td>'+tag+'</td></tr>'; }).join('')
      +'</tbody></table>';
    const sumPlan=list.reduce((s,r)=>s+r.plan,0), sumDebt=list.reduce((s,r)=>s+r.debt,0);
    v3='Всего дебиторка <b>'+fmt(DZ.total||0)+'</b> на '+(DZ.date||'')+', план сбора по этим контрагентам <b>'+fmt(sumPlan)+'</b> '
      +'при их долге <b>'+fmt(sumDebt)+'</b>. '
      +(noPlan.length? 'Долг есть, а строки в плане нет: <b>'+noPlan.slice(0,4).map(r=>r.n.replace(/:.*$/,'')+' ('+fmt(r.debt)+')').join(', ')+'</b>'
          +(noPlan.length>4?' и ещё '+(noPlan.length-4):'')+'.' : 'Все крупные должники в плане есть.');
  }

  /* 4 — концентрация */
  const top3i=D.clients.slice(0,3).reduce((s,r)=>s+r[1],0);
  const top3e=D.cats.slice(0,3).reduce((s,r)=>s+r[1],0);
  const ci=tI>0?top3i/tI*100:0, ce=tE>0?top3e/tE*100:0;
  const t4='<div class="mkpi-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
    +'<div class="mkpi mk-inc"><div class="mkpi-lbl">Топ-3 плательщика</div><div class="mkpi-val">'+ci.toFixed(0)+'%</div>'
      +'<div class="sub2" style="margin:6px 0 0">'+D.clients.slice(0,3).map(r=>r[0]).join(' · ')+'</div></div>'
    +'<div class="mkpi mk-exp"><div class="mkpi-lbl">Топ-3 статьи расхода</div><div class="mkpi-val">'+ce.toFixed(0)+'%</div>'
      +'<div class="sub2" style="margin:6px 0 0">'+D.cats.slice(0,3).map(r=>r[0]).join(' · ')+'</div></div></div>';
  const v4=ci>=60? 'Больше половины месячного плана держится на трёх плательщиках — сдвиг у любого из них сразу ломает месяц.'
        : 'План распределён между плательщиками достаточно ровно.';

  /* 5 — что делать */
  const todo=[];
  if(holes.length&&best.bal>0) todo.push('Перенести часть платежей недели '+holes[0].w+' на неделю '+best.w+' — там профицит '+fmt(best.bal)+'.');
  if(hasFact&&doneP<90) todo.push('Отставание по сбору '+fmt(pIn-fIn)+' — начать с тех, у кого долг больше плана.');
  if(DZ&&DZ.dynamics&&DZ.dynamics.length>1){
    const a=DZ.dynamics[0].total,b=DZ.dynamics[DZ.dynamics.length-1].total;
    if(b>a) todo.push('Дебиторка выросла с '+fmt(a)+' до '+fmt(b)+' — отгружаем быстрее, чем собираем.');
  }
  if(ci>=60) todo.push('Три плательщика дают '+ci.toFixed(0)+'% плана — держать их сроки на отдельном контроле.');
  if(tI<tE) todo.push('Месяц свёрстан в минус на '+fmt(tE-tI)+' — либо добирать поступления, либо двигать платежи за границу месяца.');
  const t5=todo.length? '<ul style="margin:0;padding-left:20px;font-size:13px;line-height:1.85;color:#374151">'
      +todo.map(x=>'<li>'+x+'</li>').join('')+'</ul>'
    : '<p class="sub2" style="margin:0">Критичных отклонений в плане нет.</p>';

  return '<div id="analytics" style="margin-top:22px">'
    +'<div style="display:flex;align-items:center;gap:10px;margin:0 0 14px"><div style="width:4px;height:22px;border-radius:2px;background:#7c3aed"></div>'
      +'<h2 style="font-size:15px;font-weight:800;color:#fff;margin:0;letter-spacing:.01em">Аналитика плана</h2>'
      +'<span style="font-size:11px;color:rgba(255,255,255,.55)">считается по всему месяцу, независимо от выбранной вкладки</span></div>'
    +'<div class="card" style="margin-bottom:16px">'+cardHdr(BAL_COL,'Кассовые разрывы по неделям')
      +'<p class="sub2">'+v1+'</p>'+t1+'</div>'
    +'<div class="card" style="margin-bottom:16px">'+cardHdr(INC_COL,'План против факта — сколько уже прошло')
      +(v2?'<p class="sub2">'+v2+'</p>':'')+t2+'</div>'
    +(t3? '<div class="card" style="margin-bottom:16px">'+cardHdr('#0891b2','Чем обеспечен план сбора')
      +'<p class="sub2">'+v3+'</p>'+t3+'</div>' : '')
    +'<div class="card" style="margin-bottom:16px">'+cardHdr('#6366f1','Концентрация')
      +'<p class="sub2">'+v4+'</p>'+t4+'</div>'
    +'<div class="card">'+cardHdr(EXP_COL,'Что делать')+t5+'</div>'
    +'</div>';
}

function renderDashboard({wks,cats,clients,totalInc,totalExp}){
  const bal=totalInc-totalExp,cov=totalExp>0?totalInc/totalExp*100:0;
  document.getElementById('k-inc').textContent=fmt(totalInc);
  document.getElementById('k-exp').textContent=fmt(totalExp);
  const kb=document.getElementById('k-bal');kb.textContent=fmtS(bal);kb.style.color=gc(bal);
  document.getElementById('k-bal-acc').style.background=gb(bal);
  document.getElementById('k-cov').textContent=cov.toFixed(1)+'%';
  Object.values(charts).forEach(c=>c.destroy());charts={};
  const te=document.getElementById('tabs-row'),se=document.getElementById('sections-wrap');
  te.innerHTML='';se.innerHTML='';
  const P=planByDay(wks);
  addTab(te,'План по дням','days',true,false);
  se.innerHTML+=buildPlanDays(P);
  addTab(te,'Недели: план ↔ факт','weeks',false,false);
  se.innerHTML+=buildPlanWeeks(wks,P);
  addTab(te,'Ритм недели','rhythm',false,false);
  se.innerHTML+=buildRhythm(P);
  addTab(te,'Обзор','ov',false,false);
  se.innerHTML+=buildOverview(wks);
  /* В названии вкладки сразу видно, какие это числа: «Неделя 2 · 08–14.09» */
  for(let w=1;w<=5;w++){
    const d=weekDays(w);
    const lbl=d.length? 'Неделя '+w+' · '+d[0].slice(8)+'–'+d[d.length-1].slice(8)+'.'+d[0].slice(5,7)
                      : 'Неделя '+w;
    addTab(te,lbl,'wk-'+w,false,false);
  }
  for(let w=1;w<=5;w++){se.innerHTML+=buildWeek(w,wks[w]);}
  addTab(te,'За месяц','month',false,true);
  se.innerHTML+=buildMonth(cats,clients,totalInc,totalExp);
  document.getElementById('analytics-wrap').innerHTML=
    buildAnalytics({wks,cats,clients,totalInc,totalExp},P);
  requestAnimationFrame(()=>{ initCharts(wks,cats,clients); chartDays(P); });
}
function addTab(c,lbl,id,active,mt){
  const b=document.createElement('button');
  b.className='wtab'+(mt?' mtab':'')+(active?' active':'');
  const dot=lbl.indexOf(' · ');
  if(dot>0){ b.innerHTML=lbl.slice(0,dot)+
      '<span style="opacity:.55;font-weight:700"> · '+lbl.slice(dot+3)+'</span>'; }
  else b.textContent=lbl;
  b.onclick=()=>show(id);c.appendChild(b);
}
function show(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.wtab').forEach(t=>t.classList.remove('active'));
  const sec=document.getElementById('sec-'+id);if(sec) sec.classList.add('active');
  document.querySelectorAll('.wtab').forEach(t=>{
    if(t.onclick&&t.onclick.toString().includes("'"+id+"'")) t.classList.add('active');
  });
}

function cardHdr(col,label){
  return`<div class="card-hdr"><div class="card-dot" style="background:${col}"></div><span class="card-title">${label}</span></div>`;
}
function barHtml(items,maxVal,col){
  if(!items.length) return'<p style="font-size:12px;color:#9ca3af;padding:8px 0">Нет данных</p>';
  return items.map(r=>`<div class="bar-row">
    <span class="bar-label" title="${r.name}">${r.name||'—'}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.total/maxVal*100)}%;background:${col}"></div></div>
    <span class="bar-val">${fmt(r.total)}</span>
  </div>`).join('');
}

function buildOverview(wks){
  const rows=[1,2,3,4,5].map(w=>{
    const{incTotal,expTotal,bal}=wks[w],cov=expTotal>0?incTotal/expTotal*100:0;
    return`<tr>
      <td><strong style="color:#1f2937">Неделя ${w}</strong></td>
      <td style="color:#854d0e;font-weight:700">${fmt(incTotal)}</td>
      <td style="color:#9f1239;font-weight:700">${fmt(expTotal)}</td>
      <td style="color:${gc(bal)};font-weight:700">${fmtS(bal)}</td>
      <td><span class="badge ${cov>=100?'bg-g':'bg-r'}">${cov.toFixed(0)}%</span></td>
    </tr>`;
  }).join('');
  return`<div class="section" id="sec-ov">
    <div class="card" style="margin-bottom:16px">${cardHdr(INC_COL,'Доход vs Расход vs Баланс по неделям')}<div class="chart-wrap"><canvas id="ch-ov"></canvas></div></div>
    <div class="card">${cardHdr('#6366f1','Сводная таблица')}<table><thead><tr><th>Неделя</th><th>Доход</th><th>Расход</th><th>Баланс</th><th>Покрытие</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function buildWeek(w,{inc,exp,incTotal,expTotal,bal}){
  const cov=expTotal>0?incTotal/expTotal*100:0;
  const wc=WEEK_COLS[w-1];
  const tI=inc.slice().sort((a,b)=>b.total-a.total).slice(0,8),mI=tI[0]?.total||1;
  const tE=exp.slice().sort((a,b)=>b.total-a.total).slice(0,8),mE=tE[0]?.total||1;
  return`<div class="section" id="sec-wk-${w}">
    <div class="grid4" style="margin-bottom:16px">
      <div class="mkpi mk-inc"><div class="mkpi-lbl">Доход</div><div class="mkpi-val">${fmt(incTotal)}</div></div>
      <div class="mkpi mk-exp"><div class="mkpi-lbl">Расход</div><div class="mkpi-val">${fmt(expTotal)}</div></div>
      <div class="mkpi ${bal>=0?'mk-bal-g':'mk-bal-r'}"><div class="mkpi-lbl">Баланс</div><div class="mkpi-val">${fmtS(bal)}</div></div>
      <div class="mkpi mk-cov"><div class="mkpi-lbl">Покрытие</div><div class="mkpi-val">${cov.toFixed(0)}%</div></div>
    </div>
    <div class="grid2">
      <div class="card">${cardHdr(INC_COL,'Доход — источники')}${barHtml(tI,mI,INC_COL)}</div>
      <div class="card">${cardHdr(EXP_COL,'Расход — статьи')}${barHtml(tE,mE,EXP_COL)}</div>
    </div>
    <div class="card">${cardHdr(wc,'Динамика — Неделя '+w)}<div class="chart-wrap"><canvas id="ch-wk-${w}"></canvas></div></div>
  </div>`;
}

function buildMonth(cats,clients,tI,tE){
  return`<div class="section" id="sec-month">
    <div class="grid2" style="margin-bottom:16px">
      <div class="card">${cardHdr(INC_COL,'Структура дохода')}<div class="donut-wrap"><canvas id="ch-mi"></canvas></div></div>
      <div class="card">${cardHdr(EXP_COL,'Структура расхода')}<div class="donut-wrap"><canvas id="ch-me"></canvas></div></div>
    </div>
    <div class="grid2">
      <div class="card">${cardHdr(INC_COL,'Топ клиенты')}<table><thead><tr><th>Клиент</th><th>Сумма</th><th>%</th></tr></thead><tbody>${clients.slice(0,12).map(([n,v])=>`<tr><td>${n||'—'}</td><td style="font-weight:700;color:#854d0e">${fmt(v)}</td><td><span class="badge bg-y">${tI>0?(v/tI*100).toFixed(1):0}%</span></td></tr>`).join('')}</tbody></table></div>
      <div class="card">${cardHdr(EXP_COL,'Топ расходы')}<table><thead><tr><th>Статья</th><th>Сумма</th><th>%</th></tr></thead><tbody>${cats.slice(0,12).map(([n,v])=>`<tr><td>${n||'—'}</td><td style="font-weight:700;color:#9f1239">${fmt(v)}</td><td><span class="badge bg-r">${tE>0?(v/tE*100).toFixed(1):0}%</span></td></tr>`).join('')}</tbody></table></div>
    </div>
  </div>`;

function initCharts(wks,cats,clients){
  const L=['Нед. 1','Нед. 2','Нед. 3','Нед. 4','Нед. 5'];
  const iArr=[1,2,3,4,5].map(w=>wks[w].incTotal/1e6);
  const eArr=[1,2,3,4,5].map(w=>wks[w].expTotal/1e6);
  const bArr=[1,2,3,4,5].map(w=>wks[w].bal/1e6);
  const baseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{usePointStyle:true,pointStyle:'rectRounded',boxWidth:10,font:{size:11,family:'Inter'},padding:12}}},scales:{y:{beginAtZero:true,grid:{color:'#f3f4f6'},ticks:{callback:v=>v.toFixed(0)+'М',font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:11}}}}};
  const c0=document.getElementById('ch-ov')?.getContext('2d');
  if(c0) charts.ov=new Chart(c0,{data:{labels:L,datasets:[
    {type:'bar',label:'Доход',data:iArr,backgroundColor:'rgba(234,179,8,.75)',borderColor:INC_COL,borderWidth:2,borderRadius:8,borderSkipped:false,order:2},
    {type:'bar',label:'Расход',data:eArr,backgroundColor:'rgba(244,63,94,.65)',borderColor:EXP_COL,borderWidth:2,borderRadius:8,borderSkipped:false,order:2},
    {type:'line',label:'Баланс',data:bArr,borderColor:BAL_COL,backgroundColor:'rgba(124,58,237,.08)',borderWidth:3,pointRadius:7,pointBackgroundColor:bArr.map(v=>v>=0?'#10b981':'#f43f5e'),pointBorderColor:'#fff',pointBorderWidth:2,tension:.3,yAxisID:'y2',order:1}
  ]},options:{...baseOpts,scales:{...baseOpts.scales,y2:{position:'right',grid:{drawOnChartArea:false},ticks:{callback:v=>v.toFixed(0)+'М',font:{size:10}}}}}});

  for(let w=1;w<=5;w++){
    const ctx=document.getElementById('ch-wk-'+w)?.getContext('2d');if(!ctx) continue;
    const{inc,exp}=wks[w];
    const all=[...inc,...exp];const names=[...new Set(all.map(r=>r.name))].filter(Boolean).slice(0,10);
    const iM=Object.fromEntries(inc.map(r=>[r.name,r.total]));
    const eM=Object.fromEntries(exp.map(r=>[r.name,r.total]));
    charts['w'+w]=new Chart(ctx,{type:'bar',data:{labels:names,datasets:[
      {label:'Доход',data:names.map(n=>(iM[n]||0)/1e6),backgroundColor:'rgba(234,179,8,.75)',borderColor:INC_COL,borderWidth:2,borderRadius:6},
      {label:'Расход',data:names.map(n=>(eM[n]||0)/1e6),backgroundColor:'rgba(244,63,94,.65)',borderColor:EXP_COL,borderWidth:2,borderRadius:6}
    ]},options:{...baseOpts,scales:{...baseOpts.scales,x:{...baseOpts.scales.x,ticks:{font:{size:10},maxRotation:30}}}}});
  }
  const donutOpts={responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:10,family:'Inter'},padding:6}},tooltip:{callbacks:{label:c=>{const t=c.chart.data.datasets[0].data.reduce((a,b)=>a+b,0);return`${c.label}: ${c.parsed.toFixed(2)} млн (${(c.parsed/t*100).toFixed(1)}%)`}}},datalabels:{formatter:(v,ctx)=>{const t=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0);const p=v/t*100;return p>=4?p.toFixed(1)+'%':'';},color:'#fff',font:{size:11,weight:'bold'}}}};
  const cMI=document.getElementById('ch-mi')?.getContext('2d');
  if(cMI){const t=clients.slice(0,10);charts.mi=new Chart(cMI,{type:'doughnut',data:{labels:t.map(([n])=>n||'—'),datasets:[{data:t.map(([,v])=>v/1e6),backgroundColor:PAL,borderWidth:2,borderColor:'#fff'}]},options:donutOpts,plugins:[ChartDataLabels]});}
  const cME=document.getElementById('ch-me')?.getContext('2d');
  if(cME){const t=cats.slice(0,10);charts.me=new Chart(cME,{type:'doughnut',data:{labels:t.map(([n])=>n||'—'),datasets:[{data:t.map(([,v])=>v/1e6),backgroundColor:PAL,borderWidth:2,borderColor:'#fff'}]},options:donutOpts,plugins:[ChartDataLabels]});}
}
window.addEventListener('load',loadData);
</script>
