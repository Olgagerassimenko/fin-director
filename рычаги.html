 body{background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
 .topbar{background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:14px 24px;flex-wrap:wrap}
 .topbar h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
 .topbar p{font-size:12.5px;color:var(--ink2);margin-top:1px}
 .backbtn{background:rgba(255,255,255,.06);color:#c9d4e2;border:1px solid rgba(255,255,255,.12);font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;text-decoration:none;transition:.2s;white-space:nowrap}
 .backbtn:hover{background:linear-gradient(135deg,#e8c766,#d4af37);color:#1a1205;border-color:#e8c766}
 .live{margin-left:auto;background:var(--accentbg);color:var(--accent);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap}
 .wrap{max-width:1240px;margin:0 auto;padding:18px 18px 56px}
 .tabs{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
 .tab{background:var(--surf);color:#c9d4e2;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.18s}
 .tab:hover{border-color:rgba(232,199,102,.45)}
 .tab.active{background:linear-gradient(135deg,#e8c766,#d4af37);color:#1a1205;border-color:#e8c766;box-shadow:0 6px 18px -8px rgba(212,175,55,.7)}
 .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--surf);border:1px solid var(--line);border-radius:14px}
 .filters label{font-size:12.5px;color:var(--ink2);font-weight:600}
 .filters select{font-size:13.5px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:#132234;color:var(--ink);font-weight:600;min-width:120px}
 .filters .hint{font-size:11.5px;color:var(--mut);margin-left:auto}
 .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
 .k{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.2);border-radius:14px;padding:13px 15px;transition:.2s}

 .k .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);font-weight:700}
 .k .v{font-size:20px;font-weight:800;margin-top:5px;letter-spacing:-.01em}
 .k .u{font-size:11px;color:var(--mut);font-weight:600;margin-left:2px}
 .k .s{font-size:11px;color:var(--mut);margin-top:3px}
 .card{background:linear-gradient(162deg,#0f1b29,#0b141f);border:1px solid rgba(212,175,55,.15);border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:0 16px 42px -24px rgba(0,0,0,.75);position:relative}
 .card::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,199,102,.55),transparent);z-index:2}
 .card .hd{padding:14px 18px 10px}
 .card h3{font-size:15px;font-weight:800}
 .card .sub{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5}

 .card .why b{color:#c4b5fd}
 .def{margin:2px 18px 14px;font-size:12.5px}
 .def summary{cursor:pointer;color:#f2dd9e;font-weight:700;list-style:none;padding:6px 0}
 .def summary::-webkit-details-marker{display:none}
 .def summary::before{content:"▸ ";color:var(--mut)} .def[open] summary::before{content:"▾ "}
 .def dl{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 14px;padding:6px 0 4px;line-height:1.55;color:var(--ink2)}
 .def dt{color:#f2dd9e;font-weight:700} .def dd{color:var(--ink2)}
 .lgd{display:flex;gap:14px;flex-wrap:wrap;padding:0 18px 8px;font-size:12px;color:var(--ink2)}
 .lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
 .lgd i.ln{width:16px;height:2px;border-radius:2px;vertical-align:3px}
 /* полосы */
 .bars{padding:6px 16px 14px;display:flex;flex-direction:column;gap:6px}
 .brow{display:grid;grid-template-columns:minmax(120px,230px) 1fr 108px;gap:12px;align-items:center;font-size:12.5px}
 .bnm{color:#d7dee8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .btr{position:relative;height:22px}
 .bfill{position:absolute;left:0;top:3px;bottom:3px;border-radius:0 4px 4px 0;background:var(--accent);
   animation:grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s);transform-origin:left}
 .bfill.g{background:var(--in)} .bfill.r{background:var(--out)} .bfill.dim{background:var(--dim)}
 @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
 .bval{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
 .bhit{position:absolute;inset:-3px 0;z-index:3}
 .avgl{position:absolute;top:-1px;bottom:-1px;width:2px;background:#cbd5e1;opacity:.75;border-radius:1px;pointer-events:none}
 /* расходящиеся полосы (разрыв доли) */
 .dvg{padding:6px 16px 14px;display:flex;flex-direction:column;gap:6px}
 .drow{display:grid;grid-template-columns:minmax(120px,230px) 1fr;gap:12px;align-items:center;font-size:12.5px}
 .dbar{position:relative;height:24px;display:grid;grid-template-columns:1fr 1fr}
 .dbar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--grid)}
 .dL,.dR{position:relative}
 .dfill{position:absolute;top:3px;bottom:3px;animation:grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
 .dL .dfill{right:0;background:var(--out);border-radius:4px 0 0 4px;transform-origin:right}
 .dR .dfill{left:0;background:var(--in);border-radius:0 4px 4px 0;transform-origin:left}
 .dval{position:absolute;top:50%;transform:translateY(-50%);font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2);pointer-events:none}
 .dval.p{left:calc(var(--w) + 8px)} .dval.n{right:calc(var(--w) + 8px)}
 .dval.ins{color:#0b1220;text-shadow:none}
 .dval.ins.p{left:calc(var(--w) - 8px);transform:translate(-100%,-50%)}
 .dval.ins.n{right:calc(var(--w) - 8px);transform:translate(100%,-50%)}

 .foot{text-align:center;color:#8798ab;font-size:12px;padding:22px}.foot b{color:#c9d4e2}

 }

</style>

function st(l,v,s){return '<div class="st"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';}

function paretoSvg(A){
  var W=980,H=290,pL=52,pR=54,pB=34,pT=12,iw=W-pL-pR,ih=H-pT-pB;
  var pts=A.curve.map(function(p){return [pL+p[0]/A.n*iw, pT+ih-p[1]/100*ih];});
  var d="M"+pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join("L");
  var area=d+"L"+(pL+iw)+","+(pT+ih)+"L"+pL+","+(pT+ih)+"Z";
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Кривая накопленной выручки по позициям">';
  [0,25,50,75,100].forEach(function(v){var y=pT+ih-v/100*ih;
    s+='<line class="gl" x1="'+pL+'" x2="'+(pL+iw)+'" y1="'+y+'" y2="'+y+'"/>'
      +'<text class="ax" x="'+(pL-8)+'" y="'+(y+3.5)+'" text-anchor="end">'+v+'%</text>';});
  s+='<path d="'+area+'" fill="rgba(232,199,102,.13)"/><path d="'+d+'" fill="none" stroke="#e8c766" stroke-width="2.2"/>';
  [[A.n80,80,"80% выручки — "+A.n80+" SKU","var(--in)"],[A.n95,95,"95% — "+A.n95+" SKU","#8798ab"]].forEach(function(m){
    var x=pL+m[0]/A.n*iw,y=pT+ih-m[1]/100*ih;
    s+='<line x1="'+x+'" x2="'+x+'" y1="'+y+'" y2="'+(pT+ih)+'" stroke="'+m[3]+'" stroke-width="1.4" stroke-dasharray="4 4"/>'
      +'<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+m[3]+'"/>'
      +'<text class="ax" x="'+(x+7)+'" y="'+(y-7)+'" fill="'+m[3]+'">'+m[2]+'</text>';});
  var lastX=pL+iw;
  s+='<text class="ax" x="'+lastX+'" y="'+(H-10)+'" text-anchor="end">'+A.n+' позиций</text>'

   +'<text class="ax" x="'+(pL+iw/2)+'" y="'+(H-10)+'" text-anchor="middle">позиции, отсортированные по выручке →</text>';

}

function scisSvg(O){
  var rows=O.sc.slice(),W=980,pL=210,pR=80,pT=14,rh=30,H=pT+rows.length*rh+30;
  var iw=W-pL-pR,mx=Math.max.apply(null,rows.map(function(x){return Math.max(x.pa,x.pb);}))||1;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Статьи затрат в процентах к выручке">';
  niceTicks(mx,5).forEach(function(v){var x=pL+v/mx*iw;
    s+='<line class="gl" x1="'+x+'" x2="'+x+'" y1="'+pT+'" y2="'+(H-24)+'"/>'
      +'<text class="ax" x="'+x+'" y="'+(H-8)+'" text-anchor="middle">'+v.toFixed(0)+'%</text>';});
  rows.forEach(function(x,i){
    var y=pT+14+i*rh, xa=pL+x.pa/mx*iw, xb=pL+x.pb/mx*iw, col=x.d>0?"#f43f5e":"#34d399";
    s+='<text class="ax" x="'+(pL-10)+'" y="'+(y+4)+'" text-anchor="end" style="fill:#c9d4e2">'+esc(short(x.n,26))+'</text>'
      +'<line x1="'+xa+'" x2="'+xb+'" y1="'+y+'" y2="'+y+'" stroke="'+col+'" stroke-width="2.4" opacity=".55"/>'
      +'<circle cx="'+xa+'" cy="'+y+'" r="5" fill="#8798ab"/><circle cx="'+xb+'" cy="'+y+'" r="5.5" fill="'+col+'"/>'
      +'<text class="ax" x="'+(Math.max(xa,xb)+9)+'" y="'+(y+4)+'" fill="'+col+'">'+(x.d>0?"+":"")+x.d.toFixed(1).replace(".",",")+' п.п.</text>';});
  return s+'</svg>';
}
