  <!-- Что не внесено. Стоит выше вкладок намеренно: месяц может быть помечен
       закрытым, а зарплата в нём не проведена — и тогда прибыль в отчёте

  <details id="nv" style="margin:0 0 14px;border:1px solid #3f2d1a;border-radius:12px;background:#1a1206">

  <div class="sec" id="s-stat"></div>

<script>
(function(){
var D=window.OPIU_AUDIT;
if(!D){document.querySelector('.wrap').innerHTML='<div class="empty">⚠ Нет данных: не загрузился opiu_audit.js</div>';return;}

var M=D.months,L=D.labels,R=D.rows,K=D.kpi,N=M.length;
document.getElementById('upd').textContent='обновлено '+D.updated;

/* ── откуда цифры ───────────────────────────────────────────────
   Значения приходят из iiko (gen_opiu_iiko.py), бухгалтерский xlsx служит
   структурой и эталоном. Месяц, который бухгалтерия ещё не закрыла, помечен:
   в нём могут быть не проведены зарплата, налоги и аренда, поэтому по таким
   месяцам считается досчёт, а проверки аудита их не трогают. */
var META=D.meta||{}, SRC=D.src||'xlsx';
function mm(i){ return META[M[i]]||{}; }
function isLate(i){ return META[M[i]] ? !META[M[i]].closed : false; }
function isPart(i){ var m=mm(i); return m.full===false; }
var LATEN=0; for(var _i=0;_i<N;_i++) if(isLate(_i)) LATEN++;

/* ── какой месяц показывать «последним» ──────────────────────────
   Текущий месяц идёт неполным до самого его конца, а прошлый бухгалтерия
   закрывает к началу следующего. Если по умолчанию ставить две последние
   колонки, то с первого числа и до конца месяца отчёт сравнивает полный
   месяц с огрызком: в сентябре это давало −113 млн «экономии» по
   себестоимости, которой нет. Поэтому за последний берём последний
   ЗАКРЫТЫЙ месяц: с 8-го числа это прошлый, до 8-го — позапрошлый.
   Ручной выбор месяцев остаётся: это только начальное положение. */
var CLOSE_DAY=8;
var LASTI=(function(){
  var t=new Date();
  var back=(t.getDate()>=CLOSE_DAY)?1:2;         // сколько месяцев отступить от текущего
  var y=t.getFullYear(), m=t.getMonth()+1-back;
  while(m<1){ m+=12; y--; }
  var key=y+'-'+(m<10?'0':'')+m;
  var k=M.indexOf(key);
  if(k>=0) return k;
  /* месяца нет в отчёте — берём последний закрытый из тех, что есть */
  for(var i=N-1;i>=0;i--) if(!isLate(i)) return i;
  return N-1;
})();
var PREVI=Math.max(0,LASTI-1);

/* ── где цифра не факт, а оценка ─────────────────────────────────
   В незакрытом месяце зарплата, налоги и аренда ещё не проведены, и
   сборщик подставляет вместо нуля медиану закрытых месяцев. Раньше это
   было написано только в шапке страницы — а в таблице оценка стояла
   рядом с фактом и читалась как факт. На ЗП АУП это давало «рост на
   3.1 млн ₸», которого нет: в айко по счёту ноль, а 22.6 млн — досчёт.
   Теперь такая цифра помечена прямо в строке. */
/* Названия счетов в айко и строк в бухгалтерском ОПиУ совпадают по сути,
   но не всегда по нумерации и пробелам — сводим к общему виду. */
function dnorm(n){
  return String(n||'').replace(/^[\d.\s]+/,'').trim().toLowerCase().replace(/\s+/g,' ');
}
var ESTIDX={};
M.forEach(function(ym){
  var lst=(META[ym]&&META[ym].estOf)||[], t={};
  lst.forEach(function(x){ t[dnorm(x.n)]={was:x.was,est:x.est}; });
  ESTIDX[ym]=t;
});
function estAt(i,name){
  var t=ESTIDX[M[i]]; return t? (t[dnorm(name)]||null) : null;
}
/* ── ТОЛЬКО ФАКТ ─────────────────────────────────────────────────
   В незакрытом месяце сборщик подставляет вместо нуля медиану закрытых
   месяцев. Для аудита это вредно: оценка стоит рядом с фактом и создаёт
   движения, которых не было — по ЗП АУП так получался «рост на 3.1 млн»,
   хотя в iiko по счёту ноль. Здесь досчёт снимается со всех строк, итоги
   и КПЭ пересчитываются от факта, а то, что бухгалтерия не провела,
   показывается отдельной карточкой. Прибыль от этого выглядит лучше
   реальной — ровно на сумму непроведённого, и это сказано прямо. */
var COMPUTED={'Валовая прибыль':1,'Итого Прибыль от основной деятельности':1,'ИТОГО ЧИСТАЯ ПРИБЫЛЬ':1};
(function factOnly(){
  var touched=false;
  M.forEach(function(ym,i){
    var lst=(META[ym]&&META[ym].estOf)||[];
    if(!lst.length) return;
    var by={}; lst.forEach(function(x){ by[dnorm(x.n)]=x; });
    R.forEach(function(r){
      if(r.kind!=='line') return;
      var e=by[dnorm(r.n)];
      if(e){ r.v[i]=e.was||0; touched=true; }
    });
  });
  if(!touched) return;
  /* Итоги — сумма своих строк. Открывающий «sub» ищем тем же правилом,
     что и остальная страница: ближайший выше с тем же отступом. */
  M.forEach(function(ym,i){
    for(var t=0;t<R.length;t++){
      var r=R[t];
      if(r.kind!=='total'||COMPUTED[r.n]) continue;
      var h=-1;
      for(var k=t-1;k>=0;k--) if(R[k].ind===r.ind&&R[k].kind==='sub'){ h=k; break; }
      if(h<0) continue;
      var sm=0;
      for(var k2=h+1;k2<t;k2++) if(R[k2].kind==='line') sm+=R[k2].v[i];
      r.v[i]=sm;
    }
  });
  /* КПЭ — по тем же формулам, что в исходной сборке: проверено на
     закрытых месяцах, воспроизводит их до тенге. */
  var nm={}; R.forEach(function(r){ nm[r.n]=r; });
  var g=function(n,i){ return nm[n]? nm[n].v[i] : 0; };
  M.forEach(function(ym,i){
    K.rev[i]   = g('Итого Выручка',i);
    K.cogs[i]  = g('Итого Себестоимость',i);
    K.gross[i] = K.rev[i]-K.cogs[i];
    K.opex[i]  = g('Итого Расходы',i);
    K.oper[i]  = K.gross[i]-K.opex[i];
    K.net[i]   = K.oper[i]+g('Итого Прочие доходы',i)-g('Итого Прочие расходы',i);
    if(nm['Валовая прибыль']) nm['Валовая прибыль'].v[i]=K.gross[i];
    if(nm['Итого Прибыль от основной деятельности']) nm['Итого Прибыль от основной деятельности'].v[i]=K.oper[i];
    if(nm['ИТОГО ЧИСТАЯ ПРИБЫЛЬ']) nm['ИТОГО ЧИСТАЯ ПРИБЫЛЬ'].v[i]=K.net[i];
  });
})();

function estChip(i,name){
  return estAt(i,name)? ' <span class="est-chip" title="Значение подставлено расчётом: в iiko по этой статье за месяц проводок ещё нет">оценка</span>' : '';
}
/* Сколько расходов месяца ещё не проведено — на столько завышена его прибыль. */
function estGap(i){
  var lst=(META[M[i]]&&META[M[i]].estOf)||[];
  return lst.reduce(function(s,x){ return s+((x.est||0)-(x.was||0)); },0);
}
/* ── ЧЕГО ЖДЁМ ОТ БУХГАЛТЕРИИ ────────────────────────────────────
   Досчёт закрывает дыру в цифрах, но не отвечает на вопрос, который
   на самом деле нужен: что именно не проведено и на сколько. Здесь
   этот список: по каждой статье — что реально лежит в iiko сейчас и
   сколько ожидается по медиане закрытых месяцев. */
function todoCard(i){
  var lst=((META[M[i]]&&META[M[i]].estOf)||[]).slice();
  if(!lst.length) return '';
  lst.forEach(function(x){ x.gap=(x.est||0)-(x.was||0); });
  lst.sort(function(a,b){ return b.gap-a.gap; });
  var tot=lst.reduce(function(s,x){ return s+x.gap; },0);
  var thru=(META[M[i]]&&META[M[i]].through)||'';
  var h='<div class="card"><div class="card-t">Чего ждём от бухгалтерии · '+L[i]+'</div>'+
    '<div class="card-n">Статьи, по которым в iiko на '+

    'проведено, — поэтому месяц выглядит прибыльнее, чем он есть: '+
    '<b>прибыль '+L[i]+' завышена примерно на '+fm(tot)+' ₸</b>, пока это не проведено. '+
    'Колонка «Ожидается» — не досчёт в отчёте, а ориентир: медиана закрытых месяцев.</div>'+
    '<div class="tw"><table><thead><tr><th>Статья</th><th>В iiko сейчас</th>'+
    '<th>Ожидается</th><th>Не проведено</th><th style="text-align:left">Что это</th>'+
    '</tr></thead><tbody>';
  lst.forEach(function(x){
    var part = x.was>0;
    h+='<tr><td>'+esc(x.n)+'</td>'+
       '<td class="n '+(part?'':'mut')+'">'+(x.was? f0(x.was) : '—')+'</td>'+
       '<td class="n est">'+f0(x.est)+'</td>'+
       '<td class="n"><span class="neg">'+f0(x.gap)+'</span></td>'+
       '<td style="text-align:left;white-space:normal">'+
       (part? '<span class="mut">проведено частично — примерно '+pc(x.was/x.est)+' от ожидаемого</span>'
            : '<span class="neg">не проведено ничего</span>')+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td>Итого не проведено</td><td class="n mut">'+
     f0(lst.reduce(function(s,x){return s+(x.was||0);},0))+'</td>'+
     '<td class="n">'+f0(lst.reduce(function(s,x){return s+(x.est||0);},0))+'</td>'+
     '<td class="n">'+f0(tot)+'</td><td></td></tr></tfoot></table></div></div>';
  return h;
}

/* ── форматирование ───────────────────────────────────────────── */
function f0(x){ if(x===null||x===undefined) return '—';
  return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function fm(x){ var a=Math.abs(x);
  if(a>=1e9) return (x/1e9).toFixed(2)+' млрд';
  if(a>=1e6) return (x/1e6).toFixed(1)+' млн';
  if(a>=1e3) return (x/1e3).toFixed(0)+' тыс';
  return Math.round(x).toString(); }
function pc(x){ return (x*100).toFixed(1)+'%'; }
function sgn(x,fn){ var s=(x>0?'+':'')+ (fn||f0)(x); return '<span class="'+(x>0?'pos':x<0?'neg':'mut')+'">'+s+'</span>'; }
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

var LINES=R.filter(function(r){return r.kind==='line';});

/* ══ РАСШИФРОВКА СТАТЬИ ══════════════════════════════════════════
   Отчёт отвечает «какая статья дала разницу». Следующий вопрос всегда
   один и тот же — «за счёт кого именно», и раньше на него шли руками в
   айко. Здесь тот же оборот по счёту разложен на контрагентов,
   номенклатуру, типы документов и склады: строку можно раскрыть прямо
   в таблице и увидеть, что внутри изменилось между двумя месяцами. */
var DET=window.OPIU_DETAIL||null;
var DETM=(DET&&DET.m)||{};
var CUTS=(function(){
  var c=(DET&&DET.meta&&DET.meta.cuts)||null;
  if(!c) return null;
  /* Документы — первыми: аудит начинается с первички, а не со сводки. */
  var d=c.filter(function(x){return x.code==='doc';});
  return d.concat(c.filter(function(x){return x.code!=='doc';}));
})()||[
  {code:'ctr',title:'по контрагентам'},{code:'prod',title:'по номенклатуре'},
  {code:'type',title:'по типу документа'},{code:'dep',title:'по складам'}];
var DETIDX={};                       // месяц → нормализованное имя → расшифровка
Object.keys(DETM).forEach(function(ym){
  var t={}; Object.keys(DETM[ym]).forEach(function(an){ t[dnorm(an)]=DETM[ym][an]; });
  DETIDX[ym]=t;
});
function detOf(ym,name){
  var t=DETIDX[ym]; return t? (t[dnorm(name)]||null) : null;
}
function detHas(name){
  return M.some(function(ym){ return !!detOf(ym,name); });
}
/* Две колонки одного разреза сводим в одну таблицу: позиция, было, стало.
   Сортировка по модулю разницы — сверху то, что и создало движение. */
function detRows(name,ia,ib,code){
  if(code==='doc') return null;                 // у документов своя форма строки
  var A=detOf(M[ia],name), B=detOf(M[ib],name);
  var la=(A&&A[code])||[], lb=(B&&B[code])||[];
  if(!la.length&&!lb.length) return null;
  var map={};
  la.forEach(function(x){ (map[x[0]]=map[x[0]]||[0,0])[0]=x[1]; });
  lb.forEach(function(x){ (map[x[0]]=map[x[0]]||[0,0])[1]=x[1]; });
  var out=Object.keys(map).map(function(k){
    return {n:k,a:map[k][0],b:map[k][1],d:map[k][1]-map[k][0]};
  });
  out.sort(function(x,y){return Math.abs(y.d)-Math.abs(x.d);});
  return out;
}
/* Главные слагаемые изменения — чтобы причина была видна без раскрытия.
   Берём разрез по контрагентам, если он есть, иначе по номенклатуре. */
function detWhy(name,ia,ib,inc,lim){
  var rows=detRows(name,ia,ib,'ctr')||detRows(name,ia,ib,'prod');
  if(!rows||!rows.length) return '';
  var top=rows.filter(function(r){ return Math.abs(r.d)>=1000; }).slice(0,lim||3);
  if(!top.length) return '';
  return top.map(function(r){
    var worse = inc ? r.d<0 : r.d>0;
    return '<span class="why-i"><b class="'+(worse?'neg':'pos')+'">'+(r.d>0?'+':'')+fm(r.d)+
      '</b> '+esc(r.n.length>44? r.n.slice(0,44)+'…' : r.n)+'</span>';
  }).join('');
}
function detPanel(name,ia,ib,inc){
  if(!DET) return '<div class="note">Расшифровка ещё не собрана: opiu_detail.js не загрузился.</div>';

    if(e) warn+='<div class="note" style="border-left:4px solid #fbbf24">⚠ '+L[x[0]]+
      ': месяц по этой статье не закрыт — в iiko '+

      ', обычно за месяц около '+fm(e.est)+' ₸. Ниже — то, что реально проведено; '+
      'разбирать здесь нечего, пока бухгалтерия не проведёт начисление.</div>';
  });
  var trim=(DET&&DET.meta&&DET.meta.trimmed)||[];
  if(trim.length) warn+='<div class="note">Часть глубины срезана, чтобы файл открывался в браузере: '+
    esc(trim.join('; '))+'. Крупнейшие строки на месте, обрезаны хвосты.</div>';
  var avail=CUTS.filter(function(c){
    return c.code==='doc' ? !!detDocs(name,ia,ib,inc) : !!detRows(name,ia,ib,c.code);
  });
  if(!avail.length){
    return warn+'<div class="note">По этой строке в айко проводок нет. Так бывает у расчётных '+
      'строк (валовая прибыль, итоги) и у статей, которые ведёт только бухгалтерия.</div>';
  }
  var h=warn+'<div class="dt-tabs">'+avail.map(function(c,i){
    return '<button class="dt-tab'+(i?'':' on')+'" data-c="'+c.code+'">'+esc(c.title)+'</button>';
  }).join('')+'</div><div class="dt-body"></div>';
  return h;
}
/* ── ДОКУМЕНТЫ ──────────────────────────────────────────────────
   Аудит нужен, чтобы найти неверно разнесённый документ, а суммы по
   контрагентам его не показывают. Здесь сами проводки обоих месяцев
   в одном списке, крупные сверху: видно и разовый всплеск, и расход,
   попавший не в свой месяц, и чужой счёт. */
function detDocs(name,ia,ib,inc){
  var A=detOf(M[ia],name), B=detOf(M[ib],name);
  var la=(A&&A.doc)||[], lb=(B&&B.doc)||[];
  if(!la.length&&!lb.length) return null;
  /* Колонки первички задаёт выгрузка (meta.docCols): дата, документ,
     контрагент, номенклатура, комментарии — набор зависит от того, что
     отдаёт эта сборка iiko. Последняя ячейка строки всегда сумма. */
  var cols=(DET&&DET.meta&&DET.meta.docCols)||[];
  var n=(la[0]||lb[0]||[]).length;                 // ячеек в строке, включая сумму
  if(!cols.length||cols.length!==n){
    cols=['Дата','Документ','Контрагент','Номенклатура','Комментарий'].slice(0,n-1).concat(['Сумма, ₸']);
  }
  var body=cols.slice(0,-1);
  var all=la.map(function(x){return {m:ia,c:x};}).concat(lb.map(function(x){return {m:ib,c:x};}));
  all.sort(function(x,y){return Math.abs(y.c[n-1])-Math.abs(x.c[n-1]);});
  var sa=la.reduce(function(s,x){return s+x[n-1];},0);
  var sb=lb.reduce(function(s,x){return s+x[n-1];},0);
  var h='<div class="dt-tools"><input type="search" class="dt-q" placeholder="фильтр по документу, контрагенту, позиции, комментарию…">'+
    '<span class="mut">строк: '+all.length+'</span></div>'+
    '<table class="dt"><thead><tr>'+
    body.map(function(t){return '<th style="text-align:left">'+esc(t)+'</th>';}).join('')+
    '<th>Месяц</th><th>'+esc(cols[n-1])+'</th></tr></thead><tbody>';
  all.forEach(function(r){
    var c=r.c, v=c[n-1];
    var key=c.slice(0,n-1).join(' ').toLowerCase();
    h+='<tr data-k="'+esc(key)+'">';
    for(var k=0;k<n-1;k++){
      var val=c[k]==null? '' : String(c[k]);
      /* дата приходит как 2026-08-14 — показываем по-человечески */
      if(k===0&&/^\d{4}-\d{2}-\d{2}$/.test(val)) val=val.split('-').reverse().join('.');
      h+='<td class="'+(body[k].indexOf('Комментарий')===0?'dt-note':'')+
         '" style="text-align:left;white-space:normal">'+(val? esc(val):'<span class="mut">—</span>')+'</td>';
    }
    h+='<td class="n mut">'+L[r.m]+'</td>'+
       '<td class="n"><span class="'+(v<0?'pos':'')+'">'+f0(v)+'</span></td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="'+(n-1)+'" style="text-align:left">'+
     'Крупнейшая первичка: '+L[ia]+' — '+f0(sa)+' ₸, '+L[ib]+' — '+f0(sb)+' ₸</td>'+
     '<td class="n"></td><td class="n">'+(sb-sa>0?'+':'')+f0(sb-sa)+'</td></tr></tfoot></table>';
  return h;
}
function detTable(name,ia,ib,inc,code){
  if(code==='doc'){
    var d=detDocs(name,ia,ib,inc);
    return d||'<div class="note">Проводок по этой статье за выбранные месяцы нет.</div>';
  }
  var rows=detRows(name,ia,ib,code);
  if(!rows) return '<div class="note">В этом разрезе данных нет.</div>';
  var sa=rows.reduce(function(s,r){return s+r.a;},0);
  var sb=rows.reduce(function(s,r){return s+r.b;},0);
  var t='<table class="dt"><thead><tr><th style="text-align:left">Позиция</th>'+
    '<th>'+L[ia]+'</th><th>'+L[ib]+'</th><th>Разница, ₸</th>'+
    '<th style="text-align:left">Что произошло</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var worse = inc ? r.d<0 : r.d>0;
    /* Знак у оборота меняется (сторно, возврат, коррекция), и тогда «снижение
       на 142%» — бессмыслица: считаем проценты только внутри одного знака. */
    var flip = r.a&&r.b&&((r.a>0)!==(r.b>0));
    var why = (!r.a&&!r.b) ? '<span class="mut">нулевой оборот в обоих месяцах</span>'
      : r.d===0 ? '<span class="mut">без изменений</span>'
      : (!r.a&&r.b) ? '<span class="'+(inc?'pos':'neg')+'">появилось в этом месяце</span>'
      : (r.a&&!r.b) ? '<span class="mut">было в '+L[ia]+', в '+L[ib]+' нет</span>'
      : flip ? '<span class="'+(worse?'neg':'pos')+'">сменило знак: было '+f0(r.a)+', стало '+f0(r.b)+'</span>'
      : Math.abs(r.d)<Math.abs(r.a)*0.05 ? '<span class="mut">почти без изменений</span>'
      : (Math.abs(r.b)>Math.abs(r.a)
          ? '<span class="'+(worse?'neg':'pos')+'">больше в '+(Math.abs(r.b)/Math.abs(r.a)).toFixed(1)+'×</span>'
          : '<span class="'+(worse?'neg':'pos')+'">меньше на '+pc(Math.abs(r.d)/Math.abs(r.a))+'</span>');
    t+='<tr><td style="text-align:left;white-space:normal">'+esc(r.n)+'</td>'+
       '<td class="n mut">'+f0(r.a)+'</td><td class="n">'+f0(r.b)+'</td>'+
       '<td class="n"><span class="'+(r.d===0?'mut':worse?'neg':'pos')+'">'+
       (r.d>0?'+':'')+f0(r.d)+'</span></td>'+
       '<td style="text-align:left;white-space:normal">'+why+'</td></tr>';
  });
  t+='</tbody><tfoot><tr><td style="text-align:left">Итого по разрезу</td>'+
     '<td class="n">'+f0(sa)+'</td><td class="n">'+f0(sb)+'</td>'+
     '<td class="n">'+(sb-sa>0?'+':'')+f0(sb-sa)+'</td><td></td></tr></tfoot></table>';
  return t;
}
/* Один обработчик на таблицу: строки создаются заново на каждую отрисовку,
   вешать слушатель на каждую — лишняя работа и утечки. */
function detBind(tblId,ia,ib){
  var box=document.getElementById(tblId);
  if(!box||box.__detBound) return;
  box.__detBound=1;
  box.addEventListener('input',function(e){
    var q=e.target;
    if(!q.classList||!q.classList.contains('dt-q')) return;
    var v=q.value.trim().toLowerCase(), tb=q.closest('.dt-body');
    if(!tb) return;
    var n=0;
    [].forEach.call(tb.querySelectorAll('tbody tr[data-k]'),function(tr){
      var on=!v||tr.getAttribute('data-k').indexOf(v)>=0;
      tr.style.display=on?'':'none'; if(on) n++;
    });
    var c=tb.querySelector('.dt-tools .mut');
    if(c) c.textContent='строк: '+n;
  });
  box.addEventListener('click',function(e){
    var tab=e.target.closest&&e.target.closest('.dt-tab');
    /* Первички на статью бывает до двух с половиной сотен строк — глазами
       столько не просмотреть, поэтому фильтр прямо над таблицей. */
    if(e.target&&e.target.classList&&e.target.classList.contains('dt-q')) return;
    if(tab){
      var wrap=tab.closest('.dt-wrap');
      [].forEach.call(wrap.querySelectorAll('.dt-tab'),function(b){b.classList.remove('on');});
      tab.classList.add('on');
      wrap.querySelector('.dt-body').innerHTML=
        detTable(wrap.getAttribute('data-n'),+wrap.getAttribute('data-a'),
                 +wrap.getAttribute('data-b'),wrap.getAttribute('data-i')==='1',
                 tab.getAttribute('data-c'));
      return;
    }
    var tr=e.target.closest&&e.target.closest('tr.dt-row');
    if(!tr) return;
    var nx=tr.nextElementSibling;
    if(nx&&nx.classList.contains('dt-open')){ nx.remove(); tr.classList.remove('op'); return; }
    var name=tr.getAttribute('data-n'), inc=tr.getAttribute('data-i')==='1';
    var td=document.createElement('tr'); td.className='dt-open';
    var cs=tr.children.length;
    td.innerHTML='<td colspan="'+cs+'"><div class="dt-wrap" data-n="'+esc(name)+
      '" data-a="'+ia+'" data-b="'+ib+'" data-i="'+(inc?1:0)+'">'+
      detPanel(name,ia,ib,inc)+'</div></td>';
    tr.parentNode.insertBefore(td,tr.nextSibling);
    tr.classList.add('op');
    var wrap=td.querySelector('.dt-wrap'), first=td.querySelector('.dt-tab');
    if(first) wrap.querySelector('.dt-body').innerHTML=
      detTable(name,ia,ib,inc,first.getAttribute('data-c'));
  });
}

var BUILD={};
BUILD.svod=function(){

  var lp=D.lp;
  /* годы считаем сами: в D.years только закрытые месяцы из xlsx,
     а на странице есть ещё добранные из iiko */
  var y=[];
  ['2025','2026'].forEach(function(yy){
    var idx=[]; M.forEach(function(m,i){ if(m.slice(0,4)===yy) idx.push(i); });
    if(!idx.length) return;

  });

  if(lp){
    var a=lp.a,b=lp.b;
    function d(k){ return b[k]-a[k]; }
    function marg(o){ return o.rev? o.gross/o.rev : 0; }
    var lpLast=L[M.indexOf('2026-'+String(lp.mm).padStart(2,'0'))]||'';
    h+='<div class="note">Сравниваются <b>одинаковые '+lp.mm+' мес.</b>: январь–'+

       'Считаются только <b>закрытые</b> месяцы из бухгалтерского ОПиУ; '+
       'добранные из iiko в это сравнение не входят.</div>';
    h+='<div class="kpis">';
    h+=kpi('Выручка','#38bdf8',fm(b.rev)+' ₸',
        sgn(d('rev'),fm)+' ₸ к 2025 · '+sgn(d('rev')/a.rev*100,function(x){return x.toFixed(1);})+'%');
    h+=kpi('Валовая прибыль','#34d399',fm(b.gross)+' ₸',
        pc(marg(b))+' выручки (было '+pc(marg(a))+') · '+sgn(d('gross'),fm)+' ₸');
    h+=kpi('Себестоимость','#fbbf24',fm(b.cogs)+' ₸',
        pc(b.cogs/b.rev)+' выручки (было '+pc(a.cogs/a.rev)+') · '+
        sgn((b.cogs/b.rev-a.cogs/a.rev)*100,function(x){return x.toFixed(1);})+' п.п.');
    h+=kpi('Расходы периода','#f472b6',fm(b.opex)+' ₸',
        pc(b.opex/b.rev)+' выручки (было '+pc(a.opex/a.rev)+') · '+sgn(d('opex'),fm)+' ₸');
    h+=kpi('Операционная прибыль',b.oper>=0?'#34d399':'#f87171',fm(b.oper)+' ₸',
        'было '+fm(a.oper)+' ₸ · '+sgn(d('oper'),fm)+' ₸');
    h+=kpi('Чистая прибыль',b.net>=0?'#34d399':'#f87171',fm(b.net)+' ₸',
        'было '+fm(a.net)+' ₸ · '+sgn(d('net'),fm)+' ₸');
    h+='</div>';

    /* где именно потеряли */
    var dg=d('gross'), dop=d('opex');
    h+='<div class="card"><div class="card-t">Что произошло с прибылью</div>'+
       '<div class="card-n">Разложение изменения операционной прибыли на две причины: '+
       'сколько дала валовая прибыль и сколько забрали расходы периода.</div>'+
       '<table><thead><tr><th>Причина</th><th>Сумма, ₸</th>'+
       '<th style="text-align:left">Комментарий</th></tr></thead><tbody>'+
       '<tr><td>Валовая прибыль</td><td class="n">'+sgn(dg)+'</td><td style="text-align:left;white-space:normal">'+
       (dg>=0?'выручка и себестоимость сработали в плюс':'выручка выросла слабее себестоимости')+'</td></tr>'+
       '<tr><td>Расходы периода (коммерческие + АУП)</td><td class="n">'+sgn(-dop)+'</td>'+
       '<td style="text-align:left;white-space:normal">расходы '+(dop>0?'выросли на '+fm(dop)+' ₸ — это прямой минус прибыли':'снизились')+'</td></tr>'+
       '<tr class="grand"><td>Итого изменение операционной прибыли</td><td class="n">'+sgn(d('oper'))+'</td><td></td></tr>'+
       '</tbody></table></div>';
  }

  /* итоги по годам */
  h+='<div class="card"><div class="card-t">Годы целиком</div>'+
     '<div class="card-n">2026 — неполный год, поэтому сравнивать его итог с 2025 напрямую нельзя. '+
     'Сопоставимое сравнение — в карточках выше.'+
     (LATEN? ' В 2026 входят '+LATEN+' незакрытых месяца из iiko — расходы в них занижены.':'')+
     '</div><table><thead><tr>'+
     '<th>Показатель</th>'+y.map(function(o){return '<th>'+o.y+' ('+o.n+' мес.'+
        (o.late?', из них '+o.late+' не закрыт'+(o.late>1?'ы':'')+'':'')+')</th><th>% выручки</th>';}).join('')+
     '</tr></thead><tbody>';
  [['Выручка','rev'],['Себестоимость','cogs'],['Валовая прибыль','gross'],
   ['Расходы периода','opex'],['Операционная прибыль','oper'],['Чистая прибыль','net']].forEach(function(p,i){
    h+='<tr'+(p[1]==='net'?' class="grand"':(p[1]==='gross'||p[1]==='oper')?' class="tot"':'')+'><td>'+p[0]+'</td>'+
       y.map(function(o){ return '<td class="n">'+f0(o[p[1]])+'</td><td class="n mut">'+pc(o[p[1]]/o.rev)+'</td>';}).join('')+'</tr>';
  });
  h+='</tbody></table></div>';

  /* сверка выручки с iiko — два независимых источника должны сходиться */
  h+=reconcile();

  /* полная таблица ОПиУ — сворачивается до кварталов и разворачивается до месяцев */
  h+='<div class="card"><div class="card-t">ОПиУ по периодам</div>'+
     '<div class="card-n">Открывается свёрнуто — год по кварталам. '+
     'Клик по заголовку квартала раскрывает его месяцы, повторный клик сворачивает; '+
     'клик по году сворачивает весь год в одну колонку. '+
     'Переключатель показывает либо тенге, либо долю в выручке периода — второе честнее '+
     'сравнивает периоды с разной выручкой.</div>'+
     '<div class="ctl"><span class="lbl">Показать:</span>'+
     '<button class="chip on" id="m-abs">₸</button><button class="chip" id="m-sh">% выручки</button>'+
     '<span class="lbl" style="margin-left:12px">Строки:</span>'+
     '<button class="chip on" id="m-top">свёрнуто</button><button class="chip" id="m-all">все статьи</button>'+
     '</div>'+
     '<div class="tw" id="pnl"></div></div>';

  el.innerHTML=h;

  var mode='abs',only=true;      // по умолчанию свёрнуто: только итоги групп

  /* Какие статьи входят в каждый «Итого» — чтобы группу можно было раскрыть. */
  var KIDS={};
  R.forEach(function(t,j){
    if(t.kind!=='total') return;
    var hh=-1;
    for(var i=j-1;i>=0;i--){ if(R[i].ind<t.ind) break;
      if(R[i].ind===t.ind && R[i].kind==='sub'){ hh=i; break; } }
    if(hh<0) return;
    var kids=[]; for(var i=hh+1;i<j;i++) if(R[i].ind===t.ind+3 && R[i].kind==='line') kids.push(R[i].n);
    if(kids.length) KIDS[t.n]=kids;
  });
  var OPENR={};                  // раскрытые группы строк

  /* Дерево периодов. OPEN['Y2025'] — год раскрыт до кварталов,
     OPEN['Q2025-3'] — квартал раскрыт до месяцев. */
  var YEARS=[]; M.forEach(function(m){ var y=m.slice(0,4); if(YEARS.indexOf(y)<0) YEARS.push(y); });
  YEARS.sort();
  var RQ=['I','II','III','IV'];
  var OPEN={};
  /* По умолчанию прошлые годы свёрнуты в одну колонку — они уже закрыты
     и нужны как база сравнения, а не для разглядывания. Текущий год открыт
     до кварталов: с ним и работаем. Любой год разворачивается кликом. */
  var CURY=String(new Date(Date.now()+5*3600*1000).getUTCFullYear());
  YEARS.forEach(function(y){ OPEN['Y'+y]=(y===CURY); });

  function qOf(m){ return Math.floor((+m.slice(5,7)-1)/3); }

  function cols(){
    var out=[];
    YEARS.forEach(function(y){
      var mi=[]; M.forEach(function(m,i){ if(m.slice(0,4)===y) mi.push(i); });
      if(!mi.length) return;
      var yk='Y'+y;
      out.push({k:yk,lab:y,sub:OPEN[yk]?'свернуть год':mi.length+' мес.',idx:mi,lvl:0,open:!!OPEN[yk]});
      if(!OPEN[yk]) return;
      for(var q=0;q<4;q++){
        var qi=mi.filter(function(i){ return qOf(M[i])===q; });
        if(!qi.length) continue;
        var qk='Q'+y+'-'+q;
        var lateN=qi.filter(isLate).length;
        out.push({k:qk,lab:RQ[q]+' кв '+y,
                  sub:OPEN[qk]?'свернуть':(qi.length+' мес.'+(lateN?' · '+lateN+' не закрыт':'')),
                  late:lateN>0, idx:qi,lvl:1,open:!!OPEN[qk]});
        if(!OPEN[qk]) continue;
        qi.forEach(function(i){ out.push({k:'M'+M[i],lab:L[i],
          sub:isLate(i)?'не закрыт':'',late:isLate(i),idx:[i],lvl:2}); });
      }
    });
    return out;
  }

  function cellVal(v,idx){
    var s=0; idx.forEach(function(i){ s+=v[i]; });
    if(mode==='abs') return s? f0(s) : '<span class="mut">—</span>';
    var r=0; idx.forEach(function(i){ r+=K.rev[i]; });
    return r? (s/r*100).toFixed(1)+'%' : '—';
  }

  function pnl(){
    var C=cols();
    var bg=['#2a2350','#20294a','#182342'], fg=['#e9d5ff','#c7d2fe','#9db0c9'];
    var t='<table><thead><tr><th>Статья</th>'+C.map(function(c){
      var clickable=c.lvl<2;
      return '<th data-k="'+c.k+'" style="background:'+bg[c.lvl]+';color:'+(c.late?'#fbbf24':fg[c.lvl])+
        (clickable?';cursor:pointer':'')+'" title="'+(clickable?(c.open?'свернуть':'раскрыть'):
          (c.late?'месяц не закрыт бухгалтерией: данные из iiko, начисления конца месяца ещё не прошли':''))+'">'+
        (clickable?(c.open?'▾ ':'▸ '):'')+c.lab+
        (c.sub?'<br><span style="font-weight:600;opacity:'+(c.late?'.9':'.6')+';font-size:9.5px">'+c.sub+'</span>':'')+'</th>';
    }).join('')+'</tr></thead><tbody>';

    /* какие строки-статьи показывать: всё, либо только раскрытые группы */
    var shown={};
    if(!only) R.forEach(function(r){ shown[r.n]=1; });
    else Object.keys(OPENR).forEach(function(g){
      if(OPENR[g]) (KIDS[g]||[]).forEach(function(n){ shown[n]=1; }); });

    R.forEach(function(r){
      if(r.kind==='line' && !shown[r.n]) return;
      var cls=r.kind==='grand'?'grand':r.kind==='total'?'tot':r.kind==='sub'?'sub':'';
      var can = only && r.kind==='total' && KIDS[r.n];
      t+='<tr class="'+cls+'"><td'+(can?' data-g="'+esc(r.n)+'" style="cursor:pointer"':'')+'>'+
         (can?(OPENR[r.n]?'▾ ':'▸ '):(r.kind==='line'?'<span style="opacity:.35">— </span>':''))+
         esc(r.n)+
         (can&&!OPENR[r.n]?' <span style="opacity:.45;font-weight:600">('+KIDS[r.n].length+')</span>':'')+
         '</td>';
      if(r.kind==='sub'){ t+='<td colspan="'+C.length+'"></td></tr>'; return; }
      C.forEach(function(c){
        t+='<td class="n"'+(c.lvl===0?' style="background:#242e4e;font-weight:700"':
                            c.lvl===1?' style="background:#1e2745"':'')+'>'+cellVal(r.v,c.idx)+'</td>';
      });
      t+='</tr>';
    });
    var box=document.getElementById('pnl');
    box.innerHTML=t+'</tbody></table>';
    box.querySelectorAll('th[data-k]').forEach(function(th){
      var k=th.dataset.k;
      if(k.charAt(0)==='M') return;
      th.onclick=function(){ OPEN[k]=!OPEN[k]; pnl(); };
    });
    box.querySelectorAll('td[data-g]').forEach(function(td){
      td.onclick=function(){ var g=td.dataset.g; OPENR[g]=!OPENR[g]; pnl(); };
    });
  }
  pnl();

  function tog(a,b,fn){ document.getElementById(a).onclick=function(){
      document.getElementById(a).classList.add('on');document.getElementById(b).classList.remove('on');fn();pnl(); }; }
  tog('m-abs','m-sh',function(){mode='abs';}); tog('m-sh','m-abs',function(){mode='sh';});
  tog('m-top','m-all',function(){only=true;}); tog('m-all','m-top',function(){only=false;});
};

/* Сверка выручки бухгалтерского ОПиУ с выручкой, которую iiko отдаёт напрямую.
   Два независимых источника: если они расходятся — либо после закрытия месяца
   делали корректировку, либо часть выручки в бухучёте лежит не на том счёте. */
function reconcile(){
  var REV=window.OPIU_REV;
  if(!REV) return '';
  var tr=byName['Торговая выручка'], it=byName['Итого Выручка'];
  if(!tr||!it) return '';
  var rows=[];
  for(var i=0;i<N;i++){
    if(isLate(i)) continue;          // эти месяцы сами взяты из iiko — сверять не с чем
    var r=REV[M[i]];
    if(!r||!r.trade) continue;
    if(r.through && r.through < M[i]+'-28') continue;   // месяц ещё не добран
    rows.push({m:M[i],l:L[i],x:tr.v[i],k:r.trade,d:tr.v[i]-r.trade});
  }
  if(!rows.length) return '';
  var bad=rows.filter(function(r){return Math.abs(r.d)>50000;});
  var t='<div class="card"><div class="card-t">Сверка выручки: бухгалтерия против iiko</div>'+
    '<div class="card-n">Слева — «Торговая выручка» из бухгалтерского ОПиУ, справа — то же самое, '+
    'посчитанное напрямую в iiko. Источники независимы, поэтому расхождение — это либо корректировка '+
    'после закрытия месяца, либо выручка, ушедшая не на тот счёт. '+
    (bad.length? '<b style="color:#fbbf24">Расходятся '+bad.length+' из '+rows.length+' месяцев.</b>'
               : '<b class="ok">Все '+rows.length+' месяцев сходятся.</b>')+'</div>'+
    '<div class="tw"><table><thead><tr><th>Месяц</th><th>ОПиУ (бухгалтерия)</th><th>iiko</th>'+
    '<th>Разница, ₸</th><th>Разница, %</th><th style="text-align:left">Вывод</th>'+
    '</tr></thead><tbody>';
  rows.forEach(function(r){
    var big=Math.abs(r.d)>50000;
    t+='<tr><td>'+r.l+'</td><td class="n">'+f0(r.x)+'</td><td class="n">'+f0(r.k)+'</td>'+
       '<td class="n"><span class="'+(big?'neg':'mut')+'">'+(r.d>0?'+':'')+f0(r.d)+'</span></td>'+
       '<td class="n mut">'+(r.k?(r.d/r.k*100).toFixed(2)+'%':'—')+'</td>'+
       '<td style="text-align:left;white-space:normal">'+
       (big? '<span class="neg">разошлись на '+fm(Math.abs(r.d))+' ₸ — поднять корректировки за месяц</span>'
           : '<span class="ok">сходится</span>')+'</td></tr>';
  });
  return t+'</tbody></table></div></div>';
}

function kpi(l,c,v,s){
  return '<div class="kpi" style="--k:'+c+'"><div class="kpi-l">'+l+'</div>'+
         '<div class="kpi-v" style="color:'+c+'">'+v+'</div><div class="kpi-s">'+s+'</div></div>';
}

/* ══ 2. ПОСТАТЕЙНО ═══════════════════════════════════════════════ */
BUILD.stat=function(){
  var el=document.getElementById('s-stat');
  var rows=LINES.filter(function(r){return r.n!=='Торговая выручка'&&r.n!=='Выручка';}).map(function(r){
    var s=sum(r.v), nz=r.v.filter(function(x){return x;});
    var av=nz.length? s/nz.length : 0;
    var srt=nz.slice().sort(function(a,b){return a-b;});
    var med=srt.length? (srt.length%2? srt[(srt.length-1)/2] : (srt[srt.length/2-1]+srt[srt.length/2])/2) : 0;
    var mx=Math.max.apply(null,r.v), mn=Math.min.apply(null,r.v);
    var peak=r.v.reduce(function(p,x){return Math.abs(x)>Math.abs(p)?x:p;},0);
    var last=r.v[LASTI], prev=r.v[PREVI];
    return {n:r.n,v:r.v,s:s,av:av,med:med,peak:peak,inc:r.inc,fill:nz.length,
            sh:sum(K.rev)? s/sum(K.rev):0,
            vol: med? (mx-mn)/Math.abs(med) : 0,
            last:last, dm: last-prev};
  });

  el.innerHTML='<div class="note">Каждая статья за все '+N+' месяцев. '+
    '<b>Разброс</b> = (максимум − минимум) ÷ медиана: чем он выше, тем менее предсказуема статья '+
    'и тем вероятнее, что внутри неё сидят разовые проводки. '+
    '<b>Мес.</b> — в скольких месяцах из '+N+' статья вообще была. '+
    'Последняя колонка — <b>'+L[LASTI]+'</b>'+(LASTI<N-1
      ? ', последний закрытый месяц: текущий идёт неполным и сравнивать его с полным нечестно'
      : '')+'.</div>'+
    '<div class="card"><div class="ctl">'+
    '<input type="search" id="q" placeholder="поиск по статье…" style="min-width:230px">'+
    '<span class="lbl">Сортировка:</span><select id="srt">'+
    '<option value="s">по сумме</option><option value="vol">по разбросу</option>'+
    '<option value="dm">по изменению за последний месяц</option><option value="n">по названию</option>'+
    '</select></div><div class="tw" id="stbl"></div></div>';

  function draw(){
    var q=document.getElementById('q').value.trim().toLowerCase();
    var by=document.getElementById('srt').value;
    var a=rows.filter(function(r){return !q||r.n.toLowerCase().indexOf(q)>=0;});
    a.sort(by==='n'?function(x,y){return x.n.localeCompare(y.n);}
      :by==='dm'?function(x,y){return Math.abs(y.dm)-Math.abs(x.dm);}
      :function(x,y){return (by==='vol'? y.vol-x.vol : Math.abs(y.s)-Math.abs(x.s));});
    var t='<table><thead><tr><th>Статья</th><th>Динамика</th><th>Итого, ₸</th><th>% выручки</th>'+
          '<th>Медиана</th><th>Пик</th><th>Разброс</th><th>Мес.</th>'+
          '<th'+(isLate(LASTI)?' style="color:#fbbf24"':'')+'>'+L[LASTI]+
          (isLate(LASTI)?'<br><span style="font-weight:600;opacity:.9;font-size:9.5px">не закрыт</span>':'')+
          '</th><th>к '+L[PREVI]+'</th></tr></thead><tbody>';
    a.forEach(function(r){
      var mx=Math.max.apply(null,r.v.map(Math.abs))||1;
      var bars='<div class="bars">'+r.v.map(function(x,ix){
        var hh=Math.max(1,Math.round(Math.abs(x)/mx*26));
        return '<div class="bar'+(Math.abs(x)>=mx*0.999?' hi':'')+'" style="height:'+hh+'px" title="'+
               L[ix]+': '+f0(x)+'"></div>';}).join('')+'</div>';
      /* для расхода снижение — хорошо, для дохода наоборот */
      var good = r.dm===0? 0 : (r.inc ? r.dm>0 : r.dm<0);
      t+='<tr><td>'+esc(r.n)+'</td><td style="min-width:130px">'+bars+'</td>'+
         '<td class="n">'+f0(r.s)+'</td><td class="n">'+pc(r.sh)+'</td>'+
         '<td class="n mut">'+f0(r.med)+'</td><td class="n">'+f0(r.peak)+'</td>'+
         '<td class="n '+(r.vol>3?'neg':r.vol>1.5?'':'mut')+'">'+(r.vol?r.vol.toFixed(1)+'×':'—')+'</td>'+
         '<td class="n mut">'+r.fill+'/'+N+'</td>'+
         '<td class="n'+(estAt(LASTI,r.n)?' est':'')+'">'+f0(r.last)+
         (estAt(LASTI,r.n)?'<span class="est-star" title="месяц не закрыт: по статье проведено меньше обычного">!</span>':'')+'</td>'+
         '<td class="n"><span class="'+(r.dm===0?'mut':good?'pos':'neg')+'">'+
         (r.dm>0?'+':'')+f0(r.dm)+'</span></td></tr>';
    });
    document.getElementById('stbl').innerHTML=t+'</tbody></table>';
  }
  document.getElementById('q').oninput=draw;
  document.getElementById('srt').onchange=draw;
  draw();
};

/* ══ 3. СРАВНЕНИЕ МЕСЯЦЕВ ════════════════════════════════════════ */
BUILD.cmp=function(){
  var el=document.getElementById('s-cmp');
  var opts=L.map(function(x,i){return '<option value="'+i+'">'+x+
    (isLate(i)?' — не закрыт':'')+'</option>';}).join('');
  el.innerHTML='<div class="card"><div class="card-t">Выберите два месяца</div>'+
    '<div class="card-n">Любая пара, не обязательно соседние. Разница показана в тенге '+
    'и в <b>пунктах доли выручки</b>: вторая отвечает на вопрос, стало ли дороже '+
    '<i>по сути</i>, или статья просто шла за объёмом продаж. '+
    '<b>Все цифры — факт из iiko</b>, досчёта на странице нет.'+
    (LASTI<N-1 ? ' По умолчанию сравниваются два последних <b>закрытых</b> месяца — '+
      L[PREVI]+' и '+L[LASTI]+': текущий месяц ещё идёт, и сравнение с ним показывало бы '+
      'экономию там, где просто не наступило число.' : '')+'</div>'+
    '<div class="ctl"><span class="lbl">База:</span><select id="ca">'+opts+'</select>'+
    '<span class="lbl">Сравнить с:</span><select id="cb">'+opts+'</select>'+
    '<button class="chip" id="cprev">← предыдущий месяц</button>'+
    '<button class="chip" id="cyoy">↔ тот же месяц год назад</button>'+
    '</div>'+
    '<div id="ckpi"></div></div>'+
    '<div id="ctodo"></div>'+
    '<div class="card"><div class="card-t">Постатейно: кто дал разницу</div>'+
    '<div class="card-n">Отсортировано по влиянию на прибыль. Красное — стало хуже, зелёное — лучше. '+
    '<b>Кликните по статье</b> — раскроется, за счёт кого именно получилась разница: контрагенты, номенклатура, типы документов.</div>'+
    '<div class="tw" id="ctbl"></div></div>';

  var A=document.getElementById('ca'),B=document.getElementById('cb');
  A.value=PREVI; B.value=LASTI;

  function draw(){
    var i=+A.value,j=+B.value;
    var ra=K.rev[i],rb=K.rev[j];
    var h='<div class="kpis">';
    h+=kpi('Выручка','#38bdf8',fm(rb)+' ₸',L[i]+': '+fm(ra)+' ₸ · '+sgn(rb-ra,fm)+' ₸');
    [['Себестоимость','cogs','#fbbf24'],['Валовая прибыль','gross','#34d399'],
     ['Расходы периода','opex','#f472b6'],['Чистая прибыль','net','#a78bfa']].forEach(function(p){
      var a=K[p[1]][i],b=K[p[1]][j];
      var dpp=(rb?b/rb:0)-(ra?a/ra:0);
      h+=kpi(p[0],p[2],fm(b)+' ₸',
        sgn(b-a,fm)+' ₸ · доля '+(rb?pc(b/rb):'—')+' ('+sgn(dpp*100,function(x){return x.toFixed(1);})+' п.п.)');
    });
    if(isLate(i)||isLate(j)){
      h+='<div class="note" style="border-left:4px solid #fbbf24;margin-top:2px">'+
         '⚠ В сравнении участвует незакрытый месяц ('+
         [i,j].filter(isLate).map(function(x){return L[x];}).join(' и ')+
         '). Показан факт из iiko: зарплата, налоги и часть административных начислений '+
         'ещё не проведены, поэтому расходы занижены, а прибыль выглядит лучше реальной. '+
         'Что именно не проведено и на сколько — в карточке ниже.</div>';
    }
    h+='</div>';
    /* Сколько прибыли месяца держится на досчёте — это и есть точная
       величина того, что бухгалтерия ещё не закрыла. */
    var gi=estGap(i), gj=estGap(j);
    if(gi||gj){
      h+='<div class="note" style="border-left:4px solid #fbbf24">'+
        [ [i,gi],[j,gj] ].filter(function(x){return x[1];}).map(function(x){
          return '<b>'+L[x[0]]+'</b>: не проведено расходов на <b>'+f0(x[1])+' ₸</b> — '+
                 'на столько завышена прибыль месяца';
        }).join('. ')+'. Список — ниже.</div>';
    }
    document.getElementById('ckpi').innerHTML=h;
    document.getElementById('ctodo').innerHTML=
      (estGap(j)? todoCard(j) : '')+(estGap(i)? todoCard(i) : '');
    /* Незакрытый месяц завышает прибыль ровно на сумму непроведённого —
       говорим это прямо в карточке прибыли, а не только текстом ниже. */
    var gj=estGap(j);
    if(gj){
      var kn=document.querySelectorAll('#ckpi .kpi');
      if(kn.length) kn[kn.length-1].insertAdjacentHTML('beforeend',
        '<div class="kpi-warn">завышена на '+f0(gj)+' ₸ — столько ещё не проведено</div>');
    }

    /* «Только факт» убирает досчёт и ставит то, что реально лежит в iiko:
       отклонение становится точным, но по непроведённым статьям оно
       показывает не движение расхода, а то, что бухгалтерия не закрыла. */
    var arr=LINES.filter(function(r){return r.n!=='Торговая выручка'&&r.n!=='Выручка';}).map(function(r){
      var a=r.v[i],b=r.v[j];
      return {n:r.n,a:a,b:b,d:b-a,inc:r.inc,
              p: a? (b-a)/Math.abs(a) : (b?null:0),
              pp: (rb?b/rb:0)-(ra?a/ra:0)};
    }).filter(function(r){return r.a||r.b;});
    arr.sort(function(x,y){return Math.abs(y.d)-Math.abs(x.d);});

    var t='<table><thead><tr><th>Статья</th><th>'+L[i]+'</th><th>'+L[j]+'</th>'+
      '<th>Разница, ₸</th><th>Δ п.п. доли</th>'+
      '<th style="text-align:left">Что это значит</th></tr></thead><tbody>';
    arr.forEach(function(r){
      /* для расхода рост = минус прибыли, для дохода наоборот */
      var worse = r.inc ? r.d<0 : r.d>0;
      var can = detHas(r.n);
      var ea = estAt(i,r.n), eb = estAt(j,r.n);
      /* Причина берётся из проводок iiko: какие контрагенты или позиции
         и создали это движение. Если проводок нет — причины тоже нет. */
      var wh = detWhy(r.n,i,j,r.inc,3);
      /* Досчёта на странице нет — цифры фактические. Но если статья
         не проведена, отклонение говорит не о расходе, а о том, что
         бухгалтерия месяц не закрыла: так и пишем. */
      var why = (ea||eb)
        ? '<span class="est-note">не проведено: в iiko за '+(eb?L[j]:L[i])+' по статье '+
          ((eb?eb.was:ea.was) ? f0(eb?eb.was:ea.was)+' ₸' : 'проводок нет')+
          ', обычно за месяц около '+fm(eb?eb.est:ea.est)+' ₸. Отклонение здесь — не движение '+
          'расхода, а незакрытый месяц.</span>'
        : (!r.a&&r.b) ? '<span class="'+(r.inc?'pos':'neg')+'">статьи не было — появилась на '+fm(r.b)+' ₸</span>'
        : (r.a&&!r.b) ? '<span class="'+(r.inc?'neg':'mut')+'">была '+fm(r.a)+' ₸ — стала ноль; проверьте, не переехала ли на другой счёт</span>'
        : Math.abs(r.pp)<0.002 ? '<span class="mut">двигалась вместе с выручкой</span>'
        : r.inc ? (r.pp>0 ? '<span class="pos">доход вырос на '+fm(r.pp*rb)+' ₸ сверх роста выручки</span>'
                          : '<span class="neg">доход просел на '+fm(-r.pp*rb)+' ₸ относительно выручки</span>')
        : (r.pp>0 ? '<span class="neg">дороже на '+fm(r.pp*rb)+' ₸ сверх роста выручки</span>'
                  : '<span class="pos">дешевле на '+fm(-r.pp*rb)+' ₸ относительно выручки</span>');
      t+='<tr class="'+(can?'dt-row':'')+'" data-n="'+esc(r.n)+'" data-i="'+(r.inc?1:0)+'">'+
         '<td>'+(can?'<span class="dt-caret">▸</span>':'')+esc(r.n)+'</td>'+
         '<td class="n">'+f0(r.a)+'</td><td class="n">'+f0(r.b)+'</td>'+
         '<td class="n"><span class="'+(r.d===0?'mut':worse?'neg':'pos')+'">'+(r.d>0?'+':'')+f0(r.d)+'</span></td>'+
         '<td class="n">'+sgn(r.pp*100,function(x){return x.toFixed(2);})+'</td>'+
         '<td style="text-align:left;white-space:normal;min-width:230px">'+why+
         (wh? '<div class="why-l">'+wh+'</div>' : '')+'</td></tr>';
    });
    document.getElementById('ctbl').innerHTML=t+'</tbody></table>';
    detBind('ctbl',i,j);
  }
  A.onchange=draw; B.onchange=draw;
  document.getElementById('cprev').onclick=function(){
    var j=+B.value; if(j>0){A.value=j-1;draw();} };
  document.getElementById('cyoy').onclick=function(){
    var j=+B.value, mm=M[j].slice(5), y=+M[j].slice(0,4)-1;
    var k=M.indexOf(y+'-'+mm); if(k>=0){A.value=k;draw();} };
  draw();
};

/* ══ ПРОВЕРКА ПЕРВИЧКИ ═══════════════════════════════════════════
   Верхний аудит смотрит на цифры бухгалтерского ОПиУ и говорит «здесь
   всплеск». Этого мало: всплеск может быть настоящим расходом. Ниже
   проверка идёт по самим проводкам iiko и ищет следы неверной разноски,
   сравнивая месяц не с абстрактной нормой, а с привычкой самой статьи.
   Если статья всегда закрывается одним документом без контрагента —
   зарплата, налоги, — это её норма, и замечания не будет. Замечание
   появляется там, где месяц выпал из собственной колеи статьи. */
/* Счета, на которых обязательство может пролежать мимо расхода. Дебиторку
   и кассу сюда не берём: там любой постоянный контрагент есть всегда, и
   «след» получался бы у каждого — это шум, а не доказательство. */
var TRANSIT=['Задолженность перед поставщиками','Авансы выданные','4-Подотчет',
  'Текущие расчеты с сотрудниками'];
var NOCTR={'—':1,'':1,'-':1,'Закрытие периода':1,'Не указан':1};

var PTYPE={first:'проведено первым числом',one:'месяц держится на одном документе',
  noctr:'без контрагента',newctr:'смена контрагента',dup:'возможный дубль'};
var PACT={
  first:'Открыть эти документы и посмотреть дату оказания услуги: если она из прошлого месяца — расход стоит не в своём периоде.',
  one:'Посмотреть, за какой период выставлен документ: одна бумага вместо привычного десятка обычно означает начисление сразу за несколько месяцев.',
  noctr:'Дописать контрагента в документе: без него статью нельзя ни сверить с актом, ни разложить по поставщикам.',
  newctr:'Понять, замена это или добавка: если старый поставщик ушёл, а новый пришёл — роста расхода нет, есть смена подрядчика.',
  dup:'Сверить два документа по номеру и акту: одинаковая сумма у одного контрагента за один месяц — типичное двойное проведение.'};

/* Разбор первички статьи по месяцам: сумма, число документов, сколько
   пришлось на 1-е число, сколько прошло без контрагента, повторы сумм. */
function primProfile(name){
  var p={},ks=[];
  M.forEach(function(ym,i){
    if(isPart(i)) return;                       // неполный месяц не с чем сравнивать
    var e=detOf(ym,name); if(!e) return;
    var docs=e.doc||[]; if(!docs.length) return;
    var n=docs[0].length, tot=0, first=0, nfirst=0, big=0, bigRow=null, dupMax=0;
    var seen={}, firstRows=[];
    docs.forEach(function(x){
      var v=Math.abs(x[n-1]); tot+=v;
      if(v>big){ big=v; bigRow=x; }
      if(/-01$/.test(String(x[0]))){ first+=v; nfirst++; firstRows.push(x); }
      if(v>=200000){
        var k=[x[2],x[3],Math.round(v)].join('|');
        (seen[k]=seen[k]||[]).push(x);
      }
    });
    Object.keys(seen).forEach(function(k){ if(seen[k].length>dupMax) dupMax=seen[k].length; });
    if(tot<=0) return;
    var ctr=e.ctr||[], noc=0;
    ctr.forEach(function(x){ if(NOCTR[x[0]]) noc+=Math.abs(x[1]); });
    p[ym]={i:i,tot:tot,n:docs.length,first:first,nfirst:nfirst,firstRows:firstRows,
           noc:noc,big:big,bigRow:bigRow,dup:dupMax,seen:seen,ctr:ctr,docs:docs,nc:n};
    ks.push(ym);
  });
  p._k=ks; return p;
}
function med(a){ if(!a.length) return 0; var b=a.slice().sort(function(x,y){return x-y;});
  var h=b.length>>1; return b.length%2? b[h] : (b[h-1]+b[h])/2; }

/* Где эта сумма лежала раньше. Расход, попавший не в свой месяц, почти
   всегда до этого висел на задолженности, подотчёте или авансах — если
   контрагент там есть, перенос доказан, а не предположен. */
function primTrace(ctrName,i,s){
  var out=[];
  for(var b=1;b<=2;b++){
    var k=i-b; if(k<0) break;
    TRANSIT.forEach(function(acc){
      var e=detOf(M[k],acc); if(!e||!e.ctr) return;
      e.ctr.forEach(function(x){
        /* сумма на транзитном счёте должна быть соизмерима с найденной:
           иначе это не та же операция, а обычные расчёты с контрагентом */
        if(x[0]===ctrName && x[1]>0 && x[1]>=0.2*Math.abs(s) && x[1]<=3*Math.abs(s))
          out.push({m:k,acc:acc,v:x[1],c:ctrName});
      });
    });
  }
  return out;
}
function primTraceHtml(tr){
  if(!tr.length) return '';
  var many={}; tr.forEach(function(t){ many[t.c]=1; });
  var multi=Object.keys(many).length>1;
  return '<div class="find-d" style="margin-top:5px;color:#8fa2bd"><b style="color:#fbbf24">След:</b> '+
    tr.map(function(t){ return (multi? esc(t.c)+' — ':'')+L[t.m]+', '+f0(t.v)+' ₸ на «'+esc(t.acc)+'»'; }).join('; ')+
    '. Эти суммы уже были в системе, но лежали на счетах расчётов, а не в расходе — '+
    'значит, месяц принял на себя чужой период, а не вырос по-настоящему.';
}

var PRIM=(function(){
  if(!DET) return [];
  var out=[];
  LINES.forEach(function(r){
    if(!detHas(r.n)) return;
    var p=primProfile(r.n), ks=p._k;
    if(ks.length<3) return;                      // без истории нормы нет
    ks.forEach(function(ym,idx){
      var c=p[ym];
      if(c.tot<300000) return;
      if(estAt(c.i,r.n)) return;                 // статья за месяц не проведена — разбирать нечего
      var oth=ks.filter(function(k){return k!==ym;}).map(function(k){return p[k];});
      var mapd=function(fn){ return med(oth.map(fn)); };

      /* 1. Сгущение на 1-е число там, где статья так обычно не работает */
      var shF=c.first/c.tot, bF=mapd(function(o){return o.first/o.tot;});
      if(shF>=0.30 && c.first>=400000 && c.nfirst>=2 && bF<0.15){
        var who={}; c.firstRows.forEach(function(x){ who[x[2]||'—']=(who[x[2]||'—']||0)+Math.abs(x[c.nc-1]); });
        var wl=Object.keys(who).sort(function(a,b){return who[b]-who[a];});
        var tr=[]; wl.slice(0,2).forEach(function(w){ if(!NOCTR[w]) tr=tr.concat(primTrace(w,c.i,who[w])); });
        out.push({t:'first',m:ym,i:c.i,a:r.n,s:c.first,sev:2,
          h:'первым числом проведено '+fm(c.first)+' ₸ — '+Math.round(shF*100)+'% всего оборота статьи за месяц',
          d:c.nfirst+' документ(ов) датированы 1 '+L[c.i].split(' ')[0]+
            ', обычно на первое число у этой статьи приходится '+Math.round(bF*100)+'%. '+
            'Первым числом закрывают то, что относится к прошлому месяцу.',
          w:wl.slice(0,3).map(function(w){return w+' — '+f0(who[w])+' ₸';}).join('; '),
          tr:tr});
      }
      /* 2. Месяц закрыт одним документом, хотя обычно их много */
      var shB=c.big/c.tot, bN=mapd(function(o){return o.n;});
      if(shB>=0.6 && c.big>=500000 && bN>=4 && c.n<bN*0.6){
        var br=c.bigRow||[];
        out.push({t:'one',m:ym,i:c.i,a:r.n,s:c.big,sev:2,
          h:'один документ на '+fm(c.big)+' ₸ даёт '+Math.round(shB*100)+'% месяца',
          d:'в этом месяце по статье '+c.n+' документ(ов), обычно около '+Math.round(bN)+'. '+
            'Так выглядит начисление, сделанное сразу за несколько месяцев.',
          w:'№'+(br[1]||'—')+' от '+String(br[0]||'').split('-').reverse().join('.')+
            (br[2]? ', '+br[2]:'')+(br[3]? ' · '+br[3]:''),
          tr:br[2]&&!NOCTR[br[2]]? primTrace(br[2],c.i,c.big) : []});
      }
      /* 3. Расход без контрагента там, где контрагент обычно есть */
      var shN=c.noc/c.tot, bNC=mapd(function(o){return o.noc/o.tot;});
      if(shN>=0.25 && c.noc>=300000 && bNC<0.10){
        out.push({t:'noctr',m:ym,i:c.i,a:r.n,s:c.noc,sev:1,
          h:fm(c.noc)+' ₸ прошло без контрагента — '+Math.round(shN*100)+'% статьи',
          d:'обычно у этой статьи без контрагента идёт '+Math.round(bNC*100)+'%. '+
            'Такую сумму не с кем сверить: ни акта, ни поставщика.',w:'',tr:[]});
      }
      /* 4. Крупный контрагент, которого месяцем раньше не было */
      if(idx>0 && c.ctr.length<=15){
        var pe=p[ks[idx-1]], had={}, now={};
        pe.ctr.forEach(function(x){ had[x[0]]=x[1]; });
        c.ctr.forEach(function(x){ now[x[0]]=x[1]; });
        c.ctr.forEach(function(x){
          if(NOCTR[x[0]]||x[1]<=0) return;
          if(x[1]<400000||x[1]<0.3*c.tot) return;
          if(had[x[0]]!==undefined) return;
          var gone=pe.ctr.filter(function(y){
            return !NOCTR[y[0]] && now[y[0]]===undefined && y[1]>=0.4*x[1]; });
          out.push({t:'newctr',m:ym,i:c.i,a:r.n,s:x[1],sev:2,
            h:esc(x[0])+' — '+fm(x[1])+' ₸, месяцем раньше по этой статье его не было',
            d:gone.length
              ? 'одновременно исчез '+gone[0][0]+', у которого в '+L[pe.i]+' было '+f0(gone[0][1])+
                ' ₸. Похоже на замену подрядчика: расход не вырос, а переехал.'
              : 'в '+L[pe.i]+' по статье его не было вовсе — либо новый подрядчик, '+
                'либо расход перенесли сюда с другого счёта.',
            w:'', tr:primTrace(x[0],c.i,x[1])});
        });
      }
      /* 5. Две одинаковые суммы у одного контрагента за месяц */
      if(c.dup>1 && mapd(function(o){return o.dup;})<2){
        Object.keys(c.seen).forEach(function(k){
          var g=c.seen[k]; if(g.length<2) return;
          if(NOCTR[g[0][2]]) return;                 // технические документы закрытия не считаем
          var v=Math.abs(g[0][c.nc-1]);
          out.push({t:'dup',m:ym,i:c.i,a:r.n,s:v*(g.length-1),sev:1,
            h:esc(g[0][2]||'—')+' — '+g.length+' документа на одну и ту же сумму '+f0(v)+' ₸',
            d:'у этой статьи повторяющиеся суммы обычно не встречаются. '+
              'Возможно, один и тот же акт проведён дважды.',
            w:g.map(function(x){ return '№'+(x[1]||'—')+' от '+String(x[0]||'').split('-').reverse().join('.'); }).join('; '),
            tr:[]});
        });
      }
    });
  });
  out.sort(function(a,b){ return (b.sev-a.sev)||(Math.abs(b.s)-Math.abs(a.s)); });
  return out;
})();

function primCard(){
  if(!DET) return '<div class="card"><div class="card-t">Проверка первички</div>'+
    '<div class="card-n">Расшифровка из iiko не загрузилась (opiu_detail.js), '+
    'поэтому проверка по проводкам не выполнялась.</div></div>';
  var mon=Object.keys(DETM).filter(function(ym){ var i=M.indexOf(ym); return i>=0&&!isPart(i); });
  mon.sort();
  var span=mon.length? (L[M.indexOf(mon[0])]+' — '+L[M.indexOf(mon[mon.length-1])]) : '—';
  var cnt={}; PRIM.forEach(function(f){ cnt[f.t]=(cnt[f.t]||0)+1; });
  var h='<div class="card"><div class="card-t">Проверка первички из iiko · '+span+'</div>'+
    '<div class="card-n">Здесь проверяются не итоги, а сами проводки. Каждая статья сравнивается '+
    'со своей же привычкой: сколько у неё обычно документов, есть ли у неё контрагент, '+
    'сколько приходится на первое число. Замечание появляется там, где месяц выпал из этой колеи — '+
    'поэтому зарплата и налоги, которые всегда закрываются одним документом, сюда не попадают, '+
    'а услуга, впервые проведённая первым числом сразу за три месяца, попадает. '+
    'Где сумма до этого лежала на задолженности, подотчёте или авансах, показан <b>след</b>: '+
    'это и отличает перенос периода от настоящего роста расхода.</div>';
  if(!PRIM.length) return h+'<div class="empty">По проводкам за '+span+' отклонений от привычки статей не найдено</div></div>';
  h+='<div class="ctl"><span class="lbl">Фильтр:</span>'+
     '<button class="chip on" data-p="">все ('+PRIM.length+')</button>'+
     Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).map(function(k){
       return '<button class="chip" data-p="'+k+'">'+PTYPE[k]+' ('+cnt[k]+')</button>';}).join('')+
     '</div><div id="plist"></div></div>';
  return h;
}
function primList(fl){
  var box=document.getElementById('plist'); if(!box) return;

BUILD.audit=function(){
  var el=document.getElementById('s-audit'),F=D.findings;
  var cnt={}; F.forEach(function(f){cnt[f.t]=(cnt[f.t]||0)+1;});
  var s2=F.filter(function(f){return f.sev===2;}).length;

  var h='<div class="note">Проверка сделана по бухгалтерскому ОПиУ за '+N+' месяцев '+
    '(с '+L[0]+' по '+L[N-1]+'). Ищутся типовые следы неверной разноски: расход, попавший не в свой месяц; '+
    'разовые всплески; минусы в расходных статьях; ровные «оценочные» суммы; статьи, которые начались '+
    'или закончились посреди периода. Вторая проверка идёт по самим проводкам iiko и доводит '+
    'дело до конкретного документа. <b>Это не приговор, а список того, что стоит открыть в первичке.</b></div>';

  h+='<div class="kpis">';
  h+=kpi('Замечаний всего','#a78bfa',F.length,'из них '+s2+' требуют проверки в первую очередь');
  h+=kpi('Свод сходится',D.foot.ok===D.foot.all?'#34d399':'#f87171',
      D.foot.ok+' / '+D.foot.all,
      D.foot.ok===D.foot.all
        ? 'все итоги равны сумме своих строк — арифметика отчёта чистая'
        : 'есть итоги, не равные сумме строк — смотрите замечания «итог не сходится»');
  h+=kpi('По проводкам iiko','#60a5fa',PRIM.length,
      PRIM.length? 'отклонений от привычки статей — разбор ниже, с первичкой'
                 : 'проводки за закрытые месяцы идут в своей колее');
  h+=kpi('Сумма под вопросом','#fbbf24',
      fm(F.filter(function(f){return f.sev===2;}).reduce(function(s,f){return s+f.s;},0))+' ₸',
      'совокупный размер отклонений по красным замечаниям');
  h+='</div>';

  /* с чего начать: три крупнейших красных замечания, по одному на статью */
  var seen={}, top=[];
  F.forEach(function(f){ if(f.sev===2 && !seen[f.a] && f.t!=='class'){ seen[f.a]=1; top.push(f); } });
  if(top.length){
    h+='<div class="card"><div class="card-t">С чего начать</div>'+
       '<div class="card-n">Три самых крупных отклонения, каждое по своей статье. '+
       'По каждому нужен один и тот же шаг: открыть проводки статьи за указанный месяц '+
       'и посмотреть первичный документ.</div><table><thead><tr>'+
       '<th style="text-align:left">Статья</th><th>Месяц</th><th>Размер</th>'+
       '<th style="text-align:left">Что проверить</th></tr></thead><tbody>';
    top.slice(0,3).forEach(function(f){
      h+='<tr><td>'+esc(f.a)+'</td><td class="n">'+(L[M.indexOf(f.m)]||f.m)+'</td>'+
         '<td class="n" style="color:#fbbf24;font-weight:700">'+fm(f.s)+' ₸</td>'+
         '<td style="text-align:left;white-space:normal;min-width:340px">'+
         esc(f.h)+'. '+esc(ACT[f.t]||'')+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  h+=primCard();

  h+='<div class="card"><div class="card-t">Замечания по бухгалтерскому ОПиУ</div>'+
     '<div class="card-n">Эти замечания сделаны по цифрам отчёта, без проводок: '+
     'они показывают, где сумма ведёт себя необычно, но не отвечают, какой документ виноват.</div>'+
     '<div class="ctl"><span class="lbl">Фильтр:</span>'+
     '<button class="chip on" data-f="">все ('+F.length+')</button>'+
     '<button class="chip" data-f="!2">только красные ('+s2+')</button>'+
     Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).map(function(k){
       return '<button class="chip" data-f="'+k+'">'+TYPE[k]+' ('+cnt[k]+')</button>';}).join('')+
     '</div><div id="flist"></div></div>';
  el.innerHTML=h;

  function list(fl){
    var a=F.filter(function(f){return !fl? true : fl==='!2'? f.sev===2 : f.t===fl;});
    document.getElementById('flist').innerHTML = a.length? a.map(function(f){
      return '<div class="find s'+f.sev+'"><div class="find-h">'+
        '<span class="find-a">'+esc(f.a)+'</span>'+
        '<span class="find-t">'+(TYPE[f.t]||f.t)+'</span>'+
        '<span class="find-m">'+(L[M.indexOf(f.m)]||f.m)+'</span></div>'+
        '<div class="find-ti">'+esc(f.h)+'</div>'+
        '<div class="find-d">'+esc(f.d)+'</div>'+
        (ACT[f.t]? '<div class="find-d" style="margin-top:5px;color:#8fa2bd">'+
          '<b style="color:#c4b5fd">Что сделать:</b> '+esc(ACT[f.t])+'</div>':'')+
        (f.s? '<div class="find-s">Величина отклонения: '+fm(f.s)+' ₸</div>':'')+'</div>';
    }).join('') : '<div class="empty">Замечаний этого типа нет</div>';
  }
  list('');
  el.querySelectorAll('.chip[data-f]').forEach(function(c){
    c.onclick=function(){ el.querySelectorAll('.chip[data-f]').forEach(function(x){x.classList.remove('on');});
      c.classList.add('on'); list(c.dataset.f); };
  });
  primList('');
  el.querySelectorAll('.chip[data-p]').forEach(function(c){
    c.onclick=function(){ el.querySelectorAll('.chip[data-p]').forEach(function(x){x.classList.remove('on');});
      c.classList.add('on'); primList(c.dataset.p); };
  });
};

<script>
/* ── «Что не внесено» ───────────────────────────────────────────────
   Считаем по находкам аудита: статья, которая платится почти каждый месяц,
   а в выбранном обнулилась, — это не экономия, а непроведённый документ.
   Такие суммы складываем и показываем, какой на самом деле получается
   результат месяца. Отдельно — то, что внесено оценкой, а не по документу. */
(function(){
  var D=window.OPIU_AUDIT, box=document.getElementById('nv');
  if(!D||!box) return;
  var F=D.findings||[], M=D.months||[], L=D.labels||[], K=D.kpi||{}, META=D.meta||{};
  if(!F.length||!M.length){ box.style.display='none'; return; }
  function ru(n){ return Math.round(Math.abs(n)).toLocaleString('ru-RU').replace(/\u00a0/g,' '); }
  function sign(n){ return (n>0?'+':n<0?'−':'')+ru(n); }
  function lab(m){ var i=M.indexOf(m); return i<0?m:L[i]; }
  /* месяцы, по которым вообще есть находки, свежие первыми */
  var mos=[];
  F.forEach(function(f){ if(f.m&&mos.indexOf(f.m)<0) mos.push(f.m); });
  mos=mos.filter(function(m){ return M.indexOf(m)>=0; }).sort().reverse().slice(0,6);
  if(!mos.length){ box.style.display='none'; return; }
  /* Какой месяц считается отчётным.
     Бухгалтерия закрывает прошлый месяц к 10-му числу следующего. До 10-го
     смотреть на прошлый месяц бессмысленно: он ещё в работе, и «непроведённое»
     в нём — просто незакрытые дни. Поэтому:
       день  < 10 -> отчётный = позапрошлый месяц;
       день >= 10 -> отчётный = прошлый.
     Ровно 10-го числа отчётный месяц сдвигается на следующий сам. */
  function reportMonth(){
    var n=new Date(Date.now()+5*3600000);            // время Алматы
    var y=n.getUTCFullYear(), m=n.getUTCMonth();
    var back=n.getUTCDate()>=10?1:2;
    var d=new Date(Date.UTC(y,m-back,1));
    return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2);
  }
  var RM=reportMonth();
  var def = mos.indexOf(RM)>=0 ? RM
          : (mos.filter(function(m){ var x=META[m]||{}; return x.closed&&x.full; })[0]||mos[0]);
  var cur=def;

  function draw(){
    var i=M.indexOf(cur);
    var zero=F.filter(function(f){ return f.m===cur&&f.t==='zero'; }).sort(function(a,b){return b.s-a.s;});
    var stop=F.filter(function(f){ return f.m===cur&&f.t==='stopped'; }).sort(function(a,b){return b.s-a.s;});
    var round=F.filter(function(f){ return f.m===cur&&f.t==='round'; });
    var spike=F.filter(function(f){ return f.m===cur&&f.t==='spike'; }).sort(function(a,b){return b.s-a.s;});
    var sum=zero.reduce(function(s2,f){ return s2+(f.s||0); },0);
    var net=(K.net&&K.net[i]!=null)?K.net[i]:null;
    var real=net===null?null:net-sum;
    var mt=META[cur]||{};

    var isRM=(cur===RM);
    document.getElementById('nv-head').innerHTML = zero.length
      ? lab(cur)+': не проведено <b style="color:#fbbf24">'+ru(sum)+' ₸</b> по '+zero.length+' статьям'
        +(real!==null&&net>0&&real<0?' · прибыль показана <b>+'+ru(net)+'</b>, фактически <b style="color:#f87171">−'+ru(real)+'</b>':'')
      : lab(cur)+': непроведённых регулярных статей не найдено';

    var h='';
    if(mt.closed&&zero.length){
      h+='<div style="padding:10px 12px;border-radius:9px;background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.35);color:#fecaca;font-size:13px;margin-bottom:12px">'
       +'Месяц помечен в iiko как <b>закрытый</b> (покрытие '+Math.round((mt.share||1)*100)+'%), '
       +'но перечисленное ниже в нём не проведено. Закрытый месяц с непроведённой зарплатой опаснее открытого: '
       +'по нему принимают решения, а выглядит он благополучно.</div>';
    }
    if(zero.length){
      h+='<div style="font-size:13px;font-weight:700;color:#e2e8f0;margin-bottom:6px">Регулярные статьи, которых в этом месяце нет</div>'
       +'<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.04em">'
       +'<td style="padding:4px 6px">Статья</td><td style="padding:4px 6px;text-align:right">Обычно в месяц</td></tr>'
       + zero.map(function(f){ return '<tr><td style="padding:5px 6px;border-bottom:1px solid #2a2010;color:#e2e8f0">'+f.a+'</td>'
           +'<td style="padding:5px 6px;border-bottom:1px solid #2a2010;text-align:right;font-weight:700;color:#fbbf24">'+ru(f.s)+' ₸</td></tr>'; }).join('')
       +'<tr><td style="padding:7px 6px;font-weight:700;color:#e2e8f0">Итого не проведено</td>'
       +'<td style="padding:7px 6px;text-align:right;font-weight:800;color:#fbbf24">'+ru(sum)+' ₸</td></tr></table>';
      if(net!==null){
        h+='<div style="margin-top:10px;padding:10px 12px;border-radius:9px;background:#0f172a;border:1px solid #1e293b;font-size:13px;color:#cbd5e1">'
         +'Чистая прибыль в отчёте <b style="color:#e2e8f0">'+sign(net)+' ₸</b>'
         +' &minus; непроведённое <b style="color:#fbbf24">'+ru(sum)+' ₸</b>'
         +' = фактически <b style="color:'+(real<0?'#f87171':'#4ade80')+'">'+sign(real)+' ₸</b></div>';
      }
    }
    if(round.length){
      h+='<div style="font-size:13px;font-weight:700;color:#e2e8f0;margin:14px 0 6px">Внесено оценкой, а не по документу</div>'
       + round.map(function(f){ return '<div style="padding:8px 10px;border-radius:8px;background:#0f172a;border:1px solid #1e293b;margin-bottom:6px;font-size:12.5px;color:#cbd5e1">'
           +'<b style="color:#e2e8f0">'+f.a+'</b> · '+f.d+'</div>'; }).join('');
    }
    if(stop.length){
      h+='<div style="font-size:13px;font-weight:700;color:#e2e8f0;margin:14px 0 6px">Статьи, которые молчат третий месяц</div>'
       +'<div style="font-size:12px;color:#94a3b8;margin-bottom:6px">Если расход никуда не делся — он теперь сидит в другой строке, и сравнение с прошлым годом врёт.</div>'
       + stop.map(function(f){ return '<div style="padding:6px 10px;border-radius:8px;background:#0f172a;border:1px solid #1e293b;margin-bottom:5px;font-size:12.5px;color:#cbd5e1">'
           +'<b style="color:#e2e8f0">'+f.a+'</b> · '+f.d+'</div>'; }).join('');
    }
    if(spike.length){
      h+='<div style="font-size:13px;font-weight:700;color:#e2e8f0;margin:14px 0 6px">Разовые всплески — проверить первичку</div>'
       + spike.slice(0,6).map(function(f){ return '<div style="padding:6px 10px;border-radius:8px;background:#0f172a;border:1px solid #1e293b;margin-bottom:5px;font-size:12.5px;color:#cbd5e1">'
           +'<b style="color:#e2e8f0">'+f.a+'</b> · '+f.d+'</div>'; }).join('');
    }
    if(!h) h='<div style="font-size:13px;color:#94a3b8">За этот месяц аудит не нашёл непроведённых статей.</div>';
    h+='<div style="margin-top:12px;font-size:11.5px;color:#64748b">'
     +(isRM?'Отчётным считается '+lab(RM)+': бухгалтерия закрывает месяц к 10-му числу следующего, и ровно 10-го отчётный месяц сдвигается сам.'
           :'Открыт '+lab(cur)+'. Отчётный сейчас — '+lab(RM)+'.')+'</div>';
    document.getElementById('nv-body').innerHTML=h;
    [].forEach.call(document.getElementById('nv-mo').children,function(b){
      var on=b.dataset.m===cur;
      b.style.background=on?'rgba(251,191,36,.18)':'#0f172a';
      b.style.borderColor=on?'#fbbf24':'#1e293b';
      b.style.color=on?'#fde68a':'#94a3b8';
    });
  }
  var mo=document.getElementById('nv-mo');
  mos.forEach(function(m){
    var b=document.createElement('button'); b.type='button'; b.dataset.m=m;
    b.textContent=lab(m)+(m===RM?' · отчётный':'');
    b.style.cssText='cursor:pointer;font:inherit;font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8';
    b.onclick=function(ev){ ev.preventDefault(); cur=m; draw(); box.open=true; };
    mo.appendChild(b);
  });
  draw();
  box.addEventListener('toggle',function(){
    var c=document.getElementById('nv-caret'); if(c) c.textContent=box.open?'▴':'▾'; });
})();
</script>
<script src="nav.js"></script>
</body>
