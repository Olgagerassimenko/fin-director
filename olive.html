<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070c17; --line:#1c2740; --line2:#26334d;
  --ink:#eef3fb; --ink2:#c3d0e2; --mut:#7b8ca6; --dim:#546279;
  --oliv:#9ec948; --oliv2:#6f9c22; --fz:#a78bfa; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
}
body{font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;background:
   radial-gradient(900px 520px at 6% -8%,rgba(158,201,72,.13),transparent 60%),
   radial-gradient(780px 460px at 97% 0%,rgba(167,139,250,.09),transparent 60%),var(--bg);
  background-attachment:fixed}
.topbar{display:flex;align-items:center;gap:16px;padding:15px 30px;position:sticky;top:0;z-index:60;
  background:rgba(10,16,29,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.backbtn{display:inline-flex;align-items:center;background:#16203a;color:var(--ink2);border:1px solid var(--line2);
  font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:999px;text-decoration:none;transition:.18s;white-space:nowrap}
.backbtn:hover{background:var(--oliv);color:#13200a;border-color:var(--oliv)}
.topbar h1{font-size:17px;font-weight:900;letter-spacing:-.3px}
.topbar p{font-size:11.5px;color:var(--mut);margin-top:2px}
.live{margin-left:auto;font-size:11.5px;color:#d7eda6;background:rgba(158,201,72,.12);
  border:1px solid rgba(158,201,72,.4);border-radius:999px;padding:6px 13px;font-weight:700;white-space:nowrap}
.section{padding:20px 30px 56px;max-width:1260px;margin:0 auto}

/* ── вердикт ───────────────────────────────────────────────────────────── */
.hero{position:relative;padding:2px;border-radius:22px;margin-bottom:16px;
  background:linear-gradient(135deg,#6f9c22,#d7eda6 28%,#9ec948 55%,#4e7214 80%,#c3e07a);
  background-size:180% 180%;box-shadow:0 26px 60px -26px rgba(0,0,0,.8);
  animation:hIn .7s cubic-bezier(.2,.75,.25,1) both,hGold 10s ease-in-out infinite}
.hero::after{content:"";position:absolute;inset:2px;border-radius:20px;
  background:radial-gradient(130% 120% at 0% 0%,#15202c,#0a1420 55%,#101c1a);z-index:0}
.hero>*{position:relative;z-index:1}
@keyframes hIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes hGold{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero-top{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;padding:20px 24px 6px}
.hero-tag{font-size:10.5px;letter-spacing:.2em;font-weight:800;color:#c3e07a}
.hero-h{margin:8px 0 3px;font-size:23px;font-weight:900;letter-spacing:-.4px;line-height:1.15}
.hero-s{font-size:12.5px;color:#9fb0c4;line-height:1.5;max-width:580px}
.hero-big{text-align:right;min-width:200px}
.hero-big .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#9fb0c4;font-weight:800}
.hero-big .v{font-size:34px;font-weight:900;line-height:1.05;margin-top:3px;color:#d7eda6;letter-spacing:-1px}
.hero-big .s{font-size:12px;color:#8697aa;margin-top:4px}
.hero-k{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:8px 22px 4px}
.hk{border:1px solid rgba(158,201,72,.22);border-radius:14px;padding:13px 15px;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));transition:.22s}
.hk:hover{transform:translateY(-3px);border-color:rgba(158,201,72,.6)}
.hk .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#9fb0c4;font-weight:800}
.hk .v{font-size:21px;font-weight:900;margin-top:4px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hk .s{font-size:11px;color:#8697aa;margin-top:4px;line-height:1.45}
.hero-v{display:flex;gap:12px;align-items:flex-start;margin:12px 22px 20px;padding:14px 16px;border-radius:15px;
  background:linear-gradient(120deg,rgba(158,201,72,.11),rgba(158,201,72,.025));
  border:1px solid rgba(158,201,72,.25);border-left:3px solid var(--oliv)}
.hero-v .vt{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:#c3e07a;margin-bottom:4px}
.hero-v .p{font-size:13px;line-height:1.65;color:#d5deea}.hero-v .p b{color:#f1f6ff}

.card{background:linear-gradient(170deg,#0e1828,#0b1320);border:1px solid var(--line);
  border-radius:18px;padding:18px 20px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:800;margin-bottom:2px}
.card .sub{font-size:12px;color:var(--mut);line-height:1.5;margin-bottom:14px}
.hh{font-size:12.5px;font-weight:800;color:#b9c5d3;margin:20px 0 7px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-bottom:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.t{border:1px solid var(--line2);border-radius:14px;padding:12px 14px;
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.012))}
.t .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:800}
.t .v{font-size:20px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.t .s{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.45}
.up{color:var(--good);font-weight:800}.down{color:var(--bad);font-weight:800}.warn{color:var(--warn);font-weight:800}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.chip{background:#121c30;border:1px solid var(--line2);color:var(--ink2);border-radius:999px;
  padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--oliv);color:var(--ink)}
.chip.on{background:linear-gradient(135deg,var(--oliv),var(--oliv2));color:#13200a;border-color:var(--oliv)}

.wrapx{overflow-x:auto}
svg{display:block}
.tt{position:fixed;pointer-events:none;z-index:200;background:#0b1422;border:1px solid var(--line2);
  border-radius:10px;padding:9px 12px;font-size:12px;color:var(--ink);box-shadow:0 18px 38px -16px #000;
  opacity:0;transition:opacity .12s;max-width:300px;line-height:1.5}
.tt b{color:#fff}.tt .m{color:var(--mut);font-size:11px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);
  font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap}
th:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--ink2)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);font-weight:700}
tbody tr:hover td{background:rgba(255,255,255,.03)}
.inp{background:#0e1728;border:1px solid var(--line2);border-radius:999px;color:var(--ink);
  font:inherit;font-size:12.5px;padding:8px 15px;min-width:240px;outline:none}
.inp:focus{border-color:var(--oliv)}
.btn{background:#121c30;border:1px solid var(--line2);color:var(--ink2);border-radius:999px;
  padding:8px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--oliv);color:var(--ink)}
.ins{background:linear-gradient(120deg,rgba(158,201,72,.1),rgba(158,201,72,.02));
  border:1px solid rgba(158,201,72,.25);border-left:3px solid var(--oliv);border-radius:14px;
  padding:13px 16px;font-size:12.5px;line-height:1.6;color:#dfe7f1;margin-top:13px}
.ins b{color:#d7eda6}
.ins.alert{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.35);border-left-color:var(--warn);color:#fbd99a}
.ins.alert b{color:#fde8b4}
.lst{display:flex;flex-direction:column;gap:6px}
.li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;
  padding:7px 11px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.02);font-size:12.5px}
.li .nm{color:var(--ink2);line-height:1.35}
.li .a{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.li .d{font-size:11px;color:var(--dim);white-space:nowrap;min-width:54px;text-align:right}
.foot{text-align:center;color:var(--dim);font-size:11.5px;padding:24px 0 0}
.err{padding:40px;text-align:center;color:var(--dim);font-size:13px}
@media(max-width:980px){.hero-k{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.section{padding:16px 14px 44px}.topbar{padding:13px 14px}
  .grid3{grid-template-columns:1fr}.hero-big{text-align:left;min-width:0}.hero-h{font-size:19px}}
</style></head>
<body>
<div class="topbar">
  <a class="backbtn" href="index.html">← Пульс</a>
  <div><h1>🫒 Продажи Olive</h1><p>Отдельное направление: выручка, деньги и ассортимент</p></div>
  <div class="live" id="live">—</div>
</div>
<div class="section" id="root"><div class="err">Загружаю данные…</div></div>
<div class="tt" id="tt"></div>

<script src="oliv_data.js" onerror="window.OLIV=null"></script>
<script src="sales_sum.js" onerror="0"></script>
<script src="dz_kz.js?v=3" onerror="0"></script>
<script src="sales_meta.js" onerror="0"></script>
<script>
(function(){
 var D = window.OLIV, root = document.getElementById('root');
 if(!D || !D.months || !D.months.length){
   root.innerHTML = '<div class="err">Данные по Olive ещё не собраны.<br>'
     + 'Файл <code>oliv_data.js</code> появится после ближайшей пересборки продаж.</div>';
   return;
 }

 /* ── формат ─────────────────────────────────────────────────────────── */
 function num(v){ return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
 function mln(v){ var a=Math.abs(v);
   if(a>=1e9) return (v/1e9).toFixed(2).replace('.',',')+' млрд';
   if(a>=1e6) return (v/1e6).toFixed(1).replace('.',',')+' млн';
   if(a>=1e3) return Math.round(v/1e3)+' тыс';
   return num(v); }
 function smln(v){ return (v>0?'+':v<0?'−':'')+mln(Math.abs(v)); }
 function pc(v){ return String(Math.round(v*10)/10).replace('.',','); }
 function spc(v){ return (v>0?'+':v<0?'−':'')+pc(Math.abs(v))+'%'; }
 function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
   return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
 function plw(n,a,b,c){ n=Math.abs(n)%100; var m=n%10;
   if(n>10&&n<20) return c; if(m>1&&m<5) return b; if(m===1) return a; return c; }
 function shortM(l){ return String(l||'').split(' ')[0]; }
 var DAT={'Январь':'январю','Февраль':'февралю','Март':'марту','Апрель':'апрелю','Май':'маю',
          'Июнь':'июню','Июль':'июлю','Август':'августу','Сентябрь':'сентябрю','Октябрь':'октябрю',
          'Ноябрь':'ноябрю','Декабрь':'декабрю'};
 function dat(l){ return DAT[shortM(l)] || String(l||'').toLowerCase(); }
 var PRE={'Январь':'январе','Февраль':'феврале','Март':'марте','Апрель':'апреле','Май':'мае',
          'Июнь':'июне','Июль':'июле','Август':'августе','Сентябрь':'сентябре','Октябрь':'октябре',
          'Ноябрь':'ноябре','Декабрь':'декабре'};
 function pre(l){ return PRE[shortM(l)] || String(l||'').toLowerCase(); }
 function cut(s,n){ s=String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }

 /* ── дни периода: «Октябрь (1–6)» → 6, «Август» → 31 ────────────────── */
 function daysOf(m){
   var f=/\((\d+)\s*[–-]\s*(\d+)\)/.exec(m.label||'');
   if(f) return +f[2]-(+f[1])+1;
   var p=(m.mk||'2026-01').split('-');
   return new Date(+p[0], +p[1], 0).getDate();
 }
 function dimOf(m){ var p=(m.mk||'2026-01').split('-'); return new Date(+p[0], +p[1], 0).getDate(); }

 var MS=D.months, YEAR=D.year;
 MS.forEach(function(m){ m.days=daysOf(m); m.dim=dimOf(m); m.perDay=m.days?m.total_rev/m.days:0;
   /* Сентябрь (1–29) — по сути целый месяц: рисовать над ним прогноз значит
      задваивать подписи. Прогноз показываем только там, где закрыто меньше
      90% дней. */
   m.showFc = !!m.partial && (m.days/m.dim) < 0.9;
   m.fc = m.showFc ? m.perDay*m.dim : m.total_rev; });
 var LAST=MS[MS.length-1], PREV=MS.length>1?MS[MS.length-2]:null;
 /* «последний полный» — где закрыто хотя бы 90% дней: сентябрь (1–29) по сути
    целый месяц, и в тексте честнее опираться на него, а не на август */
 var LASTFULL=null; for(var q=MS.length-1;q>=0;q--){ if(MS[q].days/MS[q].dim>=0.9){ LASTFULL=MS[q]; break; } }

 /* ── деньги: долг, отгрузки и оплаты ────────────────────────────────── */
 var DZ=null;
 (function(){
   var S=window.DZ_KZ; if(!S||!S.dz) return;
   function find(list){ return (list||[]).filter(function(r){
     return /o-?live/i.test(r.name||''); })[0] || null; }
   var top=find(S.dz.top)||find(S.dz.excluded), cg=find(S.dz.consign);
   if(!top && !cg) return;
   DZ={ debt:(top&&top.debt)||(cg&&cg.dz)||0, prev:(top&&top.prev)||0,
        date:S.dz.date||'', prevDate:S.dz.prevDate||'',
        ships:(cg&&cg.ships)||[], pays:(cg&&cg.pays)||[],
        weeks:((S.dz.consignMeta||{}).weeks)||[] };
   DZ.shipSum=DZ.ships.reduce(function(a,b){return a+b;},0);
   DZ.paySum=DZ.pays.reduce(function(a,b){return a+b;},0);
   DZ.perDay=DZ.ships.length?DZ.shipSum/(DZ.ships.length*7):0;
   DZ.dso=DZ.perDay?DZ.debt/DZ.perDay:0;
 })();

 /* ── доля в продажах завода по месяцам ──────────────────────────────── */
 var FZ={}; (function(){
   var S=window.SALES_SUM; if(!S||!S.months) return;
   S.months.forEach(function(x){ FZ[x.k]=x.rev; });
 })();
 function shareOf(m){ var f=FZ[m.mk]; return f? m.total_rev/(m.total_rev+f)*100 : null; }

 /* ── подсказки ──────────────────────────────────────────────────────── */
 var tt=document.getElementById('tt');
 function tipOn(e,html){ tt.innerHTML=html; tt.style.opacity=1;
   var x=e.clientX+14,y=e.clientY+14;
   if(x+tt.offsetWidth>innerWidth-10) x=e.clientX-tt.offsetWidth-14;
   if(y+tt.offsetHeight>innerHeight-10) y=e.clientY-tt.offsetHeight-14;
   tt.style.left=x+'px'; tt.style.top=y+'px'; }
 function tipOff(){ tt.style.opacity=0; }
 function bindTips(sel){ root.querySelectorAll(sel).forEach(function(el){
   var h=el.getAttribute('data-tip'); if(!h) return;
   el.addEventListener('mousemove',function(e){ tipOn(e,h); });
   el.addEventListener('mouseleave',tipOff); }); }

 /* ── график выручки по месяцам с прогнозом ──────────────────────────── */
 function monthsChart(){
   var W=1000,H=310,pL=64,pR=18,pT=38,pB=54;
   var mx=Math.max.apply(null,MS.map(function(m){return Math.max(m.total_rev,m.fc);}))||1;
   var hi=mx*1.16, bw=Math.min(62,(W-pL-pR)/MS.length*0.58);
   function X(i){ return pL+(W-pL-pR)*(i+0.5)/MS.length; }
   function Y(v){ return pT+(H-pT-pB)*(1-v/hi); }
   var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="min-width:660px">';
   for(var g=0;g<=4;g++){ var v=hi*g/4,y=Y(v);
     s+='<line x1="'+pL+'" y1="'+y.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.07)"/>'
       +'<text x="'+(pL-9)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#6f7f93">'+(g?mln(v):'0')+'</text>'; }
   var maxI=MS.reduce(function(b,m,i){ return m.total_rev>MS[b].total_rev?i:b; },0);
   MS.forEach(function(m,i){
     var x=X(i)-bw/2, y=Y(m.total_rev), h=Math.max(2,H-pB-y);
     if(m.showFc){ /* прогноз — лёгкий контур поверх факта */
       var yf=Y(m.fc), hf=Math.max(2,H-pB-yf);
       s+='<rect x="'+x.toFixed(1)+'" y="'+yf.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hf.toFixed(1)
         +'" rx="4" fill="none" stroke="#9ec948" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>'
         +'<text x="'+X(i).toFixed(1)+'" y="'+(yf-9).toFixed(1)+'" text-anchor="middle" font-size="11.5" '
         +'font-weight="800" fill="#c3e07a">'+mln(m.fc)+'<tspan fill="#7b8ca6" font-size="10"> прогноз</tspan></text>';
     }
     s+='<path class="bar" data-i="'+i+'" data-tip="'+esc(tipMonth(m,i))+'" d="M'+x.toFixed(1)+' '+(y+4).toFixed(1)
       +' a4 4 0 0 1 4 -4 h'+(bw-8).toFixed(1)+' a4 4 0 0 1 4 4 v'+(h-4).toFixed(1)+' h'+(-bw)+' Z" fill="#9ec948"/>';
     if(i===0||i===maxI||i===MS.length-1)
       s+='<text x="'+X(i).toFixed(1)+'" y="'+(y-9).toFixed(1)+'" text-anchor="middle" font-size="12" '
         +'font-weight="800" fill="#d7eda6">'+mln(m.total_rev)+'</text>';
     s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-30)+'" text-anchor="middle" font-size="11" fill="#c3d0e2">'
       + shortM(m.label).slice(0,3)+'</text>';
     if(m.showFc) s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-16)+'" text-anchor="middle" font-size="9.5" fill="#6f7f93">'
       + m.days+' '+plw(m.days,'день','дня','дней')+'</text>';
   });
   s+='<line x1="'+pL+'" y1="'+(H-pB)+'" x2="'+(W-pR)+'" y2="'+(H-pB)+'" stroke="rgba(255,255,255,.22)"/>';
   return s+'</svg>';
 }
 function tipMonth(m,i){
   var p=i>0?MS[i-1]:null;
   var d=p&&p.perDay?((m.perDay-p.perDay)/p.perDay*100):null;
   var sh=shareOf(m);
   return '<b>'+esc(m.label)+'</b><br>'+num(m.total_rev)+' ₸'
     +'<br><span class="m">в день '+mln(m.perDay)+' ₸'+(d===null?'':' · '+spc(d)+' к '+dat(p.label)+' по темпу')+'</span>'
     +(m.showFc?'<br><span class="m">прогноз на месяц '+mln(m.fc)+' ₸</span>':'')
     +'<br><span class="m">позиций '+num(m.items.length)+(sh===null?'':' · доля в продажах завода '+pc(sh)+'%')+'</span>';
 }

 /* ── доля направления: линия по месяцам ─────────────────────────────── */
 function shareChart(){
   var pts=MS.map(function(m){ return {m:m, v:shareOf(m)}; }).filter(function(x){ return x.v!==null; });
   if(pts.length<2) return '';

 /* ── ассортимент: ABC, появились / ушли, выросли / упали ────────────── */
 function abcOf(items,total){
   var a=0,b=0,c=0,cum=0,t=total||1;
   items.forEach(function(x){ var before=cum; cum+=x.r;
     if(before/t<0.8) a++; else if(before/t<0.95) b++; else c++; });
   var aRev=0,k=0,run=0;
   for(k=0;k<items.length;k++){ if(run/t>=0.8) break; run+=items[k].r; aRev+=items[k].r; }
   return {a:a,b:b,c:c,aCount:k,aRev:aRev};
 }
 function cmpItems(cur,prev){
   var P={}; (prev.items||[]).forEach(function(x){ P[x.n]=x.r; });
   var C={}; (cur.items||[]).forEach(function(x){ C[x.n]=x.r; });
   var news=[],gone=[],grew=[],fell=[];
   /* неполный месяц сравниваем по темпу в день, иначе всё «упало» */
   var k=(cur.partial||prev.partial) ? (prev.days/ (cur.days||1)) : 1;
   (cur.items||[]).forEach(function(x){
     if(P[x.n]==null){ news.push({n:x.n,r:x.r}); return; }
     var d=x.r*k-P[x.n];
     (d>=0?grew:fell).push({n:x.n,d:d,from:P[x.n],to:x.r});
   });
   (prev.items||[]).forEach(function(x){ if(C[x.n]==null) gone.push({n:x.n,r:x.r}); });
   news.sort(function(a,b){return b.r-a.r;}); gone.sort(function(a,b){return b.r-a.r;});
   grew.sort(function(a,b){return b.d-a.d;}); fell.sort(function(a,b){return a.d-b.d;});
   return {news:news,gone:gone,grew:grew,fell:fell,k:k};
 }

       + col('🆕 Новые позиции', cm.news.slice(0,7), 'up', function(x){ return mln(x.r)+' ₸'; }, function(){ return 'впервые'; })
       + col('⛔ Перестали брать', cm.gone.slice(0,7), 'down', function(x){ return mln(x.r)+' ₸'; },
             function(){ return 'было в '+shortM(p.label).toLowerCase(); })
       + '</div>';
     var lostSum=cm.gone.reduce(function(a,x){return a+x.r;},0), newSum=cm.news.reduce(function(a,x){return a+x.r;},0);
     h+='<div class="ins">💡 Пришло <b>'+num(cm.news.length)+'</b> '+plw(cm.news.length,'новая позиция','новые позиции','новых позиций')
       + ' на <b>'+mln(newSum)+' ₸</b>, ушло <b>'+num(cm.gone.length)+'</b> на <b>'+mln(lostSum)+' ₸</b>'
       + (lostSum>newSum ? ' — выпавшие позиции пока не замещены, это прямая потеря выручки.'
                         : ' — замена идёт с плюсом.')+'</div>';
   }
   return h+'</div>';
 }
 function col(title,rows,cls,fa,fd){
   if(!rows.length) return '<div><div class="hh" style="margin-top:0">'+title+'</div>'
     + '<div class="t" style="color:#546279;font-size:12px">ничего не изменилось</div></div>';
   return '<div><div class="hh" style="margin-top:0">'+title+'</div><div class="lst">'
     + rows.map(function(x){ return '<div class="li"><span class="nm">'+esc(cut(x.n,38))+'</span>'
         + '<span class="a '+cls+'">'+fa(x)+'</span><span class="d">'+fd(x)+'</span></div>'; }).join('')
     + '</div></div>';
 }

 function chipsHtml(){
   return '<div class="chips">'
     + '<button class="chip'+(SEL==='year'?' on':'')+'" data-k="year">весь год</button>'
     + MS.map(function(m){ return '<button class="chip'+(SEL===m.mk?' on':'')+'" data-k="'+m.mk+'">'
         + esc(shortM(m.label))+'</button>'; }).join('')+'</div>';
 }

 function topHtml(){
   var c=cur(), top=(c.top20||[]).slice(0,15).map(function(x){
     return {n:x.name, v:x.rev, p:c.total_rev? x.rev/c.total_rev*100 : 0}; });
   return '<div class="card"><h2>🏆 Топ позиций · '+esc(SEL==='year'?'весь год':c.label)+'</h2>'
     + '<div class="sub">Пятнадцать позиций с наибольшей выручкой за выбранный период.</div>'
     + '<div class="wrapx">'+ranked(top,{pL:300,rowH:28})+'</div></div>';
 }

 function tableHtml(){
   return '<div class="card"><h2>📋 Все позиции</h2>'
     + '<div class="sub">Полный список за выбранный период с динамикой к прошлому месяцу. '
     + 'Клик по заголовку — сортировка.</div>'
     + '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px">'
     + '<input class="inp" id="q" placeholder="Поиск по названию…">'
     + '<button class="btn" id="csv">⤓ Выгрузить в Excel (CSV)</button></div>'
     + '<div class="wrapx"><table id="tbl"><thead><tr>'
     + '<th data-s="n">Позиция</th><th data-s="q" style="text-align:right">Количество</th>'
     + '<th data-s="r" style="text-align:right">Сумма, ₸</th>'
     + '<th data-s="r" style="text-align:right">Доля</th>'
     + '<th data-s="d" style="text-align:right">Δ к прошлому мес.</th></tr></thead><tbody></tbody></table></div></div>';
 }

 /* ── сборка ─────────────────────────────────────────────────────────── */
 function render(){
   root.innerHTML = heroHtml()
     + '<div class="card"><h2>📈 Выручка по месяцам</h2>'
     + '<div class="sub">Факт по месяцам; у неполного месяца пунктиром показан прогноз по текущему темпу — '
     + 'сравнивать «шесть дней» с целым месяцем нельзя.</div>'
     + '<div class="legend"><span><i style="background:#9ec948"></i>факт</span>'
     + '<span><i style="border:1.5px dashed #9ec948;background:transparent"></i>прогноз на месяц</span></div>'
     + '<div class="wrapx" id="ch-m">'+monthsChart()+'</div>'
     + (shareChart() ? ('<div class="hh">Доля Olive в продажах завода, %</div>'
         + '<div class="sub" style="margin-bottom:8px">Какую часть всех продаж завода даёт это направление.</div>'
         + '<div class="wrapx">'+shareChart()+'</div>') : '')
     + '</div>'
     + moneyHtml()
     + assortHtml()
     + topHtml()
     + tableHtml()
     + '<div class="foot">Система «Пульс» · © 2026 · выручка и ассортимент — из выгрузок iiko, '
     + 'долг и оплаты — из раздела ДЗ/КЗ</div>';

   bindTips('.bar');
   root.querySelectorAll('.chip').forEach(function(b){ b.onclick=function(){ SEL=b.dataset.k; render(); }; });
   drawTable();
   document.getElementById('q').oninput=drawTable;
   document.getElementById('csv').onclick=exportCsv;
   root.querySelectorAll('#tbl th').forEach(function(th){
     th.onclick=function(){ var k=th.dataset.s;
       if(TS.k===k) TS.d=-TS.d; else { TS.k=k; TS.d=(k==='n'?1:-1); }
       drawTable(); }; });
 }

 var TS={k:'r',d:-1};
 function rowsNow(){
   var c=cur(), p=prevOf(), q=((document.getElementById('q')||{}).value||'').toLowerCase();
   var P={}; if(p) (p.items||[]).forEach(function(x){ P[x.n]=x.r; });
   var k=(p && (c.partial||p.partial)) ? (p.days/(c.days||1)) : 1;
   var rs=(c.items||[]).map(function(x){
     return {n:x.n,q:x.q,r:x.r, d:(p? (P[x.n]==null? null : x.r*k-P[x.n]) : null)}; });
   if(q) rs=rs.filter(function(x){ return x.n.toLowerCase().indexOf(q)>=0; });
   rs.sort(function(a,b){
     var x=a[TS.k],y=b[TS.k];
     if(TS.k==='n') return TS.d*String(x).localeCompare(String(y),'ru');
     if(x==null) return 1; if(y==null) return -1;
     return TS.d*(x-y); });
   return rs;
 }
 function drawTable(){
   var c=cur(), rs=rowsNow(), tot=c.total_rev||1, p=prevOf();
   document.querySelector('#tbl tbody').innerHTML = rs.length
     ? rs.map(function(x){
         var dd = x.d==null ? (p?'<span style="color:#546279">новая</span>':'—')
                : '<span class="'+(x.d>=0?'up':'down')+'">'+smln(x.d)+'</span>';
         return '<tr><td>'+esc(x.n)+'</td><td class="n">'+num(x.q)+'</td><td class="n">'+num(x.r)
           + '</td><td class="n" style="color:#7b8ca6;font-weight:600">'+pc(x.r/tot*100)+'%</td>'
           + '<td class="n">'+dd+'</td></tr>'; }).join('')
     : '<tr><td colspan="5" style="color:#546279;padding:22px;text-align:center">ничего не нашлось</td></tr>';
 }
 function exportCsv(){
   var c=cur(), rs=rowsNow();
   var lines=['Позиция;Количество;Сумма, ₸;Доля, %;Δ к прошлому месяцу, ₸'].concat(rs.map(function(x){
     return '"'+String(x.n).replace(/"/g,'""')+'";'+x.q+';'+x.r+';'
       + String(Math.round(x.r/(c.total_rev||1)*1000)/10).replace('.',',')+';'+(x.d==null?'':Math.round(x.d)); }));
   var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
   var a=document.createElement('a');
   a.href=URL.createObjectURL(blob);
   a.download='Продажи Olive — '+(SEL==='year'?'год':c.label)+'.csv';
   a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
 }

 document.getElementById('live').textContent =
   'обновлено ' + (((window.SALES_META||{}).updated) || 'ежедневно из iiko');
 render();
})();
</script>
</body></html>
