<!doctype html><html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Автор: Ольга Герасименко · Фуд Завод · © 2026. Все права защищены. -->
<title>Производство · Фуд Завод</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#0b1220;--card:#111a2e;--line:#243049;--mut:#8091a8;--txt:#e5edf7;
        --acc:#7c3aed;--gold:#e0b13c;--green:#34d399;--red:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif}
  .topbar{background:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar h1{font-size:19px;font-weight:900;color:#111827;margin:0}
  .topbar .sub{font-size:12.5px;color:#6b7280}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#7c3aed;
        background:#f5f3ff;border:1px solid #c4b5fd;border-radius:20px;padding:7px 15px;text-decoration:none}
  .upd{margin-left:auto;font-size:11.5px;color:#6b7280;white-space:nowrap}

  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .tb{background:#16203a;border:1px solid var(--line);color:#cbd5e1;border-radius:9px;
      padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .tb:hover{background:#1d2947;color:#fff}
  .tb.on{background:var(--acc);border-color:#a78bfa;color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .ct{font-size:14px;font-weight:800;margin-bottom:3px}
  .cs{font-size:11.5px;color:var(--mut);margin-bottom:12px;line-height:1.5}
  .kpis{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .kpi .v{font-size:28px;font-weight:900;line-height:1.1;letter-spacing:-.5px}
  .kpi .l{font-size:12.5px;font-weight:700;margin-top:6px;color:#f1f5f9}
  .kpi .n{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.45}
  .kpi.hi{background:linear-gradient(140deg,rgba(124,58,237,.24),rgba(124,58,237,.07));
          border-color:rgba(167,139,250,.42)}
  .kpi.warn{background:linear-gradient(140deg,rgba(224,177,60,.18),rgba(224,177,60,.05));
            border-color:rgba(224,177,60,.4)}

  .two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--mut);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;
     text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
  th.l{text-align:left}
  td{padding:7px 8px;border-bottom:1px solid #1b2636;text-align:right;font-variant-numeric:tabular-nums}
  td:not(.l){white-space:nowrap}
  th[data-s]{cursor:pointer;user-select:none;transition:color .12s}
  th[data-s]:hover{color:#a78bfa}
  th[data-dir]{color:#c4b5fd}
  td.l{text-align:left;color:#f1f5f9;font-weight:600}
  tr:hover td{background:rgba(255,255,255,.03)}
  .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;border-radius:4px;
       padding:2px 6px;margin-left:6px;background:rgba(224,177,60,.16);color:var(--gold)}
  .bar{height:5px;border-radius:3px;background:#243049;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--acc)}
  .up{color:var(--red)} .down{color:var(--green)}
  .empty{color:var(--mut);font-size:13px;padding:16px 2px}
  .note{background:rgba(224,177,60,.08);border:1px solid rgba(224,177,60,.25);border-radius:12px;
        padding:13px 16px;font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.82);margin-bottom:12px}
  .note b{color:#f0d98c}
  canvas{max-width:100%}
  .pane{display:none} .pane.on{display:block}
  .tall{max-height:520px;overflow:auto;border-radius:9px}
  .tall table th{position:sticky;top:0;background:var(--card);z-index:2}
  .flt{width:100%;box-sizing:border-box;background:#0f1830;border:1px solid var(--line);
       border-radius:9px;color:var(--txt);font-family:inherit;font-size:12.5px;
       padding:8px 11px;margin-bottom:9px;outline:none}
  .flt:focus{border-color:#7c3aed}
  .flt::placeholder{color:#5b6b83}
  .cnt2{font-size:11.5px;color:var(--mut);margin-top:8px}
  .cnt2 b{color:#cbd5e1}
  tr.pick td{background:rgba(124,58,237,.16)!important}
  tr.pickable{cursor:pointer}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .hint{font-size:11.5px;color:var(--mut);margin:9px 0 0}
  .perbar{background:#16203a;border:1px solid var(--line);border-radius:10px;
          padding:9px 14px;font-size:12px;color:#a9b8cc;margin-bottom:12px}
  .perbar b{color:#e5edf7}
  .ins{background:linear-gradient(140deg,rgba(52,211,153,.11),rgba(52,211,153,.03));
       border-color:rgba(52,211,153,.30)}
  .il{margin:8px 0 0;padding-left:19px;font-size:13px;line-height:1.8;color:#dfe9f5}
  .il li{margin-bottom:5px}
  .il b{color:#fff}
  .il .g{color:var(--green);font-weight:700}
  .il .r{color:var(--red);font-weight:700}
</style></head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← На главную</a>
  <div>
    <h1>🏭 Производство</h1>
    <div class="sub">Что и на сколько выпускает завод · данные из iiko</div>
  </div>
  <div class="upd" id="upd">—</div>
</div>

<div class="wrap" id="app"><div class="empty">Загружаю данные производства…</div></div>

<script src="production_data.js?v=3" onerror="window.PROD_DATA=null"></script>
<script>
(function(){
  var D=window.PROD_DATA, app=document.getElementById("app");
  if(!D||!D.mo_keys||!D.mo_keys.length){
    app.innerHTML='<div class="card"><div class="ct">Данных пока нет</div>'+
      '<div class="cs">Производство собирается из iiko вместе с остальными отчётами. '+
      'Цифры появятся после ближайшей ночной сборки.</div></div>';
    return;
  }

  function fmt(n){ return Math.round(n||0).toLocaleString("ru-RU"); }
  function mln(n){ n=n||0;
    if(Math.abs(n)>=1e9) return (n/1e9).toFixed(2).replace(".",",")+" млрд ₸";
    if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1).replace(".",",")+" млн ₸";
    if(Math.abs(n)>=1e3) return Math.round(n/1e3)+" тыс ₸";
    return fmt(n)+" ₸"; }
  function pct(a,b){ return b? Math.round(a/b*100) : 0; }
  function esc(s){ return String(s).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];}); }
  function kpi(cls,v,l,n){ return '<div class="kpi '+cls+'"><div class="v">'+v+'</div>'+
    '<div class="l">'+l+'</div><div class="n">'+n+'</div></div>'; }

  // Период отчёта. Без него любая таблица читается как «неизвестно за что»:
  // сумма в 46,7 млн ₸ ничего не значит, пока не сказано, за какой отрезок.
  var YR=String(D.mo_keys[0]||"").slice(0,4);
  var N=D.mo_keys.length, netto=D.mo_netto, gross=D.mo_gross;
  var yearNetto=netto.reduce(function(a,b){return a+b;},0);
  var yearGross=gross.reduce(function(a,b){return a+b;},0);
  var inner=yearGross-yearNetto;
  // Все сравнения — только между закрытыми месяцами. Сколько их, сборщик
  // считает по календарю и кладёт в D.closed; на старых файлах, где поля ещё
  // нет, откатываемся на прежнюю прикидку по величине выпуска.
  var PER = D.mo_labels[0]+" — "+D.mo_labels[N-1]+" "+YR;
  var PERD = PER+", данные по "+D.through;
  var closed = (D.closed && D.closed>0) ? Math.min(D.closed,N)-1
             : ((N>1 && netto[N-1] < netto[N-2]*0.4) ? N-2 : N-1);
  var cmp=closed-1;
  var dPct=(cmp>=0 && netto[cmp]) ? Math.round((netto[closed]-netto[cmp])/netto[cmp]*100) : null;

  // ── таблица «позиция · сумма · доля · вес» ───────────────────
  // Блок «Что это значит»: короткие выводы человеческим языком, посчитанные
  // из тех же цифр, что и таблицы рядом. Ничего не выдумываем — только то,
  // что прямо следует из данных.
  function insight(items){
    items=(items||[]).filter(function(x){return x;});
    if(!items.length) return '';
    return '<div class="card ins"><div class="ct">Что это значит</div>'+
      '<ul class="il"><li>'+items.join('</li><li>')+'</li></ul></div>';
  }
  function pc(v){ return String(v).replace(".",",").replace("-","−"); }
  function up(v){ return '<span class="r">+'+pc(v)+'%</span>'; }
  function dn(v){ return '<span class="g">'+pc(v)+'%</span>'; }
  function sig(d){ return d>0? up(d) : dn(d); }

  var _tid=0;
  function rows(list,total,markOwn,unitCol){
    if(!list||!list.length) return '<div class="empty">Нет данных.</div>';
    var max=list[0].s||1;
    // Таблица отдаётся целиком, а не первой сороковкой: сортировка и поиск
    // должны работать по всей базе. Длинный список кладём в прокрутку,
    // чтобы страница не растягивалась на десять экранов.
    var id='tb'+(++_tid), big=list.length>25;
    var html='<table id="'+id+'"><tr><th class="l">Позиция</th>'+(unitCol?'<th>Количество</th>':'')+
      '<th>Сумма</th><th>Доля</th><th class="l" style="width:110px">Вес</th></tr>'+
      list.map(function(r){
        return '<tr><td class="l">'+esc(r.n)+(markOwn&&r.own?'<span class="tag">своё</span>':'')+'</td>'+
          (unitCol?'<td data-v="'+(r.kg||0)+'">'+fmt(r.kg)+' '+esc(r.u||'')+'</td>':'')+
          '<td data-v="'+(r.s||0)+'">'+mln(r.s)+'</td>'+
          '<td data-v="'+(r.s||0)+'" style="color:#94a3b8">'+pct(r.s,total)+'%</td>'+
          '<td><div class="bar"><i style="width:'+Math.max(2,Math.round(r.s/max*100))+'%"></i></div></td></tr>';
      }).join("")+'</table>';
    if(!big) return html;
    return '<input class="flt" data-t="'+id+'" placeholder="Поиск по названию — всего '+
      fmt(list.length)+' позиций">'+
      '<div class="tall">'+html+'</div>'+
      '<div class="cnt2">Показано <b class="cnt" data-t="'+id+'">'+fmt(list.length)+'</b> из '+
      fmt(list.length)+' · сортировка — клик по заголовку столбца</div>';
  }
  function sum(list,f){ return (list||[]).reduce(function(a,r){return a+(f?f(r):r.s);},0); }

  // ── вкладки ──────────────────────────────────────────────────
  var TABS=[["out","Выпуск"],["cost","Себестоимость единицы"],
            ["dis","Разделка"],["tr","Переработка и пересорт"],["wo","Списания"],
            ["inv","Инвентаризации"],["tc","Тех.карта"],
            ["grp","Из чего себестоимость"]];

  app.innerHTML =
  '<div class="tabs">'+TABS.map(function(t,i){
     return '<button class="tb'+(i?'':' on')+'" data-p="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>'+
  '<div class="perbar">Период отчёта: <b>'+PER+'</b> · данные из iiko по <b>'+D.through+
  '</b> · последний закрытый месяц — <b>'+D.mo_labels[closed]+'</b></div>'+

  // ═══ ВЫПУСК ═══
  '<div class="pane on" id="p-out">'+
    '<div class="kpis">'+
      kpi("hi",mln(netto[closed]),"Товарный выпуск за "+D.mo_labels[closed],
          (dPct===null?"":(dPct>0?"+":"")+dPct+"% к "+D.mo_labels[cmp]+" · ")+
          "последний закрытый месяц")+
      kpi("",mln(yearNetto),"С начала года","товарной продукции за "+N+" мес.")+
      kpi("",fmt(D.fin_count)+" / "+fmt(D.inp_count),"Позиций: выпуск / сырьё",
          "из них "+fmt(D.own_count)+" — полуфабрикаты своего передела")+
      kpi("",pct(inner,yearGross)+"%","Внутренний передел",
          mln(inner)+" — полуфабрикаты, посчитанные дважды")+
    '</div>'+
    '<div class="note"><b>Почему «оборот производства» обманчив.</b> Одна проводка списывает сырьё '+
    'и приходует продукцию на одну и ту же сумму, поэтому оборот сам по себе ничего не говорит. '+
    'Полуфабрикат при этом считается дважды — когда его сделали и когда пустили в дело. '+
    '<b>Товарный выпуск</b> — это выпуск за вычетом того, что тут же вернулось в производство; '+
    'только он сопоставим с выручкой и себестоимостью продаж.</div>'+
    insight([
      (function(){
        if(cmp<0) return "";
        var d=Math.round((netto[closed]-netto[cmp])/(netto[cmp]||1)*100);
        return "В "+D.mo_labels[closed]+" завод выпустил товарной продукции на <b>"+mln(netto[closed])+
          "</b> — это "+sig(d)+" к "+D.mo_labels[cmp]+". Сравниваем только закрытые месяцы.";})(),
      "Каждый третий тенге оборота производства — внутренний передел: <b>"+mln(inner)+
        "</b> ("+pct(inner,yearGross)+"%) это полуфабрикаты, которые завод сделал сам и тут же пустил в дело. "+
        "На выручку они работают только через готовую продукцию, поэтому в товарный выпуск не попадают.",
      (function(){
        var t10=(D.finished||[]).slice(0,10).reduce(function(a,r){return a+r.s;},0);
        var all=sum(D.finished);
        if(!all) return "";
        return "Десять позиций из "+fmt(D.fin_count)+" дают <b>"+pct(t10,all)+
          "%</b> товарного выпуска — производство сосредоточено в узком ядре ассортимента.";})(),
      (function(){
        var lim=Math.max(1,closed+1), mx=0, mn=0;
        for(var i=1;i<lim;i++){ if(netto[i]>netto[mx])mx=i; if(netto[i]<netto[mn])mn=i; }
        if(mx===mn) return "";
        return "Самый сильный закрытый месяц — <b>"+D.mo_labels[mx]+"</b> ("+mln(netto[mx])+
          "), самый слабый — <b>"+D.mo_labels[mn]+"</b> ("+mln(netto[mn])+"). Разница "+
          Math.round((netto[mx]/(netto[mn]||1)-1)*100)+"%.";})()
    ])+
    '<div class="card"><div class="ct">Выпуск по месяцам</div>'+
    '<div class="cs">Столбики — товарный выпуск. Линия — весь оборот производства вместе с переделом.</div>'+
    '<div style="height:280px"><canvas id="chMo"></canvas></div></div>'+
    '<div class="two">'+
      '<div class="card"><div class="ct">Что производим</div>'+
      '<div class="cs">Товарный выпуск по позициям за '+PER+'. Все '+fmt(D.fin_count)+' позиций.</div>'+
      rows(D.finished,sum(D.finished),false,false)+'</div>'+
      '<div class="card"><div class="ct">Что уходит в производство</div>'+
      '<div class="cs">Сырьё и полуфабрикаты по стоимости списания за '+PER+'. '+
      'Все '+fmt(D.inp_count)+' позиций. Метка «своё» — позиция, которую завод сам же и производит.</div>'+
      rows(D.inputs,sum(D.inputs),true,false)+'</div>'+
    '</div>'+
    (D.stores&&D.stores.length>1 ?
     '<div class="card"><div class="ct">Где производим</div>'+
     '<div class="cs">Оборот производства по складам и цехам за '+PER+'.</div>'+
     rows(D.stores,sum(D.stores),false,false)+'</div>' : '')+
  '</div>'+

  // ═══ СЕБЕСТОИМОСТЬ ЕДИНИЦЫ ═══
  '<div class="pane" id="p-cost">'+
    '<div class="note"><b>Зачем это.</b> Выпуск может расти просто потому, что больше произвели. '+
    'Себестоимость единицы показывает другое: дорожает ли само производство. Считается как '+
    'товарный выпуск в тенге, делённый на количество, по каждому месяцу.</div>'+
    (D.unitcost&&D.unitcost.length ? unitTable() :
     '<div class="card"><div class="empty">Недостаточно данных по количеству.</div></div>')+
  '</div>'+

  // ═══ РАЗДЕЛКА ═══
  '<div class="pane" id="p-dis">'+ splitPane(D.disasm,"Разделка",
    "Туша или отруб разбирается на части. В деньгах разделка сходится всегда — iiko разносит "+
    "себестоимость по выходам. Смотреть надо килограммы: сколько ушло в разделку и сколько получено.",
    "chDis","это кость, обрезь, жир и усушка") +'</div>'+

  // ═══ ПЕРЕРАБОТКА ═══
  '<div class="pane" id="p-tr">'+ splitPane(D.transf,"Переработка и пересорт",
    "Одна позиция превращается в другую: сортность, фасовка, перевод в другой артикул. "+
    "Здесь же видна усушка — когда вошло больше килограммов, чем вышло.",
    "chTr","это усушка и обрезь при фасовке") +'</div>'+

  // ═══ СПИСАНИЯ ═══
  '<div class="pane" id="p-wo">'+ woPane() +'</div>'+

  // ═══ ИНВЕНТАРИЗАЦИИ ═══
  '<div class="pane" id="p-inv">'+ invPane() +'</div>'+

  // ═══ ТЕХ.КАРТА ═══
  '<div class="pane" id="p-tc">'+ tcPane() +'</div>'+

  // ═══ СТРУКТУРА ПО ГРУППАМ ═══
  '<div class="pane" id="p-grp">'+ grpPane() +'</div>';

  // ── себестоимость единицы ────────────────────────────────────
  function unitTable(){
    var L=D.mo_labels;
    var upN=0,dnN=0,mxU=null,mnU=null;
    D.unitcost.forEach(function(r){
      if(r.d>0)upN++; else if(r.d<0)dnN++;
      if(!mxU||r.d>mxU.d)mxU=r; if(!mnU||r.d<mnU.d)mnU=r;
    });
    return insight([
      "Из "+D.unitcost.length+" позиций с историей подорожало <b>"+upN+"</b>, подешевело <b>"+dnN+
        "</b>. Это себестоимость одной единицы, объём тут ни при чём.",
      mxU? "Сильнее всего выросла <b>"+esc(mxU.n)+"</b>: "+up(mxU.d)+" за период. "+
        "Такой скачок — это либо подорожавшее сырьё, либо изменённая рецептура; стоит проверить по закупу." : "",
      mnU&&mnU.d<0? "Сильнее всего подешевела <b>"+esc(mnU.n)+"</b>: "+dn(mnU.d)+
        ". Падение больше чем на четверть обычно означает не экономию, а смену состава или пересчёт норм — тоже повод посмотреть." : ""
    ])+
    '<div class="card"><div class="ct">Как менялась себестоимость единицы</div>'+
    '<div class="cs">Первый закрытый месяц каждой позиции принят за 100. Линия выше 100 — '+
    'единица продукции стала дороже, ниже — дешевле. <b>Кликните строку в таблице ниже</b>, '+
    'чтобы добавить позицию на график или убрать её; клик по названию в легенде прячет линию.</div>'+
    '<div style="height:300px"><canvas id="chCost"></canvas></div>'+
    '<div class="hint" id="ucHint"></div></div>'+
    '<div class="card"><div class="ct">Себестоимость единицы по месяцам</div>'+
      '<div class="cs">Все '+fmt(D.unitcost.length)+' позиций, у которых есть история хотя бы за '+
      'три закрытых месяца. Изменение — от первого закрытого месяца с данными к последнему '+
      'закрытому: незакрытый месяц в сравнение не берём. Клик по строке ставит позицию на график.</div>'+
      '<input class="flt" data-t="tbUC" placeholder="Поиск по названию — всего '+
        fmt(D.unitcost.length)+' позиций">'+
      '<div class="tall"><table id="tbUC"><tr><th class="l">Позиция</th><th class="l">Ед.</th>'+
      L.map(function(x){return '<th>'+x+'</th>';}).join("")+'<th>Изменение</th></tr>'+
      D.unitcost.map(function(r,i){
        return '<tr class="pickable'+(i<6?' pick':'')+'" data-uc="'+i+'">'+
          '<td class="l">'+esc(r.n)+'</td><td class="l" style="color:#94a3b8;font-weight:400">'+
          esc(r.u||'')+'</td>'+
          r.c.map(function(v){return '<td data-v="'+(v||0)+'">'+
            (v?fmt(v):'<span style="color:#475569">—</span>')+'</td>';}).join("")+
          '<td data-v="'+(r.d||0)+'" class="'+(r.d>0?'up':(r.d<0?'down':''))+'" style="font-weight:700">'+
          (r.d>0?'+':'')+pc(r.d)+'%</td></tr>';
      }).join("")+'</table></div>'+
      '<div class="cnt2">Показано <b class="cnt" data-t="tbUC">'+fmt(D.unitcost.length)+'</b> из '+
      fmt(D.unitcost.length)+' · сортировка — клик по заголовку столбца</div></div>';
  }

  // ── разделка и переработка ───────────────────────────────────
  function splitPane(R,title,expl,cid,loss){
    if(!R||!R.in||!R.in.length) return '<div class="card"><div class="ct">'+title+
      '</div><div class="empty">За период таких операций не было.</div></div>';

    // Вход и выход считаем по каждой единице отдельно: складывать килограммы
    // со штуками и литрами нельзя — «потеря веса» из такой суммы бессмысленна.
    var U=R.units||[];
    var unitRows = U.length ?
      '<table><tr><th class="l">Единица</th><th>Вошло</th><th>Вышло</th><th>Разница</th><th>Доля</th></tr>'+
      U.map(function(u){
        var d=u.in-u.out;
        var cls=d>0?'up':(d<0?'down':'');
        // Доля считается от входа. Если входа не было (позиция только появляется
        // на выходе), процент не имеет смысла — ставим прочерк.
        var ps = u.in>0 ? ((d>0?'−':(d<0?'+':''))+Math.round(Math.abs(d)/u.in*1000)/10+'%')
                        : '<span style="color:#475569">—</span>';
        return '<tr><td class="l">'+esc(u.u)+'</td>'+
          '<td data-v="'+u.in+'">'+fmt(u.in)+'</td><td data-v="'+u.out+'">'+fmt(u.out)+'</td>'+
          '<td data-v="'+(-d)+'" class="'+cls+'" style="font-weight:700">'+
            (d>0?'−':(d<0?'+':''))+fmt(Math.abs(d))+'</td>'+
          '<td data-v="'+(u.in>0?(-d/u.in):0)+'" class="'+cls+'">'+ps+'</td></tr>';
      }).join("")+'</table>' :
      '<div class="empty">Нет данных по количеству.</div>';

    var main=U.length? U[0] : null;
    var yield_ = (main&&main.in>0)? Math.round(main.out/main.in*1000)/10 : null;
    return '<div class="kpis">'+
      kpi("",mln(R.sum),title+" за год","стоимость того, что прошло операцию")+
      (yield_!==null? kpi(yield_<90?"warn":"",String(yield_).replace(".",",")+"%","Выход по «"+esc(main.u)+"»",
          fmt(main.in)+" "+esc(main.u)+" вошло → "+fmt(main.out)+" "+esc(main.u)+" вышло") : "")+
      kpi("",fmt(R.n_in)+" → "+fmt(R.n_out),"Позиций: вход → выход","сколько разной номенклатуры участвует")+
    '</div>'+
    '<div class="note">'+expl+'</div>'+
    insight([
      (yield_===null? "" : (yield_<100
        ? ("Из каждых 100 "+esc(main.u)+", отправленных в операцию, обратно приходит <b>"+
           String(yield_).replace(".",",")+"</b>. Не возвращается "+fmt(main.in-main.out)+" "+
           esc(main.u)+" за год"+(loss? " — "+loss : "")+"."+
           (R.sum&&main.in? " В деньгах вход стоит "+mln(R.sum)+", то есть невозвратная часть — около <b>"+
             mln(R.sum*(main.in-main.out)/main.in)+"</b>." : ""))
        : ("По «"+esc(main.u)+"» вес не теряется: вошло "+fmt(main.in)+", вышло "+fmt(main.out)+
           " ("+String(yield_).replace(".",",")+"%). Прибавка по количеству — это обычно перефасовка "+
           "в более мелкую единицу, а не появление товара из ниоткуда."))),
      (function(){
        var bad=U.filter(function(u){return u.in>0 && (u.in-u.out)/u.in>0.02;});
        var good=U.filter(function(u){return u.in>0 && (u.out-u.in)/u.in>0.02;});
        var t="";
        if(bad.length) t+="Теряют в весе: <b>"+bad.map(function(u){return esc(u.u)+" ("+
          dn(-Math.round((u.in-u.out)/u.in*1000)/10)+")";}).join(", ")+"</b>. ";
        if(good.length) t+="Прибавляют: <b>"+good.map(function(u){return esc(u.u)+" ("+
          up(Math.round((u.out-u.in)/u.in*1000)/10)+")";}).join(", ")+
          "</b> — прибавка по количеству означает фасовку в более мелкую единицу, а не «выросло из ниоткуда».";
        return t;})(),
      (R.in&&R.in.length? "Основное сырьё операции — <b>"+esc(R.in[0].n)+"</b>: "+mln(R.in[0].s)+
        " ("+pct(R.in[0].s,sum(R.in))+"% всей операции)." : "")
    ])+
    (cid? '<div class="card"><div class="ct">Выход по единицам измерения</div>'+
      '<div class="cs">За '+PER+'. Сколько процентов от того, что вошло, вернулось обратно. '+
      '100% — ничего не потеряли. Наведите на полосу, чтобы увидеть килограммы. Единицы, '+
      'у которых входа не было, на графике не показаны — считать выход не от чего.</div>'+
      '<div style="height:250px"><canvas id="'+cid+'"></canvas></div></div>' : '')+
    '<div class="card"><div class="ct">Вход и выход по единицам измерения</div>'+
    '<div class="cs">За '+PER+'. Килограммы, литры и штуки считаются отдельно — сложить их '+
    'в одно число нельзя. Минус в разнице означает, что вышло меньше, чем вошло.</div>'+unitRows+'</div>'+
    '<div class="two">'+
      '<div class="card"><div class="ct">Что уходит в операцию</div>'+
      '<div class="cs">Все '+R.n_in+' позиций за '+PER+'. Сумма — стоимость того, что списано в операцию.</div>'+
      rows(R.in,sum(R.in),false,true)+'</div>'+
      '<div class="card"><div class="ct">Что получается</div>'+
      '<div class="cs">Все '+R.n_out+' позиций за '+PER+'. Сумма — стоимость того, что получено.</div>'+
      rows(R.out,sum(R.out),false,true)+'</div>'+
    '</div>';
  }

  // ── списания ─────────────────────────────────────────────────
  function woPane(){
    var W=D.writeoff;
    if(!W||!W.by_product||!W.by_product.length)
      return '<div class="card"><div class="ct">Списания</div><div class="empty">Списаний нет.</div></div>';
    var avg=W.sum/N;
    return '<div class="kpis">'+
      kpi("warn",mln(W.sum),"Списано с начала года","за "+N+" мес., по себестоимости")+
      kpi("",mln(avg),"В среднем за месяц","ровный уровень или всплески — видно на графике")+
      kpi("",fmt(W.n),"Позиций в списаниях","сколько разной номенклатуры попадало в списание")+
      kpi("",fmt(W.by_store.length),"Складов и цехов","откуда идут списания")+
    '</div>'+
    insight([
      "Списания идут ровным потоком — в среднем <b>"+mln(avg)+"</b> в месяц. Это не разовая порча, "+
        "а постоянный процесс: брак, сроки, зачистка. К товарному выпуску это "+
        (yearNetto? (Math.round(W.sum/yearNetto*1000)/10+"").replace(".",",") : "0")+"%.",
      (W.by_product&&W.by_product.length? "Крупнейшая позиция — <b>"+esc(W.by_product[0].n)+"</b>: "+
        mln(W.by_product[0].s)+", это "+pct(W.by_product[0].s,W.sum)+"% всех списаний." : ""),
      (W.by_store&&W.by_store.length? "Больше всего списывает <b>"+esc(W.by_store[0].n)+"</b> — "+
        pct(W.by_store[0].s,W.sum)+"% суммы. С него и надо начинать разбор." : ""),
      (function(){
        if(!W.by_reason||!W.by_reason.length) return "";
        var named=W.named_sum||0;
        if(named>W.sum*0.5) return "Причина указана у <b>"+pct(named,W.sum)+"%</b> списаний — учёт заполняется.";
        var real=W.by_reason.filter(function(r){return r.named;});
        return "<b>Причина списания не указывается.</b> Из "+mln(W.sum)+
          " на счета с настоящей причиной (бракераж, проработка блюд, возвраты) отнесено "+
          mln(named)+" — практически ноль. Всё остальное списано на технические счета, "+
          "названные по складу, то есть в системе просто «списали со склада». "+
          (real.length? "Счета для причин в плане счетов есть ("+real.length+" шт.), их не используют. " : "")+
          "Пока это так, нельзя ответить, что из "+mln(W.sum)+" — брак, что просрочка, а что зачистка.";})(),
      (function(){
        var m=W.mo||[], lim=Math.max(1,closed+1), mx=0;
        for(var i=1;i<lim;i++) if(m[i]>m[mx])mx=i;
        if(!m[mx]||!avg) return "";
        var k=Math.round(m[mx]/avg*100)-100;
        return k>25? ("Выброс в <b>"+D.mo_labels[mx]+"</b>: "+mln(m[mx])+", это "+up(k)+
          " к среднему месяцу. Обычно так выглядит инвентаризация или разовая порча партии.") : "";})()
    ])+
    '<div class="card"><div class="ct">Списания по месяцам</div>'+
    '<div class="cs">Всплеск обычно означает инвентаризацию или разовую порчу, ровный уровень — процесс.</div>'+
    '<div style="height:250px"><canvas id="chWo"></canvas></div></div>'+
    '<div class="two">'+
      '<div class="card"><div class="ct">Что списываем</div>'+
      '<div class="cs">Все позиции за '+PER+', по сумме списания.</div>'+
      rows(W.by_product,sum(W.by_product),false,false)+'</div>'+
      '<div class="card"><div class="ct">Откуда списываем</div>'+
      '<div class="cs">Склады и цеха за '+PER+'. Здесь видно, где именно теряется товар.</div>'+
      rows(W.by_store,sum(W.by_store),false,false)+'</div>'+
    '</div>'+
    (W.by_reason&&W.by_reason.length ?
      '<div class="card"><div class="ct">Почему списываем</div>'+
      '<div class="cs">За '+PER+'. Причина списания в iiko — это счёт, на который его отнесли. '+
      'Счёт, названный так же, как склад, причиной не является: это просто «списано со склада N».</div>'+
      reasonTable(W)+'</div>' : '');
  }


  // ── причины списания ─────────────────────────────────────────
  function reasonTable(W){
    var L=W.by_reason||[], max=L[0]?L[0].s:1;
    return '<table><tr><th class="l">Счёт списания</th><th>Сумма</th><th>Доля</th>'+
      '<th class="l">Это причина?</th><th class="l" style="width:100px">Вес</th></tr>'+
      L.map(function(r){
        return '<tr><td class="l">'+esc(r.n)+'</td>'+
          '<td data-v="'+r.s+'">'+mln(r.s)+'</td>'+
          '<td data-v="'+r.s+'" style="color:#94a3b8">'+pct(r.s,W.sum)+'%</td>'+
          '<td class="l" data-v="'+(r.named?1:0)+'">'+
            (r.named? '<span class="g">да</span>' : '<span style="color:#64748b">нет — просто склад</span>')+'</td>'+
          '<td><div class="bar"><i style="width:'+Math.max(2,Math.round(r.s/max*100))+'%"></i></div></td></tr>';
      }).join("")+'</table>';
  }

  // ── история пересчётов ───────────────────────────────────────
  function histTable(V){
    var H=V.hist||[]; if(!H.length) return '';
    var mo=V.months||N;
    return '<div class="card"><div class="ct">Когда считали</div>'+
      '<div class="cs">Склад, который не пересчитывают, — это не «нет недостач», '+
      'а «недостачи не найдены». Норма для завода — раз в месяц, в последний день.</div>'+
      '<table><tr><th class="l">Склад</th><th>Пересчётов</th><th>Из месяцев</th>'+
      '<th>Последний</th><th>Дней назад</th><th class="l">Оценка</th></tr>'+
      H.slice().sort(function(a,b){return a.cnt-b.cnt;}).map(function(h){
        var bad=h.cnt<mo-1||h.gap>45;
        return '<tr><td class="l">'+esc(h.n)+'</td>'+
          '<td data-v="'+h.cnt+'" class="'+(bad?'up':'down')+'" style="font-weight:700">'+h.cnt+'</td>'+
          '<td data-v="'+mo+'" style="color:#94a3b8">'+mo+'</td>'+
          '<td class="l" data-v="'+h.last.replace(/-/g,'')+'">'+h.last+'</td>'+
          '<td data-v="'+h.gap+'" class="'+(h.gap>45?'up':'')+'">'+h.gap+'</td>'+
          '<td class="l" data-v="'+(bad?0:1)+'">'+(bad?
            '<span class="r">считают через раз</span>':'<span class="g">регулярно</span>')+'</td></tr>';
      }).join("")+'</table></div>';
  }

  // ── инвентаризации ───────────────────────────────────────────
  function invPane(){
    var V=D.invent;
    if(!V||!V.by_store||!V.by_store.length)
      return '<div class="card"><div class="ct">Инвентаризации</div>'+
        '<div class="empty">Пересчётов за период не было.</div></div>';
    var share=yearNetto? (V.net/yearNetto*100) : 0;
    // Средний месяц считаем только по закрытым: инвентаризация текущего месяца
    // ещё не проведена, и её почти нулевая сумма занизила бы среднее.
    var mo=V.mo_out||[], big=mo.filter(function(v){return v>(V.sum_out/mo.length)*0.25;});
    var avg=big.length? big.reduce(function(a,b){return a+b;},0)/big.length : 0;

    // таблица «склад · излишки · недостачи · сальдо»
    function storeTable(){
      var max=1; V.by_store.forEach(function(r){ max=Math.max(max,Math.abs(r.s)); });
      return '<table><tr><th class="l">Склад</th><th>Излишки</th><th>Недостачи</th>'+
        '<th>Сальдо</th><th class="l" style="width:110px">Вес</th></tr>'+
        V.by_store.map(function(r){
          var neg=r.s>0;
          return '<tr><td class="l">'+esc(r.n)+'</td>'+
            '<td data-v="'+r.i+'" style="color:#94a3b8">'+mln(r.i)+'</td>'+
            '<td data-v="'+r.o+'" style="color:#94a3b8">'+mln(r.o)+'</td>'+
            '<td data-v="'+r.s+'" class="'+(neg?'up':'down')+'" style="font-weight:700">'+
              (neg?'−':'+')+mln(Math.abs(r.s)).replace('-','')+'</td>'+
            '<td><div class="bar"><i style="width:'+Math.max(2,Math.round(Math.abs(r.s)/max*100))+
              '%;background:'+(neg?'#f87171':'#34d399')+'"></i></div></td></tr>';
        }).join("")+'</table>';
    }
    function posTable(list,neg){
      if(!list||!list.length) return '<div class="empty">Нет данных.</div>';
      var max=list[0].s||1;
      return '<table><tr><th class="l">Позиция</th><th>Количество</th><th>Сумма</th>'+
        '<th class="l" style="width:100px">Вес</th></tr>'+
        list.map(function(r){
          return '<tr><td class="l">'+esc(r.n)+'</td>'+
            '<td data-v="'+(r.kg||0)+'">'+fmt(r.kg)+' '+esc(r.u||'')+'</td>'+
            '<td data-v="'+(r.s||0)+'" class="'+(neg?'up':'down')+'" style="font-weight:700">'+mln(r.s)+'</td>'+
            '<td><div class="bar"><i style="width:'+Math.max(2,Math.round(r.s/max*100))+
              '%;background:'+(neg?'#f87171':'#34d399')+'"></i></div></td></tr>';
        }).join("")+'</table>';
    }

    return '<div class="kpis">'+
      kpi("warn",mln(V.net),"Чистая недостача с начала года",
          "недостачи "+mln(V.sum_out)+" минус излишки "+mln(V.sum_in))+
      kpi("",share.toFixed(1).replace(".",",")+"%","К товарному выпуску",
          "сколько процентов выпуска не доехало до склада")+
      kpi("",mln(avg),"В среднем за месяц","недостач по закрытым пересчётам")+
      kpi("",fmt(V.n),"Позиций в расхождениях","сколько разной номенклатуры расходилось с учётом")+
    '</div>'+
    '<div class="note"><b>Как это читать.</b> Проводка инвентаризации в iiko двойная: '+
    'в деньгах приход и расход равны, поэтому направление определяется по количеству. '+
    'Излишек и недостача по одной позиции сворачиваются между собой — в таблицах ниже '+
    'уже чистый результат. <b>Пересорт</b> (нашли одно, потеряли другое на том же складе) '+
    'даёт сальдо около нуля; настоящая потеря — это склад с большим минусом.</div>'+
    insight([
      "За "+N+" месяцев пересчёты дали чистую недостачу <b>"+mln(V.net)+"</b>: нашлось на "+
        mln(V.sum_in)+", не нашлось на "+mln(V.sum_out)+".",
      (function(){
        var w=(V.by_store||[])[0];
        if(!w||w.s<=0||!V.net) return "";
        return "Почти всё сосредоточено в одном месте: <b>"+esc(w.n)+"</b> даёт "+
          Math.round(w.s/V.net*100)+"% чистой недостачи ("+mln(w.s)+"). Остальные склады "+
          "расходятся в пределах пересорта — там нашли одно, потеряли другое, сальдо около нуля.";})(),
      (function(){
        var t=(V.short||[]).slice(0,3);
        if(!t.length) return "";
        return "Крупнейшие потери: <b>"+t.map(function(r){return esc(r.n)+" ("+mln(r.s)+")";}).join(", ")+
          "</b>. Если это расходники и упаковка, значит они не списываются документами по факту "+
          "расхода, а всплывают раз в месяц одной суммой при пересчёте — тогда это вопрос к учёту, "+
          "а не к сохранности.";})(),
      (yearNetto? "К товарному выпуску чистая недостача — <b>"+
        (Math.round(V.net/yearNetto*1000)/10+"").replace(".",",")+"%</b>." : ""),
      (function(){
        var H=V.hist||[]; if(!H.length) return "";
        var mo=V.months||N;
        var bad=H.filter(function(h){return h.cnt<mo-1||h.gap>45;});
        if(!bad.length) return "Все склады пересчитывают регулярно — раз в месяц.";
        bad.sort(function(a,b){return a.cnt-b.cnt;});
        var top=bad.slice(0,3).map(function(h){
          return "<b>"+esc(h.n)+"</b> — "+h.cnt+" раз"+(h.cnt===1?"":"а")+" за "+mo+" мес. (последний "+
            h.last+")";}).join(", ");
        return "<b>Пересчитывают не все:</b> "+top+
          (bad.length>3? " и ещё "+(bad.length-3)+" склад"+(bad.length-3===1?"":"а") : "")+
          ". По этим складам недостача не «ноль», а «не искали» — цифры выше занижены ровно на то, "+

  // ── тех.карта: норма против факта ────────────────────────────
  function tcPane(){
    var T=D.techcard;
    if(!T||!T.rows||!T.rows.length)
      return '<div class="card"><div class="ct">Тех.карта</div>'+
        '<div class="cs">Сравнение нормы с фактом появится после ближайшей ночной сборки: '+
        'тех.карты тянутся из iiko отдельным запросом.</div></div>';

    var dev = T.plan_sum? (T.fact_sum/T.plan_sum-1)*100 : 0;
    var over = T.rows.filter(function(r){return r.d>1;});
    var under = T.rows.filter(function(r){return r.d<-1;});
    var exact = T.rows.length-over.length-under.length;
    var overMoney = over.reduce(function(a,r){return a+(r.fact-r.plan)*r.kg;},0);
    var nocardSum = (T.nocard||[]).reduce(function(a,r){return a+r.s;},0);

    function tcTable(list,neg){
      if(!list||!list.length) return '<div class="empty">Таких позиций нет.</div>';
      var id='tc'+(++_tid), big=list.length>25;
      var html='<table id="'+id+'"><tr><th class="l">Позиция</th><th>Норма, ₸/ед.</th>'+
        '<th>Факт, ₸/ед.</th><th>Отклонение</th><th>Выпуск</th><th>Цена отклонения</th></tr>'+
        list.map(function(r){
          var money=(r.fact-r.plan)*r.kg;
          return '<tr><td class="l">'+esc(r.n)+'</td>'+
            '<td data-v="'+r.plan+'">'+fmt(r.plan)+'</td>'+
            '<td data-v="'+r.fact+'">'+fmt(r.fact)+'</td>'+
            '<td data-v="'+r.d+'" class="'+(r.d>0?'up':(r.d<0?'down':''))+'" style="font-weight:700">'+
              (r.d>0?'+':'')+String(r.d).replace(".",",")+'%</td>'+
            '<td data-v="'+r.kg+'" style="color:#94a3b8">'+fmt(r.kg)+' '+esc(r.u||'')+'</td>'+
            '<td data-v="'+money+'" class="'+(money>0?'up':'down')+'">'+
              (money>0?'+':'−')+mln(Math.abs(money))+'</td></tr>';
        }).join("")+'</table>';
      if(!big) return html;
      return '<input class="flt" data-t="'+id+'" placeholder="Поиск по названию — всего '+
        fmt(list.length)+' позиций">'+'<div class="tall">'+html+'</div>'+
        '<div class="cnt2">Показано <b class="cnt" data-t="'+id+'">'+fmt(list.length)+'</b> из '+
        fmt(list.length)+' · сортировка — клик по заголовку</div>';
    }

    return '<div class="kpis">'+
      kpi(Math.abs(dev)>3?"warn":"hi",(dev>0?"+":"")+dev.toFixed(1).replace(".",",")+"%",
          "Факт против нормы за "+T.month,
          "фактическое сырьё "+mln(T.fact_sum)+" против "+mln(T.plan_sum)+" по тех.картам")+
      kpi("",fmt(T.n_matched)+" из "+fmt(T.n_fact),"Позиций сравнено",
          "остальные — без карты ("+fmt(T.n_nocard)+") или без фактической цены части сырья ("+
          fmt(T.n_partial)+")")+
      kpi(over.length?"warn":"",fmt(over.length),"Дороже нормы",
          overMoney? "перерасход "+mln(overMoney)+" за месяц" : "перерасхода нет")+
      kpi("",fmt(T.n_cards),"Тех.карт в iiko",
          "действующих на "+T.month+"; без карты выпущено на "+mln(nocardSum))+
    '</div>'+
    '<div class="note"><b>Как это посчитано.</b> Норма берётся из тех.карты iiko: закладка '+
    'каждого ингредиента, делённая на выход по карте. Цена ингредиента — <b>не прайсовая, '+
    'а фактическая</b>: сколько тенге за единицу этого сырья реально списано в производство '+
    'за год. Факт — стоимость выпуска, делённая на количество, за '+T.month+
    ' (последний закрытый месяц). Позиции, где хотя бы у одного ингредиента нет фактической '+
    'цены, в сравнение не берём: неполная норма всегда выглядит дешевле факта, и вывод был бы '+
    'ложным. Поэтому сравнение честное, но не по всему ассортименту.</div>'+
    insight([
      "По сопоставимым позициям завод укладывается в норму "+
        (Math.abs(dev)<1? "<b>точно</b>: расхождение меньше процента."
         : ("с расхождением <b>"+(dev>0?"+":"")+dev.toFixed(1).replace(".",",")+"%</b> — "+
            (dev>0? "фактически сырья уходит больше, чем записано в картах."
                  : "фактически сырья уходит меньше, чем записано в картах."))),
      "<b>"+exact+"</b> позиций сходятся с картой в пределах процента — там учёт и рецептура "+
        "живут одной жизнью. Разбирать надо не их, а хвосты.",
      (over.length? "Дороже нормы — <b>"+over.length+"</b> позиций"+
        (overMoney? ", и это "+mln(overMoney)+" лишнего сырья за месяц" : "")+
        ". Крупнейшая: <b>"+esc(over[0].n)+"</b>, факт "+fmt(over[0].fact)+" ₸/"+esc(over[0].u)+
        " против нормы "+fmt(over[0].plan)+" ("+up(over[0].d)+"). Это либо перерасход в цехе, "+
        "либо замена ингредиента, которую не внесли в карту." : ""),
      (under.length? "Дешевле нормы — <b>"+under.length+"</b> позиций. Это не всегда хорошо: "+
        "чаще означает, что карта устарела и в ней записано больше сырья, чем кладут. "+
        "Крупнейшая: <b>"+esc(under[0].n)+"</b> ("+dn(under[0].d)+")." : ""),
      (T.n_nocard? "<b>"+fmt(T.n_nocard)+"</b> позиций выпускались без тех.карты, на "+
        mln(nocardSum)+". По ним нормы просто нет — себестоимость такая, какая получилась." : "")
    ])+
    '<div class="card"><div class="ct">Кто дальше всех от нормы</div>'+
    '<div class="cs">Отклонение факта от нормы в процентах. Столбик вправо — сырья ушло больше, '+
    'чем по карте; влево — меньше.</div>'+
    '<div style="height:330px"><canvas id="chTc"></canvas></div></div>'+
    '<div class="card"><div class="ct">Дороже нормы</div>'+
    '<div class="cs">Фактическая себестоимость единицы выше расчётной по тех.карте. '+
    '«Цена отклонения» — во сколько это обошлось за '+T.month+'.</div>'+
    tcTable(over,false)+'</div>'+
    '<div class="card"><div class="ct">Дешевле нормы</div>'+
    '<div class="cs">Обычно означает устаревшую карту: в ней записано больше сырья, чем кладут.</div>'+
    tcTable(under,true)+'</div>'+
    ((T.nocard&&T.nocard.length)?
      '<div class="card"><div class="ct">Выпускается без тех.карты</div>'+
      '<div class="cs">По этим позициям нормы нет вовсе — сравнивать не с чем.</div>'+
      rows(T.nocard,nocardSum,false,true)+'</div>' : '');
  }

  // ── структура по группам номенклатуры ────────────────────────
  function grpPane(){
    var G=D.groups;
    if(!G||!G.inp||!G.inp.length)
      return '<div class="card"><div class="ct">Из чего себестоимость</div>'+
        '<div class="empty">Группы номенклатуры не заполнены в справочнике iiko.</div></div>';
    // Проводка производства двойная: стоимость выпуска ВСЕГДА равна стоимости
    // списанного сырья, поэтому «материалоёмкость» здесь тождественно равна
    // ста процентам и ничего не значит. Смысл имеет только структура.
    var buyList=(G.inp||[]).filter(function(r){return !r.own;});
    var top3=buyList.slice(0,3).reduce(function(a,r){return a+r.s;},0);
    var conc=G.buy? Math.round(top3/G.buy*100) : 0;

    return '<div class="kpis">'+
      kpi("hi",mln(G.buy),"Покупное сырьё с начала года",
          "без внутреннего передела — только то, что завод купил")+
      kpi("",conc+"%","Три группы дают",
          (buyList.slice(0,3).map(function(r){return r.n;}).join(" · ")||"—"))+
      kpi("",mln(G.own),"Внутренний передел",
          "полуфабрикаты собственного производства, ушедшие в дело")+
      kpi("",fmt(G.n_inp)+" / "+fmt(G.n_out),"Групп: сырьё / выпуск",
          "вместо тысяч отдельных позиций")+
    '</div>'+
    '<div class="note"><b>Зачем группы.</b> По списку из сорока позиций не видно, из чего '+
    'вообще складывается себестоимость. Группы номенклатуры дают ту же картину в двадцати '+
    'строках: мясо, молочка, овощи, упаковка. Метка <b>«своё»</b> — группа, которую завод '+
    'не только тратит, но и сам выпускает: это внутренний передел, и в покупное сырьё он '+
    'не входит, иначе затраты задвоились бы. <b>Доли, а не «материалоёмкость».</b> '+
    'Проводка производства двойная — стоимость выпуска всегда равна стоимости списанного '+
    'сырья, поэтому отношение одного к другому тождественно сто процентов и ничего не '+
    'показывает. Работает только структура: какая группа сколько занимает и как это '+
    'меняется по месяцам.</div>'+
    insight([
      "Покупное сырьё за "+N+" месяцев — <b>"+mln(G.buy)+"</b>. Внутренний передел ("+mln(G.own)+
        ") сюда не входит: это уже оплаченное сырьё, прошедшее через собственный цех, и второй раз "+
        "его считать нельзя.",
      (buyList.length? "Три группы дают <b>"+conc+"%</b> всего сырья: "+
        buyList.slice(0,3).map(function(r){return "<b>"+esc(r.n)+"</b> ("+pct(r.s,G.buy)+"%)";}).join(", ")+
        ". Экономить имеет смысл здесь — процент с этих трёх строк весит больше, чем весь остальной список." : ""),
      (function(){
        var pk=buyList.filter(function(r){return /упаков|тар[аы]|гофро|расходн/i.test(r.n);});
        var ps=pk.reduce(function(a,r){return a+r.s;},0);
        return ps? ("Упаковка и расходники — <b>"+mln(ps)+"</b>, это "+pct(ps,G.buy)+
          "% сырья. Единственная группа, которую можно сократить, не трогая рецептуру.") : "";})(),
      (function(){
        var best=null;
        buyList.slice(0,8).forEach(function(r){
          var m=r.m||[]; if(!m.length||closed<1) return;
          var a=m[0], b=m[closed]; if(!a||!b) return;
          var d=Math.round((b/a-1)*100);
          if(!best||Math.abs(d)>Math.abs(best.d)) best={n:r.n,d:d};
        });
        return best? ("Сильнее всего за период изменилась группа <b>"+esc(best.n)+"</b>: "+sig(best.d)+
          " от "+D.mo_labels[0]+" к "+D.mo_labels[closed]+".") : "";})()
    ])+
    '<div class="card"><div class="ct">Структура покупного сырья по месяцам</div>'+
    '<div class="cs">Шесть крупнейших групп и всё остальное одной полосой. '+
    'Смотреть надо не на высоту столбика — она идёт за объёмом выпуска, — а на то, '+
    'меняются ли пропорции внутри него.</div>'+
    '<div style="height:290px"><canvas id="chGrp"></canvas></div></div>'+
    '<div class="two">'+
      '<div class="card"><div class="ct">Из чего производим</div>'+
      '<div class="cs">Группы сырья и полуфабрикатов по стоимости списания за '+PER+'.</div>'+
      rows(G.inp,sum(G.inp),true,false)+'</div>'+
      '<div class="card"><div class="ct">Что производим — по группам</div>'+
      '<div class="cs">Выпуск по группам номенклатуры за '+PER+', включая внутренний передел.</div>'+
      rows(G.out,sum(G.out),false,false)+'</div>'+
    '</div>';
  }


  // ── сортировка таблиц по клику на заголовок ──────────────────
  // Числа берём из data-v, а не из текста: «21,6 млн ₸» и «343 шт»
  // как строки сортируются неправильно. Колонку-полоску «Вес» и
  // единицу измерения не трогаем — там сортировать нечего.
  function makeSortable(){
    [].forEach.call(document.querySelectorAll("table"),function(t){
      if(t.getAttribute("data-srt"))return;
      var head=t.rows[0]; if(!head||!head.cells.length)return;
      t.setAttribute("data-srt","1");
      var body=t.rows[1]&&t.rows[1].parentNode; if(!body)return;
      for(var c=0;c<head.cells.length;c++)(function(ci){
        var th=head.cells[ci];
        if(/^\s*вес\s*$/i.test(th.textContent))return;
        th.setAttribute("data-s","1");
        th.title="Нажмите, чтобы отсортировать";
        th.addEventListener("click",function(){
          var dir=(th.getAttribute("data-dir")==="desc")?"asc":"desc";
          for(var j=0;j<head.cells.length;j++){
            var o=head.cells[j];
            o.removeAttribute("data-dir");
            o.innerHTML=o.innerHTML.replace(/\s*[▲▼]$/,"");
          }
          th.setAttribute("data-dir",dir);
          th.innerHTML=th.innerHTML.replace(/\s*[▲▼]$/,"")+(dir==="asc"?" ▲":" ▼");
          var rs=[].slice.call(t.rows,1);
          rs.sort(function(a,b){
            var x=a.cells[ci], y=b.cells[ci];
            if(!x||!y)return 0;
            var xv=x.getAttribute("data-v"), yv=y.getAttribute("data-v"), r;
            if(xv!==null&&yv!==null) r=parseFloat(xv)-parseFloat(yv);
            else r=String(x.textContent||"").localeCompare(String(y.textContent||""),"ru");
            return dir==="asc"? r : -r;
          });
          for(var k=0;k<rs.length;k++) body.appendChild(rs[k]);
        });
      })(c);
    });
  }
  makeSortable();

                return c.dataset.label+": "+c.parsed.y+" (100 = первый месяц)"+
                  (raw? " · "+fmt(raw)+" ₸/"+c.dataset._u : "");}}}},
            scales:{x:{ticks:{color:"#8091a8",font:{size:11}},grid:{display:false}},
                    y:{ticks:{color:"#8091a8",font:{size:10}},grid:{color:"#1b2636"}}}}});
        ucHint();
      }
      ucDraw();
      var tb=document.getElementById("tbUC");
      if(tb) tb.addEventListener("click",function(e){
        var tr=e.target; while(tr&&tr.tagName!=="TR")tr=tr.parentNode;
        if(!tr||!tr.getAttribute)return;
        var a=tr.getAttribute("data-uc"); if(a===null)return;
        var idx=parseInt(a,10), at=UCsel.indexOf(idx);
        if(at>=0){ UCsel.splice(at,1); tr.classList.remove("pick"); }
        else {
          if(UCsel.length>=10){ UCsel.shift();
            var old=tb.querySelector('tr.pick'); if(old)old.classList.remove("pick"); }
          UCsel.push(idx); tr.classList.add("pick");
        }
        ucDraw();
      });
    }
    // Разделка и переработка: вход против выхода по каждой единице
    ["chDis","chTr"].forEach(function(id){
      var el=document.getElementById(id); if(!el)return;
      var R=(id==="chDis")? D.disasm : D.transf;
      if(!R||!R.units||!R.units.length)return;
      var U=R.units.filter(function(u){return u.in>0;});
      if(!U.length)return;
      var vals=U.map(function(u){return Math.round(u.out/u.in*1000)/10;});
      new Chart(el,{type:"bar",data:{labels:U.map(function(u){return u.u;}),
        datasets:[{label:"Выход, % от входа",data:vals,
          backgroundColor:vals.map(function(v){return v<100? "#f87171":"#34d399";}),
          borderRadius:5}]},
        options:{indexAxis:"y",maintainAspectRatio:false,
          plugins:{legend:{display:false},
            tooltip:{callbacks:{
              title:function(c){return "Единица: "+c[0].label;},
              label:function(c){var u=U[c.dataIndex];
                return ["вошло  "+Math.round(u.in).toLocaleString("ru-RU")+" "+u.u,
                        "вышло  "+Math.round(u.out).toLocaleString("ru-RU")+" "+u.u,
                        "выход  "+String(c.parsed.x).replace(".",",")+"%"];}}}},
          scales:{x:{beginAtZero:true,suggestedMax:110,
                     ticks:{color:"#8091a8",font:{size:10},callback:function(v){return v+"%";}},
                     grid:{color:"#1b2636"}},
                  y:{ticks:{color:"#cbd5e1",font:{size:12}},grid:{display:false}}}}});
    });
    var ct=document.getElementById("chTc");
    if(ct&&D.techcard&&D.techcard.rows&&D.techcard.rows.length){
      var R=D.techcard.rows.slice().filter(function(r){return Math.abs(r.d)>0.5;});
      R.sort(function(a,b){return Math.abs(b.d)-Math.abs(a.d);});
      R=R.slice(0,15).sort(function(a,b){return b.d-a.d;});
      new Chart(ct,{type:"bar",data:{labels:R.map(function(r){
          return r.n.length>26? r.n.slice(0,26)+"…" : r.n;}),
        datasets:[{label:"Отклонение от нормы, %",data:R.map(function(r){return r.d;}),
          backgroundColor:R.map(function(r){return r.d>0? "#f87171" : "#34d399";}),borderRadius:4}]},
        options:{indexAxis:"y",maintainAspectRatio:false,
          plugins:{legend:{display:false},
            tooltip:{callbacks:{label:function(c){return (c.parsed.x>0?"+":"")+c.parsed.x+"% к норме";}}}},
          scales:{x:{ticks:{color:"#8091a8",font:{size:10},callback:function(v){return v+"%";}},
                     grid:{color:"#1b2636"}},
                  y:{ticks:{color:"#cbd5e1",font:{size:10}},grid:{display:false}}}}});
    }
    var cg=document.getElementById("chGrp");
    if(cg&&D.groups&&D.groups.inp){
      var PAL=["#7c3aed","#e0b13c","#34d399","#38bdf8","#f472b6","#fb923c","#475569"];
      var buyL=D.groups.inp.filter(function(r){return !r.own;});
      var six=buyL.slice(0,6);
      var ds=six.map(function(r,i){
        return {label:r.n,data:(r.m||[]).map(function(v){return v/1e6;}),
                backgroundColor:PAL[i],borderRadius:3,stack:"s"};});
      var restM=(D.mo_labels||[]).map(function(_,i){
        var t=0; buyL.slice(6).forEach(function(r){t+=(r.m||[])[i]||0;}); return t/1e6;});
      if(restM.some(function(v){return v>0;}))
        ds.push({label:"Прочее",data:restM,backgroundColor:PAL[6],borderRadius:3,stack:"s"});
      new Chart(cg,{type:"bar",data:{labels:D.mo_labels,datasets:ds},
        options:{maintainAspectRatio:false,
          plugins:{legend:{labels:{color:"#cbd5e1",boxWidth:11,font:{size:10}}},
            tooltip:{callbacks:{label:function(c){return c.dataset.label+": "+c.parsed.y.toFixed(1)+" млн ₸";}}}},
          scales:{x:{stacked:true,ticks:{color:"#8091a8",font:{size:11}},grid:{display:false}},
                  y:{stacked:true,beginAtZero:true,ticks:{color:"#8091a8",font:{size:10},
                     callback:function(v){return v+" млн";}},grid:{color:"#1b2636"}}}}});
    }
    var ci=document.getElementById("chInv");
    if(ci&&D.invent&&D.invent.mo_out){
      new Chart(ci,{type:"bar",data:{labels:D.mo_labels,datasets:[
        {label:"Недостачи",data:D.invent.mo_out.map(function(v){return v/1e6;}),
         backgroundColor:"#f87171",borderRadius:5},
        {label:"Излишки",data:(D.invent.mo_in||[]).map(function(v){return v/1e6;}),
         backgroundColor:"#34d399",borderRadius:5}]},
        options:{maintainAspectRatio:false,
          plugins:{legend:{labels:{color:"#cbd5e1",boxWidth:12,font:{size:11}}},
            tooltip:{callbacks:{label:function(c){return c.dataset.label+": "+c.parsed.y.toFixed(2)+" млн ₸";}}}},
          scales:{x:{ticks:{color:"#8091a8",font:{size:11}},grid:{display:false}},
                  y:{beginAtZero:true,ticks:{color:"#8091a8",font:{size:10},
                     callback:function(v){return v+" млн";}},grid:{color:"#1b2636"}}}}});
    }
    var cw=document.getElementById("chWo");
    if(cw&&D.writeoff&&D.writeoff.mo){
      new Chart(cw,{type:"bar",data:{labels:D.mo_labels,
        datasets:[{label:"Списано",data:D.writeoff.mo.map(function(v){return v/1e6;}),
                   backgroundColor:"#e0b13c",borderRadius:5}]},
        options:{maintainAspectRatio:false,plugins:{legend:{display:false},
          tooltip:{callbacks:{label:function(c){return c.parsed.y.toFixed(2)+" млн ₸";}}}},
          scales:{x:{ticks:{color:"#8091a8",font:{size:11}},grid:{display:false}},
                  y:{beginAtZero:true,ticks:{color:"#8091a8",font:{size:10},
                     callback:function(v){return v+" млн";}},grid:{color:"#1b2636"}}}}});
    }
  }

  document.getElementById("upd").textContent="обновлено "+D.updated+" · данные по "+D.through;
})();
</script>
<script src="nav.js"></script>
</body></html>
