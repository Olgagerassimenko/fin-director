<!doctype html><html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Производство · Фуд Завод</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* Единая палитра всей страницы: на тон светлее прежней, чтобы карточки,
     таблицы и графики читались как одно целое, а не как тёмные пятна. */
  :root{--bg:#131c30;--card:#1c2740;--card2:#243152;--line:#33436e;--mut:#9db0ca;--txt:#eef4fb;
        --acc:#8b7cf6;--acc2:#a78bfa;--gold:#f0c674;--green:#5ee0a8;--red:#fb8a8a;
        --grid:#2b3860}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif}
  .topbar{background:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar h1{font-size:19px;font-weight:900;color:#111827;margin:0}
  .topbar .sub{font-size:12.5px;color:#6b7280}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#7c3aed;
        background:#f5f3ff;border:1px solid #c4b5fd;border-radius:20px;padding:7px 15px;text-decoration:none}
  .upd{margin-left:auto;font-size:11.5px;color:#6b7280;white-space:nowrap}

  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .tb{background:var(--card2);border:1px solid var(--line);color:#d6e2f2;border-radius:9px;
      padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .tb:hover{background:#2d3d66;color:#fff}
  .tb.on{background:var(--acc);border-color:var(--acc2);color:#fff;box-shadow:0 2px 12px rgba(139,124,246,.35)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .ct{font-size:14px;font-weight:800;margin-bottom:3px}
  .cs{font-size:11.5px;color:var(--mut);margin-bottom:12px;line-height:1.5}
  .kpis{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .kpi .v{font-size:28px;font-weight:900;line-height:1.1;letter-spacing:-.5px}
  .kpi .l{font-size:12.5px;font-weight:700;margin-top:6px;color:#f1f5f9}
  .kpi .n{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.45}
  .kpi.hi{background:linear-gradient(140deg,rgba(139,124,246,.26),rgba(139,124,246,.08));
          border-color:rgba(167,139,250,.5)}
  .kpi.warn{background:linear-gradient(140deg,rgba(240,198,116,.20),rgba(240,198,116,.06));
            border-color:rgba(240,198,116,.45)}

  .two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--mut);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;
     text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
  th.l{text-align:left}
  td{padding:7px 8px;border-bottom:1px solid #2a3557;text-align:right;font-variant-numeric:tabular-nums}
  td:not(.l){white-space:nowrap}
  th[data-s]{cursor:pointer;user-select:none;transition:color .12s}
  th[data-s]:hover{color:#a78bfa}
  th[data-dir]{color:#c4b5fd}
  td.l{text-align:left;color:#f1f5f9;font-weight:600}
  tr:hover td{background:rgba(255,255,255,.03)}
  .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;border-radius:4px;
       padding:2px 6px;margin-left:6px;background:rgba(224,177,60,.16);color:var(--gold)}
  .bar{height:5px;border-radius:3px;background:#33436e;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--acc)}
  .up{color:var(--red)} .down{color:var(--green)}
  .empty{color:var(--mut);font-size:13px;padding:16px 2px}
  .note{background:rgba(240,198,116,.10);border:1px solid rgba(240,198,116,.30);border-radius:12px;
        padding:13px 16px;font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.88);margin-bottom:12px}
  .note b{color:#f7e3a8}
  canvas{max-width:100%}
  .pane{display:none} .pane.on{display:block}
  /* Внутренних полос прокрутки нет: две прокрутки в одном окне сбивают —
     непонятно, что листаешь. Таблица разворачивается целиком, а шапка
     прилипает к верху экрана, чтобы названия столбцов не терялись. */
  .tall{border-radius:9px}
  .tall table th{position:sticky;top:var(--stick,0px);background:var(--card);z-index:2}
  .flt{width:100%;box-sizing:border-box;background:#16203a;border:1px solid var(--line);
       border-radius:9px;color:var(--txt);font-family:inherit;font-size:12.5px;
       padding:8px 11px;margin-bottom:9px;outline:none}
  .flt:focus{border-color:var(--acc2)}
  .flt::placeholder{color:#5b6b83}
  .cnt2{font-size:11.5px;color:var(--mut);margin-top:8px}
  .cnt2 b{color:#cbd5e1}
  tr.pick td{background:rgba(139,124,246,.20)!important}
  tr.pickable{cursor:pointer}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .hint{font-size:11.5px;color:var(--mut);margin:9px 0 0}
  .pitch{border-left:3px solid var(--acc);background:linear-gradient(90deg,rgba(139,124,246,.13),
         rgba(139,124,246,.02));border-radius:0 10px 10px 0;padding:11px 16px;margin-bottom:11px;
         font-size:13px;line-height:1.6;color:#cfdcee}
  .pitch b{color:#fff;font-weight:800}
  .perbar{background:var(--card2);border:1px solid var(--line);border-radius:10px;
          padding:9px 14px;font-size:12px;color:#bccbe0;margin-bottom:12px}
  .perbar b{color:#e5edf7}
  .perbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .perbar select{background:#16203a;border:1px solid var(--line);border-radius:8px;color:var(--txt);
                 font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 10px;outline:none}
  .perbar select:focus{border-color:#7c3aed}
  .perbar .pb2{color:#a9b8cc}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
  .chip{background:var(--card2);border:1px solid var(--line);color:#d6e2f2;border-radius:20px;
        padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .chip:hover{background:#2d3d66;color:#fff}
  .chip.on{background:rgba(139,124,246,.40);border-color:var(--acc2);color:#fff}
  .ins{background:linear-gradient(140deg,rgba(94,224,168,.13),rgba(94,224,168,.04));
       border-color:rgba(94,224,168,.34)}
  .il{margin:8px 0 0;padding-left:19px;font-size:13px;line-height:1.8;color:#dfe9f5}
  .il li{margin-bottom:5px}
  .il b{color:#fff}
  .il .g{color:var(--green);font-weight:700}
  .il .r{color:var(--red);font-weight:700}
</style></head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← На главную</a>
  <div>
    <h1>🏭 Производство</h1>
    <div class="sub">Что и на сколько выпускает завод · данные из iiko</div>
  </div>
  <div class="upd" id="upd">—</div>
</div>

<div class="wrap" id="app"><div class="empty">Загружаю данные производства…</div></div>

<script src="production_data.js?v=3" onerror="window.PROD_DATA=null"></script>
<script>
(function(){
  var D=window.PROD_DATA, app=document.getElementById("app");
  if(!D||!D.mo_keys||!D.mo_keys.length){
    app.innerHTML='<div class="card"><div class="ct">Данных пока нет</div>'+
      '<div class="cs">Производство собирается из iiko вместе с остальными отчётами. '+
      'Цифры появятся после ближайшей ночной сборки.</div></div>';
    return;
  }

  function fmt(n){ return Math.round(n||0).toLocaleString("ru-RU"); }
  function mln(n){ n=n||0;
    if(Math.abs(n)>=1e9) return (n/1e9).toFixed(2).replace(".",",")+" млрд ₸";
    if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1).replace(".",",")+" млн ₸";
    if(Math.abs(n)>=1e3) return Math.round(n/1e3)+" тыс ₸";
    return fmt(n)+" ₸"; }
  function pct(a,b){ return b? Math.round(a/b*100) : 0; }
  function esc(s){ return String(s).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c];}); }
  function kpi(cls,v,l,n){ return '<div class="kpi '+cls+'"><div class="v">'+v+'</div>'+
    '<div class="l">'+l+'</div><div class="n">'+n+'</div></div>'; }

  // Период отчёта. Без него любая таблица читается как «неизвестно за что»:
  // сумма в 46,7 млн ₸ ничего не значит, пока не сказано, за какой отрезок.
  var YR=String(D.mo_keys[0]||"").slice(0,4);
  var N=D.mo_keys.length, netto=D.mo_netto, gross=D.mo_gross;

  // Выбранный период: RA..RB — индексы месяцев. По умолчанию весь год.
  // Все суммы на странице считаются по этому окну, а не «с начала года»:
  // директору по производству нужен месяц, а не только накопительный итог.
  var RA=0, RB=N-1;
  // Разделка, переработка и тех.карты приходят из iiko без помесячной
  // раскладки, поэтому выбор периода на них не влияет — и написать об этом
  // надо прямо, иначе цифры выглядят как противоречие остальным вкладкам.
  var PERALL="";
  function SA(a){ var t=0; if(!a)return 0;
    for(var i=RA;i<=RB&&i<a.length;i++) t+=a[i]||0; return t; }
  // Если у строки нет помесячной раскладки, за неполный период показывать её
  // годовую сумму нельзя — цифра будет неверной. В таком случае строка просто
  // не участвует: лучше её не показать, чем показать не за тот период.
  function S(r){ if(!r)return 0;
    if(!r.m||!r.m.length) return FULLP? (r.s||0) : 0;
    return SA(r.m); }
  // Список под выбранный период: пересчитываем суммы и заново сортируем,
  // иначе за август наверху висели бы лидеры года, а не месяца.
  function LP(list){
    if(!list||!list.length) return [];
    if(FULLP) return list;
    var out=[];
    for(var i=0;i<list.length;i++){
      var r=list[i], v=S(r);
      if(!v) continue;
      out.push({n:r.n,u:r.u,kg:r.kg,own:r.own,m:r.m,s:v,i:r.i,o:r.o,mi:r.mi,mo:r.mo});
    }
    out.sort(function(a,b){return Math.abs(b.s)-Math.abs(a.s);});
    return out;
  }
  var FULLP=true, NR=N;          // выбран ли весь период и сколько в нём месяцев
  var yearNetto=0, yearGross=0, inner=0;
  // Все сравнения — только между закрытыми месяцами. Сколько их, сборщик
  // считает по календарю и кладёт в D.closed; на старых файлах, где поля ещё
  // нет, откатываемся на прежнюю прикидку по величине выпуска.
  var PER = D.mo_labels[0]+" — "+D.mo_labels[N-1]+" "+YR;
  var PERD = PER+", данные по "+D.through;
  var CLOSED = (D.closed && D.closed>0) ? Math.min(D.closed,N)-1
             : ((N>1 && netto[N-1] < netto[N-2]*0.4) ? N-2 : N-1);
  var closed=CLOSED, cmp=closed-1, dPct=null, PER="", PERD="", PERDATES="";
  function recalc(){
    FULLP = (RA===0 && RB===N-1);
    NR = RB-RA+1;
    yearNetto=SA(netto); yearGross=SA(gross); inner=yearGross-yearNetto;
    closed = Math.min(CLOSED, RB);
    if(closed<RA) closed=RB;
    cmp = (closed-1>=RA)? closed-1 : (closed-1>=0? closed-1 : -1);
    dPct=(cmp>=0 && netto[cmp]) ? Math.round((netto[closed]-netto[cmp])/netto[cmp]*100) : null;
    PER = (RA===RB) ? (D.mo_labels[RA]+" "+YR)
                    : (D.mo_labels[RA]+" — "+D.mo_labels[RB]+" "+YR);
    PERD = PER+", данные по "+D.through;
    PERALL = D.mo_labels[0]+" — "+D.mo_labels[N-1]+" "+YR;
    PERDATES = moStart(RA)+" — "+moEnd(RB);
  }
  recalc();

  // ── таблица «позиция · сумма · доля · вес» ───────────────────
  // Блок «Что это значит»: короткие выводы человеческим языком, посчитанные
  // из тех же цифр, что и таблицы рядом. Ничего не выдумываем — только то,
  // что прямо следует из данных.
  function insight(items){
    items=(items||[]).filter(function(x){return x;});
    if(!items.length) return '';
    return '<div class="card ins"><div class="ct">Что это значит</div>'+
      '<ul class="il"><li>'+items.join('</li><li>')+'</li></ul></div>';
  }
  function pc(v){ return String(v).replace(".",",").replace("-","−"); }
  // Русское склонение по числу: 1 раз, 2 раза, 5 раз.
  function plural(k,one,few,many){
    var a=Math.abs(k)%100, b=a%10;
    if(a>10&&a<20) return many;
    if(b>1&&b<5) return few;
    if(b===1) return one;
    return many;
  }
  function up(v){ return '<span class="r">+'+pc(v)+'%</span>'; }
  function dn(v){ return '<span class="g">'+pc(v)+'%</span>'; }
  function sig(d){ return d>0? up(d) : dn(d); }

  // Номенклатура iiko размечена префиксами, и смешивать эти виды в одном
  // анализе нельзя. «Упак ...» — это уже упакованная готовая продукция:
  // отклонение по ней складывается из фасовки и упаковки, а не из расхода
  // сырья, и нормы расхода по ней читать бессмысленно. Упаковка, расходники
  // и химия — вообще не сырьё, это материалы.
  function kindOf(nm){
    var n=String(nm||"").trim();
    if(/^(RP\*\s*)?Упак/i.test(n)) return "ready";
    if(/^[\u0423U]\*|^[\u0420P]\*|^[\u0425X]\*/.test(n)) return "pack";
    if(/^(\u041f\u0424|\u041f|\u0411)\*/.test(n)) return "pf";
    if(/^[\u0421C]\*/.test(n)) return "raw";
    return "other";
  }
  var KIND_LABEL={ready:"фасовка готовой продукции",pack:"упаковка и расходники",
                  pf:"полуфабрикат",raw:"сырьё",other:"прочее"};
  // Группы номенклатуры размечаем по названию — там префиксов нет.
  function groupIsPack(nm){ return /\u0443\u043f\u0430\u043a\u043e\u0432|\u0442\u0430\u0440[\u0430\u044b]|\u0433\u043e\u0444\u0440\u043e|\u0440\u0430\u0441\u0445\u043e\u0434\u043d|\u0445\u0438\u043c\u0438|\u0438\u043d\u0432\u0435\u043d\u0442\u0430\u0440/i.test(String(nm||"")); }

  // Единая палитра и единые настройки всех графиков: раньше каждый график
  // задавал цвета и подписи по-своему, и страница выглядела набором чужих
  // друг другу картинок.
  var PAL=["#8b7cf6","#f0c674","#5ee0a8","#67c8f5","#f79bc4","#ffab70","#b6e36a","#6de0dd",
           "#c4b5fd","#fca5a5"];
  var CGRID="#2b3860", CTICK="#9db0ca", CLEG="#d6e2f2";
  function legLabels(ch){
    var d=window.Chart.defaults.plugins.legend.labels.generateLabels(ch);
    d.forEach(function(l){
      var ds=ch.data.datasets[l.datasetIndex];
      if(ds&&ds._base){ l.fillStyle=ds._base; l.strokeStyle=ds._base; }
    });
    return d;
  }
  function chOpts(extra){
    var o={maintainAspectRatio:false,
      animation:{duration:420},
      plugins:{legend:{labels:{color:CLEG,boxWidth:11,font:{size:10.5},usePointStyle:true,
                               pointStyle:"circle",generateLabels:legLabels}},
        tooltip:{backgroundColor:"rgba(20,28,48,.96)",borderColor:"#3b4a78",borderWidth:1,
                 titleColor:"#fff",bodyColor:"#dbe6f5",padding:10,cornerRadius:8,
                 displayColors:true,boxPadding:4}},
      scales:{x:{ticks:{color:CTICK,font:{size:11}},grid:{display:false}},
              y:{ticks:{color:CTICK,font:{size:10}},grid:{color:CGRID}}}};
    if(extra) for(var k in extra) o[k]=extra[k];
    return o;
  }
  // Месяцы вне выбранного периода гасим, а не прячем: видно и выбранный
  // отрезок, и то, как он смотрится на фоне остальных.
  function shade(color,i){ return (i>=RA&&i<=RB)? color : "rgba(157,176,202,.22)"; }
  // Клик по столбику любого помесячного графика выбирает этот месяц периодом.
  function pickMonth(e,el){ if(!el||!el.length)return; RA=el[0].index; RB=RA; draw(); }
  function clickable(id){ var c=document.getElementById(id); if(c)c.style.cursor="pointer"; }

  // Реальные даты, а не только названия месяцев.
  function d2(x){ return (x<10?"0":"")+x; }
  function moStart(i){ var k=D.mo_keys[i]; return "01."+k.slice(5,7)+"."+k.slice(0,4); }
  function moEnd(i){
    var k=D.mo_keys[i], y=+k.slice(0,4), m=+k.slice(5,7);
    if(i===N-1 && D.through) return D.through;
    return d2(new Date(y,m,0).getDate())+"."+k.slice(5,7)+"."+y;
  }

  var _tid=0;
  function rows(list,total,markOwn,unitCol){
    list=LP(list);
    if(!list||!list.length) return '<div class="empty">За выбранный период данных нет.</div>';
    total=sum(list);
    var max=Math.abs(list[0].s)||1;
    // Когда выбран один месяц, показываем ещё и изменение к предыдущему —
    // без него месячная цифра висит без ответа на вопрос «это много или мало».
    var dcol=(RA===RB && RA>0), dlab=dcol? D.mo_labels[RA-1] : "";
    // Таблица отдаётся целиком, а не первой сороковкой: сортировка и поиск
    // должны работать по всей базе. Длинный список кладём в прокрутку,
    // чтобы страница не растягивалась на десять экранов.
    var id='tb'+(++_tid), big=list.length>25;
    var html='<table id="'+id+'"><tr><th class="l">Позиция</th>'+(unitCol?'<th>Количество</th>':'')+
      '<th>Сумма</th>'+(dcol?'<th>Δ к '+dlab+'</th>':'')+
      '<th>Доля</th><th class="l" style="width:110px">Вес</th></tr>'+
      list.map(function(r){
        var dv='',dh='';
        if(dcol){
          var pv=(r.m&&r.m[RA-1])||0, cv=(r.m&&r.m[RA])||0;
          if(pv>0){ var dd=Math.round((cv/pv-1)*100);
            dh='<td data-v="'+dd+'" class="'+(dd>0?'up':(dd<0?'down':''))+'" style="font-weight:700">'+
               (dd>0?'+':'')+dd+'%</td>'; }
          else dh='<td data-v="99999" style="color:#64748b">новая</td>';
        }
        return '<tr><td class="l">'+esc(r.n)+(markOwn&&r.own?'<span class="tag">своё</span>':'')+'</td>'+
          (unitCol?'<td data-v="'+(FULLP?(r.kg||0):-1)+'">'+
            (FULLP? (fmt(r.kg)+' '+esc(r.u||'')) : '<span style="color:#475569" title="Количество считается за весь период">—</span>')+'</td>':'')+
          '<td data-v="'+(r.s||0)+'">'+mln(r.s)+'</td>'+dh+
          '<td data-v="'+(r.s||0)+'" style="color:#94a3b8">'+pct(r.s,total)+'%</td>'+
          '<td><div class="bar"><i style="width:'+Math.max(2,Math.round(Math.abs(r.s)/max*100))+'%"></i></div></td></tr>';

  function unitTable(){
    var L=D.mo_labels;
    var upN=0,dnN=0,mxU=null,mnU=null;
    D.unitcost.forEach(function(r){
      if(r.d>0)upN++; else if(r.d<0)dnN++;
      if(!mxU||r.d>mxU.d)mxU=r; if(!mnU||r.d<mnU.d)mnU=r;
    });
    // Медиана честнее среднего: пара позиций с ростом в разы утащила бы
    // среднее вверх и создала впечатление, что дорожает всё.
    var ds=D.unitcost.map(function(r){return r.d;}).sort(function(a,b){return a-b;});
    var med=ds.length? ds[Math.floor(ds.length/2)] : 0;
    var big=D.unitcost.filter(function(r){return r.d>10;});
    var bigS=big.reduce(function(a,r){return a+(r.s||0);},0);
    var allS=D.unitcost.reduce(function(a,r){return a+(r.s||0);},0);

    return '<div class="kpis">'+
      kpi("hi",(med>0?"+":"")+pc(med)+"%","Медианное изменение",
          "половина позиций изменилась сильнее, половина — слабее")+
      kpi(upN>dnN?"warn":"",fmt(upN)+" / "+fmt(dnN),"Подорожало / подешевело",
          "из "+fmt(D.unitcost.length)+" позиций с историей от 3 закрытых месяцев")+
      kpi(big.length?"warn":"",fmt(big.length),"Выросли больше чем на 10%",
          allS? ("на них приходится "+pct(bigS,allS)+"% товарного выпуска") : "")+
      kpi("",D.mo_labels[0]+" → "+D.mo_labels[closed],"База сравнения",
          "первый и последний закрытый месяц с данными")+
    '</div>'+
    insight([
      "Из "+D.unitcost.length+" позиций с историей подорожало <b>"+upN+"</b>, подешевело <b>"+dnN+
        "</b>. Это себестоимость одной единицы, объём тут ни при чём.",
      "Медианное изменение — <b>"+(med>0?"+":"")+pc(med)+"%</b>. Если оно близко к нулю, а отдельные "+
        "позиции улетели на десятки процентов, дорожает не производство целиком, а конкретные рецептуры.",
      (big.length&&allS? "Позиций с ростом больше 10% — <b>"+big.length+"</b>, и на них приходится <b>"+
        pct(bigS,allS)+"%</b> товарного выпуска. Это и есть список, с которым надо идти в закуп." : ""),
      mxU? "Сильнее всего выросла <b>"+esc(mxU.n)+"</b>: "+up(mxU.d)+" за период. "+
        "Такой скачок — это либо подорожавшее сырьё, либо изменённая рецептура; стоит проверить по закупу." : "",
      mnU&&mnU.d<0? "Сильнее всего подешевела <b>"+esc(mnU.n)+"</b>: "+dn(mnU.d)+
        ". Падение больше чем на четверть обычно означает не экономию, а смену состава или пересчёт норм — тоже повод посмотреть." : ""
    ])+
    '<div class="card"><div class="ct">Как менялась себестоимость единицы</div>'+
    '<div class="cs">Первый закрытый месяц каждой позиции принят за 100. Линия выше 100 — '+
    'единица продукции стала дороже, ниже — дешевле. <b>Кликните строку в таблице ниже</b>, '+
    'чтобы добавить позицию на график или убрать её; клик по названию в легенде прячет линию.</div>'+
    '<div style="height:300px"><canvas id="chCost"></canvas></div>'+
    '<div class="hint" id="ucHint"></div></div>'+
    '<div class="card"><div class="ct">Себестоимость единицы по месяцам</div>'+
      '<div class="cs">Все '+fmt(D.unitcost.length)+' позиций, у которых есть история хотя бы за '+
      'три закрытых месяца. Изменение — от первого закрытого месяца с данными к последнему '+
      'закрытому: незакрытый месяц в сравнение не берём. Клик по строке ставит позицию на график.</div>'+
      '<input class="flt" data-t="tbUC" placeholder="Поиск по названию — всего '+

  // ── разделка и переработка ───────────────────────────────────
  function splitPane(R,title,expl,cid,loss){
    if(!R||!R.in||!R.in.length) return '<div class="card"><div class="ct">'+title+
      '</div><div class="empty">За период таких операций не было.</div></div>';

    // Вход и выход считаем по каждой единице отдельно: складывать килограммы
    // со штуками и литрами нельзя — «потеря веса» из такой суммы бессмысленна.
    var U=R.units||[];
    var unitRows = U.length ?
      '<table><tr><th class="l">Единица</th><th>Вошло</th><th>Вышло</th><th>Разница</th><th>Доля</th></tr>'+
      U.map(function(u){
        var d=u.in-u.out;
        var cls=d>0?'up':(d<0?'down':'');
        // Доля считается от входа. Если входа не было (позиция только появляется
        // на выходе), процент не имеет смысла — ставим прочерк.
        var ps = u.in>0 ? ((d>0?'−':(d<0?'+':''))+Math.round(Math.abs(d)/u.in*1000)/10+'%')
                        : '<span style="color:#475569">—</span>';
        return '<tr><td class="l">'+esc(u.u)+'</td>'+
          '<td data-v="'+u.in+'">'+fmt(u.in)+'</td><td data-v="'+u.out+'">'+fmt(u.out)+'</td>'+
          '<td data-v="'+(-d)+'" class="'+cls+'" style="font-weight:700">'+
            (d>0?'−':(d<0?'+':''))+fmt(Math.abs(d))+'</td>'+
          '<td data-v="'+(u.in>0?(-d/u.in):0)+'" class="'+cls+'">'+ps+'</td></tr>';
      }).join("")+'</table>' :
      '<div class="empty">Нет данных по количеству.</div>';

    var main=U.length? U[0] : null;
    var yield_ = (main&&main.in>0)? Math.round(main.out/main.in*1000)/10 : null;
    return '<div class="kpis">'+
      kpi("",mln(R.sum),title+" за "+PERALL,"стоимость того, что прошло операцию")+
      (yield_!==null? kpi(yield_<90?"warn":"",String(yield_).replace(".",",")+"%","Выход по «"+esc(main.u)+"»",
          fmt(main.in)+" "+esc(main.u)+" вошло → "+fmt(main.out)+" "+esc(main.u)+" вышло") : "")+
      kpi("",fmt(R.n_in)+" → "+fmt(R.n_out),"Позиций: вход → выход","сколько разной номенклатуры участвует")+
    '</div>'+
    '<div class="note">'+expl+
    (FULLP? '' : ' <b>Выбор периода на эту вкладку не влияет:</b> разделка и переработка '+
      'приходят из iiko одной суммой за '+PERALL+', помесячной раскладки по ним нет.')+'</div>'+
    insight([
      (yield_===null? "" : (yield_<100
        ? ("Из каждых 100 "+esc(main.u)+", отправленных в операцию, обратно приходит <b>"+
           String(yield_).replace(".",",")+"</b>. Не возвращается "+fmt(main.in-main.out)+" "+
           esc(main.u)+" за год"+(loss? " — "+loss : "")+"."+
           (R.sum&&main.in? " В деньгах вход стоит "+mln(R.sum)+", то есть невозвратная часть — около <b>"+
             mln(R.sum*(main.in-main.out)/main.in)+"</b>." : ""))
        : ("По «"+esc(main.u)+"» вес не теряется: вошло "+fmt(main.in)+", вышло "+fmt(main.out)+
           " ("+String(yield_).replace(".",",")+"%). Прибавка по количеству — это обычно перефасовка "+
           "в более мелкую единицу, а не появление товара из ниоткуда."))),
      (function(){
        var bad=U.filter(function(u){return u.in>0 && (u.in-u.out)/u.in>0.02;});
        var good=U.filter(function(u){return u.in>0 && (u.out-u.in)/u.in>0.02;});

          dn(-Math.round((u.in-u.out)/u.in*1000)/10)+")";}).join(", ")+"</b>. ";
        if(good.length) t+="Прибавляют: <b>"+good.map(function(u){return esc(u.u)+" ("+
          up(Math.round((u.out-u.in)/u.in*1000)/10)+")";}).join(", ")+
          "</b> — прибавка по количеству означает фасовку в более мелкую единицу, а не «выросло из ниоткуда».";
        return t;})(),
      (R.in&&R.in.length? "Основное сырьё операции — <b>"+esc(R.in[0].n)+"</b>: "+mln(R.in[0].s)+

  }

  // ── списания ─────────────────────────────────────────────────
  function woPane(){
    var W0=D.writeoff;
    if(!W0||!W0.by_product||!W0.by_product.length)
      return '<div class="card"><div class="ct">Списания</div><div class="empty">Списаний нет.</div></div>';
    // Пересчитываем всё под выбранный период — иначе месяц показывал бы
    // годовые суммы, и цифры не сходились бы с графиком над ними.
    var W={by_product:LP(W0.by_product), by_store:LP(W0.by_store), mo:W0.mo,
           by_reason:W0.by_reason, named_sum:W0.named_sum, n:W0.n};
    W.sum=SA(W0.mo);
    if(!FULLP){ var k=W0.sum? W.sum/W0.sum : 0;

      kpi("",mln(avg),"В среднем за месяц","ровный уровень или всплески — видно на графике")+
      kpi("",fmt(W.by_product.length),"Позиций в списаниях","сколько разной номенклатуры попадало в списание")+
      kpi("",fmt(W.by_store.length),"Складов и цехов","откуда идут списания")+
    '</div>'+
    insight([
      "Списания идут ровным потоком — в среднем <b>"+mln(avg)+"</b> в месяц. Это не разовая порча, "+
        "а постоянный процесс: брак, сроки, зачистка. К товарному выпуску это "+
        (yearNetto? (Math.round(W.sum/yearNetto*1000)/10+"").replace(".",",") : "0")+"%.",
      (W.by_product&&W.by_product.length? "Крупнейшая позиция — <b>"+esc(W.by_product[0].n)+"</b>: "+
        mln(W.by_product[0].s)+", это "+pct(W.by_product[0].s,W.sum)+"% всех списаний." : ""),
      (W.by_store&&W.by_store.length? "Больше всего списывает <b>"+esc(W.by_store[0].n)+"</b> — "+
        pct(W.by_store[0].s,W.sum)+"% суммы. С него и надо начинать разбор." : ""),
      (function(){
        if(!W.by_reason||!W.by_reason.length) return "";
        var named=W.named_sum||0;
        if(named>W.sum*0.5) return "Причина указана у <b>"+pct(named,W.sum)+"%</b> списаний — учёт заполняется.";
        var real=W.by_reason.filter(function(r){return r.named;});
        return "<b>Причина списания не указывается.</b> Из "+mln(W.sum)+
          " на счета с настоящей причиной (бракераж, проработка блюд, возвраты) отнесено "+
          mln(named)+" — практически ноль. Всё остальное списано на технические счета, "+
          "названные по складу, то есть в системе просто «списали со склада». "+
          (real.length? "Счета для причин в плане счетов есть ("+real.length+" шт.), их не используют. " : "")+
          "Пока это так, нельзя ответить, что из "+mln(W.sum)+" — брак, что просрочка, а что зачистка.";})(),
      (function(){
        var m=W.mo||[], lim=Math.max(1,closed+1), mx=0;
        for(var i=1;i<lim;i++) if(m[i]>m[mx])mx=i;
        if(!m[mx]||!avg) return "";
        var k=Math.round(m[mx]/avg*100)-100;
        return k>25? ("Выброс в <b>"+D.mo_labels[mx]+"</b>: "+mln(m[mx])+", это "+up(k)+
          " к среднему месяцу. Обычно так выглядит инвентаризация или разовая порча партии.") : "";})(),
      // Экономическая часть: доля в выпуске, её разброс и тренд.
      (function(){
        var R=[], i;
        for(i=0;i<=closed;i++) if(netto[i]) R.push({i:i,v:W0.mo[i]/netto[i]*100});
        if(R.length<3) return "";
        var mn=R[0], mx=R[0], sum1=0;
        R.forEach(function(x){ if(x.v<mn.v)mn=x; if(x.v>mx.v)mx=x; sum1+=x.v; });
        var mid=sum1/R.length;
        return "Доля списаний в товарном выпуске держится около <b>"+pc(Math.round(mid*100)/100)+
          "%</b>, разброс от "+pc(Math.round(mn.v*100)/100)+"% ("+D.mo_labels[mn.i]+") до "+
          pc(Math.round(mx.v*100)/100)+"% ("+D.mo_labels[mx.i]+"). "+
          "Именно эту долю и надо держать в норме: сумма в тенге сама по себе растёт вместе "+
          "с выпуском и ни о чём не говорит.";})(),
      (function(){
        var R=[], i;
        for(i=0;i<=closed;i++) if(netto[i]) R.push(W0.mo[i]/netto[i]*100);
        if(R.length<4) return "";
        var h=Math.floor(R.length/2);
        var a=R.slice(0,h).reduce(function(x,y){return x+y;},0)/h;
        var b=R.slice(R.length-h).reduce(function(x,y){return x+y;},0)/h;
        if(!a) return "";
        var d=Math.round((b/a-1)*100);
        if(Math.abs(d)<8) return "Тренда нет: первая половина периода и вторая дают одну и ту же "+
          "долю списаний. Это устойчивый процесс, а не разовые потери.";
        return d>0
          ? ("<b>Доля списаний растёт:</b> вторая половина периода "+up(d)+" к первой ("+
             pc(Math.round(b*100)/100)+"% против "+pc(Math.round(a*100)/100)+"%). "+
             "Списывают больше не потому, что больше производят.")
          : ("Доля списаний снижается: вторая половина периода "+dn(d)+" к первой ("+
             pc(Math.round(b*100)/100)+"% против "+pc(Math.round(a*100)/100)+"%).");})(),
      (function(){
        var L=W.by_product||[]; if(!L.length||!W.sum) return "";
        var acc=0, k=0;
        for(var i=0;i<L.length;i++){ acc+=S(L[i]); k++; if(acc>=W.sum*0.8) break; }
        if(k>=L.length) return "Списания размазаны по всей номенклатуре: 80% набирается только "+
          "всем списком из "+fmt(L.length)+" позиций. Точки приложения усилий здесь нет — "+
          "это фон процесса, а не отдельные потери.";
        return "<b>"+k+"</b> "+plural(k,"позиция","позиции","позиций")+" из "+fmt(L.length)+
          " дают 80% всех списаний. Разбирать нужно их: остальные "+fmt(L.length-k)+
          " — хвост, работа с которым не окупится.";})()
    ])+
    '<div class="card"><div class="ct">Списания по месяцам</div>'+
    '<div class="cs">Всплеск обычно означает инвентаризацию или разовую порчу, ровный уровень — '+
    'процесс. Клик по столбику показывает весь отчёт за этот месяц.</div>'+
    '<div style="height:250px"><canvas id="chWo"></canvas></div></div>'+
    '<div class="card"><div class="ct">Списания к объёму производства</div>'+
    '<div class="cs">Сумма списаний сама по себе растёт вместе с выпуском, поэтому экономисту '+
    'нужна не она, а <b>доля</b>: сколько процентов товарного выпуска ушло в списание. '+
    'Пунктир — средний уровень за период. Линия выше пунктира — месяц, в котором теряли больше '+
    'обычного, даже если в тенге сумма выглядит привычной.</div>'+
    '<div style="height:270px"><canvas id="chWoRatio"></canvas></div></div>'+
    '<div class="card"><div class="ct">Правило Парето: где сосредоточены потери</div>'+
    '<div class="cs">Позиции выстроены от крупных к мелким, линия — накопленная доля. '+
    'Точка, где линия пересекает 80%, показывает, сколькими позициями закрывается основная '+
    'часть списаний: именно с ними имеет смысл работать, остальное — хвост.</div>'+
    '<div style="height:290px"><canvas id="chWoPareto"></canvas></div></div>'+
    '<div class="two">'+
      '<div class="card"><div class="ct">Что списываем</div>'+
      '<div class="cs">Все позиции за '+PER+', по сумме списания.</div>'+
      rows(W.by_product,sum(W.by_product),false,false)+'</div>'+
      '<div class="card"><div class="ct">Откуда списываем</div>'+
      '<div class="cs">Склады и цеха за '+PER+'. Здесь видно, где именно теряется товар.</div>'+
      rows(W.by_store,sum(W.by_store),false,false)+'</div>'+
    '</div>'+
    (W.by_reason&&W.by_reason.length ?
      '<div class="card"><div class="ct">Почему списываем</div>'+
      '<div class="cs">За '+PER+'. Причина списания в iiko — это счёт, на который его отнесли. '+
      'Счёт, названный так же, как склад, причиной не является: это просто «списано со склада N».</div>'+
      reasonTable(W)+'</div>' : '');
  }


  // ── причины списания ─────────────────────────────────────────
  function reasonTable(W){
    var L=W.by_reason||[], max=L[0]?L[0].s:1;
    return '<table><tr><th class="l">Счёт списания</th><th>Сумма</th><th>Доля</th>'+
      '<th class="l">Это причина?</th><th class="l" style="width:100px">Вес</th></tr>'+
      L.map(function(r){
        return '<tr><td class="l">'+esc(r.n)+'</td>'+
          '<td data-v="'+r.s+'">'+mln(r.s)+'</td>'+
          '<td data-v="'+r.s+'" style="color:#94a3b8">'+pct(r.s,W.sum)+'%</td>'+
          '<td class="l" data-v="'+(r.named?1:0)+'">'+
            (r.named? '<span class="g">да</span>' : '<span style="color:#64748b">нет — просто склад</span>')+'</td>'+
          '<td><div class="bar"><i style="width:'+Math.max(2,Math.round(r.s/max*100))+'%"></i></div></td></tr>';
      }).join("")+'</table>';
  }

  // ── история пересчётов ───────────────────────────────────────
  // Финансовая часть истории пересчётов: месяц, который не считали, — это не
  // «недостач не было», а непроверенный остаток. Оцениваем его по тому, что
  // этот же склад показывает, когда его всё-таки считают.
  function histRisk(V){
    var H=V.hist||[], mo=V.months||N, byName={}, out=[];
    (V.by_store||[]).forEach(function(r){ byName[r.n]=r; });
    H.forEach(function(h){
      var st=byName[h.n];
      var net=st? (st.s||0) : 0;              // чистая недостача склада за период
      var perCount=h.cnt? net/h.cnt : 0;      // сколько находят за один пересчёт
      var missed=Math.max(0, mo-h.cnt);
      out.push({n:h.n, cnt:h.cnt, gap:h.gap, last:h.last, net:net,
                per:perCount, missed:missed,
                risk: perCount>0? perCount*missed : 0});
    });
    return out;
  }
  function histTable(V){
    var H=V.hist||[]; if(!H.length) return '';
    var mo=V.months||N;
    var R=histRisk(V);
    var totalRisk=R.reduce(function(a,r){return a+r.risk;},0);
    return '<div class="card"><div class="ct">Когда считали и чего это стоит</div>'+
      '<div class="cs">Склад, который не пересчитывают, — это не «нет недостач», '+
      'а «недостачи не найдены». Норма для завода — раз в месяц, в последний день. '+
      '<b>Непроверенный остаток</b> — оценка того, сколько недостачи не нашли за пропущенные '+
      'пересчёты: средняя недостача этого же склада за один пересчёт, умноженная на число '+
      'пропущенных месяцев. Это не факт, а ожидаемая величина, но именно она показывает, '+
      'во сколько обходится непроведённая инвентаризация.</div>'+
      '<table><tr><th class="l">Склад</th><th>Пересчётов</th><th>Из месяцев</th>'+
      '<th>Последний</th><th>Дней назад</th><th>Нашли за период</th>'+
      '<th>В среднем за пересчёт</th><th>Непроверенный остаток</th>'+
      '<th class="l">Оценка</th></tr>'+
      R.slice().sort(function(a,b){return b.risk-a.risk || a.cnt-b.cnt;}).map(function(h){
        var bad=h.cnt<mo-1||h.gap>45;
        return '<tr><td class="l">'+esc(h.n)+'</td>'+
          '<td data-v="'+h.cnt+'" class="'+(bad?'up':'down')+'" style="font-weight:700">'+h.cnt+'</td>'+
          '<td data-v="'+mo+'" style="color:#94a3b8">'+mo+'</td>'+
          '<td class="l" data-v="'+h.last.replace(/-/g,'')+'">'+h.last+'</td>'+
          '<td data-v="'+h.gap+'" class="'+(h.gap>45?'up':'')+'">'+h.gap+'</td>'+
          '<td data-v="'+h.net+'" style="color:#94a3b8">'+(h.net>0? mln(h.net):'—')+'</td>'+
          '<td data-v="'+Math.round(h.per)+'" style="color:#94a3b8">'+(h.per>0? mln(h.per):'—')+'</td>'+
          '<td data-v="'+Math.round(h.risk)+'" class="'+(h.risk>0?'up':'')+'" style="font-weight:700">'+
            (h.risk>0? mln(h.risk):'—')+'</td>'+
          '<td class="l" data-v="'+(bad?0:1)+'">'+(bad?
            '<span class="r">считают через раз</span>':'<span class="g">регулярно</span>')+'</td></tr>';
      }).join("")+
      (totalRisk>0? '<tr><td class="l" style="color:#fff">Итого непроверенный остаток</td>'+
        '<td colspan="6"></td><td class="up" style="font-weight:800">'+mln(totalRisk)+'</td><td></td></tr>' : '')+
      '</table></div>';
  }

  // ── инвентаризации ───────────────────────────────────────────
  function invPane(){
    var V0=D.invent;
    if(!V0||!V0.by_store||!V0.by_store.length)
      return '<div class="card"><div class="ct">Инвентаризации</div>'+
        '<div class="empty">Пересчётов за период не было.</div></div>';
    var V={hist:V0.hist, months:V0.months, mo_in:V0.mo_in, mo_out:V0.mo_out,
           short:LP(V0.short), over:LP(V0.over)};
    V.sum_in=SA(V0.mo_in); V.sum_out=SA(V0.mo_out); V.net=V.sum_in? (V.sum_out-V.sum_in) : V.sum_out;
    V.n=V.short.length+V.over.length;
    V.by_store=(V0.by_store||[]).map(function(r){
      var i=r.mi? SA(r.mi):r.i, o=r.mo? SA(r.mo):r.o;
      return {n:r.n,i:i,o:o,s:o-i};}).filter(function(r){return r.i||r.o;})
      .sort(function(a,b){return b.s-a.s;});
    var share=yearNetto? (V.net/yearNetto*100) : 0;
    // Средний месяц считаем только по закрытым: инвентаризация текущего месяца
    // ещё не проведена, и её почти нулевая сумма занизила бы среднее.
    var mo=V.mo_out||[], big=mo.filter(function(v){return v>(V0.sum_out/mo.length)*0.25;});
    var avg=big.length? big.reduce(function(a,b){return a+b;},0)/big.length : 0;

    // таблица «склад · излишки · недостачи · сальдо»
    function storeTable(){
      var max=1; V.by_store.forEach(function(r){ max=Math.max(max,Math.abs(r.s)); });
      return '<table><tr><th class="l">Склад</th><th>Излишки</th><th>Недостачи</th>'+
        '<th>Сальдо</th><th class="l" style="width:110px">Вес</th></tr>'+
        V.by_store.map(function(r){
          var neg=r.s>0;
          return '<tr><td class="l">'+esc(r.n)+'</td>'+
            '<td data-v="'+r.i+'" style="color:#94a3b8">'+mln(r.i)+'</td>'+
            '<td data-v="'+r.o+'" style="color:#94a3b8">'+mln(r.o)+'</td>'+
            '<td data-v="'+r.s+'" class="'+(neg?'up':'down')+'" style="font-weight:700">'+
              (neg?'−':'+')+mln(Math.abs(r.s)).replace('-','')+'</td>'+
            '<td><div class="bar"><i style="width:'+Math.max(2,Math.round(Math.abs(r.s)/max*100))+
              '%;background:'+(neg?'#f87171':'#34d399')+'"></i></div></td></tr>';
        }).join("")+'</table>';
    }
    function posTable(list,neg){
      if(!list||!list.length) return '<div class="empty">Нет данных.</div>';
      var max=list[0].s||1;
      return '<table><tr><th class="l">Позиция</th><th>Количество</th><th>Сумма</th>'+
        '<th class="l" style="width:100px">Вес</th></tr>'+
        list.map(function(r){
          return '<tr><td class="l">'+esc(r.n)+'</td>'+
            '<td data-v="'+(r.kg||0)+'">'+fmt(r.kg)+' '+esc(r.u||'')+'</td>'+
            '<td data-v="'+(r.s||0)+'" class="'+(neg?'up':'down')+'" style="font-weight:700">'+mln(r.s)+'</td>'+
            '<td><div class="bar"><i style="width:'+Math.max(2,Math.round(r.s/max*100))+
              '%;background:'+(neg?'#f87171':'#34d399')+'"></i></div></td></tr>';
        }).join("")+'</table>';
    }

    return '<div class="kpis">'+
      kpi("warn",mln(V.net),(FULLP?"Чистая недостача с начала года":"Чистая недостача за "+PER),
          "недостачи "+mln(V.sum_out)+" минус излишки "+mln(V.sum_in))+
      kpi("",share.toFixed(1).replace(".",",")+"%","К товарному выпуску",
          "сколько процентов выпуска не доехало до склада")+
      kpi("",mln(avg),"В среднем за месяц","недостач по закрытым пересчётам")+
      kpi("",fmt(V.n),"Позиций в расхождениях","сколько разной номенклатуры расходилось с учётом")+
    '</div>'+
    '<div class="note"><b>Как это читать.</b> Проводка инвентаризации в iiko двойная: '+
    'в деньгах приход и расход равны, поэтому направление определяется по количеству. '+
    'Излишек и недостача по одной позиции сворачиваются между собой — в таблицах ниже '+
    'уже чистый результат. <b>Пересорт</b> (нашли одно, потеряли другое на том же складе) '+
    'даёт сальдо около нуля; настоящая потеря — это склад с большим минусом.</div>'+
    insight([
      "За "+PER+" пересчёты дали чистую недостачу <b>"+mln(V.net)+"</b>: нашлось на "+
        mln(V.sum_in)+", не нашлось на "+mln(V.sum_out)+".",
      (function(){
        var w=(V.by_store||[])[0];
        if(!w||w.s<=0||!V.net) return "";
        return "Почти всё сосредоточено в одном месте: <b>"+esc(w.n)+"</b> даёт "+
          Math.round(w.s/V.net*100)+"% чистой недостачи ("+mln(w.s)+"). Остальные склады "+
          "расходятся в пределах пересорта — там нашли одно, потеряли другое, сальдо около нуля.";})(),
      (function(){
        var t=(V.short||[]).slice(0,3);
        if(!t.length) return "";
        return "Крупнейшие потери: <b>"+t.map(function(r){return esc(r.n)+" ("+mln(r.s)+")";}).join(", ")+
          "</b>. Если это расходники и упаковка, значит они не списываются документами по факту "+
          "расхода, а всплывают раз в месяц одной суммой при пересчёте — тогда это вопрос к учёту, "+
          "а не к сохранности.";})(),
      (yearNetto? "К товарному выпуску чистая недостача — <b>"+
        (Math.round(V.net/yearNetto*1000)/10+"").replace(".",",")+"%</b>." : ""),
      (function(){
        var R=histRisk(V), tot=R.reduce(function(a,r){return a+r.risk;},0);
        if(tot<=0) return "";
        var top=R.slice().sort(function(a,b){return b.risk-a.risk;}).filter(function(r){return r.risk>0;});
        return "<b>Непроведённая инвентаризация стоит денег.</b> По складам, которые считают "+
          "через раз, ожидаемая ненайденная недостача — <b>"+mln(tot)+"</b>"+
          (yearNetto? " (это ещё "+pc(Math.round(tot/yearNetto*1000)/10)+"% товарного выпуска сверх "+
            "того, что уже нашли)" : "")+". Больше всего у <b>"+esc(top[0].n)+"</b>: "+mln(top[0].risk)+
          " за "+top[0].missed+" "+plural(top[0].missed,"пропущенный месяц","пропущенных месяца","пропущенных месяцев")+
          ". Оценка считается по тому, что этот же склад показывает, когда его всё-таки считают.";})(),
      (function(){
        var H=V.hist||[]; if(!H.length) return "";
        var mo=V.months||N;
        var bad=H.filter(function(h){return h.cnt<mo-1||h.gap>45;});
        if(!bad.length) return "Все склады пересчитывают регулярно — раз в месяц.";
        bad.sort(function(a,b){return a.cnt-b.cnt;});
        var top=bad.slice(0,3).map(function(h){
          return "<b>"+esc(h.n)+"</b> — "+h.cnt+" "+plural(h.cnt,"раз","раза","раз")+
            " за "+mo+" мес. (последний "+h.last+")";}).join(", ");
        return "<b>Пересчитывают не все:</b> "+top+
          (bad.length>3? " и ещё "+(bad.length-3)+" склад"+(bad.length-3===1?"":"а") : "")+
          ". По этим складам недостача не «ноль», а «не искали» — цифры выше занижены ровно на то, "+
          "что там не посчитано. Подробности в таблице «Когда считали».";})()
    ])+
    '<div class="card"><div class="ct">Недостачи и излишки по месяцам</div>'+
    '<div class="cs">Красное — недостачи, зелёное — излишки. Последний месяц может быть '+
    'неполным: инвентаризация проводится не каждый день.</div>'+
    '<div style="height:250px"><canvas id="chInv"></canvas></div></div>'+
    histTable(V)+
    '<div class="card"><div class="ct">Где расходится учёт</div>'+
    '<div class="cs">Сальдо по складам за '+PER+'. Минус — недостача, плюс — излишек.</div>'+
    storeTable()+'</div>'+
    '<div class="two">'+
      '<div class="card"><div class="ct">Что теряем</div>'+
      '<div class="cs">Чистая недостача по позициям за '+PER+'.</div>'+
      posTable(V.short,true)+'</div>'+
      '<div class="card"><div class="ct">Что находим</div>'+
      '<div class="cs">Чистые излишки за '+PER+'. Обычно это обратная сторона пересорта.</div>'+
      posTable(V.over,false)+'</div>'+
    '</div>';
  }



  // ── тех.карта: норма против факта ────────────────────────────
  function tcPane(){
    var T=D.techcard;
    if(!T||!T.rows||!T.rows.length)
      return '<div class="card"><div class="ct">Тех.карта</div>'+
        '<div class="cs">Сравнение нормы с фактом появится после ближайшей ночной сборки: '+
        'тех.карты тянутся из iiko отдельным запросом.</div></div>';

    // Считаем только по тому виду позиций, который сейчас выбран: у фасовки
    // отклонение — это упаковка и порционирование, у сырья и полуфабрикатов —
    // действительно расход. Складывать их в одну цифру некорректно.
    var ALL=T.rows||[];
    var pick=(TCMODE==="ready") ? ALL.filter(function(r){return kindOf(r.n)==="ready";})
           : (TCMODE==="all") ? ALL
           : ALL.filter(function(r){return kindOf(r.n)!=="ready";});
    var nReady=ALL.filter(function(r){return kindOf(r.n)==="ready";}).length;
    var T={month:T.month,n_cards:T.n_cards,n_fact:T.n_fact,n_partial:T.n_partial,
           n_nocard:T.n_nocard,nocard:T.nocard,rows:pick,
           n_matched:pick.length,
           plan_sum:pick.reduce(function(a,r){return a+r.plan*r.kg;},0),
           fact_sum:pick.reduce(function(a,r){return a+r.fact*r.kg;},0)};
    var dev = T.plan_sum? (T.fact_sum/T.plan_sum-1)*100 : 0;
    var over = T.rows.filter(function(r){return r.d>1;});
    var under = T.rows.filter(function(r){return r.d<-1;});
    var exact = T.rows.length-over.length-under.length;
    var overMoney = over.reduce(function(a,r){return a+(r.fact-r.plan)*r.kg;},0);
    var nocardSum = (T.nocard||[]).reduce(function(a,r){return a+r.s;},0);

    function tcTable(list,neg){
      if(!list||!list.length) return '<div class="empty">Таких позиций нет.</div>';
      var id='tc'+(++_tid), big=list.length>25;
      var html='<table id="'+id+'"><tr><th class="l">Позиция</th><th>Норма, ₸/ед.</th>'+
        '<th>Факт, ₸/ед.</th><th>Отклонение</th><th>Выпуск</th><th>Цена отклонения</th></tr>'+
        list.map(function(r){
          var money=(r.fact-r.plan)*r.kg;
          return '<tr><td class="l">'+esc(r.n)+'</td>'+
            '<td data-v="'+r.plan+'">'+fmt(r.plan)+'</td>'+
            '<td data-v="'+r.fact+'">'+fmt(r.fact)+'</td>'+
            '<td data-v="'+r.d+'" class="'+(r.d>0?'up':(r.d<0?'down':''))+'" style="font-weight:700">'+
              (r.d>0?'+':'')+String(r.d).replace(".",",")+'%</td>'+
            '<td data-v="'+r.kg+'" style="color:#94a3b8">'+fmt(r.kg)+' '+esc(r.u||'')+'</td>'+
            '<td data-v="'+money+'" class="'+(money>0?'up':'down')+'">'+
              (money>0?'+':'−')+mln(Math.abs(money))+'</td></tr>';
        }).join("")+'</table>';
      if(!big) return html;
      return '<input class="flt" data-t="'+id+'" placeholder="Поиск по названию — всего '+
        fmt(list.length)+' позиций">'+'<div class="tall">'+html+'</div>'+
        '<div class="cnt2">Показано <b class="cnt" data-t="'+id+'">'+fmt(list.length)+'</b> из '+
        fmt(list.length)+' · сортировка — клик по заголовку</div>';
    }

    return '<div class="chips">'+
      [["norm","Сырьё и полуфабрикаты"],["ready","Фасовка готовой продукции ("+nReady+")"],
       ["all","Всё вместе"]].map(function(c){
        return '<button class="chip'+(TCMODE===c[0]?' on':'')+'" data-tc="'+c[0]+'">'+c[1]+'</button>';
      }).join("")+'</div>'+
    (TCMODE==="ready"
      ? '<div class="note"><b>Осторожно с выводами.</b> «Упак …» — это уже упакованная готовая '+
        'продукция. Отклонение по ней складывается из фасовки, упаковки и порционирования, '+
        'а не из расхода сырья: читать это как перерасход в цехе нельзя.</div>'
      : (TCMODE==="all"
        ? '<div class="note"><b>Виды смешаны.</b> В одном списке и сырьё, и упакованная готовая '+
          'продукция. Общая цифра отклонения в таком наборе мало что значит — переключитесь на '+
          '«Сырьё и полуфабрикаты», если смотрите нормы расхода.</div>'
        : ''))+
    '<div class="kpis">'+
      kpi(Math.abs(dev)>3?"warn":"hi",(dev>0?"+":"")+dev.toFixed(1).replace(".",",")+"%",
          "Факт против нормы за "+T.month+
            (TCMODE==="norm"?" · сырьё и п/ф":(TCMODE==="ready"?" · фасовка":"")),
          "фактическое сырьё "+mln(T.fact_sum)+" против "+mln(T.plan_sum)+" по тех.картам")+
      kpi("",fmt(T.n_matched)+" из "+fmt(T.n_fact),"Позиций сравнено",
          "остальные — без карты ("+fmt(T.n_nocard)+") или без фактической цены части сырья ("+
          fmt(T.n_partial)+")")+
      kpi(over.length?"warn":"",fmt(over.length),"Дороже нормы",
          overMoney? "перерасход "+mln(overMoney)+" за месяц" : "перерасхода нет")+
      kpi("",fmt(T.n_cards),"Тех.карт в iiko",
          "действующих на "+T.month+"; без карты выпущено на "+mln(nocardSum))+
    '</div>'+
    '<div class="note"><b>Как это посчитано.</b> Норма берётся из тех.карты iiko: закладка '+
    'каждого ингредиента, делённая на выход по карте. Цена ингредиента — <b>не прайсовая, '+
    'а фактическая</b>: сколько тенге за единицу этого сырья реально списано в производство '+
    'за год. Факт — стоимость выпуска, делённая на количество, за '+T.month+
    ' (последний закрытый месяц). Позиции, где хотя бы у одного ингредиента нет фактической '+
    'цены, в сравнение не берём: неполная норма всегда выглядит дешевле факта, и вывод был бы '+
    'ложным. Поэтому сравнение честное, но не по всему ассортименту.</div>'+
    insight([
      "По сопоставимым позициям завод укладывается в норму "+
        (Math.abs(dev)<1? "<b>точно</b>: расхождение меньше процента."
         : ("с расхождением <b>"+(dev>0?"+":"")+dev.toFixed(1).replace(".",",")+"%</b> — "+
            (dev>0? "фактически сырья уходит больше, чем записано в картах."
                  : "фактически сырья уходит меньше, чем записано в картах."))),
      "<b>"+exact+"</b> позиций сходятся с картой в пределах процента — там учёт и рецептура "+
        "живут одной жизнью. Разбирать надо не их, а хвосты.",
      (over.length? "Дороже нормы — <b>"+over.length+"</b> позиций"+
        (overMoney? ", и это "+mln(overMoney)+" лишнего сырья за месяц" : "")+
        ". Крупнейшая: <b>"+esc(over[0].n)+"</b>, факт "+fmt(over[0].fact)+" ₸/"+esc(over[0].u)+
        " против нормы "+fmt(over[0].plan)+" ("+up(over[0].d)+"). Это либо перерасход в цехе, "+
        "либо замена ингредиента, которую не внесли в карту." : ""),
      (under.length? "Дешевле нормы — <b>"+under.length+"</b> позиций. Это не всегда хорошо: "+
        "чаще означает, что карта устарела и в ней записано больше сырья, чем кладут. "+
        "Крупнейшая: <b>"+esc(under[0].n)+"</b> ("+dn(under[0].d)+")." : ""),
      (T.n_nocard? "<b>"+fmt(T.n_nocard)+"</b> позиций выпускались без тех.карты, на "+
        mln(nocardSum)+". По ним нормы просто нет — себестоимость такая, какая получилась." : "")
    ])+
    '<div class="card"><div class="ct">Кто дальше всех от нормы</div>'+
    '<div class="cs">Отклонение факта от нормы в процентах. Столбик вправо — сырья ушло больше, '+
    'чем по карте; влево — меньше.</div>'+
    '<div style="height:330px"><canvas id="chTc"></canvas></div></div>'+
    '<div class="card"><div class="ct">Дороже нормы</div>'+
    '<div class="cs">Фактическая себестоимость единицы выше расчётной по тех.карте. '+
    '«Цена отклонения» — во сколько это обошлось за '+T.month+'.</div>'+
    tcTable(over,false)+'</div>'+
    '<div class="card"><div class="ct">Дешевле нормы</div>'+
    '<div class="cs">Обычно означает устаревшую карту: в ней записано больше сырья, чем кладут.</div>'+
    tcTable(under,true)+'</div>'+
    ((T.nocard&&T.nocard.length)?
      '<div class="card"><div class="ct">Выпускается без тех.карты</div>'+
      '<div class="cs">По этим позициям нормы нет вовсе — сравнивать не с чем.</div>'+
      rows(T.nocard,nocardSum,false,true)+'</div>' : '');
  }

  // ── структура по группам номенклатуры ────────────────────────
  function grpPane(){
    var G=D.groups;
    if(!G||!G.inp||!G.inp.length)
      return '<div class="card"><div class="ct">Из чего себестоимость</div>'+
        '<div class="empty">Группы номенклатуры не заполнены в справочнике iiko.</div></div>';
    // Проводка производства двойная: стоимость выпуска ВСЕГДА равна стоимости
    // списанного сырья, поэтому «материалоёмкость» здесь тождественно равна
    // ста процентам и ничего не значит. Смысл имеет только структура.
    var buyList=LP((G.inp||[]).filter(function(r){return !r.own;}));
    var top3=buyList.slice(0,3).reduce(function(a,r){return a+S(r);},0);
    var GBUY=SA(G.mo_buy)||G.buy;
    // Упаковка, расходники и химия — не сырьё. Держать их в одной цифре с
    // мясом и молочкой значит мерить рецептуру вместе с коробками.
    var packL=buyList.filter(function(r){return groupIsPack(r.n);});
    var rawL=buyList.filter(function(r){return !groupIsPack(r.n);});
    var packS=packL.reduce(function(a,r){return a+S(r);},0);
    var rawS=rawL.reduce(function(a,r){return a+S(r);},0);
    var GOWN=FULLP? G.own : Math.round((G.own||0)*(G.buy? GBUY/G.buy : 1));
    var conc=GBUY? Math.round(top3/GBUY*100) : 0;

    return '<div class="kpis">'+
      kpi("hi",mln(rawS),(FULLP?"Покупное сырьё с начала года":"Покупное сырьё за "+PER),
          "продукты без упаковки и расходников; внутренний передел не в счёт")+
      kpi("",mln(packS),"Упаковка и расходники",
          "это материалы, а не сырьё — "+pct(packS,GBUY)+"% всех закупок в производство")+
      kpi("",conc+"%","Три группы дают",
          (buyList.slice(0,3).map(function(r){return r.n;}).join(" · ")||"—"))+
      kpi("",mln(GOWN),"Внутренний передел",
          "полуфабрикаты собственного производства, ушедшие в дело")+
      kpi("",fmt(G.n_inp)+" / "+fmt(G.n_out),"Групп: сырьё / выпуск",
          "вместо тысяч отдельных позиций")+
    '</div>'+
    '<div class="note"><b>Зачем группы.</b> По списку из сорока позиций не видно, из чего '+
    'вообще складывается себестоимость. Группы номенклатуры дают ту же картину в двадцати '+
    'строках: мясо, молочка, овощи, упаковка. Метка <b>«своё»</b> — группа, которую завод '+
    'не только тратит, но и сам выпускает: это внутренний передел, и в покупное сырьё он '+
    'не входит, иначе затраты задвоились бы. <b>Доли, а не «материалоёмкость».</b> '+
    'Проводка производства двойная — стоимость выпуска всегда равна стоимости списанного '+
    'сырья, поэтому отношение одного к другому тождественно сто процентов и ничего не '+
    'показывает. Работает только структура: какая группа сколько занимает и как это '+
    'меняется по месяцам.</div>'+
    insight([
      "Куплено в производство за "+PER+" — <b>"+mln(GBUY)+"</b>: из них сырьё <b>"+mln(rawS)+
        "</b>, упаковка и расходники <b>"+mln(packS)+"</b>. Внутренний передел ("+mln(GOWN)+
        ") сюда не входит: это уже оплаченное сырьё, прошедшее через собственный цех, и второй раз "+
        "его считать нельзя.",
      (buyList.length? "Три группы дают <b>"+conc+"%</b> всего сырья: "+
        buyList.slice(0,3).map(function(r){return "<b>"+esc(r.n)+"</b> ("+pct(S(r),GBUY)+"%)";}).join(", ")+
        ". Экономить имеет смысл здесь — процент с этих трёх строк весит больше, чем весь остальной список." : ""),
      (function(){
        return packS? ("Упаковка и расходники — <b>"+mln(packS)+"</b>, это "+pct(packS,GBUY)+
          "% всего, что закуплено в производство. Это <b>не сырьё</b>: единственная группа, "+
          "которую можно сократить, не трогая рецептуру.") : "";})(),
      (function(){
        var best=null;
        buyList.slice(0,8).forEach(function(r){
          var m=r.m||[]; if(!m.length||closed<1) return;
          var a=m[0], b=m[closed]; if(!a||!b) return;
          var d=Math.round((b/a-1)*100);
          if(!best||Math.abs(d)>Math.abs(best.d)) best={n:r.n,d:d};
        });
        return best? ("Сильнее всего за период изменилась группа <b>"+esc(best.n)+"</b>: "+sig(best.d)+
          " от "+D.mo_labels[0]+" к "+D.mo_labels[closed]+".") : "";})()
    ])+
    '<div class="card"><div class="ct">Структура покупного сырья по месяцам</div>'+
    '<div class="cs">Шесть крупнейших групп и всё остальное одной полосой. '+
    'Смотреть надо не на высоту столбика — она идёт за объёмом выпуска, — а на то, '+
    'меняются ли пропорции внутри него.</div>'+
    '<div style="height:290px"><canvas id="chGrp"></canvas></div></div>'+
    '<div class="two">'+
      '<div class="card"><div class="ct">Из чего производим</div>'+
      '<div class="cs">Группы сырья и полуфабрикатов по стоимости списания за '+PER+'.</div>'+
      rows(G.inp,sum(G.inp),true,false)+'</div>'+
      '<div class="card"><div class="ct">Что производим — по группам</div>'+
      '<div class="cs">Выпуск по группам номенклатуры за '+PER+', включая внутренний передел.</div>'+
      rows(G.out,sum(G.out),false,false)+'</div>'+
    '</div>';
  }


  // ── сортировка таблиц по клику на заголовок ──────────────────
  // Числа берём из data-v, а не из текста: «21,6 млн ₸» и «343 шт»
  // как строки сортируются неправильно. Колонку-полоску «Вес» и
  // единицу измерения не трогаем — там сортировать нечего.
  function makeSortable(){
    [].forEach.call(document.querySelectorAll("table"),function(t){
      if(t.getAttribute("data-srt"))return;
      var head=t.rows[0]; if(!head||!head.cells.length)return;
      t.setAttribute("data-srt","1");
      var body=t.rows[1]&&t.rows[1].parentNode; if(!body)return;
      for(var c=0;c<head.cells.length;c++)(function(ci){
        var th=head.cells[ci];
        if(/^\s*вес\s*$/i.test(th.textContent))return;
        th.setAttribute("data-s","1");
        th.title="Нажмите, чтобы отсортировать";
        th.addEventListener("click",function(){
          var dir=(th.getAttribute("data-dir")==="desc")?"asc":"desc";
          for(var j=0;j<head.cells.length;j++){
            var o=head.cells[j];
            o.removeAttribute("data-dir");
            o.innerHTML=o.innerHTML.replace(/\s*[▲▼]$/,"");
          }
          th.setAttribute("data-dir",dir);
          th.innerHTML=th.innerHTML.replace(/\s*[▲▼]$/,"")+(dir==="asc"?" ▲":" ▼");
          var rs=[].slice.call(t.rows,1);
          rs.sort(function(a,b){
            var x=a.cells[ci], y=b.cells[ci];
            if(!x||!y)return 0;
            var xv=x.getAttribute("data-v"), yv=y.getAttribute("data-v"), r;
            if(xv!==null&&yv!==null) r=parseFloat(xv)-parseFloat(yv);
            else r=String(x.textContent||"").localeCompare(String(y.textContent||""),"ru");
            return dir==="asc"? r : -r;
          });
          for(var k=0;k<rs.length;k++) body.appendChild(rs[k]);
        });
      })(c);
    });
  }
  makeSortable();

  // ── поиск по названию внутри таблицы ─────────────────────────
  document.addEventListener("input",function(e){
    var i=e.target;
    if(!i||!i.className||i.className.indexOf("flt")<0)return;
    var key=i.getAttribute("data-t"), t=document.getElementById(key);
    if(!t)return;
    var q=(i.value||"").trim().toLowerCase(), shown=0;
    for(var r=1;r<t.rows.length;r++){
      var c=t.rows[r].cells[0];
      var ok=!q||String(c&&c.textContent||"").toLowerCase().indexOf(q)>=0;
      t.rows[r].style.display=ok?"":"none";
      if(ok)shown++;
    }
    var lab=document.querySelector('.cnt[data-t="'+key+'"]');
    if(lab)lab.textContent=fmt(shown);
  });

  // ── вкладки, период и перерисовка ────────────────────────────
  function bindTabs(){
    [].forEach.call(document.querySelectorAll(".tb"),function(b){
      b.addEventListener("click",function(){
        [].forEach.call(document.querySelectorAll(".tb"),function(x){x.classList.remove("on");});
        [].forEach.call(document.querySelectorAll(".pane"),function(x){x.classList.remove("on");});
        b.classList.add("on");
        CURTAB=b.getAttribute("data-p");
        var p=document.getElementById("p-"+CURTAB);
        if(p) p.classList.add("on");
        setPitch();
      });
    });
    [].forEach.call(document.querySelectorAll(".chip[data-tc]"),function(c){
      c.addEventListener("click",function(){ TCMODE=c.getAttribute("data-tc"); draw(); });
    });
    var sel=document.getElementById("perSel");
    if(sel) sel.addEventListener("change",function(){
      var v=String(sel.value).split(":");
      RA=parseInt(v[0],10)||0; RB=parseInt(v[1],10);
      if(isNaN(RB)) RB=N-1;
      if(RB<RA) RB=RA;
      draw();
    });
  }

  function draw(){
    recalc();
    _tid=0;
    app.innerHTML=pageHTML();
    var p=document.getElementById("p-"+CURTAB);
    if(p){ [].forEach.call(document.querySelectorAll(".pane"),function(x){x.classList.remove("on");});
           p.classList.add("on"); }
    bindTabs(); makeSortable(); drawCharts(); stickHead();
  }

  // Шапка длинной таблицы прилипает не к нулю, а под белую шапку страницы и
  // строку вкладок — иначе названия столбцов уезжают под них и не читаются.
  function stickHead(){
    var top=0;
    var tb=document.querySelector(".topbar,.topbar-new");
    if(tb) top+=Math.round(tb.getBoundingClientRect().height);
    var tabs=document.querySelector(".tabs");
    if(tabs&&getComputedStyle(tabs).position==="sticky")
      top+=Math.round(tabs.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--stick", top+"px");
  }

  function drawCharts(){
  if(window.Chart){
    var cmEl=document.getElementById("chMo");
    var chMo=new Chart(cmEl,{
      data:{labels:D.mo_labels.map(function(l,i){return l+" · "+moEnd(i).slice(3,5)+"."+YR.slice(2);}),
        datasets:[
        {type:"bar",label:"Товарный выпуск",data:netto.map(function(v){return v/1e6;}),
         _base:PAL[0],backgroundColor:netto.map(function(_,i){return shade(PAL[0],i);}),
         borderRadius:6,order:2},
        {type:"line",label:"Оборот производства",data:gross.map(function(v){return v/1e6;}),
         borderColor:PAL[1],backgroundColor:PAL[1],borderWidth:2,
         pointRadius:gross.map(function(_,i){return (i>=RA&&i<=RB)?4:2;}),tension:.3,order:1}]},
      options:chOpts({
        onClick:function(e,el){ if(!el||!el.length)return;
          var i=el[0].index; RA=i; RB=i; draw(); },
        plugins:{legend:{labels:{color:CLEG,boxWidth:11,font:{size:10.5},usePointStyle:true,
                                 pointStyle:"circle",generateLabels:legLabels}},
          tooltip:{backgroundColor:"rgba(20,28,48,.96)",borderColor:"#3b4a78",borderWidth:1,
            titleColor:"#fff",bodyColor:"#dbe6f5",padding:10,cornerRadius:8,
            callbacks:{title:function(c){var i=c[0].dataIndex;
                         return D.mo_labels[i]+" "+YR+" · "+moStart(i)+"–"+moEnd(i);},
                       label:function(c){return c.dataset.label+": "+c.parsed.y.toFixed(1)+" млн ₸";},
                       footer:function(){return "Клик по столбику — показать этот месяц";}}}},
        scales:{x:{ticks:{color:CTICK,font:{size:11}},grid:{display:false}},
                y:{beginAtZero:true,ticks:{color:CTICK,font:{size:10},
                   callback:function(v){return v+" млн";}},grid:{color:CGRID}}}})});
    cmEl.style.cursor="pointer";
    // Себестоимость единицы: у позиций разный масштаб (₸/кг и ₸/порц не
    // сравнить), поэтому каждую приводим к индексу — первый закрытый месяц
    // с данными равен 100. Тогда на одном графике видно, кто дорожает.
    // График себестоимости единицы интерактивный: набор линий задаётся кликом
    // по строке таблицы. Индекс (первый месяц = 100) нужен, потому что ₸/кг и
    // ₸/порц на одной оси не сравнить; в подсказке при этом показываем и тенге.
    var cc=document.getElementById("chCost");
    if(cc&&D.unitcost&&D.unitcost.length){
      var PAL2=PAL;
      var UCsel=[]; for(var i0=0;i0<Math.min(6,D.unitcost.length);i0++)UCsel.push(i0);
      var ucChart=null;
      function ucColor(i){ return PAL2[UCsel.indexOf(i)%PAL2.length]; }
      function ucSets(){
        return UCsel.map(function(idx,k){
          var r=D.unitcost[idx], base=null;
          for(var m=0;m<=closed&&m<r.c.length;m++){ if(r.c[m]){ base=r.c[m]; break; } }
          return {label:r.n.length>30? r.n.slice(0,30)+"…" : r.n,
                  _raw:r.c, _u:r.u||"",
                  data:r.c.map(function(v){return (v&&base)? Math.round(v/base*1000)/10 : null;}),
                  borderColor:PAL2[k%PAL2.length],backgroundColor:PAL2[k%PAL2.length],
                  borderWidth:2,pointRadius:2.5,tension:.3,spanGaps:true};
        });
      }
      function ucHint(){
        var h=document.getElementById("ucHint"); if(!h)return;
        h.innerHTML = UCsel.length
          ? ("На графике "+UCsel.length+" "+plural(UCsel.length,"позиция","позиции","позиций")+
             ": "+UCsel.map(function(idx,k){
                return '<span class="dot" style="background:'+PAL2[k%PAL2.length]+'"></span>'+
                       esc(D.unitcost[idx].n);}).join(" &nbsp; ")+
             " · чтобы убрать, кликните строку ещё раз")
          : "Ни одной позиции не выбрано — кликните строку в таблице ниже.";
      }
      function ucDraw(){
        if(ucChart){ ucChart.data.datasets=ucSets(); ucChart.update(); ucHint(); return; }
        ucChart=new Chart(cc,{type:"line",data:{labels:D.mo_labels,datasets:ucSets()},
          options:chOpts({
            interaction:{mode:"nearest",intersect:true},
            hover:{mode:"nearest",intersect:true},
            plugins:{legend:{labels:{color:CLEG,boxWidth:11,font:{size:10},
                                     usePointStyle:true,pointStyle:"circle"}},
              tooltip:{backgroundColor:"rgba(20,28,48,.96)",borderColor:"#3b4a78",borderWidth:1,
                titleColor:"#fff",bodyColor:"#dbe6f5",footerColor:"#9db0ca",
                padding:11,cornerRadius:8,displayColors:false,
                callbacks:{
                  title:function(c){ return c[0].dataset.label; },
                  label:function(c){
                    var raw=(c.dataset._raw||[])[c.dataIndex];
                    return (raw? fmt(raw)+" ₸/"+c.dataset._u : "нет данных")+
                           "  ·  "+D.mo_labels[c.dataIndex]+" "+YR; },
                  footer:function(c){
                    var v=c[0].parsed.y;
                    if(v===null||v===undefined) return "";
                    var d=Math.round((v-100)*10)/10;
                    return "индекс "+pc(v)+" — "+(d>0? "дороже на "+pc(d)+"%"
                           : (d<0? "дешевле на "+pc(Math.abs(d))+"%" : "как в первом месяце"));}}}},
            scales:{x:{ticks:{color:CTICK,font:{size:11}},grid:{display:false}},
                    y:{ticks:{color:CTICK,font:{size:10},callback:function(v){return v;}},
                       grid:{color:CGRID}}}})});
        ucHint();
      }
      ucDraw();
      var tb=document.getElementById("tbUC");
      if(tb) tb.addEventListener("click",function(e){
        var tr=e.target; while(tr&&tr.tagName!=="TR")tr=tr.parentNode;
        if(!tr||!tr.getAttribute)return;
        var a=tr.getAttribute("data-uc"); if(a===null)return;
        var idx=parseInt(a,10), at=UCsel.indexOf(idx);
        if(at>=0){ UCsel.splice(at,1); tr.classList.remove("pick"); }
        else {
          if(UCsel.length>=10){ UCsel.shift();
            var old=tb.querySelector('tr.pick'); if(old)old.classList.remove("pick"); }
          UCsel.push(idx); tr.classList.add("pick");
        }
        ucDraw();
      });
    }
    // Разделка и переработка: вход против выхода по каждой единице
    ["chDis","chTr"].forEach(function(id){
      var el=document.getElementById(id); if(!el)return;
      var R=(id==="chDis")? D.disasm : D.transf;
      if(!R||!R.units||!R.units.length)return;
      var U=R.units.filter(function(u){return u.in>0;});
      if(!U.length)return;
      var vals=U.map(function(u){return Math.round(u.out/u.in*1000)/10;});
      new Chart(el,{type:"bar",data:{labels:U.map(function(u){return u.u;}),
        datasets:[{label:"Выход, % от входа",data:vals,
          backgroundColor:vals.map(function(v){return v<100? PAL[9]:PAL[2];}),
          borderRadius:5}]},
        options:{indexAxis:"y",maintainAspectRatio:false,
          plugins:{legend:{display:false},
            tooltip:{callbacks:{
              title:function(c){return "Единица: "+c[0].label;},
              label:function(c){var u=U[c.dataIndex];
                return ["вошло  "+Math.round(u.in).toLocaleString("ru-RU")+" "+u.u,
                        "вышло  "+Math.round(u.out).toLocaleString("ru-RU")+" "+u.u,
                        "выход  "+String(c.parsed.x).replace(".",",")+"%"];}}}},
          scales:{x:{beginAtZero:true,suggestedMax:110,
                     ticks:{color:CTICK,font:{size:10},callback:function(v){return v+"%";}},
                     grid:{color:CGRID}},
                  y:{ticks:{color:CLEG,font:{size:12}},grid:{display:false}}}}});
    });
    var ct=document.getElementById("chTc");
    if(ct&&D.techcard&&D.techcard.rows&&D.techcard.rows.length){
      var R=D.techcard.rows.slice().filter(function(r){return Math.abs(r.d)>0.5;});
      R.sort(function(a,b){return Math.abs(b.d)-Math.abs(a.d);});
      R=R.slice(0,15).sort(function(a,b){return b.d-a.d;});
      new Chart(ct,{type:"bar",data:{labels:R.map(function(r){
          return r.n.length>26? r.n.slice(0,26)+"…" : r.n;}),
        datasets:[{label:"Отклонение от нормы, %",data:R.map(function(r){return r.d;}),
          backgroundColor:R.map(function(r){return r.d>0? PAL[9] : PAL[2];}),borderRadius:4}]},
        options:{indexAxis:"y",maintainAspectRatio:false,
          plugins:{legend:{display:false},
            tooltip:{callbacks:{label:function(c){return (c.parsed.x>0?"+":"")+c.parsed.x+"% к норме";}}}},
          scales:{x:{ticks:{color:CTICK,font:{size:10},callback:function(v){return v+"%";}},
                     grid:{color:CGRID}},
                  y:{ticks:{color:CLEG,font:{size:10}},grid:{display:false}}}}});
    }
    var cg=document.getElementById("chGrp");
    if(cg&&D.groups&&D.groups.inp){
      var PALG=PAL.slice(0,6).concat(["rgba(157,176,202,.45)"]);
      var buyL=D.groups.inp.filter(function(r){return !r.own;});
      var six=buyL.slice(0,6);
      var ds=six.map(function(r,i){
        return {label:r.n,data:(r.m||[]).map(function(v,mi){return (mi>=RA&&mi<=RB)? v/1e6 : null;}),
                backgroundColor:PALG[i],borderRadius:3,stack:"s"};});
      var restM=(D.mo_labels||[]).map(function(_,i){
        var t=0; buyL.slice(6).forEach(function(r){t+=(r.m||[])[i]||0;}); return t/1e6;});
      if(restM.some(function(v){return v>0;}))
        ds.push({label:"Прочее",data:restM,backgroundColor:PALG[6],borderRadius:3,stack:"s"});
      new Chart(cg,{type:"bar",data:{labels:D.mo_labels,datasets:ds},
        options:{maintainAspectRatio:false,
          plugins:{legend:{labels:{color:CLEG,boxWidth:11,font:{size:10}}},
            tooltip:{callbacks:{label:function(c){return c.dataset.label+": "+c.parsed.y.toFixed(1)+" млн ₸";}}}},
          scales:{x:{stacked:true,ticks:{color:CTICK,font:{size:11}},grid:{display:false}},
                  y:{stacked:true,beginAtZero:true,ticks:{color:CTICK,font:{size:10},
                     callback:function(v){return v+" млн";}},grid:{color:CGRID}}}}});
    }
    var ci=document.getElementById("chInv");
    if(ci&&D.invent&&D.invent.mo_out){
      new Chart(ci,{type:"bar",data:{labels:D.mo_labels,datasets:[
        {label:"Недостачи",data:D.invent.mo_out.map(function(v){return v/1e6;}),
         _base:PAL[9],backgroundColor:(D.invent.mo_out||[]).map(function(_,i){return shade(PAL[9],i);}),borderRadius:6},
        {label:"Излишки",data:(D.invent.mo_in||[]).map(function(v){return v/1e6;}),
         _base:PAL[2],backgroundColor:(D.invent.mo_in||[]).map(function(_,i){return shade(PAL[2],i);}),borderRadius:6}]},
        options:chOpts({onClick:pickMonth,
          scales:{x:{ticks:{color:CTICK,font:{size:11}},grid:{display:false}},
                  y:{beginAtZero:true,ticks:{color:CTICK,font:{size:10},
                     callback:function(v){return v+" млн";}},grid:{color:CGRID}}}})});
      clickable("chInv");
    }
    var cw=document.getElementById("chWo");
    if(cw&&D.writeoff&&D.writeoff.mo){
      new Chart(cw,{type:"bar",data:{labels:D.mo_labels,
        datasets:[{label:"Списано",data:D.writeoff.mo.map(function(v){return v/1e6;}),
                   backgroundColor:D.writeoff.mo.map(function(_,i){return shade(PAL[1],i);}),
                   borderRadius:6}]},
        options:chOpts({onClick:pickMonth,
          plugins:{legend:{display:false},
            tooltip:{backgroundColor:"rgba(20,28,48,.96)",borderColor:"#3b4a78",borderWidth:1,
              titleColor:"#fff",bodyColor:"#dbe6f5",padding:10,cornerRadius:8,
              callbacks:{label:function(c){return c.parsed.y.toFixed(2)+" млн ₸";},
                         footer:function(){return "Клик — показать этот месяц";}}}},
          scales:{x:{ticks:{color:CTICK,font:{size:11}},grid:{display:false}},
                  y:{beginAtZero:true,ticks:{color:CTICK,font:{size:10},
                     callback:function(v){return v+" млн";}},grid:{color:CGRID}}}})});
      clickable("chWo");
    }
    // Доля списаний в товарном выпуске: нормированная величина, по которой
    // только и можно судить, растут потери или просто растёт выпуск.
    var cr=document.getElementById("chWoRatio");
    if(cr&&D.writeoff&&D.writeoff.mo){
      var mo=D.writeoff.mo;
      var rat=mo.map(function(v,i){ return netto[i]? Math.round(v/netto[i]*1000)/10 : null; });
      var okv=rat.filter(function(v,i){return v!==null && i<=closed;});
      var mid=okv.length? okv.reduce(function(a,b){return a+b;},0)/okv.length : 0;
      new Chart(cr,{data:{labels:D.mo_labels,datasets:[
        {type:"bar",label:"Списано, млн ₸",_base:PAL[1],
         data:mo.map(function(v){return v/1e6;}),
         backgroundColor:mo.map(function(_,i){return shade(PAL[1],i);}),borderRadius:6,
         order:3,yAxisID:"y"},
        {type:"line",label:"Доля в товарном выпуске, %",data:rat,
         borderColor:PAL[9],backgroundColor:PAL[9],borderWidth:2.5,pointRadius:4,
         tension:.25,order:1,yAxisID:"y1",spanGaps:true},
        {type:"line",label:"Средний уровень",data:rat.map(function(){return Math.round(mid*10)/10;}),
         borderColor:"rgba(157,176,202,.7)",borderDash:[6,5],borderWidth:1.5,pointRadius:0,
         order:2,yAxisID:"y1"}]},
        options:chOpts({onClick:pickMonth,
          plugins:{legend:{labels:{color:CLEG,boxWidth:11,font:{size:10.5},usePointStyle:true,
                                   pointStyle:"circle",generateLabels:legLabels}},
            tooltip:{backgroundColor:"rgba(20,28,48,.96)",borderColor:"#3b4a78",borderWidth:1,
              titleColor:"#fff",bodyColor:"#dbe6f5",padding:10,cornerRadius:8,
              callbacks:{title:function(c){var i=c[0].dataIndex;
                           return D.mo_labels[i]+" "+YR+" · "+moStart(i)+"–"+moEnd(i);},
                         label:function(c){ return c.datasetIndex===0
                           ? ("списано "+c.parsed.y.toFixed(2)+" млн ₸")
                           : (c.dataset.label+": "+pc(c.parsed.y)+"%"); }}}},
          scales:{x:{ticks:{color:CTICK,font:{size:11}},grid:{display:false}},
            y:{beginAtZero:true,position:"left",ticks:{color:CTICK,font:{size:10},
               callback:function(v){return v+" млн";}},grid:{color:CGRID}},
            y1:{beginAtZero:true,position:"right",ticks:{color:PAL[9],font:{size:10},
               callback:function(v){return v+"%";}},grid:{display:false}}}})});
      clickable("chWoRatio");
    }
    // Парето: сколько позиций закрывают 80% списаний.
    var cp=document.getElementById("chWoPareto");
    if(cp&&D.writeoff&&D.writeoff.by_product){
      var L=LP(D.writeoff.by_product).slice(0,30);
      var tot=sum(LP(D.writeoff.by_product))||1, run=0;
      var cum=L.map(function(r){ run+=S(r); return Math.round(run/tot*1000)/10; });
      new Chart(cp,{data:{labels:L.map(function(r){
          return r.n.length>22? r.n.slice(0,22)+"…" : r.n;}),
        datasets:[
        {type:"bar",label:"Списано",_base:PAL[0],data:L.map(function(r){return S(r)/1e6;}),
         backgroundColor:PAL[0],borderRadius:4,order:2,yAxisID:"y"},
        {type:"line",label:"Накопленная доля, %",data:cum,borderColor:PAL[1],backgroundColor:PAL[1],
         borderWidth:2.5,pointRadius:3,tension:.2,order:1,yAxisID:"y1"},
        {type:"line",label:"Порог 80%",data:cum.map(function(){return 80;}),
         borderColor:"rgba(157,176,202,.7)",borderDash:[6,5],borderWidth:1.5,pointRadius:0,
         order:0,yAxisID:"y1"}]},
        options:chOpts({
          plugins:{legend:{labels:{color:CLEG,boxWidth:11,font:{size:10.5},usePointStyle:true,
                                   pointStyle:"circle",generateLabels:legLabels}},
            tooltip:{backgroundColor:"rgba(20,28,48,.96)",borderColor:"#3b4a78",borderWidth:1,
              titleColor:"#fff",bodyColor:"#dbe6f5",padding:10,cornerRadius:8,
              callbacks:{title:function(c){return L[c[0].dataIndex].n;},
                         label:function(c){ return c.datasetIndex===0
                           ? ("списано "+mln(S(L[c.dataIndex])))
                           : (c.dataset.label+": "+pc(c.parsed.y)+"%"); }}}},
          scales:{x:{ticks:{color:CTICK,font:{size:9},maxRotation:60,minRotation:45},
                     grid:{display:false}},
            y:{beginAtZero:true,position:"left",ticks:{color:CTICK,font:{size:10},
               callback:function(v){return v+" млн";}},grid:{color:CGRID}},
            y1:{beginAtZero:true,max:100,position:"right",ticks:{color:PAL[1],font:{size:10},
               callback:function(v){return v+"%";}},grid:{display:false}}}})});
    }
  }

  }

  draw();
  window.addEventListener("resize",stickHead);
  window.addEventListener("load",stickHead);
  setTimeout(stickHead,600); setTimeout(stickHead,1800);
  document.getElementById("upd").textContent="обновлено "+D.updated+" · данные по "+D.through;
})();
