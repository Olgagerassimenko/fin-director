<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ОПиУ 2026 — Фуд завод</title>

<!-- ============================================================
     Страница «ОПиУ 2026» системы «Пульс».
     Автор и разработчик: Ольга Герасименко. © 2026.

     Откуда цифры: страница НИЧЕГО не считает по первичке сама.
     Она читает готовый opiu_audit.js — его собирает gen_opiu_iiko.py
     в GitHub Actions прямо из оборотов счетов iiko (те же счета,
     что строки бухгалтерского ОПиУ), а gen_opiu_audit.py добавляет
     порядок строк и иерархию из бухгалтерского xlsx.
     Второй файл, opiu_iiko.js, нужен только ради признаков месяца:
     закрыт ли он бухгалтерией, полный ли, что дочитано оценкой.

     Поэтому страницу не нужно пересобирать при обновлении данных:
     CI перезаписывает opiu_audit.js три раза в день, а страница
     остаётся прежней и просто показывает свежие цифры.
     ============================================================ -->

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<!-- onerror гасит ошибку, если файл данных ещё не собран: страница покажет понятное сообщение вместо белого экрана -->
<script src="opiu_audit.js" onerror="window.OPIU_AUDIT=null"></script>
<script src="opiu_iiko.js" onerror="window.OPIU_IIKO=null"></script>

<style>
/* ── палитра ───────────────────────────────────────────────────
   Тёмная основа, чтобы цветные акценты «светились», и шесть
   насыщенных цветов, каждый со своей ролью:
   фиолетовый — выручка, синий — себестоимость, зелёный — прибыль,
   янтарный — оценка/досчёт, розовый — потери, циан — проценты.   */
:root{
  --bg:#0a0f1f; --panel:#131c33; --panel2:#182444; --line:#243257;
  --tx:#eef2ff; --mut:#8698b8;
  --vio:#a855f7; --vio2:#7c3aed;
  --cy:#22d3ee; --em:#34d399; --am:#fbbf24; --ro:#fb7185; --bl:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;min-height:100vh}
body::before{ /* мягкое неоновое свечение фона — чистый CSS, ничего не грузит */
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(680px 420px at 12% -8%, rgba(168,85,247,.22), transparent 60%),
    radial-gradient(620px 420px at 88% 4%, rgba(34,211,238,.16), transparent 60%),
    radial-gradient(900px 600px at 50% 108%, rgba(52,211,153,.10), transparent 60%);
}
::selection{background:rgba(168,85,247,.35)}

/* ── шапка ───────────────────────────────────────────────────── */
.hero{padding:22px 30px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(168,85,247,.12),rgba(10,15,31,0));}
.hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{font-size:12px;color:var(--mut);text-decoration:none;padding:7px 12px;border:1px solid var(--line);border-radius:10px;transition:.15s;white-space:nowrap}
.back:hover{color:var(--vio);border-color:var(--vio2);box-shadow:0 0 18px rgba(124,58,237,.35)}
.h1{font-size:26px;font-weight:900;letter-spacing:-.6px;line-height:1.1;
  background:linear-gradient(92deg,#fff 10%,var(--vio) 55%,var(--cy) 95%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.h1s{font-size:11.5px;color:var(--mut);margin-top:4px}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:#c7d3ea;
  background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.35);border-radius:999px;padding:7px 14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--em);box-shadow:0 0 10px var(--em);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}

/* панель под шапкой: режим показа слева, оглавление справа */
.hero-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.mode{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:3px}
.mode a{font-size:11px;font-weight:700;color:#a9b8d4;text-decoration:none;padding:6px 12px;border-radius:8px;white-space:nowrap}
.mode a.on{background:linear-gradient(135deg,var(--vio2),var(--vio));color:#fff;box-shadow:0 0 16px rgba(168,85,247,.45)}
.toc{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.toc a{font-size:11px;color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid transparent}
.toc a:hover{color:#fff;border-color:var(--line);background:rgba(255,255,255,.04)}
.wrap{max-width:1640px;margin:0 auto;padding:20px 30px 70px}
[id^="s-"]{scroll-margin-top:16px}

/* ── общие блоки ─────────────────────────────────────────────── */
.note{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:13px 16px 13px 18px;font-size:12px;color:#c2cfe6;line-height:1.65;margin-bottom:18px;overflow:hidden}
.note::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--vio),var(--cy))}
.note.warn::before{background:linear-gradient(180deg,var(--am),var(--ro))}
.note b{color:#fff}
.sec-t{font-size:15px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-t .sub{font-weight:400;font-size:11px;color:var(--mut)}
.tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{font-size:11px;font-weight:700;color:#a9b8d4;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:7px 13px;cursor:pointer;transition:.15s}
.btn:hover{color:#fff;border-color:var(--vio2)}
.btn.on{background:linear-gradient(135deg,var(--vio2),var(--vio));border-color:transparent;color:#fff;box-shadow:0 0 18px rgba(168,85,247,.45)}
.inp{font-size:11px;color:#dbe4f7;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;min-width:190px;outline:none}
.inp:focus{border-color:var(--vio2);box-shadow:0 0 16px rgba(124,58,237,.3)}
.pos{color:var(--em)}.neg{color:var(--ro)}.mut{color:var(--mut)}

/* ── KPI ─────────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:13px;margin-bottom:20px}
/* на широком экране раскладываем ровно 3×2 — так плитки крупнее и ряд не рвётся */
@media(min-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;overflow:hidden;transition:.18s}
.kpi:hover{transform:translateY(-3px);border-color:rgba(168,85,247,.45);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.kpi::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--ac,var(--vio));
  box-shadow:0 0 16px var(--ac,var(--vio))}
.kpi-l{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.kpi-v{font-size:26px;font-weight:900;margin-top:7px;letter-spacing:-.8px;color:var(--ac,#fff)}
.kpi-d{font-size:11px;margin-top:5px;color:var(--mut);min-height:16px}
.chip{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:6px}
.chip.up{background:rgba(52,211,153,.14);color:var(--em);border:1px solid rgba(52,211,153,.35)}
.chip.down{background:rgba(251,113,133,.14);color:var(--ro);border:1px solid rgba(251,113,133,.35)}
.chip.flat{background:rgba(134,152,184,.12);color:var(--mut);border:1px solid rgba(134,152,184,.3)}
.kpi-spark{margin-top:9px;height:26px}
.kpi-note{font-size:10.5px;color:#93a5c4;margin-top:8px;line-height:1.5;border-top:1px dashed var(--line);padding-top:8px}

/* ── карточки с графиками ────────────────────────────────────── */
.grid{display:grid;gap:14px;margin-bottom:6px}
.g2{grid-template-columns:1fr 1fr}
.g2b{grid-template-columns:1.35fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:1100px){.g3{grid-template-columns:1fr}}
@media(max-width:1100px){.g2,.g2b{grid-template-columns:1fr}}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card-t{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-s{font-size:11px;color:var(--mut);margin:3px 0 12px}
.cv{position:relative;height:280px}
.cv.tall{height:330px}

/* ── авто-выводы ─────────────────────────────────────────────── */
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.find{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px 13px 17px;overflow:hidden}
.find::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac,var(--vio));box-shadow:0 0 14px var(--ac,var(--vio))}
.find-h{font-size:12px;font-weight:800;margin-bottom:5px;color:#fff;display:flex;align-items:center;gap:7px}
.find-d{font-size:11.5px;color:#b9c7df;line-height:1.65}
.find-d b{color:#fff}
.todo{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:#9fb0cd;line-height:1.6}
.todo b{color:var(--am)}
.todo a{color:var(--cy);text-decoration:none;font-weight:700;white-space:nowrap}
.todo a:hover{text-decoration:underline}

/* ── топ-движения ────────────────────────────────────────────── */
.mv{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(36,50,87,.7)}
.mv:last-child{border-bottom:none}
.mv-n{flex:1;font-size:11.5px;color:#cfdaef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-b{width:34%;height:8px;border-radius:999px;background:rgba(134,152,184,.12);overflow:hidden;flex-shrink:0}
.mv-b i{display:block;height:100%;border-radius:999px}
.mv-v{width:98px;text-align:right;font-size:11.5px;font-weight:800;flex-shrink:0}

/* ── таблица ─────────────────────────────────────────────────── */
/* таблица живёт в потоке страницы: внутренних полос прокрутки нет.
   overflow-x оставлен страховкой для узких экранов. */
.tw{overflow-x:auto;overflow-y:visible;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px}
th,td{padding:6px 7px;text-align:right;white-space:nowrap}
thead th{position:sticky;top:0;background:#1b2748;color:#9fb0cd;font-size:10.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.4px;z-index:3;border-bottom:1px solid var(--line)}
th.nm,td.nm{text-align:left;position:sticky;left:0;background:var(--panel);z-index:2;
  min-width:150px;width:20%;white-space:normal}
thead th.nm{background:#1b2748;z-index:4}
tbody td{border-bottom:1px solid rgba(36,50,87,.45)}
tbody tr:hover td{background:rgba(168,85,247,.10)!important}
td.sep,th.sep{border-left:1px solid var(--line)}
tr.r-sub td{font-weight:800;color:#cbd8f0;background:#16203c}
tr.r-total td{font-weight:800;color:#fff;background:#17223f}
tr.r-big td{font-size:13px;font-weight:900;background:linear-gradient(90deg,rgba(168,85,247,.18),rgba(34,211,238,.08));color:#fff}
tr.on td{outline:1px solid rgba(168,85,247,.55);outline-offset:-1px}
td.est::after{content:'~';color:var(--am);font-weight:800;margin-left:3px}
.tag{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
.tag-est{background:rgba(251,191,36,.16);color:var(--am);border:1px solid rgba(251,191,36,.4)}
.tag-part{background:rgba(251,113,133,.16);color:var(--ro);border:1px solid rgba(251,113,133,.4)}
.spark{display:block}
tr.det td{background:#101830;padding:0}
tr.det .box{padding:12px 14px;height:190px}
.rowbtn{cursor:pointer}
.rowbtn .nm::before{content:'▸';color:var(--vio);margin-right:6px;display:inline-block;transition:transform .15s}
tr.open .nm::before{transform:rotate(90deg)}

/* ── незакрытые месяцы ───────────────────────────────────────── */
.gaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.gap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px 13px 17px;overflow:hidden}
.gap::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--am);box-shadow:0 0 14px var(--am)}
.gap-h{font-size:12.5px;font-weight:800;margin-bottom:7px}
.gap ul{margin:0 0 0 16px;color:#b9c7df;font-size:11px;line-height:1.75}
.empty{padding:80px;text-align:center;color:var(--mut);font-size:14px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--mut);margin:10px 2px 0}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ── ПРЕМИАЛЬНЫЙ СЛОЙ ────────────────────────────────────────────
   Ничего лишнего не грузим: всё «дорогое» — на градиентах, тенях
   и тонких линиях. Каждый раздел получает своё свечение, чтобы
   страница читалась как разделённая на главы.                     */
:root{--gold:#e8c98a}
.h1{text-shadow:0 0 34px rgba(168,85,247,.45)}
.hero{position:relative}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,201,138,.55),rgba(168,85,247,.5),transparent)}

/* заголовок раздела: светящаяся грань слева и мягкий след вправо */
.sec-t{position:relative;padding:2px 0 2px 16px}
.sec-t::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:4px;
  background:var(--sc,linear-gradient(180deg,var(--vio),var(--cy)));
  box-shadow:0 0 18px var(--sg,rgba(168,85,247,.85)),0 0 46px var(--sg,rgba(168,85,247,.3))}
.sec-t::after{content:'';position:absolute;left:16px;right:0;bottom:-7px;height:1px;
  background:linear-gradient(90deg,var(--sg,rgba(168,85,247,.5)),transparent 60%)}

/* карточки: стекло со светом сверху и глубокой мягкой тенью */
.card,.kpi,.find,.gap,.tw,.note{box-shadow:0 18px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.card{border-radius:18px;position:relative}
.card::after{content:'';position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.05),transparent 42%)}
.card-t{letter-spacing:-.2px}
.kpi{border-radius:18px}
.kpi-v{text-shadow:0 0 26px currentColor}

/* «было → стало»: читаются обе цифры, а не только новая */
.ba{display:flex;align-items:flex-end;gap:10px;margin-top:9px;flex-wrap:wrap}
.ba i{display:block;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.ba-w{font-size:15px;font-weight:700;color:#9fb0cd}
.ba-n{font-size:18px;font-weight:900;color:#fff}
.ba-a{font-size:16px;color:var(--vio);text-shadow:0 0 12px var(--vio);padding-bottom:2px}

/* таблица: золотой волосок под шапкой и мягкая подсветка строки */
thead th{border-bottom:1px solid rgba(232,201,138,.28)}
tbody tr:hover td{box-shadow:inset 0 0 0 9999px rgba(168,85,247,.06)}
.leg{opacity:.85}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <a class="back" href="index.html">← Назад</a>
    <div>
      <div class="h1">ОПиУ 2026</div>
      <div class="h1s">отчёт о прибылях и убытках · постатейно из iiko · помесячно, с досчётом незакрытых месяцев</div>
    </div>
    <div class="live"><span class="dot"></span><span id="upd">—</span></div>
  </div>
  <div class="hero-bar">
    <span class="mode" id="mode-sw"></span>
    <nav class="toc">
      <a href="#s-charts">Графики</a><a href="#s-find">Выводы</a><a href="#s-moves">Движения</a>
      <a href="#s-cmp">Сравнение месяцев</a><a href="#s-tab">Постатейно</a><a href="#s-note">Оговорки</a>
    </nav>
  </div>
</div>

<div class="wrap" id="wrap"><div class="empty">Загрузка…</div></div>

<script src="nav.js"></script>
<script>
(function(){
/* ============================================================
   1. ДАННЫЕ
   ============================================================
   A (opiu_audit.js) — основной источник:
     months  ['2025-01', …]        ключи месяцев
     labels  ['янв 2025', …]       подписи
     rows    [{n,ind,kind,v[],g,inc}]
              n   — название статьи
              ind — отступ в иерархии (0,3,6,9,12,15)
              kind— 'line' статья | 'sub' заголовок | 'total' итог
              v   — значения по месяцам, тенге
              g   — блок: rev|cogs|opex|oinc|oexp
              inc — 1 если строка доходная
     kpi     {rev,cogs,gross,opex,oper,net} — массивы по месяцам
   I (opiu_iiko.js) — признаки месяца: closed (закрыт бухгалтерией),
     fullMonth, share (доля прошедших дней), estAdd (сколько дочитано),
     gaps (какие начисления явно не дошли).
   ============================================================ */
var A=window.OPIU_AUDIT, I=window.OPIU_IIKO, W=document.getElementById('wrap');
if(!A||!A.months){W.innerHTML='<div class="empty">⚠ Нет данных: не загрузился opiu_audit.js</div>';return;}

var M=A.months, L=A.labels, R=A.rows, K=A.kpi;
document.getElementById('upd').textContent='обновлено '+(A.updated||'—');

/* Берём весь 2026 год и ровно столько же первых месяцев 2025 —
   иначе сравнение «год к году» врёт: 8 месяцев против 12. */
var i26=[], i25=[];
for(var i=0;i<M.length;i++) if(M[i].indexOf('2026-')===0) i26.push(i);
for(var i=0;i<M.length;i++) if(M[i].indexOf('2025-')===0) i25.push(i);

/* Режим показа. Смешивать закрытые месяцы с незакрытыми в одном итоге —
   значит выдавать оценку за факт, поэтому есть переключатель:
   «факт» оставляет только месяцы, закрытые бухгалтерией и полные,
   «все месяцы» показывает и текущие, но с честной пометкой досчёта.
   Режим живёт в адресе страницы, поэтому переключение — это просто
   переход по ссылке, и ничего не нужно пересобирать вручную. */
var FACT_ONLY = location.search.indexOf('fact=1')>=0;
var i25all=i25.slice();
/* сам отбор месяцев — ниже, сразу после mstat: ей нужны признаки месяца */
if(!i26.length){W.innerHTML='<div class="empty">⚠ В данных ещё нет ни одного месяца 2026 года</div>';return;}

/* Признаки месяца: сначала смотрим в opiu_iiko.js (он свежее),
   потом в meta из аудита, и только потом считаем месяц закрытым. */
var IM=(I&&I.months)||{}, AM=A.meta||{};
function mstat(ym){
  var a=IM[ym]||{}, b=AM[ym]||{};
  return {closed:(a.closed!==undefined)?a.closed:(b.closed!==undefined?b.closed:true),
          full:(a.fullMonth!==undefined)?a.fullMonth:(b.full!==undefined?b.full:true),
          share:(a.share!==undefined)?a.share:(b.share!==undefined?b.share:1),
          estAdd:a.estAdd||b.estAdd||0, gaps:a.gaps||b.gaps||[],

var UNIT={div:1e6,suf:'млн',dec:1};            /* переключается кнопками «млн ₸ / тыс ₸» */
function nz(x){ return (x===null||x===undefined||isNaN(x))?0:x; }
function fu(x){ x=nz(x); if(x===0) return '—';
  var v=x/UNIT.div; return v.toFixed(Math.abs(v)<10?UNIT.dec+1:UNIT.dec); }
function fbig(x){ x=nz(x); var a=Math.abs(x);
  if(a>=1e9) return (x/1e9).toFixed(2)+' млрд ₸';
  if(a>=1e6) return (x/1e6).toFixed(0)+' млн ₸';
  if(a>=1e3) return (x/1e3).toFixed(0)+' тыс ₸';
  return Math.round(x)+' ₸'; }
function pc(x,d){ return (x*100).toFixed(d===undefined?1:d)+'%'; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function mlab(ym){ var k=M.indexOf(ym); return k>=0?L[k]:(ym||'—'); }
/* «3.3.15.Видеонаблюдение…» и «Итого 2.5.Итог РазныеРасходы…» читаются плохо:
   номер плана счетов убираем с экрана, полное имя оставляем в подсказке. */
function nice(n){
  var t=String(n).replace(/^(итого\s+|ИТОГО\s+)/i,function(m){return m;});
  t=t.replace(/(^|\s)[\d]+(\.[\d]+)*\.?\s*/,'$1');
  t=t.replace(/\s{2,}/g,' ').trim();
  return t||String(n);
}
function ru(d){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||'')); return m?(m[3]+'.'+m[2]+'.'+m[1]):(d||'—'); }
function sum(v,idx){ var s=0; for(var j=0;j<idx.length;j++) s+=nz(v[idx[j]]); return s; }
function short(ym){ return (L[M.indexOf(ym)]||ym).replace(/\s2026$/,''); }

/* Δ к прошлому году. Процент врёт, когда база отрицательная или
   знак меняется (прибыль → убыток), поэтому в таких случаях
   показываем разницу в деньгах, а не «-646%». */
function dchip(now,was,good){
  now=nz(now); was=nz(was); var d=now-was;
  if(!was && !now) return '<span class="chip flat">—</span>';
  var cls = Math.abs(d)<1e4 ? 'flat' : ((d>0)===(good>0)?'up':'down');
  var txt = (was<=0||now<0) ? ((d>0?'+':'')+fbig(d)) : ((d>0?'+':'')+(d/was*100).toFixed(1)+'%');
  return '<span class="chip '+cls+'">'+txt+'</span>';
}
function dtxt(now,was,good){
  now=nz(now); was=nz(was); var d=now-was;
  if(!was && !now) return '<span class="mut">—</span>';
  var cls = Math.abs(d)<1e4 ? 'mut' : ((d>0)===(good>0)?'pos':'neg');
  var txt = (was<=0||now<0) ? ((d>0?'+':'')+fu(d)) : ((d>0?'+':'')+(d/was*100).toFixed(1)+'%');
  return '<span class="'+cls+'">'+txt+'</span>';
}

/* Спарклайн — крошечный график прямо в ячейке. Рисуем инлайновым
   SVG: библиотека для восьми точек не нужна, а грузится мгновенно. */
function spark(vals,color,w,h){
  w=w||96; h=h||26;
  var mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals);
  if(mx===mn){mx=mx+1;mn=mn-1;}
  var pts=vals.map(function(v,i){
    return (i/(vals.length-1)*(w-4)+2).toFixed(1)+','+((h-3)-((v-mn)/(mx-mn))*(h-6)).toFixed(1);
  }).join(' ');
  var last=pts.split(' ').pop().split(',');
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'
   + '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>'
   + '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="'+color+'"/></svg>';
}

/* ============================================================
   5. ТАБЛИЦА
   ============================================================
   Подсветка (heatmap) считается по каждой строке отдельно:
   сравниваем месяц со средним по строке. Для расходных статей
   «выше среднего» — тревожный красный, «ниже» — спокойный зелёный;
   для доходных наоборот. Так глазом сразу видно месяц-выброс.     */
var MATTER=Math.abs(Y.rev/N)*0.004;   /* «материальность»: ~0.4% средней месячной выручки */
function heat(v,avg,inc){
  if(!avg) return '';
  var d=(v-avg)/Math.abs(avg);
  /* два фильтра сразу, иначе таблица превращается в новогоднюю гирлянду:
     отклонение должно быть и заметным в процентах, и ощутимым в деньгах */
  if(Math.abs(d)<0.25 || Math.abs(v-avg)<MATTER) return '';
  var k=Math.min(Math.abs(d)/0.9,1)*0.34;
  var bad = inc ? (d<0) : (d>0);
  return 'background:rgba('+(bad?'251,113,133':'52,211,153')+','+k.toFixed(2)+')';
}
function tagFor(j){ var s=ST[j];
  if(!s.full) return '<span class="tag tag-part">неполный</span>';
  if(!s.closed) return '<span class="tag tag-est">досчёт</span>';
  return ''; }

   + '<th title="Изменение к тому же периоду 2025: в процентах, а для строк, где знак меняется — в млн ₸">Δ к 2025</th>'
   + '<th>% выр.</th></tr></thead>';
  return h;
}

  for(var j=0;j<N;j++){ var x=nz(v[i26[j]]);
    H+='<td class="cell'+((!ST[j].closed&&x)?' est':'')+'" data-h="'+heat(x,avg,row.inc)+'" data-v="'+x+'">'+fu(x)+'</td>'; }
  H+='<td class="sep num" data-v="'+t26+'"><b>'+fu(t26)+'</b></td>'
   + '<td class="num" data-v="'+t25+'">'+fu(t25)+'</td>'
   + '<td>'+dtxt(t26,t25,good)+'</td>'
   + '<td>'+(Y.rev?pc(t26/Y.rev):'')+'</td></tr>';
  visRows.push(row);
}
H+='</tbody></table></div>'
 + '<div class="leg"><span><i style="background:rgba(251,113,133,.45)"></i>месяц заметно хуже среднего по статье</span>'
 + '<span><i style="background:rgba(52,211,153,.45)"></i>месяц заметно лучше среднего</span>'

/* ============================================================
   6.7 СРАВНЕНИЕ МЕСЯЦ К МЕСЯЦУ
   ============================================================
   Считаем разницу по каждой конечной статье и раскладываем,
   из чего сложилось изменение прибыли: рост выручки минус рост
   себестоимости минус рост расходов. Статьи сортируем по модулю
   разницы — сверху то, что реально двинуло результат.            */
var cmpChart=null;
function renderCmp(a,b){
  var box=document.getElementById('cmp'); if(!box) return;
  var La=L[a], Lb=L[b], sa=mstat(M[a]), sb=mstat(M[b]);

  /* ключевые блоки */
  var keys=[['rev','Выручка',1],['cogs','Себестоимость',-1],['gross','Валовая прибыль',1],
            ['opex','Расходы',-1],['oper','Прибыль от осн. деятельности',1],['net','Чистая прибыль',1]];
  var h='<div class="kpis">';
  keys.forEach(function(k){
    var va=nz(K[k[0]][a]), vb=nz(K[k[0]][b]), d=vb-va;
    var col = Math.abs(d)<1e4 ? 'var(--mut)' : ((d>0)===(k[2]>0)?'var(--em)':'var(--ro)');
    h+='<div class="kpi" style="--ac:'+col+'">'
     + '<div class="kpi-l">'+esc(k[1])+'</div>'
     + '<div class="ba"><span class="ba-w"><i>было</i>'+fbig(va)+'</span>'
     +   '<span class="ba-a">→</span>'
     +   '<span class="ba-n"><i>стало</i>'+fbig(vb)+'</span></div>'
     + '<div class="kpi-d">'+dchip(vb,va,k[2])+'<span class="mut">разница '+(d>0?'+':'')+fbig(d)+'</span></div>'
     + '<div class="kpi-note">'+esc(La)+' → '+esc(Lb)+'</div></div>';
  });
  h+='</div>';

  /* постатейная разница */
  var diff=[];
  R.forEach(function(r){
    if(r.kind!=='line') return;
    var va=nz((r.v||[])[a]), vb=nz((r.v||[])[b]);
    if(!va && !vb) return;
    diff.push({n:r.n, a:va, b:vb, d:vb-va, inc:!!r.inc, g:r.g});
  });
  diff.sort(function(x,y){return Math.abs(y.d)-Math.abs(x.d);});
  var top=diff.slice(0,14);

  /* короткий вывод словами: из чего сложилась разница прибыли */
  var dRev=nz(K.rev[b])-nz(K.rev[a]), dCogs=nz(K.cogs[b])-nz(K.cogs[a]),
      dOpex=nz(K.opex[b])-nz(K.opex[a]), dOper=nz(K.oper[b])-nz(K.oper[a]);
  var parts=[];
  parts.push('выручка '+(dRev>=0?'дала +':'забрала ')+fbig(Math.abs(dRev)));
  parts.push('себестоимость '+(dCogs>0?'забрала ':'вернула +')+fbig(Math.abs(dCogs)));
  parts.push('расходы '+(dOpex>0?'забрали ':'вернули +')+fbig(Math.abs(dOpex)));
  h+='<div class="note"><b>'+esc(La)+' → '+esc(Lb)+'.</b> Прибыль от основной деятельности '
   + (dOper>=0?'выросла на <b>':'упала на <b>')+fbig(Math.abs(dOper))+'</b>: '+parts.join(', ')+'. '
   + 'Сильнее всего сдвинулась статья <b>'+esc(top.length?nice(top[0].n):'—')+'</b> ('+(top.length&&top[0].d>0?'+':'')+fbig(top.length?top[0].d:0)+').'
   + ((!sa.closed||!sb.closed)?' <span class="mut">Внимание: один из месяцев ещё не закрыт бухгалтерией, часть начислений в нём — оценка.</span>':'')
   + '</div>';

  /* график и таблица различий */
  h+='<div class="grid g2b">'
   + '<div class="card"><div class="card-t">📊 Топ изменений по статьям</div><div class="card-s">'+esc(La)+' → '+esc(Lb)+', млн ₸ · красное увеличивает затраты, зелёное улучшает результат</div><div class="cv tall"><canvas id="cCmp"></canvas></div></div>'
   + '<div class="card"><div class="card-t">🧮 Постатейно</div><div class="card-s">сортировка по величине изменения</div>'
   + '<table style="width:100%"><thead><tr><th class="nm" style="min-width:150px">Статья</th><th>'+esc(La)+'</th><th>'+esc(Lb)+'</th><th>Δ</th></tr></thead><tbody>';
  diff.slice(0,20).forEach(function(m){
    var good=(m.d>0)===m.inc;
    h+='<tr><td class="nm" style="padding-left:8px" title="'+esc(m.n)+'">'+esc(nice(m.n))+'</td><td>'+fu(m.a)+'</td><td>'+fu(m.b)+'</td>'
     + '<td class="'+(Math.abs(m.d)<1e4?'mut':(good?'pos':'neg'))+'">'+(m.d>0?'+':'')+fu(m.d)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  box.innerHTML=h;

  if(window.Chart){
    if(cmpChart) cmpChart.destroy();
    cmpChart=new Chart(document.getElementById('cCmp'),{type:'bar',
      data:{labels:top.map(function(m){return m.n.replace(/^[\d.]+\s*/,'').slice(0,34);}),
        datasets:[{label:'изменение, млн ₸',data:top.map(function(m){return m.d/1e6;}),
          backgroundColor:top.map(function(m){return ((m.d>0)===m.inc)?'rgba(52,211,153,.85)':'rgba(251,113,133,.85)';}),
          borderRadius:5}]},
      options:chartOpts({indexAxis:'y',plugins:{legend:{display:false},
        tooltip:{callbacks:{label:function(c){return (c.parsed.x>0?'+':'')+c.parsed.x.toFixed(2)+' млн ₸';}}}},
        scales:{x:{ticks:{color:'#8698b8',font:{size:10}},grid:{color:'rgba(148,163,184,.10)'}},
                y:{ticks:{color:'#9fb0cd',font:{size:10}},grid:{display:false}}}})});
  }
}

    scales:{x:{ticks:{color:'#8698b8',font:{size:10}},grid:{display:false}},
            y:{ticks:{color:'#8698b8',font:{size:10}},grid:{color:'rgba(148,163,184,.10)'}}}};

if(window.Chart){
  Chart.defaults.font.family="Inter, system-ui, sans-serif";
  /* плагин подписей подключаем точечно — только к бубликам, иначе он
     лезет в остальные графики и падает на смешанных типах */

  var ALL=[]; for(var q=0;q<M.length;q++) ALL.push(q);          /* все месяцы 2025–2026 */
  var labAll=ALL.map(function(k){ return L[k].replace(/\s20(\d\d)$/,"'$1"); });

  /* градиентная заливка вместо плоского цвета — ради «дорогого» вида */
  function grad(c,c1,c2){
    var a=c.chart.chartArea; if(!a) return c1;
    var g=c.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);
    g.addColorStop(0,c1); g.addColorStop(1,c2); return g;
  }

  /* 7.1 Выручка и себестоимость — помесячно за оба года */
  new Chart(document.getElementById('cRS'),{type:'bar',
    data:{labels:labAll,datasets:[
      {label:'Выручка',data:ALL.map(function(k){return mln(K.rev[k]);}),borderRadius:5,
       backgroundColor:function(c){return grad(c,'#fbbf24','rgba(251,191,36,.5)');}},
      {label:'Себестоимость',data:ALL.map(function(k){return mln(K.cogs[k]);}),borderRadius:5,
       backgroundColor:function(c){return grad(c,'#fb7185','rgba(251,113,133,.45)');}}
    ]},options:chartOpts()});

  /* 7.2 Чистая прибыль: цвет столбца — по знаку месяца */
  new Chart(document.getElementById('cNP'),{type:'bar',
    data:{labels:labAll,datasets:[{label:'Чистая прибыль',borderRadius:5,
      data:ALL.map(function(k){return mln(K.net[k]);}),
      backgroundColor:ALL.map(function(k){return nz(K.net[k])<0?'rgba(251,113,133,.9)':'rgba(52,211,153,.9)';})}]},
    options:chartOpts({plugins:{datalabels:{display:false},legend:{display:false},
      tooltip:{callbacks:{label:function(c){return (c.parsed.y>0?'прибыль ':'убыток ')+Math.abs(c.parsed.y).toFixed(1)+' млн ₸';}}}}})});

  /* 7.3–7.4 Структура затрат по годам.
     Берём подытоги ОПиУ: они не пересекаются и в сумме дают
     всю себестоимость плюс все расходы. */
  var STRUCT=['Итого 1.С/с реализованной продукции','Итого 2.ФОТ Производство','Итого 3.Арендная плата',
              'Итого 2.Расходы по реализации(папка)','Итого 3.Расходы АДМ','Расходы по вознаграждениям','Зарплата'];
  var SHORT={'Итого 1.С/с реализованной продукции':'С/с продукции','Итого 2.ФОТ Производство':'ФОТ пр-во',
             'Итого 3.Арендная плата':'Аренда','Итого 2.Расходы по реализации(папка)':'Расходы по реализации',
             'Итого 3.Расходы АДМ':'Админ. расходы','Расходы по вознаграждениям':'Вознаграждения','Зарплата':'Зарплата'};
  var PAL=['#7c5cf0','#22d3ee','#fbbf24','#fb7185','#34d399','#f472b6','#94a3b8'];
  function structData(idx){
    var lab=[],val=[];
    STRUCT.forEach(function(n){
      for(var r=0;r<R.length;r++) if(R[r].n===n){
        var v=sum(R[r].v||[],idx); if(v>0){ lab.push(SHORT[n]||n); val.push(v/1e6); } break; }
    });
    return {lab:lab,val:val};
  }
  function donut(id,d){
    var el=document.getElementById(id); if(!el) return;
    new Chart(el,{type:'doughnut',
      plugins:window.ChartDataLabels?[window.ChartDataLabels]:[],
      data:{labels:d.lab,datasets:[{data:d.val,backgroundColor:PAL,borderWidth:0,hoverOffset:10}]},
      options:chartOpts({cutout:'62%',scales:{},plugins:{
        legend:{position:'bottom',labels:{color:'#9fb0cd',boxWidth:9,usePointStyle:true,padding:9,font:{size:10}}},
        datalabels:{display:true,color:'#fff',font:{size:11,weight:'800'},
          textStrokeColor:'rgba(0,0,0,.45)',textStrokeWidth:3,
          formatter:function(v,c){ var t=c.dataset.data.reduce(function(a,b){return a+b;},0);
            var pp=v/t*100; return pp<6?'':pp.toFixed(1)+'%'; }},
        tooltip:{callbacks:{label:function(c){ var t=c.dataset.data.reduce(function(a,b){return a+b;},0);
          return c.label+': '+c.parsed.toFixed(1)+' млн ₸ ('+(c.parsed/t*100).toFixed(1)+'%)'; }}}}})});
  }
  donut('cS5',structData(i25)); donut('cS6',structData(i26));

  /* 7.5 Валовая прибыль — область с градиентом */
  new Chart(document.getElementById('cGP'),{type:'line',
    data:{labels:labAll,datasets:[{label:'Валовая прибыль',data:ALL.map(function(k){return mln(K.gross[k]);}),
      borderColor:'#34d399',borderWidth:3,tension:.35,fill:true,
      backgroundColor:function(c){return grad(c,'rgba(52,211,153,.45)','rgba(52,211,153,0)');},
      pointRadius:3,pointBackgroundColor:'#34d399',pointBorderColor:'#0a0f1f',pointBorderWidth:2}]},
    options:chartOpts({plugins:{datalabels:{display:false},legend:{display:false},
      tooltip:{callbacks:{label:function(c){return c.parsed.y.toFixed(1)+' млн ₸';}}}}})});


}
})();
</script>
</body>
