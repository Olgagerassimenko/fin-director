<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ОПиУ 2026 — Фуд завод</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="opiu_audit.js" onerror="window.OPIU_AUDIT=null"></script>
<script src="opiu_iiko.js" onerror="window.OPIU_IIKO=null"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#18233d;color:#f1f5f9;min-height:100vh;font-size:13px}

.hdr{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid #24304d;flex-wrap:wrap}
.back{font-size:12px;color:#9db0c9;text-decoration:none;padding:5px 10px;border:1px solid #24304d;border-radius:8px;transition:all .15s;white-space:nowrap}
.back:hover{color:#a78bfa;border-color:#7c3aed}
.hdr-title{font-size:17px;font-weight:800}
.hdr-sub{font-size:11px;color:#7f90a8;margin-top:2px}
.hdr-badge{margin-left:auto;font-size:11px;color:#9db0c9;background:#1e2a45;border:1px solid #24304d;border-radius:999px;padding:5px 12px}

.wrap{max-width:1560px;margin:0 auto;padding:20px 28px 60px}

.note{background:#1e2a45;border:1px solid #24304d;border-left:3px solid #7c3aed;border-radius:10px;padding:12px 16px;font-size:12px;color:#b8c6dc;line-height:1.6;margin-bottom:18px}
.note b{color:#e8eefb}
.note.warn{border-left-color:#f59e0b}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#1e2a45;border:1px solid #24304d;border-radius:12px;padding:14px 16px}
.kpi-l{font-size:11px;color:#8ea0ba;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi-v{font-size:23px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi-d{font-size:11px;margin-top:6px;color:#7f90a8}
.pos{color:#34d399}.neg{color:#f87171}.mut{color:#7f90a8}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.card{background:#1e2a45;border:1px solid #24304d;border-radius:12px;padding:16px}
.card-t{font-size:13px;font-weight:700;margin-bottom:4px}
.card-s{font-size:11px;color:#7f90a8;margin-bottom:12px}
.cv{position:relative;height:270px}

.sec-t{font-size:14px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:6px;margin-left:auto}
.btn{font-size:11px;font-weight:600;color:#9db0c9;background:#1e2a45;border:1px solid #24304d;border-radius:8px;padding:6px 12px;cursor:pointer;transition:all .15s}
.btn:hover{color:#e8eefb;border-color:#3a4a6e}
.btn.on{background:#7c3aed;border-color:#7c3aed;color:#fff}

.tw{overflow-x:auto;border:1px solid #24304d;border-radius:12px;background:#1e2a45}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:max-content}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
thead th{position:sticky;top:0;background:#22304e;color:#9db0c9;font-size:11px;font-weight:700;z-index:3;border-bottom:1px solid #2c3a5c}
th.nm,td.nm{text-align:left;position:sticky;left:0;background:#1e2a45;z-index:2;min-width:270px;max-width:420px;white-space:normal}
thead th.nm{background:#22304e;z-index:4}
tbody tr:hover td{background:#243257}
tbody tr:hover td.nm{background:#243257}
td.sep,th.sep{border-left:1px solid #2c3a5c}
tr.r-sub td{font-weight:700;color:#cbd6ea;background:#212e4c}
tr.r-sub td.nm{background:#212e4c}
tr.r-total td{font-weight:700;border-top:1px solid #2c3a5c;color:#e8eefb}
tr.r-big td{font-size:13px;font-weight:800;background:#243257;color:#fff}
tr.r-big td.nm{background:#243257}
td.est{color:#fbbf24}
.tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
.tag-est{background:#422006;color:#fbbf24;border:1px solid #78350f}
.tag-part{background:#3b1120;color:#fb7185;border:1px solid #7f1d3a}

.gaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.gap{background:#1e2a45;border:1px solid #24304d;border-left:3px solid #f59e0b;border-radius:10px;padding:12px 14px}
.gap-h{font-size:12px;font-weight:700;margin-bottom:6px}
.gap ul{margin:6px 0 0 16px;color:#b8c6dc;font-size:11px;line-height:1.7}
.empty{padding:60px;text-align:center;color:#7f90a8}
.foot{margin-top:28px;font-size:11px;color:#5d6d86;text-align:center;line-height:1.7}
</style>
</head>
<body>

<div class="hdr">
  <a class="back" href="index.html">← Назад</a>
  <div>
    <div class="hdr-title">📊 ОПиУ 2026</div>
    <div class="hdr-sub">отчёт о прибылях и убытках · постатейно из iiko · помесячно</div>
  </div>
  <div class="hdr-badge" id="upd">—</div>
</div>

<div class="wrap" id="wrap">
  <div class="empty">Загрузка…</div>
</div>

<script src="nav.js"></script>
<script>
(function(){
var A=window.OPIU_AUDIT, I=window.OPIU_IIKO;
var W=document.getElementById('wrap');
if(!A||!A.months){W.innerHTML='<div class="empty">⚠ Нет данных: не загрузился opiu_audit.js</div>';return;}

var M=A.months, L=A.labels, R=A.rows, K=A.kpi;
document.getElementById('upd').textContent='обновлено '+(A.updated||'—');

/* ── какие месяцы берём: весь 2026 и столько же месяцев 2025 для сравнения ── */
var i26=[], i25=[];
for(var i=0;i<M.length;i++){ if(M[i].indexOf('2026-')===0) i26.push(i); }
for(var i=0;i<M.length;i++){ if(M[i].indexOf('2025-')===0) i25.push(i); }
i25=i25.slice(0,i26.length);
if(!i26.length){W.innerHTML='<div class="empty">⚠ В данных ещё нет ни одного месяца 2026 года</div>';return;}
var N=i26.length;

/* ── признаки месяца: закрыт бухгалтерией, полный ли, что дочитано ── */
var IM=(I&&I.months)||{}, AM=A.meta||{};
function mstat(ym){
  var a=IM[ym]||{}, b=AM[ym]||{};
  return {
    closed: (a.closed!==undefined)?a.closed:(b.closed!==undefined?b.closed:true),
    full:   (a.fullMonth!==undefined)?a.fullMonth:(b.full!==undefined?b.full:true),
    share:  (a.share!==undefined)?a.share:(b.share!==undefined?b.share:1),
    estAdd: a.estAdd||b.estAdd||0,
    gaps:   a.gaps||b.gaps||[],
    estOf:  a.estOf||b.estOf||[],
    through:a.through||b.through||''
  };
}
var ST=i26.map(function(k){return mstat(M[k]);});

/* ── форматирование ── */
function nz(x){ return (x===null||x===undefined||isNaN(x))?0:x; }
function fmln(x){ x=nz(x); var a=Math.abs(x);
  if(a<50000) return (x===0?'—':(x/1e6).toFixed(2));
  return (x/1e6).toFixed(1); }
function fbig(x){ x=nz(x); var a=Math.abs(x);
  if(a>=1e9) return (x/1e9).toFixed(2)+' млрд ₸';
  if(a>=1e6) return (x/1e6).toFixed(0)+' млн ₸';
  if(a>=1e3) return (x/1e3).toFixed(0)+' тыс ₸';
  return Math.round(x)+' ₸'; }
function pc(x){ return (x*100).toFixed(1)+'%'; }
function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function mlab(ym){ var k=M.indexOf(ym); return k>=0?L[k]:(ym||'—'); }
function ru(d){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||'')); return m?(m[3]+'.'+m[2]+'.'+m[1]):(d||'—'); }
function sum(v,idx){ var s=0; for(var j=0;j<idx.length;j++) s+=nz(v[idx[j]]); return s; }
function delta(now,was,good){ /* good: +1 рост это хорошо, -1 рост это плохо */
  now=nz(now); was=nz(was);
  var d=now-was;
  if(!was && !now) return '<span class="mut">—</span>';
  var cls = Math.abs(d)<1e4 ? 'mut' : ((d>0)===(good>0)?'pos':'neg');
  /* процент врёт, когда база отрицательная или знак меняется — тогда показываем разницу в деньгах */
  if(was<=0 || now<0)
    return '<span class="'+cls+'">'+(d>0?'+':'')+fmln(d)+' млн</span>';
  return '<span class="'+cls+'">'+(d>0?'+':'')+(d/was*100).toFixed(1)+'%</span>';
}

/* ── свод по периоду ── */
var Y={}, Y5={};
['rev','cogs','gross','opex','oper','net'].forEach(function(k){
  Y[k]=sum(K[k]||[],i26); Y5[k]=sum(K[k]||[],i25);
});
var per26=L[i26[0]]+' — '+L[i26[N-1]], per25=L[i25[0]]+' — '+L[i25[i25.length-1]];

var H='';

/* ── плашка «откуда цифры» ── */
var lateN=0; for(var j=0;j<N;j++) if(!ST[j].closed) lateN++;
H+='<div class="note">Цифры собраны <b>напрямую из iiko</b> по оборотам счетов — те же счета, что строки бухгалтерского ОПиУ. '
 + 'Бухгалтерия закрыла период по <b>'+esc(mlab(A.xlsxThrough||(I&&I.xlsxThrough)))+'</b> включительно'
 + (lateN?', остальные '+lateN+' мес. показаны из iiko с досчётом регулярных начислений (зарплата, налоги, аренда проводятся в конце месяца) — такие ячейки помечены <span class="tag tag-est">досчёт</span>':'')
 + '. Данные обновляются автоматически, последний охваченный день — <b>'+esc(ru((I&&I.through)||A.srcDate))+'</b>.</div>';

/* ── KPI ── */
function kpi(l,v,d,cls){ return '<div class="kpi"><div class="kpi-l">'+l+'</div><div class="kpi-v'+(cls?' '+cls:'')+'">'+v+'</div><div class="kpi-d">'+d+'</div></div>'; }
H+='<div class="kpis">'
 + kpi('Выручка', fbig(Y.rev), 'к '+per25+': '+delta(Y.rev,Y5.rev,1))
 + kpi('Себестоимость', fbig(Y.cogs), 'к выручке: '+(Y.rev?pc(Y.cogs/Y.rev):'—')+' · '+delta(Y.cogs,Y5.cogs,-1))
 + kpi('Валовая прибыль', fbig(Y.gross), 'маржа '+(Y.rev?pc(Y.gross/Y.rev):'—')+' · '+delta(Y.gross,Y5.gross,1), Y.gross<0?'neg':'pos')
 + kpi('Расходы', fbig(Y.opex), 'к выручке: '+(Y.rev?pc(Y.opex/Y.rev):'—')+' · '+delta(Y.opex,Y5.opex,-1))
 + kpi('Прибыль от осн. деятельности', fbig(Y.oper), 'за '+per25+': '+fbig(Y5.oper), Y.oper<0?'neg':'pos')
 + kpi('Чистая прибыль', fbig(Y.net), 'за '+per25+': '+fbig(Y5.net), Y.net<0?'neg':'pos')
 + '</div>';

/* ── графики ── */
H+='<div class="grid2">'
 + '<div class="card"><div class="card-t">Выручка и себестоимость по месяцам</div><div class="card-s">2026 год, млн ₸ · линия — валовая прибыль</div><div class="cv"><canvas id="c1"></canvas></div></div>'
 + '<div class="card"><div class="card-t">Прибыль по месяцам</div><div class="card-s">от основной деятельности и чистая, млн ₸</div><div class="cv"><canvas id="c2"></canvas></div></div>'
 + '</div>';

/* ── свод помесячно ── */
function tagFor(j){ var s=ST[j]; var t='';
  if(!s.full) t+='<span class="tag tag-part">неполный</span>';
  else if(!s.closed) t+='<span class="tag tag-est">досчёт</span>';
  return t; }
function head(){ var h='<thead><tr><th class="nm">Статья</th>';
  for(var j=0;j<N;j++) h+='<th>'+esc(L[i26[j]].replace(' 2026',''))+tagFor(j)+'</th>';
  h+='<th class="sep">Итого 2026</th><th>'+esc(per25)+'</th><th>Δ</th><th>% выр.</th></tr></thead>';
  return h; }
function line(name,vals,cls,good,showShare){
  var t26=sum(vals,i26), t25=sum(vals,i25);
  var h='<tr class="'+(cls||'')+'"><td class="nm">'+esc(name)+'</td>';
  for(var j=0;j<N;j++){ var v=nz(vals[i26[j]]);
    h+='<td'+(!ST[j].closed&&v?' class="est"':'')+'>'+fmln(v)+'</td>'; }
  h+='<td class="sep"><b>'+fmln(t26)+'</b></td><td>'+fmln(t25)+'</td><td>'+delta(t26,t25,good||1)+'</td>';
  h+='<td>'+(showShare===false||!Y.rev?'':pc(t26/Y.rev))+'</td></tr>';
  return h; }

H+='<div class="sec-t">Свод по месяцам <span class="mut" style="font-weight:400;font-size:11px">'+esc(per26)+' · млн ₸</span></div>';
H+='<div class="tw"><table>'+head()+'<tbody>'
 + line('Выручка',K.rev,'r-big',1)
 + line('Себестоимость',K.cogs,'',-1)
 + line('Валовая прибыль',K.gross,'r-total',1)
 + line('Расходы',K.opex,'',-1)
 + line('Прибыль от основной деятельности',K.oper,'r-total',1)
 + line('Чистая прибыль',K.net,'r-big',1)
 + '</tbody></table></div>';

/* ── постатейно ── */
H+='<div class="sec-t">Постатейно'
 + '<span class="btns"><button class="btn on" id="b-tot">Только итоги</button><button class="btn" id="b-all">Все статьи</button></span></div>';
H+='<div class="tw"><table id="t-det">'+head()+'<tbody>';
for(var r=0;r<R.length;r++){
  var row=R[r], v=row.v||[];
  var t26=sum(v,i26), t25=sum(v,i25);
  if(!t26 && !t25) continue;
  var cls=(row.kind==='total'?'r-total':row.kind==='sub'?'r-sub':'');
  var pad=6+(nz(row.ind))*1.7;
  H+='<tr class="'+cls+'" data-k="'+row.kind+'"><td class="nm" style="padding-left:'+pad+'px">'+esc(row.n)+'</td>';
  for(var j=0;j<N;j++){ var x=nz(v[i26[j]]);
    H+='<td'+(!ST[j].closed&&x?' class="est"':'')+'>'+fmln(x)+'</td>'; }
  /* для строк прибыли рост — это хорошо, для расходных — наоборот */
  var good = /прибыл/i.test(row.n) ? 1 : (row.inc?1:-1);
  H+='<td class="sep"><b>'+fmln(t26)+'</b></td><td>'+fmln(t25)+'</td><td>'+delta(t26,t25,good)+'</td>'
   + '<td>'+(Y.rev?pc(t26/Y.rev):'')+'</td></tr>';
}
H+='</tbody></table></div>';

/* ── что ещё не проведено ── */
var gh='';
for(var j=0;j<N;j++){ var s=ST[j];
  if(s.closed && s.full) continue;
  var items=[];
  if(!s.full) items.push('месяц неполный — данные по '+esc(ru(s.through))+' ('+pc(s.share||0)+' дней)');
  (s.gaps||[]).forEach(function(g){ items.push(esc(g)); });
  if(s.estAdd) items.push('досчитано регулярных начислений на <b>'+fbig(s.estAdd)+'</b>'
    + ((s.estOf&&s.estOf.length)?' по '+s.estOf.length+' статьям':''));
  if(!items.length) items.push('бухгалтерия ещё не закрыла месяц');
  gh+='<div class="gap"><div class="gap-h">'+esc(L[i26[j]])+'</div><ul><li>'+items.join('</li><li>')+'</li></ul></div>';
}
if(gh){
  H+='<div class="sec-t">Что в цифрах ещё не окончательно</div>'
   + '<div class="note warn">Незакрытые месяцы нельзя сравнивать с закрытыми напрямую: зарплата, налоги, аренда и НДС проводятся в конце месяца и в начале следующего. Ниже — что именно дочитано оценкой.</div>'
   + '<div class="gaps">'+gh+'</div>';
}

W.innerHTML=H;

/* ── переключатель детализации ── */
var bT=document.getElementById('b-tot'), bA=document.getElementById('b-all');
function det(all){
  var rows=document.querySelectorAll('#t-det tbody tr');
  for(var i=0;i<rows.length;i++){
    var k=rows[i].getAttribute('data-k');
    rows[i].style.display=(all||k!=='line')?'':'none';
  }
  bT.classList.toggle('on',!all); bA.classList.toggle('on',all);
}
bT.onclick=function(){det(false);}; bA.onclick=function(){det(true);};
det(false);

/* ── графики ── */
var labs=i26.map(function(k){return L[k].replace(' 2026','');});
var mln=function(v){return nz(v)/1e6;};
var gridc='rgba(148,163,184,.12)', tick='#8ea0ba';
var base={responsive:true,maintainAspectRatio:false,
  plugins:{legend:{labels:{color:tick,boxWidth:12,font:{size:11}}},
    tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+c.parsed.y.toFixed(1)+' млн ₸';}}}},
  scales:{x:{ticks:{color:tick,font:{size:10}},grid:{display:false}},
          y:{ticks:{color:tick,font:{size:10}},grid:{color:gridc}}}};
if(window.Chart){
  new Chart(document.getElementById('c1'),{data:{labels:labs,datasets:[
    {type:'bar',label:'Выручка',data:i26.map(function(k){return mln(K.rev[k]);}),backgroundColor:'#7c3aed',borderRadius:4},
    {type:'bar',label:'Себестоимость',data:i26.map(function(k){return mln(K.cogs[k]);}),backgroundColor:'#475b86',borderRadius:4},
    {type:'line',label:'Валовая прибыль',data:i26.map(function(k){return mln(K.gross[k]);}),borderColor:'#34d399',backgroundColor:'#34d399',tension:.3,pointRadius:3}
  ]},options:base});
  new Chart(document.getElementById('c2'),{data:{labels:labs,datasets:[
    {type:'bar',label:'Прибыль от осн. деятельности',data:i26.map(function(k){return mln(K.oper[k]);}),
      backgroundColor:i26.map(function(k){return nz(K.oper[k])<0?'#f87171':'#34d399';}),borderRadius:4},
    {type:'line',label:'Чистая прибыль',data:i26.map(function(k){return mln(K.net[k]);}),borderColor:'#fbbf24',backgroundColor:'#fbbf24',tension:.3,pointRadius:3}
  ]},options:base});
}
})();
</script>
</body>
</html>
