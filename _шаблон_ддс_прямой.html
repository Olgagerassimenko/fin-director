<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ДДС — движение денежных средств · Мастерская Сегодня</title><meta name="author" content="Ольга Герасименко">
<script src="nav.js"></script>
<style>
 /* --out подобран так, чтобы приход и расход различались и при дальтонизме (ΔE 12 deutan) */
 :root{--in:#34d399;--out:#f43f5e;--ink:#f4f7fb;--ink2:#b9c5d3;--mut:#8798ab;
   --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.055);--surf:#0f1a27;--page:#080d16;--accent:#e8c766;--accentbg:rgba(232,199,102,.14);
   --grid:rgba(255,255,255,.09);--card:#0f1b29;--dim:#8a7c4e}
 *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
 body{background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
 .topbar{background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:14px 24px;flex-wrap:wrap}
 .topbar h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
 .topbar p{font-size:12.5px;color:var(--ink2);margin-top:1px}
 .backbtn{background:rgba(255,255,255,.06);color:#c9d4e2;border:1px solid rgba(255,255,255,.12);font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;text-decoration:none;transition:.2s}
 .backbtn:hover{background:linear-gradient(135deg,#e8c766,#d4af37);color:#1a1205;border-color:#e8c766}
 .live{margin-left:auto;background:var(--accentbg);color:var(--accent);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap}
 .wrap{max-width:1240px;margin:0 auto;padding:18px 18px 56px}
 .tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
 .tab{background:var(--surf);color:#c9d4e2;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.18s}
 .tab:hover{border-color:rgba(232,199,102,.45)}.tab.active{background:linear-gradient(135deg,#e8c766,#d4af37);color:#1a1205;border-color:#e8c766;box-shadow:0 6px 18px -8px rgba(212,175,55,.7)}
 .tab .dot{color:#f59e0b;margin-left:4px}
 .daypick{display:none;margin-bottom:14px;align-items:center;gap:10px;flex-wrap:wrap}
 .daypick.show{display:flex}
 .daypick label{font-size:12.5px;color:var(--ink2);font-weight:600}
 .daypick select,.daypick input[type=date]{font-size:13.5px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#132234;color:var(--ink);font-weight:600}
 .daypick select{min-width:190px}
 .d1grp{display:flex;align-items:center;gap:8px;flex:1 1 250px;min-width:0}
 .d1grp select{flex:1 1 auto;min-width:110px}
 .d1grp .rgo{padding:8px 13px;line-height:1}
 .rgo{font-size:13px;font-weight:700;padding:8px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,#e8c766,#d4af37);color:#1a1205;cursor:pointer}
 .rgo:hover{filter:brightness(1.08)}
 .anlz{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 14px 14px}
 .anlz .blk{border:1px solid rgba(52,211,153,.22);border-left:3px solid #34d399;background:rgba(52,211,153,.07);border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.55;color:#d7ebe4;box-shadow:0 6px 18px -12px rgba(0,0,0,.6)}
 .anlz .blk.vd{border-color:rgba(167,139,250,.32);border-left-color:#a78bfa;background:rgba(139,92,246,.1);color:#e4dcff}
 .anlz .blk.rate{border-color:rgba(232,199,102,.32);border-left-color:#e8c766;background:rgba(232,199,102,.08);color:#efe3c3}
 .anlz .blk b{color:#7ff0c0}.anlz .blk.vd b{color:#cbb8ff}.anlz .blk.rate b{color:#f2dd9e}
 .anlz .blk .mut{color:#9fb8b0;font-size:12px}.anlz .blk.rate .mut{color:#cbb688}
 @media(max-width:720px){.anlz{grid-template-columns:1fr}}
 .openb{background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.4);color:#fbbf77;border-radius:12px;padding:9px 14px;margin-bottom:14px;font-size:12.5px;font-weight:600}
 .kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
 .k{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.2);border-radius:14px;padding:13px 15px;transition:.2s}
 .k:hover{transform:translateY(-3px);border-color:rgba(232,199,102,.55);box-shadow:0 14px 30px -14px rgba(212,175,55,.5)}
 .k .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);font-weight:700}
 .k .v{font-size:20px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
 .k .u{font-size:11px;color:var(--mut);font-weight:600;margin-left:2px}
 .card{background:linear-gradient(162deg,#0f1b29,#0b141f);border:1px solid rgba(212,175,55,.15);border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:0 16px 42px -24px rgba(0,0,0,.75)}
 .card .hd{padding:14px 18px 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
 .card h3{font-size:15px;font-weight:800}
 .card .sub{font-size:12px;color:var(--ink2)}
 /* Кто нам оплатил */
 .pay{padding:2px 14px 12px}
 .payrow{display:grid;grid-template-columns:26px 1fr 130px 52px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line2);font-size:13.5px}
 .payrow .rk{color:var(--mut);font-size:12px;font-weight:700;text-align:center}
 .payrow .nm{color:#c9d4e2;position:relative}
 .payrow .nm .bg{position:absolute;left:-6px;right:0;top:-4px;bottom:-4px;background:linear-gradient(90deg,rgba(52,211,153,.18),rgba(52,211,153,.03));border-radius:6px;z-index:0}
 .payrow .nm span{position:relative;z-index:1}
 .payrow .am{text-align:right;font-weight:800;color:var(--in);font-variant-numeric:tabular-nums;white-space:nowrap}
 .payrow .pc{text-align:right;color:#9ca3af;font-size:11.5px}
 .payrow.tot{font-weight:800;border-top:1px solid var(--line);border-bottom:none;background:rgba(255,255,255,.04)}
 .payrow.tot .am{color:var(--ink)}
 .morebtn{display:inline-block;margin:8px 8px 4px;font-size:12.5px;color:#f2dd9e;font-weight:700;cursor:pointer;background:rgba(232,199,102,.1);border:1px solid rgba(232,199,102,.3);border-radius:999px;padding:6px 14px}
 /* Схема расхода */
 .wfx{padding:8px 16px 16px;display:flex;flex-direction:column;gap:7px}
 .wfrow{display:grid;grid-template-columns:26px minmax(120px,210px) 1fr 46px;gap:12px;align-items:center;font-size:13px}
 .wfrk{color:#8798ab;font-size:12px;font-weight:700;text-align:center}
 .wfnm{color:#d7dee8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .wfbar{position:relative;height:26px;background:rgba(255,255,255,.04);border-radius:7px;overflow:hidden}
 .wffill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f43f5e,#be123c);border-radius:7px;box-shadow:0 0 14px -4px rgba(251,113,133,.55);transform-origin:left;animation:wfgrow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
 @keyframes wfgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
 .wfam{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:800;font-variant-numeric:tabular-nums;color:#fff;font-size:12px;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6)}
 .wfpc{text-align:right;color:#8798ab;font-size:12px;font-weight:700}
 .wfrow.rest .wfnm{color:#8798ab;font-style:italic}
 @media(prefers-reduced-motion:reduce){.wffill{animation:none}}
 @media(max-width:640px){.wfrow{grid-template-columns:20px minmax(84px,130px) 1fr 36px;gap:8px}.wfam{font-size:11px}}
 /* Таблица по счетам */
 .tblwrap{overflow-x:auto}
 table.dds{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
 table.dds th,table.dds td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 table.dds thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line);background:rgba(255,255,255,.035);position:sticky;top:0}
 table.dds .stub{text-align:left;white-space:normal;color:#c9d4e2;position:sticky;left:0;background:var(--surf);z-index:2;min-width:210px;max-width:230px}
 table.dds thead .stub{background:rgba(255,255,255,.035);z-index:3}
 table.dds .tot{font-weight:800;border-left:1px solid var(--line)}
 tr.grp td{background:rgba(255,255,255,.055);font-weight:800;color:var(--ink);border-top:1px solid var(--line)}
 tr.grp .stub{background:rgba(255,255,255,.055)}
 tr.grp.fold{cursor:pointer;user-select:none}tr.grp.fold:hover .stub{filter:brightness(.96)}.fold .arw{display:inline-block;width:13px;color:var(--mut)}
 tr.bal td{font-weight:800;background:rgba(232,199,102,.09)}tr.bal .stub{background:rgba(232,199,102,.09)}
 tr.other td{color:var(--ink2);font-style:italic;background:rgba(255,255,255,.035)}tr.other .stub{background:rgba(255,255,255,.035)}
 .pos{color:var(--in)}.neg{color:var(--out)}.z{color:#465264}
 /* ================= ДДС ЗА ДЕНЬ: рассказ о дне ================= */
 .story{padding:4px 18px 18px;font-size:14.5px;line-height:1.62;color:#dbe4ef}
 .story p{margin:0 0 9px}
 .story .hero{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 10px;color:var(--ink)}
 .story .hero .u{font-size:15px;font-weight:700;color:var(--mut);margin-left:4px}
 .story b{color:#f2dd9e;font-weight:700}
 .story .gi{color:var(--in);font-weight:700}.story .ro{color:var(--out);font-weight:700}
 .story .note{margin-top:11px;padding-top:10px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--mut)}
 .story ul{margin:2px 0 9px 0;padding-left:18px}.story li{margin:3px 0}
 /* ================= общая обвязка графиков ================= */
 .chgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
 @media(max-width:920px){.chgrid{grid-template-columns:1fr}}
 .chgrid .card{margin-bottom:0}
 .lgd{display:flex;gap:14px;flex-wrap:wrap;padding:0 18px 8px;font-size:12px;color:var(--ink2)}
 .lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
 .lgd i.ln{width:16px;height:2px;border-radius:2px;vertical-align:3px}
 .tv{margin:2px 18px 14px;font-size:12.5px}
 .tv summary{cursor:pointer;color:#f2dd9e;font-weight:700;list-style:none;padding:6px 0}
 .tv summary::-webkit-details-marker{display:none}
 .tv summary::before{content:"▸ ";color:var(--mut)}
 .tv[open] summary::before{content:"▾ "}
 .tv table{width:100%;border-collapse:collapse;font-size:12px}
 .tv th,.tv td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .tv th{color:var(--mut);font-weight:700;font-size:10.5px;text-transform:uppercase}
 .tv th:first-child,.tv td:first-child{text-align:left}
 .empty{padding:16px 18px 20px;color:var(--mut);font-size:13px}
 /* на телефоне названию статьи и счёта отдаём отдельную строку — полосе нужна ширина */
 @media(max-width:640px){
   .dvgrow{grid-template-columns:1fr;gap:2px}
   .dvgnm{font-size:12px;color:var(--ink2)}
   .dmbrow{grid-template-columns:minmax(64px,92px) 1fr 96px;gap:8px;font-size:11.5px}
   .story{font-size:13.5px}.story .hero{font-size:26px}
   .svgwrap svg{min-width:340px}
 }
 /* ---- diverging: приход/расход по статьям ---- */
 .dvg{padding:6px 16px 14px;display:flex;flex-direction:column;gap:6px}
 .dvgrow{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:12px;align-items:center;font-size:12.5px}
 .dvgnm{color:#d7dee8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .dvgbar{position:relative;height:24px;display:grid;grid-template-columns:1fr 1fr}
 .dvgbar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--grid)}
 .dvgL,.dvgR{position:relative}
 .dvgf{position:absolute;top:3px;bottom:3px;animation:dvgrow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
 .dvgL .dvgf{right:0;background:var(--out);border-radius:4px 0 0 4px;transform-origin:right}
 .dvgR .dvgf{left:0;background:var(--in);border-radius:0 4px 4px 0;transform-origin:left}
 @keyframes dvgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
 .dvgv{position:absolute;top:50%;transform:translateY(-50%);font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2);pointer-events:none}
 .dvgv.in{left:calc(var(--w) + 8px)}.dvgv.out{right:calc(var(--w) + 8px);text-align:right}
 /* если снаружи не помещается — подпись уезжает внутрь полосы, к её концу (класс .ins ставится после замера) */
 .dvgv.ins{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
 .dvgv.ins.in{left:calc(var(--w) - 8px);transform:translate(-100%,-50%)}
 .dvgv.ins.out{right:calc(var(--w) - 8px);transform:translate(100%,-50%)}
 .dvgf{pointer-events:none}
 .dvghit{position:absolute;inset:-3px 0;cursor:default;z-index:3}
 /* ---- dumbbell: деньги по счетам утро -> вечер ---- */
 .dmb{padding:6px 16px 14px;display:flex;flex-direction:column;gap:7px}
 .dmbrow{display:grid;grid-template-columns:minmax(84px,132px) 1fr 118px;gap:12px;align-items:center;font-size:12.5px}
 .dmbnm{color:#d7dee8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .dmbtr{position:relative;height:22px}
 .dmbtr::before{content:"";position:absolute;left:0;right:0;top:10.5px;height:1px;background:var(--line2)}
 .dmbln{position:absolute;top:10px;height:2px;border-radius:2px;background:rgba(232,199,102,.5)}
 .dmbd{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;margin-left:-6px;box-shadow:0 0 0 2px var(--card)}
 .dmbd.s{background:var(--dim)}.dmbd.e{background:var(--accent)}
 .dmbv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
 /* ---- svg-графики ---- */
 .svgwrap{padding:4px 12px 10px;overflow-x:auto}
 .svgwrap svg{display:block;width:100%;min-width:420px;touch-action:pan-y}
 .ax{font-size:10.5px;fill:var(--mut);font-variant-numeric:tabular-nums}
 .gl{stroke:var(--grid);stroke-width:1}
 /* ---- общий тултип ---- */
 #tip{position:fixed;z-index:99;pointer-events:none;opacity:0;transition:opacity .12s;background:#16243a;border:1px solid rgba(232,199,102,.35);
   border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--ink2);box-shadow:0 14px 34px -16px #000;max-width:280px}
 #tip.on{opacity:1}
 #tip .tt{font-weight:700;color:var(--ink);margin-bottom:3px;font-size:12px}
 #tip .tr{display:flex;gap:9px;align-items:baseline;justify-content:space-between;white-space:nowrap}
 #tip .tv2{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
 [data-t]{outline:none}
 [data-t]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
 .foot{text-align:center;color:#8798ab;font-size:12px;padding:22px}.foot b{color:#c9d4e2}
 .card{position:relative}
 .card::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,199,102,.55),transparent);z-index:2}
 .card,.k{animation:fadeUp .55s cubic-bezier(.2,.75,.25,1) both}
 @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
 @media(prefers-reduced-motion:reduce){.card,.k{animation:none}}
 @media(max-width:720px){.kpi{grid-template-columns:repeat(2,1fr)}.payrow{grid-template-columns:22px 1fr 96px 44px}}
</style><style id="mobile-adapt">@media (max-width:768px){html,body{overflow-x:hidden!important;max-width:100%;}body{font-size:15px;-webkit-text-size-adjust:100%;}table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;}img,svg{max-width:100%;height:auto;}.container,.wrap,.content,.card,.panel,section,main{max-width:100%!important;box-sizing:border-box;}[style*="width:1"],[style*="width: 1"]{max-width:100%!important;}}</style>

<div class="topbar"><a href="index.html" class="backbtn">← На главную</a>
 <div><h1>💧 ДДС — движение денежных средств</h1><p id="sub">Мастерская Сегодня · прямой метод · по счетам · источник: iiko</p></div>
 <span class="live" id="live">🔄 из iiko · каждое утро</span></div>
<div class="wrap">
 <div class="tabs" id="tabs"></div>
 <div class="daypick" id="daypick"><label for="daysel">День:</label><select id="daysel"></select></div>
 <div class="daypick" id="d1pick"><label for="d1sel">Дата:</label><span class="d1grp"><button id="d1prev" class="rgo" title="Предыдущий день">‹</button><select id="d1sel"></select><button id="d1next" class="rgo" title="Следующий день">›</button></span></div>
 <div class="daypick" id="rangepick"><label for="rfrom">Период с</label><input type="date" id="rfrom"><label for="rto">по</label><input type="date" id="rto"><button id="rgo" class="rgo">Показать</button></div>
 <div id="openbadge"></div>
 <div style="margin-bottom:12px"><button id="xls" class="rgo" style="background:#107c41">📥 Выгрузить в Excel</button></div>
 <div id="body"></div>
 <div class="foot">Система «Пульс» · автор: <b>Ольга Герасименко</b> · © 2026 · <span id="prov"></span></div>
</div>
<div id="tip" role="tooltip" aria-hidden="true"></div>
<script>
/*__DATA__*/
const ACCS=D.accounts||[], SH=D.short||{};
const HIDE_ACC=[];  // счета скрытые из таблицы (пусто = показывать все; Итого = сумма по всем)
const ACCV=ACCS.filter(a=>!HIDE_ACC.some(h=>(a||'').toLowerCase().includes(h)));
const RUB=v=>Math.round(Math.abs(v)).toLocaleString('ru-RU');
const SUM=v=>(v<0?'−':'')+RUB(v);
const SIGN=v=>(v<0?'−':'+')+RUB(v);
const MLN=v=>{const a=Math.abs(v);return a>=1e6?(v<0?'−':'')+(a/1e6).toFixed(1).replace('.',',')+' млн':(a>=1?SUM(v):'0');};
// ячейка счёта: полное число, ноль/мелочь — точка
const CELL=v=>{v=Math.round(v||0); if(Math.abs(v)<1)return '<span class="z">·</span>'; return '<span class="'+(v<0?'neg':'pos')+'">'+SIGN(v)+'</span>';};
const isInt=c=>/внутрен|внутригрупп/i.test(c||'');
function grp(a){ if(isInt(a.cat))return 'int'; const t=(a.type||'').toUpperCase();
 if(t.indexOf('FIN')===0)return 'fin'; if(t.indexOf('INVEST')===0)return 'inv'; return 'op'; }
const GROUPS=[['op','Операционная деятельность'],['inv','Инвестиционная деятельность'],
              ['fin','Финансовая деятельность'],['int','Внутренние переводы между своими счетами']];
document.getElementById('prov').textContent=D.prov||('источник: iiko · обновлено '+(D.updated||''));
(function(){var lv=document.getElementById('live');if(lv&&D.updated)lv.textContent='🔄 обновлено '+(D.updatedFull||D.updated)+' · из iiko';})();
const MK=Object.keys(D.months).sort();
const accNet=(a,acc)=>{const b=(a.byAcc||{})[acc];return b?(b.in-b.out):0;};

/* ---------- Кто нам оплатил ---------- */
let payAll=false, LAST=null;
function payHTML(rev){
 rev=(rev||[]).filter(r=>r.net>0); if(!rev.length)return '';
 const tot=rev.reduce((s,r)=>s+r.net,0), mx=rev[0].net||1;
 const shown=payAll?rev:rev.slice(0,20);
 let rows=shown.map((r,i)=>{const w=Math.round(r.net/mx*100),pc=Math.round(r.net/tot*100);
   return `<div class="payrow"><div class="rk">${i+1}</div>
     <div class="nm"><span class="bg" style="width:${w}%"></span><span>${r.name}</span></div>
     <div class="am">${SUM(r.net)} ₸</div><div class="pc">${pc}%</div></div>`;}).join('');
 rows+=`<div class="payrow tot"><div class="rk"></div><div class="nm"><span>Итого выручка</span></div>
   <div class="am">${SUM(tot)} ₸</div><div class="pc">100%</div></div>`;

function ddsTable(obj,opts){

 const head=`<tr><th class="stub">Статья ДДС</th>`+ACCV.map(a=>`<th title="${a}">${SH[a]||a}</th>`).join('')+`<th class="tot">Итого</th></tr>`;

 // Группы статей
 const buckets={op:[],inv:[],fin:[],int:[]}; arts.forEach(a=>buckets[grp(a)].push(a));
 GROUPS.forEach(([key,title])=>{
   const list=buckets[key]; if(!list.length)return;
   list.sort((x,y)=>Math.abs(y.net)-Math.abs(x.net));

   });
 });

 if(obj.startByAcc&&obj.endByAcc){

     rows+=`<tr class="other"><td class="stub">Прочее / без статьи ДДС</td>`+
       ACCV.map(a=>`<td>${CELL(otherAcc[a])}</td>`).join('')+`<td class="tot">${CELL(otherTot)}</td></tr>`;
   }
 }
 // Остаток на конец
 if(obj.endByAcc){ rows+=`<tr class="bal"><td class="stub">🏁 Остаток на конец</td>`+
   ACCV.map(a=>`<td>${MLN(obj.endByAcc[a]||0)}</td>`).join('')+`<td class="tot">${MLN(obj.end||0)}</td></tr>`; }
 return `<div class="card"><div class="hd"><h3>Движение по счетам · ${opts.label||''}</h3>
   <div class="sub">Как в iiko: строки — статьи ДДС, колонки — счета компании. Внутренние переводы свёрнуты.</div></div>
   <div class="tblwrap"><table class="dds"><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>`;
}

 const sOut=arts.filter(a=>!isInt(a.cat)).reduce((s,a)=>s+a.out,0);

 if(hasBal)c.push(`<div class="k"><div class="l">Остаток на конец</div><div class="v">${MLN(end)}<span class="u">₸</span></div></div>`);
 const rawRe=/сырь|упаковк|хоз\.?\s*товар/i;
 const rawPay=arts.filter(a=>rawRe.test(a.cat)).reduce((s,a)=>s+a.out,0);
 const revA=arts.find(a=>/выручк/i.test(a.cat));
 const rev=((obj.revByContr||[]).filter(r=>r.net>0).reduce((s,r)=>s+r.net,0))||(revA?revA.in:0);
 if(rawPay>0&&rev>0)c.push(`<div class="k" title="Сырьё Платежи поставщикам + Упаковка + Хоз. товары к выручке"><div class="l">🌾 Сырьё</div><div class="v">${(rawPay/rev*100).toFixed(1).replace('.',',')}<span class="u">%</span></div></div>`);
 return `<div class="kpi" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${c.join('')}</div>`;

 const sIn=arts.filter(a=>!isInt(a.cat)).reduce((s,a)=>s+a.in,0);
 const sOut=arts.filter(a=>!isInt(a.cat)).reduce((s,a)=>s+a.out,0);
 const net=obj.startByAcc?((obj.end||0)-(obj.start||0)):arts.reduce((s,a)=>s+a.net,0);
 const pct=(v,b)=>b?Math.round(v/b*100):0;
 const find=re=>exp.find(e=>re.test(e.cat));

 if(exp.length)b.push(`<div class="blk"><b>Куда ушло больше всего:</b><br>`+exp.slice(0,3).map((e,i)=>`${i+1}. ${e.cat} — <b>${SUM(e.out)} ₸</b> (${pct(e.out,sOut)}%)`).join('<br>')+`</div>`);
 let ob=[];if(syr)ob.push(`сырьё ${pct(syr.out,sOut)}%`);if(zp)ob.push(`зарплата ${pct(zp.out,sOut)}%`);if(nal)ob.push(`налоги ${pct(nal.out,sOut)}%`);if(ar)ob.push(`аренда ${pct(ar.out,sOut)}%`);
 if(ob.length)b.push(`<div class="blk"><b>Основные обязательные траты:</b> ${ob.join(', ')} от всех выплат.</div>`);
 const rawRe=/сырь|упаковк|хоз\.?\s*товар/i;
 const rawPay=arts.filter(a=>rawRe.test(a.cat)).reduce((s,a)=>s+a.out,0);
 const revA=arts.find(a=>/выручк/i.test(a.cat)); const revenue=totRev||(revA?revA.in:0);
 if(rawPay>0&&revenue>0)b.push(`<div class="blk"><b>🌾 Оплата за сырьё</b> (сырьё + упаковка + хоз. товары): <b>${SUM(rawPay)} ₸</b> — <b>${(rawPay/revenue*100).toFixed(1).replace('.',',')}%</b> от выручки (${MLN(revenue)}).</div>`);
 if(CUR.type==='month'&&(D.mmeta[CUR.key]||{}).closed===false&&rawPay>0&&D.cogs){const idx=MK.indexOf(CUR.key);const prevKeys=MK.slice(Math.max(0,idx-3),idx).filter(k=>D.cogs[k]!=null);const dNow=+((D.through||'').split('.')[0])||0;if(prevKeys.length&&dNow>0){const parts=prevKeys.map(k=>{const dM=new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();const p=Math.round(rawPay/(D.cogs[k]*dNow/dM)*100);return{nm:((D.mmeta[k]||{}).ru||k).replace(' 2026','').slice(0,3),p:p,cogs:D.cogs[k]};});const avg=Math.round(parts.reduce((s,x)=>s+x.p,0)/parts.length);const line=parts.map(x=>`к ${x.nm} <b>${x.p}%</b>`).join(' · ');b.push(`<div class="blk rate"><b>🌾 Оплата за сырьё к себестоимости ОПиУ</b> (за ${dNow} дн., в пересчёте на дни):<br>${line} · <b>в среднем ${avg}%</b><br><span class="mut">Продуктовая себестоимость: ${parts.map(x=>x.nm+' '+MLN(x.cogs)).join(', ')}. ${avg>105?'⚠ выше нормы':(avg<95?'✓ в пределах нормы':'≈ в норме')}.</span></div>`);}}
 const cov=sOut?Math.round(sIn/sOut*100):0;
 b.push(`<div class="blk vd">💡 По операциям: поступления <b>${MLN(sIn)}</b>, выплаты <b>${MLN(sOut)}</b> (покрытие <b>${cov}%</b>). Итог по всем счетам: денег ${net<0?'стало меньше на':'прибавилось на'} <b>${MLN(Math.abs(net))} ₸</b>${(sIn-sOut>0&&net<0)?' — операции в плюсе, разницу забрали переводы и прочие движения':(sIn-sOut<0&&net>0)?' — операции в минусе, счета выросли за счёт переводов':''}.</div>`);
 return `<div class="card"><div class="hd"><h3>📊 Аналитика ДДС</h3><div class="sub">Ключевые выводы за период</div></div><div class="anlz">${b.join('')}</div></div>`;
}
// агрегируем произвольный период из дневной детализации
function rangeData(from,to){
 const arts={},revMap={};
 Object.keys(D.byDay||{}).forEach(dt=>{ if(dt<from||dt>to)return;
   (D.byDay[dt]||[]).forEach(e=>{const key=e.t+'|'+e.c;let a=arts[key];if(!a)a=arts[key]={type:e.t,cat:e.c,in:0,out:0,net:0,byAcc:{}};
     Object.keys(e.a).forEach(ix=>{const v=e.a[ix],acc=ACCS[+ix];a.net+=v;if(v>0)a.in+=v;else a.out+=-v;
       const bb=a.byAcc[acc]||(a.byAcc[acc]={in:0,out:0});if(v>0)bb.in+=v;else bb.out+=-v;});});
 });
 Object.keys(D.byDayRev||{}).forEach(dt=>{ if(dt<from||dt>to)return;
   (D.byDayRev[dt]||[]).forEach(r=>{revMap[r.n]=(revMap[r.n]||0)+r.v;});});
 const rev=Object.keys(revMap).map(n=>({name:n,net:revMap[n]})).sort((a,b)=>b.net-a.net);
 return {articles:Object.values(arts),revByContr:rev};
}
// ---------- Схема: куда ушли деньги (расход) ----------
function expScheme(obj){
 const arts=obj.articles||[];
 const exp=arts.filter(a=>!isInt(a.cat)&&a.out>0).map(a=>({cat:a.cat,out:Math.round(a.out)})).sort((x,y)=>y.out-x.out);
 if(!exp.length) return '';
 const total=exp.reduce((s,e)=>s+e.out,0), mx=exp[0].out||1, show=exp.slice(0,12);
 const rows=show.map((e,i)=>{
   const w=Math.max(3,Math.round(e.out/mx*100)), pc=Math.round(e.out/total*100);
   return '<div class="wfrow" style="--d:'+(i*0.05).toFixed(2)+'s"><div class="wfrk">'+(i+1)+'</div><div class="wfnm" title="'+e.cat+'">'+e.cat+'</div><div class="wfbar"><div class="wffill" style="width:'+w+'%"></div><span class="wfam">'+SUM(e.out)+' ₸</span></div><div class="wfpc">'+pc+'%</div></div>';
 }).join('');
 const rest=exp.length>12?('<div class="wfrow rest"><div class="wfrk"></div><div class="wfnm">и ещё '+(exp.length-12)+' статей</div><div class="wfbar"></div><div class="wfpc">'+Math.round(exp.slice(12).reduce((s,e)=>s+e.out,0)/total*100)+'%</div></div>'):'';
 return '<div class="card"><div class="hd"><h3>💸 Куда ушли деньги — расход</h3><div class="sub">Кому и на что платили за период · всего <b style="color:#fb7185">'+SUM(total)+' ₸</b></div></div><div class="wfx">'+rows+rest+'</div></div>';
}
// ---------- Схема потока денег (waterfall) — не используется ----------
function waterfall(obj){
 if(!obj.startByAcc) return '';
 const arts=obj.articles||[];
 const bk={op:0,inv:0,fin:0,int:0};
 arts.forEach(a=>{const g=grp(a); bk[g]=(bk[g]||0)+a.net;});
 const start=Math.round(obj.start||0), end=Math.round(obj.end||0);
 const other=end-start-bk.op-bk.inv-bk.fin-bk.int;
 const steps=[{l:'Остаток начало',v:start,anchor:1}];
 [['Операционная',bk.op],['Инвестиционная',bk.inv],['Финансовая',bk.fin],['Внутренние',bk.int],['Прочее',other]].forEach(p=>{if(Math.abs(p[1])>1)steps.push({l:p[0],v:Math.round(p[1])});});
 steps.push({l:'Остаток конец',v:end,anchor:1});
 let run=0; steps.forEach(st=>{ if(st.anchor){st.lo=0;st.hi=st.v;run=st.v;} else {st.lo=run;st.hi=run+st.v;run=st.hi;} });
 const vals=steps.flatMap(st=>[st.lo,st.hi]); const mx=Math.max(...vals,0), mn=Math.min(...vals,0);
 const W=980,H=300,padT=36,padB=72,padL=14,padR=14, n=steps.length, gap=16, bw=(W-padL-padR-gap*(n-1))/n;
 const Y=v=>padT+(H-padT-padB)*(mx-v)/((mx-mn)||1), X=i=>padL+i*(bw+gap);
 let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="min-width:660px"><defs><linearGradient id="wfg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6ad"/><stop offset="1" stop-color="#d4af37"/></linearGradient></defs>';
 const zy=Y(0); s+='<line x1="'+padL+'" y1="'+zy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+zy.toFixed(1)+'" stroke="rgba(255,255,255,.14)"/>';
 steps.forEach((st,i)=>{ const x=X(i), top=Y(Math.max(st.lo,st.hi)), bot=Y(Math.min(st.lo,st.hi)), h=Math.max(3,bot-top);
   const fill=st.anchor?'url(#wfg)':(st.v>=0?'#34d399':'#fb7185');
   s+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="6" fill="'+fill+'"'+(st.anchor?'':' fill-opacity=".92"')+'/>';
   const vlab=(st.anchor?'':(st.v>=0?'+':'−'))+MLN(Math.abs(st.v));
   s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(top-9).toFixed(1)+'" text-anchor="middle" font-size="12.5" font-weight="800" fill="'+(st.anchor?'#f2dd9e':(st.v>=0?'#34d399':'#fb7185'))+'">'+vlab+'</text>';
   s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-46).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" fill="#c9d4e2">'+st.l+'</text>';
   if(i<steps.length-1){ const y=Y(st.hi); s+='<line x1="'+(x+bw).toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+X(i+1).toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,.3)" stroke-dasharray="3 3"/>'; } });
 s+='</svg>';
 return '<div class="card"><div class="hd"><h3>💠 Схема движения денег</h3><div class="sub">От остатка на начало через операционную, инвестиционную и финансовую деятельность — к остатку на конец.</div></div><div style="padding:6px 14px 18px;overflow-x:auto">'+s+'</div></div>';
}

 if(obj&&obj.to&&/^\d{4}-\d{2}$/.test(obj.to)) return eom(obj.to);

/* ---------- данные одного дня ---------- */
function dayObj(k){

 if(bb[k])obj.startByAcc=bb[k];

 if(bb[nk])obj.endByAcc=bb[nk];
 if(obj.startByAcc)obj.start=ACCS.reduce((s,a)=>s+(obj.startByAcc[a]||0),0);

/* ---------- 1. Рассказ: что было в этот день ---------- */
function dayStory(obj,k){
 const arts=(obj.articles||[]).filter(a=>!isInt(a.cat));
 const ints=(obj.articles||[]).filter(a=>isInt(a.cat));
 const sIn=arts.reduce((s,a)=>s+a.in,0), sOut=arts.reduce((s,a)=>s+a.out,0);
 const st=obj.start||0, en=obj.end||0, delta=en-st;
 const rev=(obj.revByContr||[]).filter(r=>r.net>0).sort((a,b)=>b.net-a.net);
 const totRev=rev.reduce((s,r)=>s+r.net,0);
 const inA=arts.filter(a=>a.in>0).sort((x,y)=>y.in-x.in);
 const outA=arts.filter(a=>a.out>0).sort((x,y)=>y.out-x.out);
 const isToday=(k===(D.today||''));
 // фон: средние за 30 дней до этого дня
 let hist=[],c=dShift(k,-30);
 while(c<k){ if(D.byDay[c]){const a=rangeData(c,c).articles.filter(x=>!isInt(x.cat));
   hist.push({in:a.reduce((s,x)=>s+x.in,0),out:a.reduce((s,x)=>s+x.out,0)});} c=dShift(c,1); }
 const avgIn=hist.length?hist.reduce((s,x)=>s+x.in,0)/hist.length:0;
 const avgOut=hist.length?hist.reduce((s,x)=>s+x.out,0)/hist.length:0;
 const cmp=(v,a)=>{if(!a)return '';const p=Math.round((v-a)/a*100);
   return p>=15?(' — это на '+p+'% больше обычного'):p<=-15?(' — это на '+Math.abs(p)+'% меньше обычного'):' — как в обычный день';};
 // где лежат деньги на конец дня
 const tops=ACCS.map(a=>({a:a,v:(obj.endByAcc||{})[a]||0})).filter(x=>Math.abs(x.v)>1).sort((x,y)=>y.v-x.v);
 let p=[];
 p.push('<div class="hero">'+(delta>0?'+':delta<0?'−':'')+MLN(Math.abs(delta))+'<span class="u">₸ за день</span></div>');
 if(!arts.length&&!ints.length){
   p.push('<p>В этот день движений по счетам не было. На счетах как лежало <b>'+MLN(st)+' ₸</b>, так и осталось.</p>');
 }else{
   p.push('<p>Утром на счетах было <b>'+MLN(st)+' ₸</b>. За день пришло <span class="gi">+'+MLN(sIn)+' ₸</span>'+
     cmp(sIn,avgIn)+', ушло <span class="ro">−'+MLN(sOut)+' ₸</span>'+cmp(sOut,avgOut)+
     '. К концу дня осталось <b>'+MLN(en)+' ₸</b> — денег '+(delta>=0?'стало больше на <span class="gi">'+MLN(delta)+' ₸</span>':'стало меньше на <span class="ro">'+MLN(-delta)+' ₸</span>')+'.</p>');
   let li=[];
   if(totRev>0){
     li.push('<b>Выручка:</b> '+MLN(totRev)+' ₸ от '+rev.length+' '+plural(rev.length,'плательщика','плательщиков','плательщиков')+
       (rev[0]?'. Больше всех — '+esc(rev[0].name)+' ('+MLN(rev[0].net)+' ₸, '+Math.round(rev[0].net/totRev*100)+'% дневного прихода)':''));
   }
   const inNoRev=inA.filter(a=>!/выручк/i.test(a.cat));
   if(inNoRev.length)li.push('<b>Прочие поступления:</b> '+inNoRev.slice(0,3).map(a=>esc(a.cat)+' — '+MLN(a.in)+' ₸').join(', '));
   if(outA.length)li.push('<b>Крупнейшие выплаты:</b> '+outA.slice(0,3).map(a=>esc(a.cat)+' — '+MLN(a.out)+' ₸').join(', ')+
     (outA.length>3?' и ещё '+(outA.length-3)+' '+plural(outA.length-3,'статья','статьи','статей'):''));
   if(ints.length){const iv=ints.reduce((s,a)=>s+a.in,0);
     if(iv>0)li.push('<b>Внутренние переводы между своими счетами:</b> '+MLN(iv)+' ₸ — на общий остаток не влияют');}
   if(li.length)p.push('<ul><li>'+li.join('</li><li>')+'</li></ul>');
   if(tops.length)p.push('<p>Вечером деньги лежат так: '+tops.slice(0,3).map(x=>(SH[x.a]||x.a)+' — <b>'+MLN(x.v)+' ₸</b>').join(', ')+
     (tops.length>3?', остальное — на других счетах':'')+'.</p>');
   const cov=sOut?Math.round(sIn/sOut*100):null;
   if(cov!=null)p.push('<p>Поступления покрыли выплаты на <b>'+cov+'%</b>'+
     (cov>=100?' — день закрыли с запасом.':' — разницу добрали из остатка на счетах.')+'</p>');
 }
 p.push('<div class="note">'+(isToday
   ? 'День ещё идёт: данные на '+esc(D.updatedFull||D.updated||'')+', сборка из iiko каждый день в 18:00.'
   : 'Данные закрытого дня, прямой метод, источник — iiko.')+
   ' Внутренние переводы между своими счетами в приход и расход не входят.</div>');
 return '<div class="card"><div class="hd"><h3>📅 Что было '+dLong(k)+'</h3><div class="sub">Коротко и по-человечески: откуда пришли и куда ушли деньги</div></div>'+
   '<div class="story">'+p.join('')+'</div></div>';
}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;
 if(n>10&&n<20)return c; if(n1>1&&n1<5)return b; if(n1===1)return a; return c;}

/* ---------- 2. Водопад: как утренний остаток стал вечерним ---------- */
function chartWaterfall(obj,k){
 if(!obj.startByAcc||!obj.endByAcc)return '';
 const arts=obj.articles||[], bk={op:0,inv:0,fin:0,int:0};
 arts.forEach(a=>{bk[grp(a)]+=a.net;});
 const start=Math.round(obj.start||0), end=Math.round(obj.end||0);
 const other=end-start-bk.op-bk.inv-bk.fin-bk.int;
 const steps=[{l:'Утро',full:'Остаток на начало дня',v:start,anchor:1}];
 [['Операционная','Операционная деятельность',bk.op],['Инвестиционная','Инвестиционная деятельность',bk.inv],
  ['Финансовая','Финансовая деятельность',bk.fin],['Внутренние','Внутренние переводы',bk.int],
  ['Прочее','Прочее / без статьи ДДС',other]].forEach(pp=>{
   if(Math.abs(pp[2])>1)steps.push({l:pp[0],full:pp[1],v:Math.round(pp[2])});});
 steps.push({l:'Вечер',full:'Остаток на конец дня',v:end,anchor:1});
 if(steps.length<3)return '';
 let run=0; steps.forEach(s=>{if(s.anchor){s.lo=0;s.hi=s.v;run=s.v;}else{s.lo=run;s.hi=run+s.v;run=s.hi;}});
 const vals=steps.flatMap(s=>[s.lo,s.hi]); const mx=Math.max(...vals,0), mn=Math.min(...vals,0);
 const W=880,H=286,pT=34,pB=62,pL=12,pR=12,n=steps.length,gap=14;
 const band=(W-pL-pR-gap*(n-1))/n, bw=Math.min(24,band);
 const Y=v=>pT+(H-pT-pB)*(mx-v)/((mx-mn)||1), X=i=>pL+i*(band+gap)+(band-bw)/2;
 let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Как утренний остаток стал вечерним">'+
   '<defs><linearGradient id="wfg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6ad"/><stop offset="1" stop-color="#d4af37"/></linearGradient></defs>';
 s+='<line class="gl" x1="'+pL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-pR)+'" y2="'+Y(0).toFixed(1)+'"/>';
 steps.forEach((st,i)=>{
   const x=X(i), top=Y(Math.max(st.lo,st.hi)), bot=Y(Math.min(st.lo,st.hi)), h=Math.max(3,bot-top);
   const fill=st.anchor?'url(#wfg)':(st.v>=0?'var(--in)':'var(--out)');
   const tt=st.full+'¦'+(st.anchor?'на счетах':(st.v>=0?'прибавило':'убавило'))+'='+(st.anchor?SUM(st.v):((st.v>=0?'+':'−')+RUB(st.v)))+' ₸';
   s+='<g data-t="'+esc(tt)+'" role="listitem">'+
      '<rect x="'+(X(i)-gap/2).toFixed(1)+'" y="'+pT+'" width="'+(bw+gap).toFixed(1)+'" height="'+(H-pT-pB+22)+'" fill="transparent"/>'+
      '<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" fill="'+fill+'"/></g>';
   s+='<text class="ax" x="'+(x+bw/2).toFixed(1)+'" y="'+(top-10).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="800" fill="'+
      (st.anchor?'#f2dd9e':(st.v>=0?'var(--in)':'var(--out)'))+'">'+(st.anchor?'':(st.v>=0?'+':'−'))+MLN(Math.abs(st.v))+'</text>';
   s+='<text class="ax" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-38)+'" text-anchor="middle">'+st.l+'</text>';
   if(i<n-1){const y=Y(st.hi);
     s+='<line class="gl" x1="'+(x+bw).toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+X(i+1).toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';}
 });
 s+='</svg>';
 return '<div class="card"><div class="hd"><h3>💠 Как утренний остаток стал вечерним</h3>'+
   '<div class="sub">Слева направо: что прибавило и что убавило деньги за '+dRU(k)+'</div></div>'+
   '<div class="svgwrap">'+s+'</div></div>';
}

/* подписи на полосах: снаружи, если помещаются; иначе внутрь; иначе только в подсказке и таблице */

/* круглые деления оси: 0 / 5 млн / 10 млн, а не 8 763 412 */
function niceTicks(lo,hi,n){
 if(!(hi>lo))return [lo];
 const raw=(hi-lo)/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
 let step=mag*10; for(const s of [1,2,2.5,5,10]){if(mag*s>=raw){step=mag*s;break;}}
 const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+step*1e-6; v+=step)out.push(v);
 if(lo<0&&hi>0&&out.indexOf(0)<0)out.push(0);
 return out.sort((a,b)=>a-b);
}

 }).join('');
 const li=S.length-1;
 const ticks=[0,Math.floor(li/2),li].map(i=>'<text class="ax" x="'+(pL+band*i+band/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+dRU(S[i].d).slice(0,5)+'</text>').join('');
 return '<div class="card"><div class="hd"><h3>📊 Итог каждого дня, 30 дней</h3>'+
   '<div class="sub">Насколько денег стало больше или меньше за день · выбранный день выделен</div></div>'+
   '<div class="lgd"><span><i style="background:var(--in)"></i>день в плюс</span><span><i style="background:var(--out)"></i>день в минус</span></div>'+
   '<div class="svgwrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Итог каждого дня за 30 дней">'+g+
   '<line class="gl" x1="'+pL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-pR)+'" y2="'+Y(0).toFixed(1)+'"/>'+bars+ticks+'</svg></div></div>';
}
function table30(k){
 const S=last30(k).slice().reverse();
 const rows=S.map(x=>'<tr><td>'+dRU(x.d)+(x.d===k?' ·':'')+'</td><td>'+SUM(x.bal)+'</td><td>'+(x.net?SIGN(x.net):'—')+'</td></tr>').join('');
 return '<details class="tv"><summary>Те же 30 дней — таблицей</summary>'+
   '<table><thead><tr><th>Дата</th><th>На счетах утром, ₸</th><th>Итог дня, ₸</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
}

/* ---------- сборка вкладки ---------- */
function renderDay1(k){
 if(!k)return;
 const obj=dayObj(k), dt=dRU(k), label='день '+dt;
 LAST={obj:obj,label:label,from:k,to:k};
 let h=kpi(obj);
 h+=dayStory(obj,k);
 h+=chartWaterfall(obj,k);
 h+=chartArticles(obj,k);
 h+=payHTML(obj.revByContr);
 h+=expScheme(obj);
 h+=chartAccounts(obj,k);
 h+='<div class="chgrid">'+chartBalance30(k)+chartFlow30(k)+'</div>'+table30(k);
 h+=analytics(obj);
 h+=ddsTable(obj,{label:dt});
 const body=document.getElementById('body');
 body.innerHTML=h;
 document.getElementById('sub').textContent='Мастерская Сегодня · '+label+' · прямой метод · по счетам · источник: iiko';
 document.getElementById('openbadge').innerHTML=(k===(D.today||''))
   ? '<div class="openb">⏱ день ещё идёт — данные на '+esc(D.updatedFull||D.updated||'')+' · сборка из iiko каждый день в 18:00</div>' : '';
 bindFold(); tipHide(); bindTips(body); fitDvg(body);
}
function renderDay(k){
 const dd=D.days[k]; if(!dd)return;
 const dt=k.split('-').reverse().join('.');
 LAST={obj:{articles:dd.articles},label:'день '+dt,from:k,to:k};
 let h=kpi({articles:dd.articles,net:dd.net});
 h+=analytics({articles:dd.articles});
 h+=ddsTable({articles:dd.articles},{label:dt});
 document.getElementById('body').innerHTML=h;
 document.getElementById('sub').textContent='Мастерская Сегодня · день '+dt+' · прямой метод · по счетам · источник: iiko';
 document.getElementById('openbadge').innerHTML='';
 bindFold();
}
function bindFold(){
 document.querySelectorAll('tr.fold[data-fold]').forEach(el=>{
   el.onclick=()=>{const key=el.dataset.fold,arw=el.querySelector('.arw');let open=false;
     document.querySelectorAll('.fold-'+key).forEach(r=>{const vis=r.style.display==='none';r.style.display=vis?'':'none';open=vis;});
     if(arw)arw.textContent=open?'▾':'▸';};
 });
}
function xnum(v){v=Math.round(v||0);return v?String(v):'';}
function ctrRows(from,to){
 /* Сводка по контрагентам за период: [статья][контрагент] = {in,out}.
    Данные из iiko: день × статья ДДС × контрагент. */
 const F=D.flowCtr; if(!F||!F.days) return null;
 const cats=F.cats||[], ctrs=F.ctrs||[], acc={};
 Object.keys(F.days).forEach(function(d){
   if(from&&d<from) return; if(to&&d>to) return;
   F.days[d].forEach(function(r){
     const cat=cats[r[0]]||'—', nm=ctrs[r[1]]||'—';
     const a=acc[cat]||(acc[cat]={});
     const e=a[nm]||(a[nm]={in:0,out:0});
     e.in+=r[2]; e.out+=r[3];
   });
 });
 return acc;
}
function xlsSection(acc,dir){
 /* dir: 'in' — приход (кто оплатил), 'out' — расход (куда ушли деньги) */
 const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const arts=[];
 Object.keys(acc).forEach(function(cat){
   let tot=0; const list=[];
   Object.keys(acc[cat]).forEach(function(nm){
     const v=acc[cat][nm][dir]; if(Math.abs(v)<1) return;
     tot+=v; list.push({n:nm,v:v});
   });
   if(Math.abs(tot)<1) return;
   list.sort((a,b)=>b.v-a.v);
   arts.push({cat:cat,tot:tot,list:list});
 });
 if(!arts.length) return {html:'',total:0};
 arts.sort((a,b)=>b.tot-a.tot);
 const sign=dir==='out'?-1:1;
 let t='', total=0;
 arts.forEach(function(a){
   total+=a.tot;
   t+='<tr><td style="font-weight:bold">'+esc(a.cat)+'</td><td></td><td style="font-weight:bold">'+xnum(sign*a.tot)+'</td></tr>';
   a.list.forEach(function(r){
     t+='<tr><td></td><td>'+esc(r.n)+'</td><td>'+xnum(sign*r.v)+'</td></tr>';
   });
 });
 return {html:t,total:total};
}
function exportXls(){
 if(!LAST){return;} const obj=LAST.obj,label=LAST.label||'';
 const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const from=LAST.from||'', to=LAST.to||'';

 /* ── 1. Приход и расход с расшифровкой по контрагентам ── */
 let money='';
 const acc=ctrRows(from,to);
 if(acc){
   const IN=xlsSection(acc,'in'), OUT=xlsSection(acc,'out');
   money='<table border="1" cellspacing="0"><tr><th>Статья ДДС</th><th>Контрагент</th><th>Сумма, ₸</th></tr>';
   if(IN.html){
     money+='<tr><td colspan="3" style="background:#dff0d8;font-weight:bold">ПРИХОД — кто оплатил</td></tr>'+IN.html
       +'<tr><td colspan="2" style="font-weight:bold">Итого приход</td><td style="font-weight:bold">'+xnum(IN.total)+'</td></tr>';
   }
   if(OUT.html){
     money+='<tr><td colspan="3" style="background:#f2dede;font-weight:bold">РАСХОД — куда ушли деньги</td></tr>'+OUT.html
       +'<tr><td colspan="2" style="font-weight:bold">Итого расход</td><td style="font-weight:bold">'+xnum(-OUT.total)+'</td></tr>';
   }
   money+='<tr><td colspan="2" style="font-weight:bold">ЧИСТЫЙ ПОТОК</td><td style="font-weight:bold">'+xnum(IN.total-OUT.total)+'</td></tr></table>';
 }

 /* ── 2. По дням: статья × контрагент внутри каждого дня ── */
 let byday='';
 if(D.flowCtr&&D.flowCtr.days&&from&&to&&from!==to){
   const cats=D.flowCtr.cats||[], ctrs=D.flowCtr.ctrs||[];
   const ds=Object.keys(D.flowCtr.days).filter(d=>d>=from&&d<=to).sort();
   if(ds.length){
     byday='<br><h3>По дням</h3><table border="1" cellspacing="0"><tr><th>Дата</th><th>Статья ДДС</th><th>Контрагент</th><th>Приход, ₸</th><th>Расход, ₸</th></tr>';
     ds.forEach(function(d){
       const rows=D.flowCtr.days[d].slice().sort((a,b)=>(b[2]-b[3])-(a[2]-a[3]));
       let di=0,doo=0;
       rows.forEach(function(r){
         di+=r[2]; doo+=r[3];
         byday+='<tr><td>'+d.split('-').reverse().join('.')+'</td><td>'+esc(cats[r[0]]||'—')+'</td><td>'+esc(ctrs[r[1]]||'—')+'</td>'
           +'<td>'+(r[2]?xnum(r[2]):'')+'</td><td>'+(r[3]?xnum(-r[3]):'')+'</td></tr>';
       });
       byday+='<tr><td colspan="3" style="font-weight:bold">Итого '+d.split('-').reverse().join('.')+'</td>'
         +'<td style="font-weight:bold">'+xnum(di)+'</td><td style="font-weight:bold">'+xnum(-doo)+'</td></tr>';
     });
     byday+='</table>';
   }
 }

 /* ── 3. Прежняя таблица по счетам — оставляем, она нужна для сверки остатков ── */
 let t='<br><h3>По счетам</h3><table border="1" cellspacing="0"><tr><th>Статья ДДС</th>'+ACCS.map(a=>'<th>'+esc(SH[a]||a)+'</th>').join('')+'<th>Итого</th></tr>';
 if(obj.startByAcc)t+='<tr><td>Остаток на начало</td>'+ACCS.map(a=>'<td>'+xnum(obj.startByAcc[a])+'</td>').join('')+'<td>'+xnum(obj.start)+'</td></tr>';
 const bk={op:[],inv:[],fin:[],int:[]};(obj.articles||[]).forEach(a=>bk[grp(a)].push(a));
 GROUPS.forEach(([key,title])=>{const list=bk[key];if(!list.length)return;list.sort((x,y)=>Math.abs(y.net)-Math.abs(x.net));
   const gt={};ACCS.forEach(a=>gt[a]=list.reduce((s,x)=>s+accNet(x,a),0));const gn=list.reduce((s,x)=>s+x.net,0);
   t+='<tr><td><b>'+esc(title)+'</b></td>'+ACCS.map(a=>'<td>'+xnum(gt[a])+'</td>').join('')+'<td>'+xnum(gn)+'</td></tr>';
   list.forEach(a=>{t+='<tr><td>'+esc(a.cat)+'</td>'+ACCS.map(ac=>'<td>'+xnum(accNet(a,ac))+'</td>').join('')+'<td>'+xnum(a.net)+'</td></tr>';});});
 if(obj.startByAcc&&obj.endByAcc){const fl={};ACCS.forEach(a=>fl[a]=(obj.articles||[]).reduce((s,x)=>s+accNet(x,a),0));
   const oth={};let ot=0;ACCS.forEach(a=>{const o=(obj.endByAcc[a]||0)-(obj.startByAcc[a]||0)-fl[a];oth[a]=o;ot+=o;});
   if(Math.abs(ot)>1)t+='<tr><td>Прочее / без статьи</td>'+ACCS.map(a=>'<td>'+xnum(oth[a])+'</td>').join('')+'<td>'+xnum(ot)+'</td></tr>';
   t+='<tr><td>Остаток на конец</td>'+ACCS.map(a=>'<td>'+xnum(obj.endByAcc[a])+'</td>').join('')+'<td>'+xnum(obj.end)+'</td></tr>';}
 t+='</table>';

 const head='<h3>ДДС · '+esc(label)+'</h3>'
   +'<div>Источник: iiko · прямой метод · собрано '+esc(D.updatedFull||D.updated||'')+'</div>'
   +(acc?'':'<div>Разрез по контрагентам недоступен — пересоберите данные.</div>');
 const html='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>'
   +head+money+byday+t+'</body></html>';
 const blob=new Blob(['﻿'+html],{type:'application/vnd.ms-excel'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;
 a.download='ДДС_'+label.replace(/[^0-9A-Za-zА-Яа-яЁё]+/g,'_')+'.xls';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
document.getElementById('xls').onclick=exportXls;
function rerender(){ if(CUR.type==='day1'){renderDay1(CUR.key);} else if(CUR.type==='day'){renderDay(CUR.key);} else if(CUR.type==='range'){renderRange(rfrom.value,rto.value);} else if(CUR.type==='year'){goYear();} else {const m=D.months[CUR.key],meta=(D.mmeta||{})[CUR.key]||{};renderPeriod(m,meta.ru||CUR.key,meta.ru,meta.closed);} }

/* ---------- вкладки ---------- */
const tabs=document.getElementById('tabs'),dp=document.getElementById('daypick'),dsel=document.getElementById('daysel');
const rp=document.getElementById('rangepick'),rfrom=document.getElementById('rfrom'),rto=document.getElementById('rto');
const d1p=document.getElementById('d1pick'),d1sel=document.getElementById('d1sel');
function setActive(k){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.k===k));}
function addTab(k,label,mark){const t=document.createElement('div');t.className='tab';t.dataset.k=k;
 t.innerHTML=label+(mark?'<span class="dot">•</span>':'');t.onclick=()=>go(k);tabs.appendChild(t);}
function goYear(){const y=D.year;const toRu=(D.mmeta[y.to]||{}).ru||'';renderPeriod(y,'2026 год (январь — '+(toRu.split(' ')[0]||'')+')','2026 год',true);}
function go(k){
 payAll=false; setActive(k);
 dp.classList.remove('show'); rp.classList.remove('show'); d1p.classList.remove('show');
 if(k==='DAY1'){CUR={type:'day1',key:d1sel.value};d1p.classList.add('show');renderDay1(d1sel.value);return;}
 if(k==='DAYS'){CUR={type:'day',key:dsel.value};dp.classList.add('show');renderDay(dsel.value);return;}
 if(k==='RANGE'){CUR={type:'range'};rp.classList.add('show');renderRange(rfrom.value,rto.value);return;}
 if(k==='YEAR'){CUR={type:'year',key:'YEAR'};goYear();}
 else{CUR={type:'month',key:k};const m=D.months[k],meta=(D.mmeta||{})[k]||{};renderPeriod(m,meta.ru||k,meta.ru,meta.closed);}
}
if(D.year&&D.year.articles&&D.year.articles.length) addTab('YEAR','2026 · год');
MK.forEach(k=>{const meta=(D.mmeta||{})[k]||{};addTab(k,(meta.ru||k).replace(' 2026','').replace(/^./,c=>c.toUpperCase()),meta.closed===false);});
/* --- вкладка «ДДС за день»: полный отчёт за одну дату (остатки + статьи + кто оплатил).
       Сегодняшний день есть в списке всегда и выбран по умолчанию — сборка в 18:00 показывает текущий день. --- */
const D1K=Object.keys(Object.assign({},D.byDay||{},(D.today?{[D.today]:1}:{}))).sort();
if(D1K.length){
 addTab('DAY1','ДДС за день');
 D1K.slice().reverse().forEach(k=>{const o=document.createElement('option');o.value=k;
   o.textContent=dRU(k)+(k===(D.today||'')?'  · сегодня':'')+'  ('+SIGN(Math.round(netOf(k)))+' ₸)';
   d1sel.appendChild(o);});
 d1sel.value=(D.today&&D1K.indexOf(D.today)>=0)?D.today:D1K[D1K.length-1];
 const pick=k=>{d1sel.value=k;CUR={type:'day1',key:k};payAll=false;renderDay1(k);};
 d1sel.onchange=()=>pick(d1sel.value);
 document.getElementById('d1prev').onclick=()=>{const i=D1K.indexOf(d1sel.value);if(i>0)pick(D1K[i-1]);};
 document.getElementById('d1next').onclick=()=>{const i=D1K.indexOf(d1sel.value);if(i>=0&&i<D1K.length-1)pick(D1K[i+1]);};
}
const DK=Object.keys(D.days||{}).sort();
if(DK.length){ addTab('DAYS','По дням');
 DK.slice().reverse().forEach(k=>{const o=document.createElement('option');o.value=k;
   o.textContent=k.split('-').reverse().join('.')+'  ('+SIGN(D.days[k].net)+' ₸)';dsel.appendChild(o);});
 dsel.onchange=()=>{CUR={type:'day',key:dsel.value};payAll=false;renderDay(dsel.value);};
}
if(D.byDay&&Object.keys(D.byDay).length){
 addTab('RANGE','Период');
 const keys=Object.keys(D.byDay).sort();
 const mn=D.dayMin||keys[0], mx=D.dayMax||keys[keys.length-1];
 rfrom.min=mn;rfrom.max=mx;rto.min=mn;rto.max=mx;rto.value=mx;
 const d=new Date(mx+'T00:00:00');d.setDate(d.getDate()-6);let iso=d.toISOString().slice(0,10);
 rfrom.value=(iso<mn?mn:iso);
 document.getElementById('rgo').onclick=()=>{let a=rfrom.value,b=rto.value;if(!a||!b)return;if(a>b){rfrom.value=b;rto.value=a;a=rfrom.value;b=rto.value;}payAll=false;CUR={type:'range'};renderRange(a,b);};
}
go(MK.length?MK[MK.length-1]:'YEAR');
</script></body></html>
