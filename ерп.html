<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЕРП · Пульс</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   Интерфейс «Такси» 1С:Предприятия 8.3, воспроизведённый на Пульсе:
   жёлтая панель разделов слева, белая рабочая область, команды
   разложены по колонкам — как в 1С:ERP Управление предприятием 2.

   Структура разделов и команд повторяет оригинал. Синяя живая ссылка —
   такой отчёт в Пульсе есть. Серая — такого нет. Страница заодно
   показывает, какую часть ERP завод закрыл, не покупая ERP.
   ══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif;color:#1c1c1c;background:#fff;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* ── верхняя жёлтая полоса ── */
.tb{background:#ffe9a3;border-bottom:1px solid #e3c969;display:flex;align-items:center;
  gap:11px;padding:0 12px;height:34px;flex:0 0 auto}
.tb .logo{width:26px;height:17px;border-radius:2px;background:#f5c518;position:relative;flex:0 0 auto;
  display:grid;place-items:center;font-weight:900;font-size:10px;color:#111;letter-spacing:-.5px}
.tb .logo:after{content:'';position:absolute;right:2px;top:3px;width:5px;height:11px;
  border-radius:1px;background:#e2231a}
.tb .burger{font-size:15px;color:#4a4332;user-select:none}
.tb .cap{font-size:12.5px;color:#262626;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .sp{margin-left:auto;display:flex;gap:12px;align-items:center}
.tb a.exit{font-size:12px;color:#1d3c6e;text-decoration:none;white-space:nowrap}
.tb a.exit:hover{text-decoration:underline}

.wrap{flex:1 1 auto;display:flex;min-height:0}

/* ── левая панель разделов ── */
.nav{width:216px;flex:0 0 216px;background:#ffe9a3;overflow-y:auto;padding:2px 0 24px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;
  background:none;font:inherit;font-size:12.5px;color:#1c1c1c;padding:7px 10px 7px 11px;
  cursor:pointer;line-height:1.25;border-left:3px solid transparent}
.nav button:hover{background:#ffdf7e}
.nav button.on{background:#fff;border-left-color:#f0b400;font-weight:600}
.nav .ic{width:16px;flex:0 0 16px;text-align:center;font-size:13px;opacity:.75}

/* ── рабочая область ── */
.main{flex:1 1 auto;overflow-y:auto;padding:16px 26px 60px;min-width:0}
.crumb{font-size:12px;color:#6b6b6b;margin-bottom:3px}
h1{font-size:17px;font-weight:600;color:#1c1c1c;margin-bottom:3px}
.lead{font-size:12.5px;color:#555;max-width:780px;margin-bottom:18px;line-height:1.5}

.cols{column-width:272px;column-gap:38px}
.grp{break-inside:avoid;margin-bottom:21px;display:inline-block;width:100%}
.grp h2{font-size:13.5px;font-weight:600;color:#1a9e4b;margin-bottom:7px}
.grp ul{list-style:none}
.grp li{padding:2.5px 0;display:flex;gap:7px;align-items:baseline}
.grp a{color:#1d3c6e;text-decoration:none}
.grp a:hover{text-decoration:underline}
.grp .no{color:#9a9a9a}
.bg{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;white-space:nowrap;
  letter-spacing:.02em;flex:0 0 auto;position:relative;top:-1px}
.b-ok{background:#e7f6ec;color:#17793c}
.b-part{background:#fdf1dc;color:#9a6508}
.b-no{background:#f1f1f1;color:#8a8a8a}

/* ── монитор руководителя: классический вид 1С — синие шапки блоков,
      сетка, подсветка строки при наведении ── */
.m1c{border:1px solid #8ca0b8;border-radius:2px;margin-bottom:22px;background:#f7f9fc;max-width:1120px}
.m1c .hd{background:linear-gradient(#dfe8f3,#c6d6e8);border-bottom:1px solid #9fb3c8;
  padding:6px 12px;font-size:13.5px;font-weight:700;color:#1b3a5c}
.m1c .asof{padding:6px 12px;border-bottom:1px solid #d7e0ea;font-size:12px;color:#3b5b7e;
  background:#eef3f9;display:flex;gap:22px;flex-wrap:wrap}
.m1c .asof b{font-weight:700;color:#1b3a5c}
.m1c .body{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.m1c .pane{background:#fff;border:1px solid #9fb3c8;border-radius:2px;min-width:0;overflow:hidden}
.m1c h3{background:linear-gradient(#dfe8f3,#c6d6e8);border-bottom:1px solid #9fb3c8;
  padding:4px 8px;font-size:12px;font-weight:700;color:#1b3a5c;margin:0}
.m1c table{width:100%;border-collapse:collapse;font-size:12px}
.m1c th{background:#eef3f9;font-weight:400;color:#3b5b7e;text-align:right;padding:3px 7px;
  border-bottom:1px solid #9fb3c8;border-right:1px solid #dde4ec;font-size:11px;white-space:nowrap}
.m1c th:last-child{border-right:0}
.m1c th.l,.m1c td.l{text-align:left}
.m1c td{padding:3px 7px;text-align:right;font-variant-numeric:tabular-nums;color:#1c1c1c;
  border-bottom:1px solid #e6ebf2;border-right:1px solid #eef1f5;white-space:nowrap}
.m1c td:last-child{border-right:0}
.m1c td.l{white-space:normal}
.m1c td.nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:1px;width:99%}
.m1c tbody tr:hover td,.m1c table tr:hover td{background:#316ac5;color:#fff}
.m1c tr:hover td a,.m1c tr:hover td span{color:#fff}
.m1c tr.tot td{background:#eef3f9;font-weight:700;border-top:1px solid #9fb3c8;
  border-bottom:0;color:#1b3a5c}
.m1c tr.tot:hover td{background:#316ac5;color:#fff}
.m1c a{color:#1d3c6e}
.m1c .warn{color:#c0392b;font-weight:600}
.m1c .foot{font-size:11px;color:#3b5b7e;padding:5px 8px;background:#f7f9fc;
  border-top:1px solid #dde4ec}
.m1c .empty{font-size:12px;color:#8a97a8;padding:7px 8px}
@media(max-width:860px){ .m1c .body{grid-template-columns:1fr} }

/* ── отчёт, который считается в айко по кнопке ── */
.m1c.rp .asof{align-items:center;gap:10px}
.m1c.rp select,.m1c.rp input{font:inherit;font-size:12px;border:1px solid #9fb3c8;border-radius:2px;
  padding:2px 5px;background:#fff;color:#1c1c1c}
.m1c.rp select{max-width:280px}
.m1c.rp button{font:inherit;font-size:12px;border:1px solid #9fb3c8;border-radius:2px;padding:2px 12px;
  background:linear-gradient(#f7fafd,#dfe8f3);color:#1b3a5c;font-weight:600;cursor:pointer}
.m1c.rp button:hover{background:linear-gradient(#fff,#d2e0ef)}
.m1c.rp button:disabled{opacity:.6;cursor:default}
.m1c.rp .st{color:#3b5b7e;font-size:11.5px}
.rpbd{padding:0;max-height:430px;overflow:auto;background:#fff}
.rpbd table{width:100%}
.rpbd th{position:sticky;top:0;z-index:1}
/* в отчёте бывает две текстовые колонки — не даём первой забрать всю ширину */
.rpbd td.nm{width:auto;max-width:360px}

/* ── доска задач CRM, в оформлении «Такси» ── */
.crm{border:1px solid #c9c9c9;border-radius:2px;margin-bottom:22px;background:#fff}
.crm .hd{background:#f4f4f4;border-bottom:1px solid #d9d9d9;padding:7px 12px;font-size:13.5px;
  font-weight:600;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crm .hd .st{margin-left:auto;font-size:11.5px;font-weight:400;color:#777}
.crm .bd{display:flex;gap:10px;padding:12px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 232px;border:1px solid #d9d9d9;border-radius:2px;background:#fafafa;min-height:70px}
.col.over{border-color:#f0b400;background:#fffaea}
.col .ch{background:#ffe9a3;border-bottom:1px solid #e3c969;padding:5px 9px;font-size:12.5px;
  font-weight:600;display:flex;align-items:center;gap:7px}
.col .ch .cnt{margin-left:auto;font-weight:400;color:#6b5c2a;font-size:11.5px}
.col .ch .x{color:#9a6508;cursor:pointer;font-size:12px;opacity:.5}
.col .ch .x:hover{opacity:1}
.col .cards{padding:7px;display:flex;flex-direction:column;gap:6px}
.card{border:1px solid #d9d9d9;background:#fff;border-radius:2px;padding:6px 8px;font-size:12px;
  display:flex;gap:7px;align-items:flex-start;cursor:grab;line-height:1.35}
.card:hover{border-color:#b9b9b9}
.card.drag{opacity:.4}
.card .ck{width:12px;height:12px;flex:0 0 12px;border:1px solid #9a9a9a;border-radius:50%;
  margin-top:2px;cursor:pointer}
.card.done .ck{background:#17793c;border-color:#17793c}
.card.done .t{color:#9a9a9a;text-decoration:line-through}
.card .t{flex:1 1 auto;min-width:0;word-wrap:break-word}
.card .x{color:#b9b9b9;cursor:pointer;font-size:12px;line-height:1}
.card .x:hover{color:#c0392b}
.addc{padding:5px 9px 9px;font-size:12px;color:#1d3c6e;cursor:pointer}
.addc:hover{text-decoration:underline}
.crm textarea{width:100%;font:inherit;font-size:12px;border:1px solid #f0b400;border-radius:2px;
  padding:5px 7px;resize:vertical;min-height:46px;outline:none}
.crm .btn{background:#ffe9a3;border:1px solid #e3c969;border-radius:2px;font:inherit;font-size:12px;
  padding:3px 11px;cursor:pointer}
.crm .btn:hover{background:#ffdf7e}
.crm .btn.lnk{background:none;border:0;color:#1d3c6e;padding:3px 4px}
.crm .btn.lnk:hover{text-decoration:underline;background:none}
.newcol{flex:0 0 190px}

.legend{font-size:11.5px;color:#777;margin-top:26px;padding-top:12px;border-top:1px solid #ececec;
  display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.cover{font-size:12px;color:#6b6b6b;margin-top:7px}
.cover b{color:#17793c}

@media(max-width:760px){
  .nav{position:fixed;left:0;top:34px;bottom:0;z-index:9;transform:translateX(-100%);
    transition:transform .18s;box-shadow:2px 0 12px #0003}
  .nav.open{transform:none}
  .tb .burger{cursor:pointer;font-size:19px}
  .main{padding:14px 16px 60px}
}
</style>
</head>

/* ── деньги ── */
function f0(v){ return Math.round(v).toLocaleString('ru-RU').replace(/,/g,' '); }
function mln(v){
  var a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(2).replace('.',',')+' млрд ₸';
  if(a>=1e6) return (v/1e6).toFixed(1).replace('.',',')+' млн ₸';
  return f0(v)+' ₸';
}
var MN=['','январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

/* ── левая панель ── */
var nav=document.getElementById('nav'), main=document.getElementById('main');
S.forEach(function(s){
  var b=document.createElement('button');
  b.innerHTML='<span class="ic">'+s.ic+'</span><span>'+s.n+'</span>';
  b.dataset.id=s.id;
  b.onclick=function(){ open(s.id); };
  nav.appendChild(b);
});

/* ── сколько закрыто: считаем по самой таблице, чтобы цифра не врала ── */
function cover(s){
  var ok=0,part=0,no=0;
  s.groups.forEach(function(g){ g.i.forEach(function(it){
    if(it[2]==='ok') ok++; else if(it[2]==='part') part++; else no++; }); });
  return {ok:ok, part:part, no:no, all:ok+part+no};
}

function open(id){
  var s=S.filter(function(x){return x.id===id;})[0]; if(!s) return;
  [].forEach.call(nav.children,function(b){ b.className = b.dataset.id===id?'on':''; });
  nav.classList.remove('open');
  var c=cover(s);
  var h='<div class="crumb">Пульс: Управление предприятием</div><h1>'+s.n+'</h1>'
      + '<p class="lead">'+s.sub+'</p>';
  if(s.home) h+= '<div class="m1c"><div class="hd">Монитор руководителя</div>'
    + '<div class="asof" id="asof">По состоянию на: <b>—</b></div>'
    + '<div class="body" id="mon"></div></div>'
    + '<div class="note"><b>Это Пульс, разложенный по разделам 1С:ERP.</b> Слева — те же разделы, '
    + 'что в «Управлении предприятием 2», внутри — те же команды. Синяя ссылка значит, что такой '
    + 'отчёт в Пульсе уже есть и он живой. Серая — такого нет. Получается честная карта: какую '
    + 'часть ERP завод закрыл, не покупая ERP, и что осталось за её пределами.</div>';
  if(s.rep) h+= '<div class="m1c rp"><div class="hd">Отчёт из айко</div>'
    + '<div class="asof"><select id="rp-sel"></select>'
    + '<span>с <input type="date" id="rp-from"> по <input type="date" id="rp-to"></span>'
    + '<button id="rp-go">Сформировать</button><span class="st" id="rp-st"></span></div>'
    + '<div class="rpbd" id="rp-bd"></div></div>';
  if(s.crm) h+= '<div class="crm"><div class="hd">Задачи'
    + '<button class="btn lnk" id="crm-addcol">+ Колонка</button>'
    + '<span class="st" id="crm-st">загружается…</span></div>'
    + '<div class="bd" id="crm-bd"></div></div>';
  h+='<div class="cols">';
  s.groups.forEach(function(g){
    h+='<div class="grp"><h2>'+g.t+'</h2><ul>';
    g.i.forEach(function(it){
      var name=it[0], href=it[1], st=it[2];
      var bg = st==='ok' ? '' : '<span class="bg '+(st==='part'?'b-part':'b-no')+'">'
             + (st==='part'?'частично':'нет')+'</span>';
      h+='<li>' + (href? '<a href="'+href+'">'+name+'</a>' : '<span class="no">'+name+'</span>')
        + bg + '</li>';
    });
    h+='</ul></div>';
  });
  h+='</div>';
  h+='<div class="legend"><span><span class="bg b-ok">есть</span> отчёт работает</span>'
   + '<span><span class="bg b-part">частично</span> есть похожее, но не в полном виде</span>'
   + '<span><span class="bg b-no">нет</span> в Пульсе такого нет</span></div>'
   + '<div class="cover">В разделе «'+s.n+'» из '+c.all+' команд ERP Пульс закрывает '
   + '<b>'+c.ok+'</b>, частично '+c.part+', не закрывает '+c.no+'.</div>';
  main.innerHTML=h;
  main.scrollTop=0;
  /* ссылки «#раздел» переключают раздел, а не прыгают по странице */
  [].forEach.call(main.querySelectorAll('a[href^="#"]'),function(a){
    a.onclick=function(e){ e.preventDefault(); open(a.getAttribute('href').slice(1)); };
  });
  if(s.home) monitor();
  if(s.crm) crmInit();
  if(s.rep) repInit(s.rep);
  if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
}

/* ══════════════════════════════════════════════════════════════════
   МОНИТОР РУКОВОДИТЕЛЯ — как в 1С:ERP: остатки на счетах и в кассах,
   доход, дебиторы, кредиторы. Цифры живые, из тех же файлов, что и
   главная Пульса, — ничего не пересчитываем заново, чтобы монитор
   не разошёлся с отчётами.
   ══════════════════════════════════════════════════════════════════ */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function load(src,cb){ var s=document.createElement('script'); s.src=src;
  s.onload=cb; s.onerror=function(){cb();}; document.head.appendChild(s); }
function pane(id,title,wide){
  return '<div class="pane'+(wide?' wide':'')+'" id="'+id+'" style="'+(wide?'grid-column:1/-1':'')+'">'
       + '<h3>'+title+'</h3><div class="empty">загружается…</div></div>';
}
function fill(id,html){ var e=document.getElementById(id); if(!e) return;
  e.innerHTML = e.querySelector('h3').outerHTML + html; }
function nodata(id){ fill(id,'<div class="empty">нет данных</div>'); }

function monitor(){
  var m=document.getElementById('mon'); if(!m) return;
  m.innerHTML = pane('pn-cash','Остатки денежных средств на расчётных счетах и в кассах')
              + pane('pn-rev','Доход (выручка)')
              + pane('pn-rz','Реализация в 1С против айко', true)
              + pane('pn-dz','Дебиторы')
              + pane('pn-kz','Кредиторы');

  /* ── Остатки на счетах и в кассах ── */
  load('/ddsp_days.js?v=1',function(){
    var C=(window.DDSP_DAYS||{}).cash; if(!C||!C.acc) return nodata('pn-cash');
    var nalSet={}; (C.nalAcc||[]).forEach(function(x){ nalSet[x]=1; });
    var ks=Object.keys(C.acc).sort(function(a,b){ return C.acc[b]-C.acc[a]; });
    var h='<table><tr><th class="l">Счёт / касса</th><th>Вид</th><th>Остаток, ₸</th></tr>';
    ks.forEach(function(k){
      h+='<tr><td class="nm" title="'+esc(k)+'">'+esc(k)+'</td>'
       + '<td style="color:#888">'+(nalSet[k]?'касса':'банк')+'</td>'
       + '<td>'+f0(C.acc[k])+'</td></tr>';
    });
    h+='<tr class="tot"><td class="l">ВСЕГО</td><td></td><td>'+f0(C.nal+C.beznal)+'</td></tr></table>';
    fill('pn-cash',h);
    var a=document.getElementById('asof');
    if(a&&C.date){ var d=C.date.split('-');
      a.innerHTML='По состоянию на: <b>'+d[2]+'.'+d[1]+'.'+d[0]+'</b>'
                + '<span>Организация: <b>Фуд Завод</b></span>'
                + '<span>Источник: <b>айко, 1С</b></span>'; }
  });

  /* ── Доход по месяцам ── */
  load('/opiu_rev.js?v=1',function(){
    var R=window.OPIU_REV; if(!R) return nodata('pn-rev');
    var ks=Object.keys(R).filter(function(k){return /^\d{4}-\d{2}$/.test(k);}).sort();
    if(!ks.length) return nodata('pn-rev');
    var yearT=0, yearI=0;
    ks.forEach(function(k){ yearT+=R[k].trade||0; yearI+=R[k].itogo||0; });
    var show=ks.slice(-6);
    var h='<table><tr><th class="l">Месяц</th><th>Торговая выручка</th>'
        + '<th>Возвраты и прочее</th><th>Итого</th></tr>';
    show.forEach(function(k){
      var x=R[k], d=(x.itogo||0)-(x.trade||0);
      h+='<tr><td class="l">'+MN[+k.slice(5)]+'</td><td>'+f0(x.trade||0)+'</td>'
       + '<td style="color:'+(d<0?'#9a6508':'#888')+'">'+(d?f0(d):'—')+'</td>'
       + '<td>'+f0(x.itogo||0)+'</td></tr>';
    });
    h+='<tr class="tot"><td class="l">С начала года</td><td>'+f0(yearT)+'</td><td></td>'
     + '<td>'+f0(yearI)+'</td></tr></table>';
    fill('pn-rev',h);
  });

  /* ── Дебиторы и кредиторы ── */
  load('/balans.js?v=2',function(){
    var B=window.BALANS;
    if(!B||!B.sides){ nodata('pn-dz'); nodata('pn-kz'); return; }
    var DAY=864e5, base=new Date(B.base+'T00:00:00');
    function side(k){
      var S2=B.sides[k]; if(!S2) return null;
      var ad=new Date(((B.anchor&&B.anchor[k])||B.base)+'T00:00:00');
      var ai=Math.round((ad-base)/DAY), tot=0, rows=[];
      S2.rows.forEach(function(r){
        var v=r.open;
        for(var j=0;j<r.mv.length;j++){ if(r.mv[j][0]<=ai) v+=r.mv[j][1]-r.mv[j][2]; }
        tot+=v; if(v>0) rows.push({n:String(r.n).replace(/^\d+-\s*/,''), v:v});
      });
      rows.sort(function(a,b){ return b.v-a.v; });
      return {total:tot, rows:rows, date:ad.toLocaleDateString('ru-RU')};
    }
    function draw(id,o,who,href){
      if(!o) return nodata(id);
      var h='<table><tr><th class="l">Контрагент</th><th>Задолженность, ₸</th></tr>';
      o.rows.slice(0,8).forEach(function(r){
        h+='<tr><td class="nm" title="'+esc(r.n)+'">'+esc(r.n)+'</td><td>'+f0(r.v)+'</td></tr>';
      });
      if(o.rows.length>8)
        h+='<tr><td class="l" style="color:#888">…и ещё '+(o.rows.length-8)+'</td><td></td></tr>';
      h+='<tr class="tot"><td class="l">ВСЕГО</td><td>'+f0(o.total)+'</td></tr></table>'
       + '<div class="foot">на '+o.date+' · '
       + o.rows.length+' '+who+' · <a href="'+href+'" style="color:#1d3c6e">подробно</a></div>';
      fill(id,h);
    }
    draw('pn-dz', side('dz'), 'покупателей', 'дз_кз.html');
    draw('pn-kz', side('kz'), 'поставщиков', 'дз_кз.html');
  });

  /* ── Реализация: 1С против айко ── */
  load('/realizaciya.js?v=4',function(){
    var R=window.REALIZACIYA; if(!R||!R.months||!R.months.length) return nodata('pn-rz');
    var h='<table><tr><th class="l">Месяц</th><th>Проведено в 1С</th><th>Отгружено по айко</th>'
        + '<th>Разница</th><th>Создано, не проведено</th></tr>';
    R.months.slice(-4).forEach(function(x){
      h+='<tr><td class="l">'+MN[x.m]+'</td><td>'+f0(x.v1c||0)+'</td><td>'+f0(x.iiko||0)+'</td>'
       + '<td style="color:'+((x.diff||0)<0?'#9a6508':'#888')+'">'+f0(x.diff||0)+'</td>'
       + '<td'+((x.np||0)>0?' class="warn"':'')+'>'+((x.np||0)?f0(x.np)+' · '+x.npn+' док.':'—')+'</td></tr>';
    });
    h+='</table><div class="foot">'
     + 'Непроведённый документ в 1С создан, но в оборот не попал — в обычном отчёте его не видно. '
     + '<a href="реализация.html">подробно</a></div>';
    fill('pn-rz',h);
  });
}

/* ══════════════════════════════════════════════════════════════════
   ОТЧЁТЫ ИЗ АЙКО. Не ссылка на готовую страницу Пульса, а запрос
   в учётную систему: выбрали период, нажали «Сформировать» —
   воркер сходил в OLAP айко и вернул строки. Набор отчётов задан
   на сервере, страница только показывает.
   ══════════════════════════════════════════════════════════════════ */
var REP_N = {
  osv:'Оборотно-сальдовая ведомость по счетам',
  cash:'Движение денежных средств по статьям',
  ship:'Отгрузка по контрагентам',
  shipit:'Отгрузка по номенклатуре',
  buy:'Закупки по поставщикам',
  buyit:'Закупки по номенклатуре',
  prod:'Выпуск продукции',
  wo:'Списания, брак и недостачи'
};
function qty(v){
  var n=Number(v)||0;
  if(Math.abs(n-Math.round(n))<0.0005) return f0(n);
  return n.toFixed(3).replace('.',',');
}
function repInit(list){
  var sel=document.getElementById('rp-sel'), go=document.getElementById('rp-go'),
      f=document.getElementById('rp-from'), t=document.getElementById('rp-to');
  if(!sel) return;
  sel.innerHTML=list.map(function(k){ return '<option value="'+k+'">'+(REP_N[k]||k)+'</option>'; }).join('');
  var now=new Date(Date.now()+5*3600e3);           /* Алматы */
  var p2=function(x){ return ('0'+x).slice(-2); };
  var iso=function(d){ return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()); };
  t.value=iso(now);
  f.value=iso(now).slice(0,8)+'01';
  go.onclick=function(){ repRun(sel.value,f.value,t.value); };
  sel.onchange=function(){ repRun(sel.value,f.value,t.value); };
  repRun(list[0],f.value,t.value);
}
function repRun(key,from,to){
  var bd=document.getElementById('rp-bd'), st=document.getElementById('rp-st'),
      go=document.getElementById('rp-go');
  if(!bd) return;
  st.textContent='считаю в айко…'; go.disabled=true;
  bd.innerHTML='<div class="empty">запрос в айко, это занимает несколько секунд…</div>';
  fetch('/api/erp?r='+encodeURIComponent(key)+'&from='+from+'&to='+to)
    .then(function(r){ return r.json(); })
    .then(function(j){
      go.disabled=false;
      if(!j||j.error){ st.textContent=''; bd.innerHTML='<div class="empty">не получилось: '
        +esc((j&&j.error)||'нет ответа')+'</div>'; return; }
      var h='<table><tr>'+j.cols.map(function(c){
        return '<th'+(c[2]==='l'?' class="l"':'')+'>'+esc(c[1])+'</th>'; }).join('')+'</tr>';
      j.rows.forEach(function(r){
        h+='<tr>'+j.cols.map(function(c){
          var v=r[c[0]];
          if(c[2]==='l') return '<td class="nm" title="'+esc(v==null?'':v)+'">'+esc(v==null?'—':v)+'</td>';
          if(c[2]==='q') return '<td>'+qty(v)+'</td>';
          return '<td>'+f0(v||0)+'</td>';
        }).join('')+'</tr>';
      });
      h+='<tr class="tot">'+j.cols.map(function(c,n){
        if(c[2]==='l') return '<td class="l">'+(n===0?'ИТОГО':'')+'</td>';
        if(c[2]==='q') return '<td>'+qty(j.sums[c[0]]||0)+'</td>';
        return '<td>'+f0(j.sums[c[0]]||0)+'</td>';
      }).join('')+'</tr></table>';
      bd.innerHTML=h;
      var more=j.total>j.rows.length ? ' · показаны первые '+j.rows.length+' из '+j.total : '';
      st.textContent='строк '+j.total+more+' · период '+j.from+' — '+j.to;
    })
    .catch(function(e){ go.disabled=false; st.textContent='';
      bd.innerHTML='<div class="empty">не получилось: '+esc(String(e))+'</div>'; });
}

/* ══════════════════════════════════════════════════════════════════
   ДОСКА ЗАДАЧ раздела CRM. Колонки и карточки лежат в Cloudflare KV
   одним ключом (crm:v1). Сохраняем не на каждый щелчок, а через паузу
   после последнего изменения: на бесплатном плане всего 1000 записей
   в KV в сутки.
   ══════════════════════════════════════════════════════════════════ */
var CRM=null, crmTimer=null;
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function crmSeed(){
  function c(t){ return {id:uid(), t:t, d:0}; }
  return {cols:[
    {id:uid(), n:'Бэклог',  cards:[]},
    {id:uid(), n:'Октябрь', cards:[]},
    {id:uid(), n:'ОльгаС',  cards:[c('Инфраструктура ЕРП: названия, блоки, отделы, логика'),
                                   c('Дэшборд «Качество»')]},
    {id:uid(), n:'ИринаВ',  cards:[c('НДС по хлебобулочным'),
                                   c('Закрыть ИП Айдана, перевести реализацию на ИП Малышев'),
                                   c('Схема налоговая на октябрь–ноябрь')]},
    {id:uid(), n:'СашаМ',   cards:[c('Вайлдберриз')]}
  ]};
}

function crmUpd(u){
  /* воркер пишет время в UTC строкой «ГГГГ-ММ-ДД ЧЧ:ММ» — показываем по Алматы */
  try{
    var d=new Date(String(u).replace(' ','T')+'Z');
    d=new Date(d.getTime()+5*3600e3);
    var p2=function(x){ return ('0'+x).slice(-2); };
    return p2(d.getUTCDate())+'.'+p2(d.getUTCMonth()+1)+' '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes());
  }catch(e){ return u; }
}
function crmStatus(t){ var e=document.getElementById('crm-st'); if(e) e.textContent=t; }

function crmInit(){
  var bd=document.getElementById('crm-bd'); if(!bd) return;
  document.getElementById('crm-addcol').onclick=function(){
    var n=prompt('Название колонки:'); if(!n) return;
    CRM.cols.push({id:uid(), n:n.slice(0,60), cards:[]}); crmDraw(); crmSave();
  };
  if(CRM){ crmDraw(); return; }
  fetch('/api/crm?a=get').then(function(r){return r.json();}).then(function(j){
    CRM = (j && j.board && j.board.cols && j.board.cols.length) ? j.board : crmSeed();
    crmDraw();
    crmStatus(j && j.board && j.board.upd ? 'сохранено '+crmUpd(j.board.upd) : 'доска создана, ещё не сохранялась');
    if(!(j && j.board)) crmSave();
  }).catch(function(){ CRM=crmSeed(); crmDraw(); crmStatus('офлайн: изменения не сохранятся'); });
}

function crmSave(){
  clearTimeout(crmTimer); crmStatus('сохраняю…');
  crmTimer=setTimeout(function(){
    fetch('/api/crm?a=save',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({cols:CRM.cols})})
      .then(function(r){return r.json();})
      .then(function(j){ crmStatus(j&&j.ok ? 'сохранено '+crmUpd(j.upd) : 'не сохранилось: '+((j&&j.error)||'ошибка')); })
      .catch(function(){ crmStatus('не сохранилось: нет связи'); });
  },1200);
}

function crmDraw(){
  var bd=document.getElementById('crm-bd'); if(!bd||!CRM) return;
  bd.innerHTML='';
  CRM.cols.forEach(function(col){
    var d=document.createElement('div'); d.className='col'; d.dataset.col=col.id;
    var left=col.cards.filter(function(k){return !k.d;}).length;
    d.innerHTML='<div class="ch"><span>'+esc(col.n)+'</span>'
      + '<span class="cnt">'+left+'</span><span class="x" title="удалить колонку">✕</span></div>'
      + '<div class="cards"></div><div class="addc">+ Добавить карточку</div>';
    var box=d.querySelector('.cards');
    col.cards.forEach(function(k){
      var c=document.createElement('div');
      c.className='card'+(k.d?' done':''); c.draggable=true; c.dataset.card=k.id;
      c.innerHTML='<span class="ck"></span><span class="t">'+esc(k.t)+'</span><span class="x">✕</span>';
      c.querySelector('.ck').onclick=function(e){ e.stopPropagation();
        k.d=k.d?0:1; crmDraw(); crmSave(); };
      c.querySelector('.x').onclick=function(e){ e.stopPropagation();
        col.cards=col.cards.filter(function(x){return x!==k;}); crmDraw(); crmSave(); };
      c.ondragstart=function(e){ e.dataTransfer.setData('text/plain',k.id);
        e.dataTransfer.effectAllowed='move'; c.classList.add('drag'); };
      c.ondragend=function(){ c.classList.remove('drag'); };
      box.appendChild(c);
    });
    d.querySelector('.ch .x').onclick=function(){
      if(col.cards.length && !confirm('В колонке «'+col.n+'» ещё '+col.cards.length+' карточек. Удалить?')) return;
      CRM.cols=CRM.cols.filter(function(x){return x!==col;}); crmDraw(); crmSave();
    };
    d.querySelector('.addc').onclick=function(){ crmAdd(d,col); };
    d.ondragover=function(e){ e.preventDefault(); d.classList.add('over'); };
    d.ondragleave=function(){ d.classList.remove('over'); };
    d.ondrop=function(e){
      e.preventDefault(); d.classList.remove('over');
      var id=e.dataTransfer.getData('text/plain'); if(!id) return;
      var card=null;
      CRM.cols.forEach(function(c2){
        var f=c2.cards.filter(function(x){return x.id===id;})[0];
        if(f){ card=f; c2.cards=c2.cards.filter(function(x){return x!==f;}); }
      });
      if(card){ col.cards.push(card); crmDraw(); crmSave(); }
    };
    bd.appendChild(d);
  });
}

function crmAdd(d,col){
  var a=d.querySelector('.addc'); if(!a||a.dataset.open) return;
  a.dataset.open='1';
  a.innerHTML='<textarea placeholder="Введите название карточки"></textarea>'
    + '<div style="margin-top:5px;display:flex;gap:6px">'
    + '<button class="btn" data-ok>Добавить</button><button class="btn" data-no>✕</button></div>';
  var ta=a.querySelector('textarea'); ta.focus();
  function close(){ a.dataset.open=''; crmDraw(); }
  function ok(){
    var t=ta.value.trim(); if(t){ col.cards.push({id:uid(), t:t.slice(0,400), d:0}); crmSave(); }
    close();
  }
  a.querySelector('[data-ok]').onclick=ok;
  a.querySelector('[data-no]').onclick=close;
  ta.onkeydown=function(e){
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ok(); }
    if(e.key==='Escape') close();
  };
}
